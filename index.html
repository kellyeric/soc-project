<p>Your original containment in phase 1 only handled <code>jane.okoro</code>. Because lab 8.7’s phase 5 extended the scenario to a second, privileged account, a real response has to contain <b>both</b>, and in the right order. Think before you act: which account would you disable first, and why? <i>Suggested reasoning: contain the most powerful compromised account first, since it represents the larger blast radius, then the initial foothold account.</i></p>
<ol class="steps"><li><span class="vm u">dc01</span> (log on as the built-in Administrator for this step, since you are about to contain your own delegated admin account and cannot reliably use that same account to do it) <pre>Disable-ADAccount -Identity tunde.admin
Set-ADAccountPassword -Identity tunde.admin -NewPassword (ConvertTo-SecureString "ContainedPass2024!" -AsPlainText -Force) -Reset
Get-ADUser tunde.admin -Properties Enabled | Select-Object SamAccountName, Enabled</pre></li></ol>
<h3>Phase 6: search for persistence before you declare the incident closed</h3>
<p>A real investigation never ends at "the stolen account is disabled". An attacker with Domain Admin access for even a few minutes could have created a second, hidden account, exactly as you practised detecting in Module 7. Check for it now, as the final investigative step before writing your report, rather than assuming the story is over.</p>
<ol class="steps"><li><span class="vm u">dc01</span> <pre>Get-ADUser -Filter * -Properties WhenCreated | Where-Object { $_.WhenCreated -gt (Get-Date).AddHours(-2) } | Select-Object Name, SamAccountName, WhenCreated
Get-ADGroupMember "Domain Admins" | Format-Table Name</pre></li>
<li><span class="vm h">YOUR PC</span> Also search Wazuh across <b>both</b> agents for event 4720 (account created) in the last two hours, to cross-check the directory query against the independent log evidence, which is exactly the kind of corroboration a real report should show: <pre>data.win.system.eventID:4720</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>No unexpected new accounts, since this lab did not actually create a persistence backdoor, but you should be able to state, with evidence from two independent sources, that you checked and found none. That sentence, backed by both a directory query and a log search, is far stronger in a real report than simply assuming nothing was planted.</div>
<h3>Phase 7: extend the incident report with the escalation and the search for persistence</h3>
<p>Add two new rows to the report table you were asked to build in the original version of this lab:</p>
<table><tr><th>Section</th><th>Addition</th></tr>
<tr><td>Timeline</td><td>Your third row from lab 8.7 phase 6: tunde.admin, 4624 type 3 plus 4672, from win-victim</td></tr>
<tr><td>Scope and blast radius</td><td>Your paragraph from lab 8.7 phase 7, stating plainly that Domain Admin compromise means the whole domain must be considered at risk</td></tr>
<tr><td>Containment</td><td>Both accounts disabled and reset, built-in Administrator used for the second containment action, with the reasoning for that order</td></tr>
<tr><td>Persistence check</td><td>Directory query plus independent Wazuh log search for new accounts, both negative, both recorded with their timestamps</td></tr></table>
<h3>Phase 8: a closing self-audit of your whole case file</h3>
<p>Before you move on to the next module, go back through all eight labs in this one and answer honestly, in a short closing note: which single step, if you had skipped it, would have left the biggest gap in your investigation? There is no single correct answer, but writing this down is exactly the habit real analysts build after every serious incident, in what is usually called a post-incident review.</p>
<h3>Evidence to save (additional)</h3>
<ul><li>Confirmation both accounts are disabled, then both correctly re-enabled and reset back to their original lab passwords once you are fully done, so Module 9 and any repeat of this case file still work.</li><li>Your extended report with all four additional rows.</li><li>Your closing self-audit note.</li></ul>
<h3>Evidence to save</h3>
<ul><li>Your finished report, saved as <code>incident-report-domain.md</code> alongside your Case File 1 and 2 reports.</li><li>Confirmation that the account is re-enabled and reset to its original password.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td><code>Disable-ADAccount</code> says access denied</td><td>Not running as a Domain Admin</td><td>Log on to dc01 as BRIGHTMART\Administrator</td></tr>
