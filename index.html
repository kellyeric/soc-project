takeaways:["Kerberoasting abuses a normal, permitted Kerberos request to obtain service tickets that are then cracked offline.","Service accounts are especially exposed because their passwords are often old, weak and over-privileged.","Watch for many 4769 requests from one account in a short time, and weaker ticket encryption, with caveats for legitimate causes.","Long random passwords, managed service accounts and least privilege are the real defences; detection is a safety net.","Containing a domain account compromise means disabling at the domain level, resetting everywhere the credential is used, and searching every agent."],
quiz:[{q:"What does Kerberoasting actually exploit?",o:["A normal, permitted Kerberos service ticket request","A software bug in Windows","A firewall misconfiguration only","A phishing email"],a:0},{q:"Why are service accounts especially risky?",o:["Passwords are often old, weak and over-privileged","They never log in","They are always disabled","They have no permissions"],a:0},{q:"What is the best long-term defence against Kerberoasting?",o:["Long random service account passwords and least privilege","A stronger firewall only","Disabling Kerberos","Renaming the domain"],a:0}]}
];

{id:"0-1",mod:"m0",mins:50,title:"Orientation lab: set up your workspace, schedule and goals",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have a lab notebook, a weekly study schedule, a baseline self-assessment, a written goal, and a clear picture of how to use every part of this portal.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 50 minutes. <b>You need:</b> a text editor or note-taking app, a calendar, and a quiet half hour. Read the chapters “A Day in the Life of a SOC Analyst” and “What You Will Be Protecting” first if you can. They explain why the habits you are about to build matter.</div>
<h3>Why start with habits, not tools?</h3>
<p>Beginners usually fail at security for ordinary reasons: they run out of time, lose track of what they changed, or cannot remember what they learned last week. Professionals solve these problems with routines. Ten minutes of setup now prevents weeks of confusion later.</p>
<h3>Phase 1: create your lab notebook</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Create a folder called <code>SOC-Lab</code> and, inside it, a file called <code>soc-lab-notes.md</code>. A plain text file is perfect. Any notes app also works if you can export it.</li>
<li>Paste this template at the top, and copy it for every session:
<pre>## Date: ______
Goal:
What I did (exact commands, copied from the screen):
What happened (including exact error text):
What I learned / still do not understand:</pre></li>
<li>Write your first entry now: today’s date, the goal “set up my workspace”, and one thing you want to get from this academy.</li></ol>
<h3>Phase 2: build a schedule you can keep</h3>
<p>A small routine that you keep beats a heroic one that you abandon. Choose three to five sessions each week of 60 to 90 minutes, and put them in your calendar with an alarm. Fill in this table:</p>
<table><tr><th>Day</th><th>Time</th><th>Planned work</th></tr><tr><td>Example: Tuesday</td><td>19:00 to 20:30</td><td>One reading chapter and one lab</td></tr><tr><td>?</td><td>?</td><td>?</td></tr><tr><td>?</td><td>?</td><td>?</td></tr></table>
<p>A good weekly pattern is <b>read, then practise</b>: one reading chapter followed by its lab. The portal links each chapter to its lab for this reason.</p>
<h3>Phase 3: take your baseline</h3>
<p>Rate yourself from 1 (never done it) to 5 (can teach it) on each skill. Save the numbers with today’s date. You will rate yourself again after Module 4 and see your progress in numbers.</p>
<table><tr><th>Skill</th><th>Score now</th></tr><tr><td>Using a command line</td><td>?</td></tr><tr><td>Windows administration basics</td><td>?</td></tr><tr><td>Computer networking basics</td><td>?</td></tr><tr><td>Explaining security terms</td><td>?</td></tr><tr><td>Writing clear notes and reports</td><td>?</td></tr></table>
<h3>Phase 4: explore the portal</h3>
<ol class="steps">
<li>Open the <b>Lab sheet</b> from the top bar. Find the address of <code>wazuh-server</code> and the username for Windows. You will return to this page often.</li>
<li>Open the <b>Glossary</b> and search for “baseline”. Words you do not know belong here.</li>
<li>On the curriculum page, notice which modules are marked <b>Free</b>. Notice the 📖 reading and 🧪 lab icons.</li>
<li>Finish this lab’s checkpoint to see how completion and progress tracking work. Your progress is saved in <b>this browser on this device</b>; clearing browser data erases it.</li></ol>
<h3>Phase 5: choose your path and write your goal</h3>
<p>The standard path needs a computer with 16 GB of memory (lab 1.1 checks this). If yours is weaker, tell your instructor now: a lighter, browser-based path for the Linux labs is in development, and some labs can be done on a friend’s or a training-centre computer.</p>
<p>Now write one sentence, in your notebook: <i>“In 12 weeks I want to be able to ___, so that I can ___.”</i> Be specific. “Triage a password-attack alert and write a one-page report, so that I can apply for junior SOC roles” is better than “learn hacking”.</p>
<div class="box tip"><b>✅ You should see</b>A notebook file with your template and first entry; a weekly schedule with calendar alarms; five baseline scores; a goal sentence; and a completed checkpoint showing the item as done on the curriculum page.</div>
<h3>Evidence to save</h3>
<ul><li>A screenshot of your notebook with the first entry.</li><li>Your schedule and baseline scores.</li><li>Your goal sentence. Read it again when motivation drops.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Concern</th><th>What to do</th></tr>
<tr><td>“I do not have time.”</td><td>Reduce to three 45-minute sessions. Consistency matters more than length.</td></tr>
<tr><td>“I feel completely lost.”</td><td>That is normal in week one. Do one small step, write down what confused you, and ask your instructor.</td></tr>
<tr><td>“My progress disappeared.”</td><td>It is stored in the browser. Use the same browser and the same address, and do not clear site data.</td></tr>
<tr><td>“My computer is weak.”</td><td>Tell your instructor before Module 1. Do the reading first and arrange another way to run the labs.</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You set up the three things that carry beginners through any technical course: a notebook, a schedule and a goal. You also learned your way around the portal. Next, the ethics lab: the rules that keep you and your lab safe.</div>`,
quiz:[{q:"Why keep a lab notebook?",o:["To record exact commands, results and lessons for later","To make labs run faster","It is a legal requirement","To hide mistakes"],a:0},{q:"Where is your progress saved?",o:["In your browser on this device","On the instructor’s computer","In the cloud automatically","Nowhere"],a:0},{q:"What makes a good goal sentence?",o:["It is specific about what you will do and why","It is as short as possible","It mentions no skills","It is secret"],a:0}]},

{id:"0-2",mod:"m0",mins:60,title:"Ethics lab: rules, scope and your lab safety checklist",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have a written personal ethics statement, a mini scope document for your own lab, a ticked safety checklist, and a plan for what to do if you ever find a real weakness.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 60 minutes. <b>You need:</b> your notebook from lab 0.1. This lesson is not legal advice: laws differ by country, and you should check the rules where you live. The principle, however, is the same almost everywhere: <b>permission decides whether security testing is a profession or a crime.</b></div>
<h3>Why ethics comes before tools</h3>
<p>In the labs you will run real attack tools. They are legal and useful in your own lab, and illegal against systems you do not own. Employers also ask about conduct, and a single reckless act can end a career before it starts. This lab builds the habit of asking, before every action, “do I have permission, and is it in scope?”</p>
<h3>Phase 1: write your personal statement</h3>
<ol class="steps"><li>In your notebook, write in your own words, and date it:
<pre>I will only test systems that I own or have written permission to test.
I will keep my lab network isolated.
I will never reuse real passwords in the lab.
I will protect other people’s private data.
If I find a weakness in a real system, I will report it responsibly.</pre></li></ol>
<h3>Phase 2: judge six situations</h3>
<p>For each situation, write <b>OK</b>, <b>Not OK</b> or <b>Only with written permission</b>. Then open the answers.</p>
<table><tr><th>#</th><th>Situation</th></tr>
<tr><td>1</td><td>You run Nmap against the three VMs in your own lab.</td></tr>
<tr><td>2</td><td>A friend asks you to “test” their school’s website, and says it is fine.</td></tr>
<tr><td>3</td><td>You run a password-guessing tool against your home router.</td></tr>
<tr><td>4</td><td>You scan an address you found online “just to see if it is up”.</td></tr>
<tr><td>5</td><td>A company hires you and signs a document listing which servers you may test.</td></tr>
<tr><td>6</td><td>You notice a classmate’s password on a sticky note and try it.</td></tr></table>
<details><summary>Show answers</summary><p>1 OK, because you own it. 2 Only with written permission from the school’s owner, and a friend cannot give it. 3 Even your own router can affect others on the network, and it may be provided by your internet company: check first, and prefer your lab. 4 Not OK: scanning others’ systems without permission can be illegal. 5 OK within the listed scope. 6 Not OK: using someone else’s credentials without permission is unauthorised access.</p></details>
<h3>Phase 3: write a mini scope document for your lab</h3>
<p>Real engagements begin with a scope document. Write a short one for the academy lab, using this template:</p>
<pre>Scope document: SOC Academy lab
Owner: (your name)
Systems IN scope: wazuh-server 192.168.56.10, win-victim 192.168.56.30, kali-attacker 192.168.56.50
Systems OUT of scope: everything else, including my home router and any internet address
Allowed activities: port scans, password guessing against lab accounts, file changes, log analysis
Not allowed: using Kali against anything outside the lab network
Time: any time; lab network is host-only
Contact if something goes wrong: (instructor name)</pre>
<h3>Phase 4: the lab safety checklist</h3>
<p>Tick each item when it is true. You will repeat this check after building the lab in Module 1.</p>
<table><tr><th>☐</th><th>Check</th></tr>
<tr><td>☐</td><td>Every VM’s second card is host-only, never bridged</td></tr>
<tr><td>☐</td><td>Kali has no route to any network except the lab</td></tr>
<tr><td>☐</td><td>Lab passwords are not used anywhere real</td></tr>
<tr><td>☐</td><td>Snapshots exist before any attack</td></tr>
<tr><td>☐</td><td>Screenshots are checked for private information before sharing</td></tr>
<tr><td>☐</td><td>The notebook has no real credentials in it</td></tr></table>
<h3>Phase 5: what if you find a real weakness?</h3>
<p>It can happen: a website shows a stranger’s data, or a router is left open. Responsible behaviour is simple.</p>
<ol class="steps"><li><b>Stop.</b> Do not explore further or take data.</li><li><b>Write down</b> what you saw, when, and how you came across it, without copying private data.</li><li><b>Report</b> it privately to the owner, or to a national incident response team if you cannot find one.</li><li><b>Do not</b> publish it, brag about it, or ask for payment.</li></ol>
<div class="box tip"><b>✅ You should see</b>Your signed and dated statement, six answers (with the correct answers understood), a completed scope document and a safety checklist ready to tick.</div>
<h3>Evidence to save</h3>
<ul><li>The statement, the scope document and the checklist, in your notebook.</li><li>One sentence on the situation you found hardest, and why.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Situation</th><th>What to do</th></tr>
<tr><td>You accidentally scanned a real address</td><td>Stop at once, write down what happened, tell your instructor, and do not repeat it.</td></tr>
<tr><td>A friend pressures you to “hack” an account</td><td>Say no and offer to help them secure it instead.</td></tr>
<tr><td>You are unsure if something is in scope</td><td>Treat it as out of scope until the owner confirms in writing.</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You wrote your ethics statement, practised judging real situations, created a scope document for your own lab, and prepared the safety checks. In Module 1 you build the lab that this scope document describes.</div>`,
quiz:[{q:"What turns security testing from crime into a profession?",o:["Written permission and a defined scope","Using free tools","Working at night","Using a VPN"],a:0},{q:"If you find a real weakness, you should…",o:["Stop, record it, and report it privately","Explore further","Post it online","Ask for payment"],a:0},{q:"What is a scope document?",o:["A list of what you may and may not test","A password list","A report template","A tool manual"],a:0}]},

{id:"1-1",mod:"m1",mins:60,title:"Check your computer and download everything",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>know whether your computer can run the academy lab, have a clean folder structure, and have every file downloaded and (optionally) verified. You will also have a completed readiness table in your notebook.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about an hour, mostly waiting for downloads. <b>You need:</b> a computer with a 64-bit Intel or AMD processor, an internet connection, and about 150 GB of free disk space. Read the chapter “Virtualisation Explained” first if you have not: it explains the words used here (host, guest, hypervisor, snapshot).</div>
<h3>Where this lab fits</h3>
<p>You are about to build a miniature company out of three virtual machines. Every later lesson assumes this lab exists and matches the names and addresses on the Lab sheet. A mistake made here is cheap to fix today and expensive to find in week four. So we start by checking, not by installing.</p>
<h3>Phase 1: check the hardware</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> <b>Windows:</b> press <code>Ctrl+Shift+Esc</code> to open Task Manager and click <b>Performance</b>. Click <b>Memory</b> and note the total (for example 16.0 GB). Click <b>CPU</b> and note the line <b>Virtualization</b>. Click <b>Disk</b> for your main drive and note its type (SSD or HDD).
<br><b>Linux:</b> run <code>lscpu | grep -i virtualization</code> and <code>free -h</code> and <code>df -h</code>.
<br><b>Intel Mac:</b> the Apple menu → About This Mac shows memory and storage; virtualization is built in. <b>Apple Silicon Macs (M1 to M4)</b> cannot run this lab: ask your instructor about the browser-based light track.</li>
<li>Check free disk space on the drive where you will keep the VMs. You need at least 150 GB free. A virtual disk file grows as the VM writes data, but you must have room for the maximum.</li>
<li>Choose your RAM plan from the table below, based on the memory you found in step 1. Never give the VMs more than your computer’s memory minus 4 GB.
<table><tr><th>Your PC memory</th><th>wazuh-server</th><th>win-victim</th><th>kali-attacker</th></tr><tr><td>16 GB (standard)</td><td>6 GB</td><td>3 GB</td><td>2 GB</td></tr><tr><td>24 GB or more (comfortable)</td><td>8 GB</td><td>4 GB</td><td>2 GB</td></tr></table>
With 16 GB, run only two or three VMs at once and keep Kali switched off until an attack lab needs it.</li></ol>
<div class="box tip"><b>✅ You should see</b>At least 16 GB of memory, “Virtualization: Enabled” (Windows) or a Virtualization line such as <code>VT-x</code> or <code>AMD-V</code> (Linux), and 150 GB or more of free space.</div>
<details><summary>😕 Virtualization says Disabled</summary><p>Restart the computer and open its firmware settings (BIOS or UEFI). The key is usually <code>F2</code>, <code>F10</code>, <code>Del</code> or <code>Esc</code> during the first seconds of startup; search the internet for “enter BIOS” plus your computer’s model. Find a setting named <b>Intel Virtualization Technology</b>, <b>VT-x</b>, <b>SVM Mode</b> or <b>AMD-V</b>, set it to <b>Enabled</b>, then save and exit. Without it, 64-bit VMs will not start or will crawl.</p><p><b>Windows tip:</b> if you use Hyper-V, WSL2 or “Memory integrity”, VirtualBox can still run but may be slower. If you hit errors later, turn Windows hypervisor features off temporarily.</p></details>
<h3>Phase 2: create the folder structure</h3>
<p>A clean folder structure saves hours later. Choose a drive with enough space and create:</p>
<pre>SOC-Lab\
  ISO\        (downloaded installers)
  Kali\       (the extracted Kali image)
  VMs\        (VirtualBox will store your machines here)
  Notes\      (your lab notebook and screenshots)</pre>
<p>On Linux or Mac use <code>mkdir -p ~/SOC-Lab/{ISO,Kali,VMs,Notes}</code>. Create your notebook now: a plain file called <code>soc-lab-notes.md</code> in <code>Notes</code>. Write today’s date and the first entry: your memory total, your RAM plan, and your free disk space.</p>
<h3>Phase 3: download</h3>
<table><tr><th>Item</th><th>Where from</th><th>Size</th><th>Save to</th></tr>
<tr><td>VirtualBox 7.x for your operating system</td><td>virtualbox.org → Downloads</td><td>about 110 MB</td><td>ISO</td></tr>
<tr><td>Ubuntu Server 22.04 LTS ISO</td><td>ubuntu.com/download/server (choose 22.04 LTS)</td><td>about 2 GB</td><td>ISO</td></tr>
<tr><td>Windows 10 or 11 ISO, free evaluation</td><td>Search “Microsoft Evaluation Center”, choose Windows 11 Enterprise or Windows 10 Enterprise, ISO, 64-bit</td><td>about 5 GB</td><td>ISO</td></tr>
<tr><td>Kali pre-built VirtualBox image, 64-bit</td><td>kali.org/get-kali → Virtual Machines → VirtualBox</td><td>about 3 GB</td><td>Kali</td></tr>
<tr><td>7-Zip (to open the Kali .7z file)</td><td>7-zip.org</td><td>about 2 MB</td><td>ISO</td></tr></table>
<div class="box edge"><b>Edge case: slow or interrupted downloads</b>Large downloads fail often on unstable connections. Use a download manager or your browser’s “resume” feature, and never install from a file that did not finish. If your connection is limited, ask your instructor whether the files can be shared on a USB drive.</div>
<h3>Phase 4 (optional but excellent): verify your downloads</h3>
<p>Remember hashes from the file lessons? Download pages often publish a <b>SHA256</b> checksum so you can prove that your copy is complete and untampered. In PowerShell:</p>
<pre>Get-FileHash C:\SOC-Lab\ISO\ubuntu-22.04-live-server-amd64.iso -Algorithm SHA256</pre>
<p>Use your real file name. On Linux or Mac use <code>sha256sum filename</code>. Compare the result with the value on the download page. They must match exactly. If not, download again.</p>
<h3>Evidence to save in your notebook</h3>
<ul>
<li>Memory, CPU virtualization status, free disk space, and your RAM plan.</li>
<li>A screenshot of the finished <code>SOC-Lab</code> folder with all downloads inside.</li>
<li>The checksum result for at least one file, with “match” or “mismatch”.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Download stops at 99%</td><td>Unstable connection</td><td>Resume or restart; use a download manager</td></tr>
<tr><td>Windows evaluation page offers only an older version</td><td>Microsoft changes offers</td><td>Pick the newest 64-bit ISO available; Windows 10 or 11 both work</td></tr>
<tr><td>Kali file will not open</td><td>Wrong extractor</td><td>Use 7-Zip</td></tr>
<tr><td>Not enough disk space</td><td>Other files</td><td>Free space or use an external SSD for <code>SOC-Lab</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You confirmed that your computer can host the lab, set up a tidy workspace and started your notebook, and you collected and (optionally) verified every installer. Next you will install VirtualBox and create the private lab network.</div>`,
quiz:[{q:"What should be enabled in the BIOS for 64-bit VMs?",o:["Virtualization (VT-x or AMD-V)","Secure boot only","Sleep mode","Fast startup"],a:0},{q:"Why verify a download’s checksum?",o:["To prove the file is complete and unaltered","To make it install faster","To compress it","To rename it"],a:0},{q:"Which computer type cannot run this lab?",o:["Apple Silicon Mac","64-bit Windows PC","Intel Mac","64-bit Linux PC"],a:0}]},

{id:"1-2",mod:"m1",mins:45,title:"Install VirtualBox and create the lab network",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have VirtualBox installed and a private host-only network at <code>192.168.56.0/24</code>, with your own computer at <code>192.168.56.1</code> and DHCP switched off.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 30 to 45 minutes. <b>You need:</b> the VirtualBox installer from lab 1.1 and administrator rights on your computer. You may briefly lose internet while the installer adds virtual network drivers: that is normal.</div>
<h3>Why a host-only network?</h3>
<p>Your lab needs two kinds of connection. A VM needs the <b>internet</b> to download software, and the three VMs need a <b>private network</b> where attacks happen safely. VirtualBox provides both through two different virtual network cards. The private one is called <b>host-only</b>: it connects your VMs and your own computer, and nothing else. An attack running inside that network cannot leave your computer.</p>
<p>We also turn off <b>DHCP</b>, the service that hands out addresses automatically. In a real company, servers get fixed addresses so that people and tools always know where to find them. We do the same, so your lab looks identical every time.</p>
<h3>Phase 1: install VirtualBox</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Run the VirtualBox installer. Accept the defaults. Windows may warn about “network interfaces” and ask you to confirm: choose <b>Yes</b> or <b>Install</b>. When it finishes, open VirtualBox.</li>
<li>Note the version in <i>Help → About</i> and write it in your notebook. Screens differ slightly between versions, and this helps if you ask for help.</li></ol>
<h3>Phase 2: create the host-only network</h3>
<ol class="steps">
<li>Open the network manager. In VirtualBox 7, click the menu icon at the left of the toolbar (the three-line “Tools” menu) and choose <b>Network</b>. In older versions open <i>File → Host Network Manager</i>.</li>
<li>Open the <b>Host-only Networks</b> tab. Click <b>Create</b>. A new entry appears, usually called <code>vboxnet0</code> or “VirtualBox Host-Only Ethernet Adapter”.</li>
<li>Select it and set the IPv4 address to <code>192.168.56.1</code> and the network mask to <code>255.255.255.0</code>. This is your own computer’s address on the lab network.</li>
<li><b>Switch the DHCP server off.</b> Untick “Enable Server”, or remove the DHCP entry. If you leave it on, VMs may receive random addresses.</li>
<li>Click <b>Apply</b>.</li></ol>
<h3>Phase 3: verify</h3>
<ol class="steps">
<li>Windows: open Command Prompt and run <code>ipconfig</code>. Mac or Linux: run <code>ifconfig</code> or <code>ip a</code>.
<pre>ipconfig</pre></li>
<li>Look for an adapter with “VirtualBox Host-Only” in its name (or <code>vboxnet0</code>). Its IPv4 address must be <code>192.168.56.1</code>.</li></ol>
<div class="box tip"><b>✅ You should see</b>An adapter named “Ethernet adapter VirtualBox Host-Only Network” (Windows) or <code>vboxnet0</code> (Linux, Mac), with IPv4 address <b>192.168.56.1</b> and subnet mask <b>255.255.255.0</b>. No default gateway is listed for it, and that is correct.</div>
<h3>What you just built</h3>
<table><tr><th>Thing</th><th>Value</th><th>Meaning</th></tr>
<tr><td>Network</td><td>192.168.56.0/24</td><td>All addresses that start 192.168.56</td></tr>
<tr><td>Your PC</td><td>192.168.56.1</td><td>The host on the lab network</td></tr>
<tr><td>Planned VMs</td><td>.10 .30 .50</td><td>wazuh-server, win-victim, kali-attacker</td></tr>
<tr><td>DHCP</td><td>Off</td><td>Every address is set by hand</td></tr></table>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the host-only network settings, and one of the <code>ipconfig</code> result.</li><li>Your VirtualBox version.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>No Host-only entry appears</td><td>Create was not applied</td><td>Click Create again, then Apply; check the network driver installed</td></tr>
<tr><td>Creation fails on Linux</td><td>Address range not allowed</td><td>Check <code>/etc/vbox/networks.conf</code> contains <code>* 192.168.56.0/21</code></td></tr>
<tr><td>Adapter has a different address</td><td>Defaults were kept</td><td>Edit it to 192.168.56.1 and Apply</td></tr>
<tr><td>Your PC’s internet stopped</td><td>Network drivers were just installed</td><td>Disable and re-enable your network adapter, or reboot</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You created a private virtual switch, gave your computer an address on it, and switched DHCP off so every machine will be addressed by hand. Next you build the first VM.</div>`,
quiz:[{q:"What address does your own PC have on the lab network?",o:["192.168.56.1","192.168.56.10","10.0.2.15","8.8.8.8"],a:0},{q:"Why switch the DHCP server off?",o:["So we use fixed, predictable addresses","It uses too much memory","It blocks ping","It is a security flaw in Windows"],a:0},{q:"What does host-only mean?",o:["A private network of the host and VMs only","Internet access for VMs","A Wi-Fi network","A cloud network"],a:0}]},

{id:"1-3",mod:"m1",mins:75,title:"Build the Wazuh server VM: Ubuntu Server",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have an Ubuntu Server VM named <code>wazuh-server</code>, with two network cards, an administrator account called <code>socadmin</code>, SSH installed, and an updated system you can log in to.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> 60 to 90 minutes. <b>You need:</b> the Ubuntu Server 22.04 ISO, the host-only network from lab 1.2, and your RAM plan from lab 1.1. You will see no desktop and no mouse pointer inside the installer: servers run from a text screen, and you will learn to love it.</div>
<h3>Why Ubuntu Server?</h3>
<p>Most security products, and the Wazuh server in particular, run on Linux. Server editions have no desktop, which keeps them small, fast and safer, because fewer programs mean fewer weaknesses. Everything is done by typing commands. That is exactly the skill SOC analysts use daily.</p>
<h3>Phase 1: create the VM</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> In VirtualBox click <b>New</b>. Name: <code>wazuh-server</code>. Folder: <code>SOC-Lab\VMs</code>. ISO image: the Ubuntu Server ISO. <b>Tick “Skip Unattended Installation”</b> so that you control every choice. Type should show Linux and version Ubuntu (64-bit).</li>
<li>Hardware: <b>Base memory</b> from your plan (6144 MB, or 8192 if you have 24 GB or more). <b>Processors:</b> 4, or 2 if your computer has only 4 cores.</li>
<li>Virtual hard disk: <b>50 GB</b>, “Pre-allocate full size” unticked. Click Finish.</li>
<li>Select the VM → <b>Settings → Network</b>. <b>Adapter 1:</b> Attached to <b>NAT</b>. Open the <b>Adapter 2</b> tab, tick <b>Enable Network Adapter</b>, attached to <b>Host-only Adapter</b>, name the network from lab 1.2. Click OK.</li></ol>
<h3>Phase 2: install Ubuntu</h3>
<p>Click <b>Start</b>. At the first menu choose <b>Try or Install Ubuntu Server</b> and press Enter. Use the keyboard only: arrow keys to move, <code>Tab</code> to jump between sections, <code>Enter</code> to choose and <code>Space</code> to tick a box.</p>
<table><tr><th>Screen</th><th>Choose</th><th>Why</th></tr>
<tr><td>Language and keyboard</td><td>English; your keyboard layout</td><td>A wrong layout changes where characters such as <code>|</code> and <code>"</code> sit</td></tr>
<tr><td>Installer update</td><td>Continue without updating</td><td>Not needed</td></tr>
<tr><td>Type of install</td><td>Ubuntu Server (not minimized)</td><td>Includes tools we use</td></tr>
<tr><td>Network</td><td>Leave as shown. Two interfaces appear: <code>enp0s3</code> and <code>enp0s8</code></td><td>The NAT card gets an address automatically; the host-only card has none yet, and we set it in lab 1.6</td></tr>
<tr><td>Proxy and mirror</td><td>Leave defaults</td><td>Not needed at home</td></tr>
<tr><td>Storage</td><td>Use an entire disk; accept the default layout</td><td>Affects only the virtual disk, never your real one</td></tr>
<tr><td>Profile</td><td>Your name: <code>SOC Admin</code>; server name: <code>wazuh-server</code>; username: <code>socadmin</code>; a password you will remember</td><td>These names appear in every alert and every lesson</td></tr>
<tr><td>Ubuntu Pro</td><td>Skip</td><td>Not needed</td></tr>
<tr><td>SSH setup</td><td>Press <code>Space</code> to tick <b>Install OpenSSH server</b></td><td>Lets you control the server from your own PC and paste commands</td></tr>
<tr><td>Featured snaps</td><td>Select none</td><td>Keep the system small</td></tr></table>
<p>The installation takes 5 to 15 minutes. When it says <b>Reboot Now</b>, select it. If it asks you to remove the installation medium, press Enter; if the VM returns to the installer menu, power it off, open Settings → Storage and remove the ISO from the optical drive, then start it again.</p>
<h3>Phase 3: first login and first commands</h3>
<ol class="steps">
<li>At the login prompt type <code>socadmin</code> and your password. Nothing appears as you type the password: that is normal security behaviour.</li>
<li>Look at the server’s identity and network cards:
<pre>hostnamectl
ip -br a</pre></li>
<li>Check that SSH is running:
<pre>systemctl status ssh --no-pager | head -n 5</pre></li>
<li>Update the system. This needs the NAT card to reach the internet and can take several minutes:
<pre>sudo apt update &amp;&amp; sudo apt -y upgrade</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>A prompt <code>socadmin@wazuh-server:~$</code>; <code>hostnamectl</code> showing “Static hostname: wazuh-server” and Ubuntu 22.04; <code>ip -br a</code> listing <code>enp0s3</code> with an address such as <code>10.0.2.15/24</code> and <code>enp0s8</code> without an address; SSH “active (running)”; and the update ending without red errors.</div>
<h3>Evidence to save</h3>
<ul><li>The output of <code>hostnamectl</code> and <code>ip -br a</code>, copied into your notebook.</li><li>The VM settings screenshot (memory, processors, both network cards).</li><li>The password stored safely, for example in a password manager. Never reuse a real password.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>“VT-x is not available” or the VM will not start</td><td>Virtualization disabled</td><td>Lab 1.1: enable it in the BIOS</td></tr>
<tr><td>Black screen after install</td><td>Display glitch</td><td>Power the VM off from the VirtualBox menu and start again</td></tr>
<tr><td>Message “a start job is running for wait for network”</td><td>The host-only card has no address</td><td>Normal for about two minutes; lab 1.6 fixes it</td></tr>
<tr><td>apt cannot reach the internet</td><td>Adapter 1 is not NAT, or cable unticked</td><td>Check Settings → Network; restart the VM</td></tr>
<tr><td>Characters typed are wrong</td><td>Wrong keyboard layout</td><td>Run <code>sudo dpkg-reconfigure keyboard-configuration</code></td></tr>
<tr><td>Installer stuck on “getting updates”</td><td>No internet during install</td><td>Wait or choose to skip; updates can be done later</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You created a VM, gave it two network cards, installed a server operating system from a text installer, and used your first commands to inspect it and update it. You will not snapshot it yet: you do that in lab 1.6, once the network is correct.</div>`,
quiz:[{q:"Why tick “Skip Unattended Installation”?",o:["So we control each installation choice ourselves","To go faster","To remove the internet","To lock the VM"],a:0},{q:"Which card gives the VM internet access?",o:["Adapter 1, NAT","Adapter 2, host-only","Both","Neither"],a:0},{q:"Why install the OpenSSH server?",o:["To control the server from your PC and paste commands","To make it faster","It is needed for the keyboard","To hide the server"],a:0}]},

{id:"1-4",mod:"m1",mins:75,title:"Build the Windows VM: win-victim",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have a Windows VM named <code>win-victim</code> with a local administrator called <code>analyst</code>, Guest Additions installed, a working shared clipboard, the correct time zone and Defender left switched on.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> 60 to 90 minutes. <b>You need:</b> the Windows ISO, your RAM plan, and the host-only network. The evaluation edition works for 90 to 180 days, after which you can rebuild the lab. This machine plays an employee’s laptop: the place where most real attacks begin.</div>
<h3>Why keep Defender and updates on?</h3>
<p>A real employee’s computer has antivirus. In later labs, Defender will sometimes delete a test file you created, and its events will appear in your logs. That is not a lab failure, it is realism. It also teaches an important lesson: preventive tools and detection tools see the same events, and analysts learn to read both.</p>
<h3>Phase 1: create the VM</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> VirtualBox → <b>New</b>. Name <code>win-victim</code>, folder <code>SOC-Lab\VMs</code>, select the Windows ISO, <b>tick “Skip Unattended Installation”</b>. Type: Microsoft Windows; version: Windows 11 (64-bit) or Windows 10 (64-bit) to match your ISO.</li>
<li>Memory from your plan (3072 or 4096 MB), 2 processors, hard disk <b>64 GB</b>.</li>
<li><b>Settings → Network:</b> Adapter 1 = NAT; Adapter 2 enabled = Host-only Adapter (the lab network).</li>
<li>VirtualBox 7 prepares what Windows 11 requires (firmware mode, TPM, Secure Boot) automatically. If the installer says the PC cannot run Windows 11, use a Windows 10 ISO instead.</li></ol>
<h3>Phase 2: install Windows</h3>
<ol class="steps">
<li>Start the VM. If you see “Press any key to boot from CD or DVD”, press a key quickly.</li>
<li>Choose language and keyboard, then <b>Install now</b>. Choose “I don’t have a product key”. Select an edition (Pro or Enterprise), accept the licence, and choose <b>Custom: Install Windows only</b>. Select the empty drive and continue. The VM restarts several times.</li>
<li>At the first-run setup choose your region and keyboard. You want a <b>local account</b>. If setup insists on a Microsoft account, press <code>Shift+F10</code> to open a command window, type <code>oobe\bypassnro</code> and press Enter. The VM restarts, and you can then choose “I don’t have internet”. On Windows 10, choose “Domain join instead” or “Offline account”.</li>
<li>User name <code>analyst</code>, with a password you record safely. Answer the security questions with anything memorable. Turn off optional privacy toggles.</li></ol>
<h3>Phase 3: make it comfortable and correct</h3>
<ol class="steps">
<li>VM window menu: <b>Devices → Insert Guest Additions CD image</b>. In Windows open File Explorer → This PC → the CD drive and run <code>VBoxWindowsAdditions.exe</code>. Accept the defaults and reboot when asked. Guest Additions add smooth screen resizing and the shared clipboard.</li>
<li>VM menu: <b>Devices → Shared Clipboard → Bidirectional</b>. Test it: copy a word on your PC and paste it into Notepad inside the VM.</li>
<li>Set the time zone: Settings → Time &amp; language → Date &amp; time. Turn on automatic time.</li>
<li>Open <b>PowerShell as administrator</b> (Start → type PowerShell → right-click → Run as administrator) and rename the computer:
<pre>Rename-Computer -NewName "WIN-VICTIM" -Restart</pre></li>
<li>After the restart, log in again and confirm:
<pre>hostname
whoami
Get-NetAdapter | Format-Table Name, MacAddress, Status</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>WIN-VICTIM</code>; a user such as <code>win-victim\analyst</code>; two network adapters with <b>Up</b> status (one is NAT, one is host-only); a desktop that resizes with the window; and text that pastes from your PC with <code>Ctrl+V</code>.</div>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the output of the three commands in step 5.</li><li>The two MAC addresses, labelled “Adapter 1 NAT” and “Adapter 2 host-only” (VirtualBox shows them under Network → Advanced). You will use them in lab 1.6 to find the right adapter.</li><li>The date the evaluation was installed.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>VM boots to a black screen with a firmware prompt</td><td>You missed “press any key”</td><td>Restart the VM and press a key at once</td></tr>
<tr><td>Everything is very slow</td><td>Too little memory or too many programs open on the host</td><td>Increase memory within your plan; close other programs</td></tr>
<tr><td>Paste does not work</td><td>Guest Additions missing or clipboard not bidirectional</td><td>Repeat steps 1 and 2 of phase 3</td></tr>
<tr><td>Stuck on “Let’s connect you to a network”</td><td>Microsoft account required</td><td><code>Shift+F10</code>, then <code>oobe\bypassnro</code></td></tr>
<tr><td>Installer says PC cannot run Windows 11</td><td>Firmware requirements</td><td>Use a Windows 10 ISO</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You installed Windows without a Microsoft account, added the integration tools, named the computer, and recorded its adapters. Defender and updates stay on, because realism matters. Next you import the attacker.</div>`,
quiz:[{q:"Why install Guest Additions?",o:["Better screen resizing and a shared clipboard","To remove antivirus","To get a licence","To make a snapshot"],a:0},{q:"Why leave Windows Defender on?",o:["A real computer has it, and its events appear in logs","It is required to install Windows","It speeds up the VM","It hides the VM"],a:0},{q:"Which account type do we create?",o:["A local account named analyst","A Microsoft account","A guest","No account"],a:0}]},

{id:"1-5",mod:"m1",mins:45,title:"Import the attacker VM: Kali Linux",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have <code>kali-attacker</code> imported and running, with its default password changed, the two network cards set, and the three tools you need (Nmap, Hydra, Nikto) checked.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> 30 to 45 minutes. <b>You need:</b> the Kali pre-built VirtualBox image and 7-Zip. Reread lab 0.2 first: you will only ever use these tools on your own lab. Kali is a toolbox, not a daily operating system. Never keep personal accounts or files on it.</div>
<h3>Why a pre-built image?</h3>
<p>Installing Kali from scratch is easy for people who have done it, and confusing for beginners. The pre-built image is a ready-made VM, already installed with its tools and with the VirtualBox integration tools included. You import it and start. This saves an hour and removes a source of mistakes.</p>
<h3>Phase 1: import</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Right-click the downloaded <code>.7z</code> file → 7-Zip → Extract to your <code>SOC-Lab\Kali</code> folder. You should find a folder containing a <code>.vbox</code> file.</li>
<li>Double-click the <code>.vbox</code> file. VirtualBox adds the VM. If nothing happens, use <i>Machine → Add</i> and select the file.</li>
<li>Right-click the new VM → <b>Rename</b> to <code>kali-attacker</code> (Settings → General).</li>
<li><b>Settings → System:</b> Base memory <b>2048 MB</b>, processors <b>2</b>.</li>
<li><b>Settings → Network:</b> Adapter 1 = NAT. Tick <b>Enable Network Adapter</b> on Adapter 2 = Host-only Adapter (the lab network).</li></ol>
<h3>Phase 2: first boot and basic hygiene</h3>
<ol class="steps">
<li>Start the VM. Log in with username <code>kali</code> and password <code>kali</code>.</li>
<li>Open the terminal (the black icon in the top bar). Change the default password at once:
<pre>passwd</pre>
A known default password is a classic weakness, and you would write it in an incident report if you found it on a real machine.</li>
<li>Confirm the network cards:
<pre>ip -br a</pre></li>
<li>Check the tools:
<pre>hydra -h | head -n 3
nmap --version | head -n 1
sudo apt update &amp;&amp; sudo apt install -y nikto
nikto -Version</pre></li>
<li>VM menu: <b>Devices → Shared Clipboard → Bidirectional</b>.</li></ol>
<div class="box tip"><b>✅ You should see</b>The Kali desktop; <code>eth0</code> with an address like <code>10.0.2.15/24</code> (NAT) and <code>eth1</code> without an address (host-only, set in lab 1.6); a first line of help from Hydra; an Nmap version; and Nikto installing and printing its version.</div>
<h3>What each tool is for</h3>
<table><tr><th>Tool</th><th>Purpose</th><th>Used in</th></tr>
<tr><td>Nmap</td><td>Finds open ports and services</td><td>Lesson 2.3 and the case files</td></tr>
<tr><td>Hydra</td><td>Tries many passwords against a login</td><td>Case File #2</td></tr>
<tr><td>Nikto</td><td>Scans a web server for known weaknesses</td><td>Web attack practice</td></tr></table>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the Kali desktop with the terminal showing the three tool checks.</li><li>A note that you changed the password (never write the password itself in a shared file).</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Extraction fails or the archive is “corrupt”</td><td>Incomplete download or the wrong extractor</td><td>Download again; use 7-Zip</td></tr>
<tr><td>No <code>.vbox</code> file</td><td>Extracted to the wrong place</td><td>Open the extracted folders and look inside</td></tr>
<tr><td>Login fails</td><td>Wrong credentials</td><td>The pre-built default is <code>kali</code> and <code>kali</code></td></tr>
<tr><td><code>eth1</code> does not exist</td><td>Adapter 2 not enabled</td><td>Power off, enable Adapter 2, start again</td></tr>
<tr><td>VM is slow</td><td>Host short of memory</td><td>Run Kali only when attacking; close other programs</td></tr></table>
<div class="box edge"><b>Keep it isolated</b>Never move Kali’s second card to a bridged network, and never point its tools at any address that is not in your lab. The host-only network is the only place it may attack.</div>
<div class="box lab"><b>📝 Recap</b>You imported a ready-made attacker, changed its default password, and confirmed that its three main tools work. The addressing comes next.</div>`,
quiz:[{q:"What do you do first after logging in to Kali?",o:["Change the default password","Delete the VM","Share the password","Disable the keyboard"],a:0},{q:"What is Hydra for in this academy?",o:["Trying many passwords against our own lab login","Editing photos","Writing documents","Backing up files"],a:0},{q:"Where may Kali’s tools be used?",o:["Only against your lab network","Any website","Your school","A neighbour’s Wi-Fi"],a:0}]},

{id:"1-6",mod:"m1",mins:90,title:"Connect the lab: addresses, ping tests, SSH and snapshots",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have fixed IP addresses on all three VMs, a complete ping test, the ability to log in to Ubuntu from your own computer, and a snapshot of each machine named <code>01-network-ready</code>.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> 60 to 90 minutes. <b>You need:</b> all three VMs built and your notebook open. This is the most important lab in Module 1: every later lesson depends on these addresses. A lab that is 90 per cent correct wastes hours later, so do not skip a verification.</div>
<h3>The target</h3>
<table><tr><th>Machine</th><th>Lab address</th><th>Card to configure</th></tr>
<tr><td>wazuh-server</td><td>192.168.56.10/24</td><td><code>enp0s8</code> (host-only)</td></tr>
<tr><td>win-victim</td><td>192.168.56.30/24</td><td>The host-only adapter (often “Ethernet 2”)</td></tr>
<tr><td>kali-attacker</td><td>192.168.56.50/24</td><td><code>eth1</code> (host-only)</td></tr>
<tr><td>Your PC</td><td>192.168.56.1/24</td><td>Set in lab 1.2</td></tr></table>
<p>Only the <b>host-only</b> card gets a lab address. The NAT card stays automatic so that the VM still reaches the internet. We leave the <b>gateway empty</b> on the lab card: this network has no router, and a second gateway would confuse the machines.</p>
<h3>Phase 1: Ubuntu (wazuh-server)</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> Find the network settings file:
<pre>ls /etc/netplan</pre>
It is usually <code>00-installer-config.yaml</code> (sometimes <code>50-cloud-init.yaml</code>). Use your file’s name below.</li>
<li>Open it for editing and replace everything with the text below. Spaces matter: use <b>two spaces</b> for each level, never the Tab key. Hold <code>Ctrl+K</code> to delete lines in nano.
<pre>sudo nano /etc/netplan/00-installer-config.yaml</pre>
<pre>network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: true
    enp0s8:
      dhcp4: false
      addresses: [192.168.56.10/24]</pre></li>
<li>Save with <code>Ctrl+O</code>, Enter, then exit with <code>Ctrl+X</code>. Test safely, then apply:
<pre>sudo chmod 600 /etc/netplan/*.yaml
sudo netplan try
sudo netplan apply
ip -br a</pre>
<code>netplan try</code> reverts automatically after 120 seconds if you do not confirm, which protects you from locking yourself out.</li>
<li>Set the clock service on:
<pre>sudo timedatectl set-ntp true</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>enp0s8</code> with <code>192.168.56.10/24</code> and <code>enp0s3</code> still with its NAT address.</div>
<h3>Phase 2: Windows (win-victim)</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Find which adapter is the host-only one. In PowerShell run:
<pre>Get-NetAdapter | Format-Table Name, MacAddress, Status</pre>
Match the MAC address with the one you saved from VirtualBox for “Adapter 2 host-only”.</li>
<li>Set the address (replace the adapter name if yours differs). This does the same as the graphical settings:
<pre>New-NetIPAddress -InterfaceAlias "Ethernet 2" -IPAddress 192.168.56.30 -PrefixLength 24
Get-NetIPAddress -InterfaceAlias "Ethernet 2" | Format-Table IPAddress, PrefixLength</pre>
Do <b>not</b> add a gateway or DNS.</li>
<li>Windows blocks ping by default. Allow it:
<pre>netsh advfirewall firewall add rule name="Allow ICMP" protocol=icmpv4:8 dir=in action=allow</pre></li></ol>
<h3>Phase 3: Kali</h3>
<ol class="steps"><li><span class="vm k">KALI</span> Check the cards with <code>ip -br a</code>. Then:
<pre>sudo nmcli con add type ethernet ifname eth1 con-name lab ip4 192.168.56.50/24
sudo nmcli con up lab
ip -br a</pre></li></ol>
<h3>Phase 4: the ping matrix</h3>
<p>Ping every machine from every other, and tick each cell in your notebook.</p>
<table><tr><th>From \ To</th><th>.1 PC</th><th>.10 Ubuntu</th><th>.30 Windows</th><th>.50 Kali</th></tr>
<tr><td>Your PC</td><td>-</td><td>☐</td><td>☐</td><td>☐</td></tr>
<tr><td>Ubuntu</td><td>☐</td><td>-</td><td>☐</td><td>☐</td></tr>
<tr><td>Windows</td><td>☐</td><td>☐</td><td>-</td><td>☐</td></tr>
<tr><td>Kali</td><td>☐</td><td>☐</td><td>☐</td><td>-</td></tr></table>
<pre>ping -c 3 192.168.56.10      (Linux and Mac)
ping 192.168.56.10           (Windows)</pre>
<div class="box tip"><b>✅ You should see</b>Replies and “0% packet loss” in every cell. If your PC cannot reach a VM but the VMs reach each other, check your PC’s own firewall for the host-only adapter.</div>
<h3>Phase 5: log in to Ubuntu from your own PC</h3>
<p>The Ubuntu console window cannot copy and paste. Instead, use SSH from your PC, where paste works.</p>
<ol class="steps"><li><span class="vm h">YOUR PC</span> Open PowerShell or Terminal:
<pre>ssh socadmin@192.168.56.10</pre>
Type <code>yes</code> to accept the server’s fingerprint, then the password. Your window is now a remote control for the server. Paste with right-click or <code>Ctrl+Shift+V</code>. Type <code>exit</code> to leave.</li></ol>
<h3>Phase 6: snapshots (your undo button)</h3>
<ol class="steps">
<li>Shut each VM down cleanly: <code>sudo poweroff</code> on Linux; Start → Power → Shut down on Windows.</li>
<li>In VirtualBox, select a VM → <b>Snapshots</b> tab → <b>Take</b>. Name it <code>01-network-ready</code>. Repeat for all three.</li></ol>
<h3>Evidence to save</h3>
<ul><li>The completed ping matrix.</li><li>The <code>ip -br a</code> output from Ubuntu and Kali, and the <code>Get-NetIPAddress</code> output from Windows.</li><li>A screenshot of the SSH login from your PC, and of the three snapshot lists.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>netplan reports an error</td><td>Spaces or Tab characters in the file</td><td>Retype with spaces only; run <code>sudo netplan try</code></td></tr>
<tr><td>Windows cannot ping anything</td><td>You set the address on the NAT adapter</td><td>Set the NAT adapter back to automatic and use the other one</td></tr>
<tr><td>Kali has no <code>eth1</code></td><td>Adapter 2 not enabled in settings</td><td>Power off; enable Adapter 2; start</td></tr>
<tr><td>SSH from your PC is refused</td><td>OpenSSH not installed or PC cannot reach .10</td><td><code>sudo apt install openssh-server</code> on Ubuntu; ping first</td></tr>
<tr><td>“A start job is running for wait for network” at boot</td><td>Old DHCP wait</td><td>Gone once the static address is in place; run <code>sudo netplan apply</code></td></tr>
<tr><td>Ping works one way only</td><td>Windows firewall</td><td>Add the ICMP rule above</td></tr></table>
<div class="box lab"><b>✅ Lab Ready checklist</b>☐ Ubuntu is .10 ☐ Windows is .30 ☐ Kali is .50 ☐ every ping in the matrix works ☐ SSH from your PC works ☐ three snapshots taken ☐ notebook updated. <b>Do not continue until every box is ticked.</b></div>
<div class="box lab"><b>📝 Recap</b>You gave every machine a fixed address on the private network, proved they can all reach each other, learned to control the server from your own PC, and created your first safety net. From now on, every lab starts from these snapshots.</div>
<h3>🔬 Go deeper: reading the numbers, and a troubleshooting ladder</h3>
<p>You have typed several addresses, so check that you understand them. In <code>192.168.56.10/24</code>, the part before the slash is the address, and <code>/24</code> says that the first 24 of its 32 bits, which means the first three numbers, name the network. Every machine whose address starts with <code>192.168.56</code> is on the same network and can talk directly. That is why the three VMs find each other without any router, and why we left the gateway empty.</p>
<p>When two machines cannot talk, climb this ladder from the bottom. Stop at the first rung that fails.</p>
<table><tr><th>Rung</th><th>Question</th><th>How to test</th></tr>
<tr><td>1</td><td>Is the virtual cable connected?</td><td>VirtualBox → Settings → Network → “Cable connected” is ticked</td></tr>
<tr><td>2</td><td>Does the card have the right address?</td><td><code>ip a</code> or <code>ipconfig</code></td></tr>
<tr><td>3</td><td>Can I reach myself?</td><td><code>ping 127.0.0.1</code></td></tr>
<tr><td>4</td><td>Can I reach the other machine?</td><td><code>ping 192.168.56.10</code></td></tr>
<tr><td>5</td><td>Is the service port open?</td><td><code>nc -zv 192.168.56.10 22</code> or <code>Test-NetConnection</code></td></tr>
<tr><td>6</td><td>Is a firewall blocking it?</td><td><code>sudo ufw status</code> and the Windows firewall rules</td></tr></table>
<div class="box lab"><b>Challenge</b>Write in your notebook which rung would fail in each case: (a) you typed 192.168.65.30 instead of 192.168.56.30 on Windows; (b) the Windows firewall blocks ping; (c) SSH is stopped on Ubuntu. <i>Answers: (a) rung 4, because the networks differ; (b) rung 4, though rung 5 may still work; (c) rung 5.</i></div>`,
quiz:[{q:"Why is the Windows gateway left empty on the lab adapter?",o:["The lab network has no router; the NAT card handles internet","It is an error","Windows cannot use gateways","It makes ping faster"],a:0},{q:"What does sudo netplan try do?",o:["Applies the settings and reverts if you do not confirm","Deletes the file","Reboots the server","Opens SSH"],a:0},{q:"Why SSH from your PC into Ubuntu?",o:["Paste works, so commands are easier to enter","It is faster than Windows","It hides traffic","Wazuh needs it"],a:0}]},

{id:"2-1",mod:"m2",mins:75,title:"The Linux command line (Ubuntu)",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>move around Linux, create and edit files, search and count text, read file permissions and use <code>sudo</code> safely, using only the keyboard.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 75 minutes. <b>You need:</b> the lab from Module 1 with <code>wazuh-server</code> running, and the chapter “Linux for Security People” (optional but helpful). SIEM servers, attacker tools and most logs live on Linux, and analysts search logs from the command line every day.</div>
<h3>Connect from your own PC</h3>
<p><span class="vm h">YOUR PC</span> Open PowerShell or Terminal and run <code>ssh socadmin@192.168.56.10</code>. All commands below run in that window, where copy and paste works.</p>
<h3>Phase 1: orient yourself</h3>
<p>The prompt <code>socadmin@wazuh-server:~$</code> says: user <b>socadmin</b>, computer <b>wazuh-server</b>, in <b>~</b> (your home folder), and <b>$</b> means a normal user.</p>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>pwd
ls
ls -la
cd /var/log
pwd
ls | head -n 10
cd ~</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>/home/socadmin</code>, then (after <code>cd</code>) <code>/var/log</code>, then a list of log files such as <code>auth.log</code> and <code>syslog</code>, and back to home.</div>
<h3>Phase 2: create and edit files</h3>
<ol class="steps"><li><pre>mkdir ~/practice
cd ~/practice
echo "10:01 login ok user=ada" &gt; app.log
echo "10:02 login FAILED user=admin" &gt;&gt; app.log
echo "10:03 login FAILED user=admin" &gt;&gt; app.log
echo "10:04 login ok user=tunde" &gt;&gt; app.log
cat app.log
nano app.log</pre>
In nano, add a fifth line, then press <code>Ctrl+O</code>, Enter to save, and <code>Ctrl+X</code> to exit. The single arrow <code>&gt;</code> overwrites a file and the double arrow <code>&gt;&gt;</code> appends. Mixing them up destroys data, so slow down at this step.</li></ol>
<h3>Phase 3: search and count like an analyst</h3>
<ol class="steps"><li><pre>grep FAILED app.log
grep -c FAILED app.log
grep -i "user=admin" app.log | wc -l
sudo tail -n 5 /var/log/auth.log</pre></li></ol>
<p><code>grep</code> keeps lines that match, <code>-c</code> counts them, <code>wc -l</code> counts lines, and <code>tail</code> shows the end of a file. The pipe <code>|</code> sends one command’s output into the next.</p>
<div class="box tip"><b>✅ You should see</b>The two FAILED lines, the number <code>2</code>, another <code>2</code>, and lines from <code>auth.log</code> that include your own SSH login.</div>
<h3>Phase 4: permissions and sudo</h3>
<ol class="steps"><li><pre>ls -l app.log
whoami
sudo whoami
ls -l /etc/shadow</pre></li></ol>
<p>The first column of <code>ls -l</code>, such as <code>-rw-rw-r--</code>, shows who may read, write and execute. <code>sudo whoami</code> prints <code>root</code> because <code>sudo</code> runs one command as administrator. <code>/etc/shadow</code> is readable only by root, because it holds password hashes.</p>
<h3>Phase 5: delete safely, then clean up</h3>
<p>Linux has no recycle bin. Before you delete, look at what you will delete:</p>
<pre>ls ~/practice
cd ~
rm -r ~/practice
ls</pre>
<div class="box edge"><b>Danger rule</b>Never type <code>rm -r</code> with a path you did not just look at with <code>ls</code>, and never use <code>sudo rm -r</code> casually. One wrong path can destroy a server.</div>
<h3>Command reference</h3>
<table><tr><th>Command</th><th>Does</th></tr><tr><td><code>pwd</code>, <code>ls</code>, <code>cd</code></td><td>Where am I, what is here, move</td></tr><tr><td><code>mkdir</code>, <code>cp</code>, <code>mv</code>, <code>rm</code></td><td>Make, copy, move or rename, delete</td></tr><tr><td><code>cat</code>, <code>less</code>, <code>head</code>, <code>tail</code></td><td>Show a file, page through it, start or end of it</td></tr><tr><td><code>grep</code>, <code>wc</code>, <code>sort</code>, <code>uniq</code></td><td>Search, count, order, group</td></tr><tr><td><code>sudo</code>, <code>man</code></td><td>Run as administrator, read a manual (<code>q</code> quits)</td></tr></table>
<p>Time savers: <b>Tab</b> completes names, the <b>Up arrow</b> recalls your last command, and <b>Ctrl+C</b> stops a running command.</p>
<h3>Evidence to save</h3>
<ul><li>The output of the <code>grep -c</code> and <code>wc -l</code> commands.</li><li>The first lines of <code>ls -l app.log</code> and <code>ls -l /etc/shadow</code>, with one sentence explaining the difference.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>“Permission denied”</td><td>Needs administrator rights</td><td>Add <code>sudo</code></td></tr>
<tr><td>“No such file or directory”</td><td>Typo, or wrong folder; Linux is case sensitive</td><td>Check <code>pwd</code> and <code>ls</code>; use Tab completion</td></tr>
<tr><td>Stuck inside nano</td><td>Did not exit</td><td><code>Ctrl+X</code>, then <code>N</code> to quit without saving</td></tr>
<tr><td>Strange characters appear after pasting</td><td>Hidden formatting</td><td>Retype the command</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You moved through the file system, created and edited files, searched and counted text with pipes, read permissions, used <code>sudo</code> and deleted safely. These are the movements behind every Linux investigation.</div>
<h3>🔬 Go deeper: pipes, and counting like an analyst</h3>
<p>The real power of the command line is the <b>pipe</b>, the vertical bar <code>|</code>. It sends the output of one command into the next, so that small tools combine into big ones. Here is a line that analysts type every week. It counts failed SSH logins by source address.</p>
<pre>sudo grep "Failed password" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -rn | head</pre>
<p>Read it from left to right. <code>grep</code> keeps the failure lines. <code>awk</code> prints the address, which sits four words from the end of each line. <code>sort</code> groups equal addresses together, <code>uniq -c</code> counts each group, <code>sort -rn</code> puts the biggest number first and <code>head</code> shows the top ten. After you run the Hydra attack in Module 6, run this line again, and you will see the attacker’s address at the top with a large count.</p>
<div class="box lab"><b>Challenge</b>Change the command to count failures by <b>user name</b> instead of address. (Hint: in lines for invalid users, the name is the word after <code>user</code>; start by printing the whole line and looking at where the name sits.) Then write one sentence explaining what a long list of different names from one address would suggest. <i>Answer: it suggests guessing or spraying user names.</i></div>`,
quiz:[{q:"Which command shows only lines containing FAILED?",o:["grep FAILED file","cat FAILED","ls FAILED","cd FAILED"],a:0},{q:"What is the difference between > and >> ?",o:["> overwrites; >> appends","They are the same","> appends; >> overwrites","Neither writes a file"],a:0},{q:"Why look at a path with ls before using rm -r?",o:["There is no recycle bin","It makes rm faster","It is required by Linux","It hides files"],a:0}]},

{id:"2-2",mod:"m2",mins:70,title:"The Windows command line (PowerShell)",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>use PowerShell, as a normal user and as administrator, to move around, create and read files, search text, list processes and services, and calculate a file’s hash.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 70 minutes. <b>You need:</b> <code>win-victim</code> running with Guest Additions (for pasting) and the chapter “Windows for Security People” if you can. PowerShell is the tool both administrators and attackers use most on Windows, and you will use it throughout the case files.</div>
<h3>Open it two ways</h3>
<p><span class="vm w">WINDOWS</span> <b>Normal:</b> Start → type <code>PowerShell</code> → Enter. <b>As administrator:</b> right-click it → <b>Run as administrator</b>. The title bar then says “Administrator”. In this academy we call that <b>admin PowerShell</b>.</p>
<h3>Phase 1: find your way around</h3>
<ol class="steps"><li><pre>Get-Location
Get-ChildItem C:\
Set-Location C:\
Get-ChildItem -Force | Select-Object -First 8</pre></li></ol>
<p>Commands follow a <b>Verb-Noun</b> pattern, which makes them guessable: <code>Get-</code> reads something, <code>Set-</code> changes it, <code>New-</code> creates it, <code>Remove-</code> deletes it. Use <code>Get-Help Get-ChildItem</code> to read the manual.</p>
<h3>Phase 2: create, write and search a file</h3>
<ol class="steps"><li>Open <b>admin PowerShell</b> and run:
<pre>New-Item C:\Practice -ItemType Directory -Force
Set-Content C:\Practice\app.log "10:01 login ok user=ada"
Add-Content C:\Practice\app.log "10:02 login FAILED user=admin"
Add-Content C:\Practice\app.log "10:03 login FAILED user=admin"
Get-Content C:\Practice\app.log
Select-String "FAILED" C:\Practice\app.log</pre></li></ol>
<p><code>Set-Content</code> overwrites a file, and <code>Add-Content</code> appends: the same trap as <code>&gt;</code> and <code>&gt;&gt;</code> in Linux.</p>
<h3>Phase 3: processes and services</h3>
<ol class="steps"><li><pre>Get-Process | Sort-Object CPU -Descending | Select-Object -First 5
Get-Service | Where-Object { $_.Status -eq "Running" } | Select-Object -First 8
Get-Service WinDefend, EventLog</pre></li></ol>
<p><b>EventLog</b> is the service that records Windows logs. If an attacker stops it, the computer goes quiet. <b>WinDefend</b> is the antivirus. Both should be <b>Running</b>.</p>
<h3>Phase 4: the file fingerprint</h3>
<p>This is the idea behind file integrity monitoring in Module 5.</p>
<ol class="steps"><li><pre>Get-FileHash C:\Practice\app.log -Algorithm SHA256
Add-Content C:\Practice\app.log "10:05 login ok user=tunde"
Get-FileHash C:\Practice\app.log -Algorithm SHA256</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>The log lines, two FAILED matches, a table of 5 programs, a list of running services, WinDefend and EventLog both <b>Running</b>, and two <b>different</b> SHA256 values for the same file before and after you added one line.</div>
<h3>Clean up</h3>
<pre>Remove-Item C:\Practice -Recurse</pre>
<h3>Linux and PowerShell side by side</h3>
<table><tr><th>Task</th><th>PowerShell</th><th>Linux</th></tr><tr><td>Where am I</td><td><code>Get-Location</code></td><td><code>pwd</code></td></tr><tr><td>List files</td><td><code>Get-ChildItem</code></td><td><code>ls</code></td></tr><tr><td>Show a file</td><td><code>Get-Content</code></td><td><code>cat</code></td></tr><tr><td>Search text</td><td><code>Select-String</code></td><td><code>grep</code></td></tr><tr><td>Processes</td><td><code>Get-Process</code></td><td><code>ps</code></td></tr><tr><td>Services</td><td><code>Get-Service</code></td><td><code>systemctl</code></td></tr></table>
<h3>Evidence to save</h3>
<ul><li>The two hash values, labelled “before” and “after”.</li><li>A screenshot of the services check showing WinDefend and EventLog.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>“Access denied”</td><td>Not running as administrator</td><td>Open admin PowerShell</td></tr>
<tr><td>“Running scripts is disabled”</td><td>Script policy (affects .ps1 files only)</td><td>Ignore for typed commands</td></tr>
<tr><td>“Cannot find path”</td><td>Typo or the folder does not exist</td><td>Check spelling; list the parent folder</td></tr>
<tr><td>Paste does nothing</td><td>Guest Additions or clipboard setting</td><td>Repeat lab 1.4, phase 3</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You learned the verb-noun pattern, created and searched files, inspected processes and services, and saw why a changed file has a different hash. You will use all of these in the case files.</div>
<h3>🔬 Go deeper: PowerShell passes objects, not text</h3>
<p>Linux pipes carry lines of text. PowerShell pipes carry <b>objects</b>, which are like little records with named fields. That makes filtering and counting more precise. For example, this counts failed Windows logons by account name:</p>
<pre>Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} | ForEach-Object { $_.Properties[5].Value } | Group-Object | Sort-Object Count -Descending</pre>
<p>Each event has a list of properties; number 5 holds the name of the account that failed to log on. <code>Group-Object</code> groups equal names and counts them. Run it after you create a few failed logons in lesson 2.5, and you should see <code>labuser</code> near the top.</p>
<p>To see what other properties an event has, run this and look at the list:</p>
<pre>(Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} -MaxEvents 1).Properties | Select-Object -First 12 Value</pre>
<div class="box lab"><b>Challenge</b>Find which property holds the <b>source address</b> of the failed logon, then count failures by address. <i>Hint: look for a value that looks like an IP address or a dash for local logons.</i> Write down what you learned about the difference between a local failure and a network failure.</div>`,
quiz:[{q:"How do you open PowerShell as administrator?",o:["Right-click it and choose Run as administrator","Double-click it","Press Esc","Type admin"],a:0},{q:"The PowerShell equivalent of grep is…",o:["Select-String","Get-Process","Get-Location","Set-Content"],a:0},{q:"What happens to a file’s hash when its content changes?",o:["It changes","It stays","It is deleted","It gets shorter"],a:0}]},

{id:"2-3",mod:"m2",mins:80,title:"Networking essentials: addresses, ports and connections",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>find each machine’s address, list the open ports on two systems, test connections between your VMs, run a first scan from Kali and explain what each result means.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 80 minutes. <b>You need:</b> all three VMs running with the addresses from lab 1.6, and the chapter “Networking for Defenders” if you can. Almost every attack crosses a network, and almost every alert mentions an address or a port.</div>
<h3>Phase 1: who am I on the network?</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> <pre>ip -br a</pre></li>
<li><span class="vm w">WINDOWS</span> <pre>ipconfig</pre></li>
<li><span class="vm k">KALI</span> <pre>ip -br a</pre></li></ol>
<p>Write the lab address of each machine in your notebook. They must match the Lab sheet: .10, .30 and .50.</p>
<h3>Phase 2: can I reach you?</h3>
<ol class="steps"><li><span class="vm k">KALI</span> <pre>ping -c 3 192.168.56.10
ping -c 3 192.168.56.30</pre></li></ol>
<p>A reply proves that the two machines can exchange packets. It does <b>not</b> prove that any service is available. For that you need Phase 3.</p>
<h3>Phase 3: which doors are open?</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> <pre>sudo ss -tulpn</pre>Look for <code>:22</code> (SSH) in the <b>LISTEN</b> state.</li>
<li><span class="vm w">WINDOWS</span> <pre>netstat -ano | Select-String LISTENING | Select-Object -First 8</pre>Common Windows entries are 135, 445 and 139. Port 3389 appears only if Remote Desktop is on.</li></ol>
<h3>Phase 4: knock on the door</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> <pre>Test-NetConnection 192.168.56.10 -Port 22</pre></li>
<li><span class="vm k">KALI</span> <pre>nc -zv 192.168.56.10 22
nc -zv -w 2 192.168.56.10 80</pre></li></ol>
<p>The first <code>nc</code> succeeds because SSH listens on 22. The second fails because nothing listens on port 80 yet. Both results are useful: an open port is a door, and a closed port is a wall.</p>
<h3>Phase 5: your first scan (your own lab only)</h3>
<ol class="steps"><li><span class="vm k">KALI</span> <pre>nmap 192.168.56.10
nmap -sV -p 22 192.168.56.10</pre></li></ol>
<p>This is <b>reconnaissance</b>: the attacker’s first step. <code>-sV</code> asks the service to identify itself, which reveals the software version. Attackers search for known flaws in that version, so a visible version is information you are giving away.</p>
<div class="box tip"><b>✅ You should see</b>Addresses matching the Lab sheet; ping replies; port 22 listening on Ubuntu; <code>TcpTestSucceeded : True</code> on Windows; “succeeded” for port 22 and a failure for port 80; and Nmap listing <code>22/tcp open ssh</code> with an OpenSSH version for the last command.</div>
<h3>What each result means</h3>
<table><tr><th>Result</th><th>Meaning</th></tr><tr><td>Ping replies</td><td>The path exists, and ICMP is allowed</td></tr><tr><td>Port “open” or “succeeded”</td><td>A service is listening and reachable</td></tr><tr><td>Port “closed”</td><td>The machine answered, but no service listens</td></tr><tr><td>Port “filtered” or a timeout</td><td>A firewall is probably dropping the traffic</td></tr></table>
<div class="box why"><b>💡 Why Wazuh will not see this scan</b>Wazuh reads logs on computers. A closed port writes no log, so a simple scan leaves little trace on the host. Network sensors see scans. You will meet this limitation again, and in the chapter “Reading Network Traffic” you capture a scan yourself.</div>
<h3>Evidence to save</h3>
<ul><li>The Nmap output and one sentence saying what each open port is for.</li><li>A table of the three addresses and the ports you found open on each machine.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Port 22 not open</td><td>SSH stopped</td><td><code>sudo systemctl enable --now ssh</code> on Ubuntu</td></tr>
<tr><td>Ping works but ports time out</td><td>A firewall</td><td>Check <code>sudo ufw status</code> and Windows Firewall</td></tr>
<tr><td><code>nmap: command not found</code></td><td>Wrong machine</td><td>Nmap is on Kali only</td></tr>
<tr><td>Everything times out</td><td>Network not configured</td><td>Redo the ping matrix in lab 1.6</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You found addresses, distinguished reachability from service availability, listed open ports, tested connections and performed a first scan. You also saw what an attacker learns from each step.</div>
<h3>🔬 Go deeper: the life of a connection</h3>
<p>A TCP connection has states, and the <code>ss</code> command shows them. Open an SSH session from your PC to the server, and then run this on Ubuntu:</p>
<pre>ss -tn state established '( sport = :22 )'</pre>
<p>You will see one line for your session, with your PC’s address on the right. The word <b>ESTABLISHED</b> means that the handshake finished and both sides are talking. After you close the session, you may briefly see <b>TIME-WAIT</b>, which is the system waiting a moment to be sure that no late packets are on their way. Other states you will meet are <b>LISTEN</b> (a service waiting for connections) and <b>SYN-SENT</b> or <b>SYN-RECV</b> (a handshake in progress). Many <b>SYN-RECV</b> lines at once can mean a flood of connection attempts.</p>
<p>To link a port to a program, add the <code>-p</code> option as an administrator:</p>
<pre>sudo ss -tnp state established</pre>
<div class="box lab"><b>Challenge</b>Start an SSH session from Kali, and on Ubuntu find (a) the Kali address, (b) the Kali source port, and (c) the name of the program serving the session. Explain why the source port changes every time you reconnect. <i>Answer: the client picks a fresh temporary port for each new connection.</i></div>`,
quiz:[{q:"What is a port?",o:["A numbered door for a service on a computer","A USB socket","A network cable","A website"],a:0},{q:"Which port does SSH use?",o:["22","80","3389","1514"],a:0},{q:"Does a successful ping prove a service is available?",o:["No, only that packets can travel","Yes, always","Yes, for SSH only","Only on Windows"],a:0}]},

{id:"2-4",mod:"m2",mins:75,title:"Users, permissions and services",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>explain users, groups, administrators, permissions and services on both operating systems, create the practice account <code>labuser</code> on each, and prove that a permission setting really blocks access.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 75 minutes. <b>You need:</b> Ubuntu and Windows running, and the chapters on Linux and Windows for security people if you can. Most attacks are about accounts (stealing or guessing them) and permissions (becoming an administrator). Almost every alert mentions a user.</div>
<h3>Phase 1: Linux identity and the account we will attack later</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> <pre>whoami
id
groups
ls -l /etc/passwd /etc/shadow</pre>Notice that <code>/etc/passwd</code> can be read by anyone and <code>/etc/shadow</code> only by root.</li>
<li>Create the victim account. Its password is weak <b>on purpose</b>, so that you can attack it in Module 6:
<pre>sudo useradd -m -s /bin/bash labuser
echo 'labuser:Summer2024' | sudo chpasswd
id labuser</pre></li></ol>
<h3>Phase 2: prove that a permission works</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>echo "board salary notes" &gt; ~/secret.txt
chmod 600 ~/secret.txt
ls -l ~/secret.txt
sudo -u labuser cat ~/secret.txt
sudo cat ~/secret.txt
chmod 644 ~/secret.txt
sudo -u labuser cat ~/secret.txt
rm ~/secret.txt</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>First <code>-rw-------</code> and “Permission denied” when labuser reads the file; root can read it; after <code>chmod 644</code> labuser can read it too. Permission 600 means owner read and write only; 644 means everyone can read.</div>
<h3>Phase 3: a Linux service</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>systemctl is-active ssh cron
systemctl status cron --no-pager | head -n 5</pre></li></ol>
<p>A service is a program that runs in the background. Each running service is a door, and a new unexpected service is a classic place for an attacker to hide.</p>
<div class="box edge"><b>Do not stop SSH</b>You are connected to the server through SSH. Stopping it would cut your connection. Practise stopping and starting on <code>cron</code> instead, if you wish: <code>sudo systemctl stop cron</code> then <code>sudo systemctl start cron</code>.</div>
<h3>Phase 4: Windows accounts and permissions</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> (admin PowerShell) <pre>whoami
net localgroup administrators
net user labuser Summer2024 /add
net user labuser</pre></li>
<li>Prove a Windows permission:
<pre>New-Item C:\LabData -ItemType Directory -Force
Set-Content C:\LabData\secret.txt "board salary notes"
icacls C:\LabData\secret.txt
icacls C:\LabData\secret.txt /inheritance:r /grant:r "analyst:(R,W)"
icacls C:\LabData\secret.txt
Remove-Item C:\LabData\secret.txt</pre>
The second <code>icacls</code> shows who may access the file. After removing inherited rights and granting only <code>analyst</code>, other ordinary users lose access.</li>
<li>A Windows service:
<pre>Get-Service WinDefend, EventLog</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>analyst</code> listed in the Administrators group, <code>labuser</code> not listed, <code>labuser</code> created with “The command completed successfully”, and WinDefend and EventLog both <b>Running</b>.</div>
<h3>Key ideas</h3>
<table><tr><th>Idea</th><th>Linux</th><th>Windows</th></tr>
<tr><td>Powerful account</td><td>root (use <code>sudo</code>)</td><td>Administrators group; SYSTEM is the machine itself</td></tr>
<tr><td>Permissions</td><td>Read, write, execute for owner, group, others</td><td>Access control lists (ACLs) per user or group</td></tr>
<tr><td>Services</td><td><code>systemctl</code></td><td><code>services.msc</code>, <code>Get-Service</code></td></tr>
<tr><td>Risk when abused</td><td>Privilege escalation to root</td><td>Becoming a local or domain administrator</td></tr></table>
<p><b>Least privilege</b> means giving each account only the access it needs. When an attacker steals a low-privilege account, their next goal is <b>privilege escalation</b>.</p>
<h3>Evidence to save</h3>
<ul><li>The output of <code>id labuser</code> and <code>net user labuser</code>.</li><li>The two <code>ls -l</code> lines showing 600 and 644, with the “Permission denied” message.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>“user already exists”</td><td>Account was created before</td><td>Continue; reset the password with <code>chpasswd</code> if unsure</td></tr>
<tr><td>Windows rejects the password</td><td>A password policy applies</td><td>Use <code>Summer2024!x</code> and write it in your notes, then use it consistently</td></tr>
<tr><td>“Access is denied” in PowerShell</td><td>Not administrator</td><td>Open admin PowerShell</td></tr>
<tr><td>icacls changes nothing visible</td><td>You are an administrator and can still access it</td><td>Read the output rather than relying on opening the file</td></tr></table>
<div class="box edge"><b>Rule for later</b><b>labuser / Summer2024</b> exists only so that we can attack it. On a real system a password like that would be a finding in your report.</div>
<div class="box lab"><b>📝 Recap</b>You created the practice accounts, proved a permission setting with your own eyes on both systems, and compared how Linux and Windows describe users, groups and services. These are the foundations for every access-related alert.</div>`,
quiz:[{q:"What is privilege escalation?",o:["An attacker gaining higher access such as administrator","A pay rise","Updating Windows","Creating a user"],a:0},{q:"What does chmod 600 do?",o:["Only the owner can read and write","Everyone can write","Nobody can read","Makes the file executable"],a:0},{q:"Why not stop the SSH service during this lab?",o:["It would disconnect your remote session","It deletes files","It resets the password","It is required to run"],a:0}]},

{id:"2-5",mod:"m2",mins:80,title:"Logs: your computer’s diary",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>read the parts of a log line, create a failed login on Linux and on Windows, find each one in its log, and explain why a SIEM needs both.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 80 minutes. <b>You need:</b> the lab running, <code>labuser</code> created (lab 2.4) and the chapter “What Really Happens When You Log In” if you can. Everything in a SOC starts with logs. A SIEM is a tool that collects logs from many computers and raises alerts, so if you can read a log, you can understand any alert.</div>
<h3>What a log line tells you</h3>
