quiz:[{q:"Why do many companies run FIM?",o:["It detects unauthorised changes and is often required by standards","It speeds up computers","It replaces passwords","It blocks email"],a:0},{q:"What is the first question to ask about a FIM alert?",o:["Was the change approved?","What colour is the file?","Is the PC fast?","Who is the CEO?"],a:0},{q:"Which statement is true?",o:["FIM and EDR see different things","FIM replaces EDR fully","EDR never helps","FIM sees memory-only attacks"],a:0}]},

{id:"r11",mod:"m6",title:"Password Attacks and Authentication Defence",labs:["6-1","6-2"],
body:`<p class="lead">Passwords are a few decades old as a mass technology, and they have never been a perfect idea. In this chapter you will learn why password attacks remain so common, how they appear in logs, how defenders respond, and what actually reduces the risk.</p>
<h2>Why passwords keep failing</h2>
<p>A password asks a human to invent a secret, remember it, and keep it unique across dozens of services. People do not do this well. They choose short passwords, pick predictable patterns such as a season and a year, reuse the same one in many places, and share them. Attackers know all of this, and write their tools around it.</p>
<h2>The main attack types</h2>
<table><tr><th>Attack</th><th>How it works</th><th>What it looks like in logs</th></tr>
<tr><td><b>Brute force</b></td><td>Many guesses against one account</td><td>A long run of failures for one user from one address</td></tr>
<tr><td><b>Password spraying</b></td><td>One or two common passwords against many accounts, to stay under lockout limits</td><td>Few failures per account, but many accounts from the same source</td></tr>
<tr><td><b>Credential stuffing</b></td><td>Leaked username and password pairs from another breach are tried here</td><td>Failures across many accounts; some successes from unfamiliar locations</td></tr>
<tr><td><b>Phishing</b></td><td>A fake page tricks the user into typing the password</td><td>A successful login from an unusual place, with no preceding failures</td></tr>
<tr><td><b>Password reset abuse</b></td><td>Attacker convinces a helpdesk or an email account to reset the password</td><td>Reset events followed by new sign-ins</td></tr></table>
<p>Notice that the last two leave no failures at all. This is why you cannot rely on “count the failures” as a complete detection. Failures catch the noisy attacks; context, such as an unusual place or time, catches the quiet ones.</p>
<h2>The defender’s trade-off: lockouts</h2>
<p>An account lockout, which disables an account after a number of failures, stops simple brute force. But it creates a new problem. An attacker can lock out many real users on purpose, causing a <b>denial of service</b>. Spraying avoids lockouts anyway. So security teams choose limits carefully, and many prefer <b>delays</b> and <b>additional factors</b> to hard lockouts.</p>
<h2>What really helps</h2>
<ol>
<li><b>Multi-factor authentication (MFA).</b> A second proof, such as a code or a security key, means a stolen password alone is not enough. This single control prevents a large share of account takeovers.</li>
<li><b>Keys instead of passwords for servers.</b> SSH keys cannot be guessed in the way passwords can.</li>
<li><b>Long, unique passwords</b> stored in a password manager.</li>
<li><b>Restricting where logins are accepted from</b>, for example a VPN or a short list of addresses.</li>
<li><b>Removing unused accounts</b> and exposure.</li>
<li><b>Monitoring</b> that links failures to later successes.</li>
</ol>
<h2>How SSH attacks look in practice</h2>
<p>Any server with SSH open to the internet is probed within hours. In the logs you see failures for names such as <code>root</code>, <code>admin</code>, <code>ubuntu</code>, <code>test</code> and <code>oracle</code>, from addresses around the world. Most are bots and most will never succeed. Analysts do not investigate each one. Instead they ask:</p>
<ul>
<li>Is there any <b>success</b> from an address that also produced failures?</li>
<li>Did a <b>real account</b> get targeted, rather than random names?</li>
<li>Did the activity <b>change</b> in intensity or style?</li>
<li>Did anything happen <b>after</b> a success: new keys, new users, new scheduled jobs, large downloads?</li>
</ul>
<p>The case file follows exactly these questions.</p>
<h2>Hardening SSH</h2>
<p>A sensible baseline for a public server includes the following settings in <code>/etc/ssh/sshd_config</code>. Always keep one session open while testing changes, so that a mistake does not lock you out.</p>
<table><tr><th>Setting</th><th>Value</th><th>Reason</th></tr>
<tr><td><code>PermitRootLogin</code></td><td><code>no</code></td><td>Attackers always try root</td></tr>
<tr><td><code>PasswordAuthentication</code></td><td><code>no</code> (once keys work)</td><td>Removes guessing entirely</td></tr>
<tr><td><code>MaxAuthTries</code></td><td><code>3</code></td><td>Limits guesses per connection</td></tr>
<tr><td><code>AllowUsers</code></td><td>a short list</td><td>Only expected accounts may log in</td></tr></table>
<p>Tools such as <b>fail2ban</b> add automatic blocking after failures, similar to the active response you will configure in Wazuh.</p>
<h2>The same ideas on Windows</h2>
<p>On Windows, password attacks generate event 4625 for each failure, with the reason in the status codes. Remote Desktop, exposed to the internet, is one of the most attacked services in the world. Defenders watch for many 4625 events from one source, for a 4624 with logon type 10 soon after, and for failures against many different accounts from one address, which suggests spraying. In a company with Active Directory, Kerberos and NTLM events on the domain controller show the same activity from the server’s side. A later module covers these in depth.</p>
<h2>A response playbook for a compromised account</h2>
<p>A playbook is a prepared list of steps, so people do not invent them under stress. For a compromised account, it usually reads like this.</p>
<ol>
<li><b>Confirm</b> the compromise with evidence: failures then success, unusual location, or the user’s own report.</li>
<li><b>Contain</b>: disable the account or reset the password, end active sessions, and revoke tokens or keys.</li>
<li><b>Scope</b>: what did this account access, and from where? Search for the same address and account elsewhere.</li>
<li><b>Eradicate</b>: remove anything the attacker added, such as new keys, accounts, scheduled jobs or programs.</li>
<li><b>Recover</b>: restore normal access with a new credential and MFA.</li>
<li><b>Learn</b>: write the report and fix the cause, for example a weak password policy.</li>
</ol>
<div class="note"><b>Field note: be kind to the user</b>The person whose account was stolen is usually embarrassed or afraid. Good analysts treat them as a witness, not a culprit. Calm, plain language and quick help make people report problems sooner next time, and early reports are worth a great deal.</div>
<h2>Connecting to the lab</h2>
<p>In the SSH case file you will play the part of the attacker with Hydra against your own lab, then switch sides and use Wazuh to see, understand and stop it. Try to hold both views at once. A defender who understands how the attack tool behaves writes better rules than one who has only read about it.</p>`,
takeaways:["Passwords fail because humans choose predictable, reused secrets.","Brute force, spraying, stuffing, phishing and reset abuse look different in logs; some leave no failures at all.","Lockouts can be abused, so teams balance them with delays and extra factors.","MFA, keys, long unique passwords and restricted access reduce risk most.","A playbook turns response into repeatable steps: confirm, contain, scope, eradicate, recover, learn."],
quiz:[{q:"Which attack tries a few passwords across many accounts?",o:["Password spraying","Brute force","Phishing","Defacement"],a:0},{q:"Why can hard account lockouts be a problem?",o:["Attackers can lock real users out on purpose","They are too slow","They remove logs","They use too much RAM"],a:0},{q:"Which single control prevents many account takeovers?",o:["Multi-factor authentication","A longer wallpaper","A bigger disk","Weekly reboots"],a:0}]},

{id:"r12",mod:"m6",title:"Writing Great Detections and Great Reports",labs:["6-4","6-6"],
body:`<p class="lead">Two kinds of writing decide how useful you are in a security team: the rules you write for machines, and the reports you write for people. This chapter explains how to do both well, using habits that experienced detection engineers and incident responders share.</p>
<h2>Part one: writing detections</h2>
<h3>The life of a detection</h3>
<p>A good detection is not written once and forgotten. It moves through a cycle.</p>
<ol>
<li><b>Idea.</b> Where does it come from? A new attack technique, a past incident, a gap in coverage, or a request from a manager.</li>
<li><b>Data check.</b> Do we log the evidence needed to see this behaviour? If not, the first job is to collect the logs.</li>
<li><b>Logic.</b> Write the simplest rule that would catch the behaviour.</li>
<li><b>Test.</b> Perform the behaviour in a safe place and confirm the alert fires. Also test with harmless activity to see whether it fires wrongly.</li>
<li><b>Deploy.</b> Release the rule, with documentation.</li>
<li><b>Tune.</b> Watch its results, and reduce noise.</li>
<li><b>Review or retire.</b> Systems change; a rule may need updating or removing.</li>
</ol>
<h3>Document every detection</h3>
<p>A rule without documentation becomes a mystery within a year. Even in a small team, keep a short record for each detection.</p>
<table><tr><th>Field</th><th>Example</th></tr>
<tr><td>Name</td><td>SSH login success shortly after brute force</td></tr>
<tr><td>Rule ID</td><td>100100</td></tr>
<tr><td>Purpose</td><td>Catch a likely compromised account after password guessing</td></tr>
<tr><td>Data needed</td><td>SSH authentication logs from Linux servers</td></tr>
<tr><td>Logic, in words</td><td>A successful login within five minutes of a brute-force alert from the same source address</td></tr>
<tr><td>ATT&CK techniques</td><td>T1110, T1078</td></tr>
<tr><td>Known false positives</td><td>An administrator who mistypes a password many times, then succeeds</td></tr>
<tr><td>First response steps</td><td>Check the account’s recent activity; contact the owner; disable if not confirmed</td></tr>
<tr><td>Owner and review date</td><td>Security team; review in six months</td></tr></table>
<h3>Think about false positives before you deploy</h3>
<p>For every rule, ask: “what harmless activity might trigger this?” In the example above, a real user who forgets their password and then remembers it creates the same pattern. That is acceptable if the rule is rare and the response is quick, but unacceptable if it fires fifty times a day. By thinking this through in advance, you decide the right level and the right wording.</p>
<h3>Write the alert for the reader at three in the morning</h3>
<p>The text of an alert is the first thing an analyst sees. Compare:</p>
<p><b>Weak:</b> “Rule 100100 triggered.”</p>
<p><b>Strong:</b> “SSH login success shortly after brute force from the same IP: likely compromised account.”</p>
<p>The strong version says what happened, what it probably means and what to worry about. Good descriptions are short, specific and written in plain words.</p>
<h3>Treat rules like code</h3>
<p>Keep your rule files in a version-control system such as Git. Every change then has an author, a date and a reason, and you can undo mistakes. Test new rules on a copy of the system before they go live, as you do with <code>wazuh-logtest</code>. Have a colleague read each change; a second pair of eyes catches typos that would otherwise hide a gap.</p>
<h3>Measure coverage honestly</h3>
<p>Keep a table with the attacker techniques you care about, whether you have a detection, whether you have tested it, and the result. Gaps are not embarrassing; unknown gaps are. The coverage table you will build in your portfolio is the same document that real teams show their managers.</p>
<h2>Part two: writing incident reports</h2>
<h3>Know your readers</h3>
<p>An incident report has several readers: the executive who wants to know the impact in two minutes, the engineer who must fix the cause, the auditor who wants evidence, and perhaps a lawyer. The structure serves all of them: a short summary at the top for the executive, details below for the others.</p>
<h3>The structure</h3>
<ul>
<li><b>Summary.</b> What happened, how serious, current status. Three or four sentences, no jargon.</li>
<li><b>Timeline.</b> Dated events, with times in one time zone.</li>
<li><b>Impact.</b> Which systems, accounts and data were affected, and what was not.</li>
<li><b>Detection.</b> How and when the incident was noticed.</li>
<li><b>Response.</b> What was done, by whom, when.</li>
<li><b>Root cause.</b> Why it was possible.</li>
<li><b>Recommendations.</b> What will change, with owners and dates.</li>
</ul>
<h3>Style rules that make reports readable</h3>
<ul>
<li>Use short sentences. One idea per sentence.</li>
<li>State facts and label guesses: “the logs show…” and “we believe…”.</li>
<li>Give evidence for each claim: a rule ID, a log line, a screenshot.</li>
<li>Avoid blame. Write about systems and processes, not about who failed.</li>
<li>Define technical terms the first time, or avoid them in the summary.</li>
<li>Use the same names for things throughout, so the reader never wonders whether two names mean one thing.</li>
</ul>
<p>Compare two summaries.</p>
<p><b>Poor:</b> “Bad guy brute forced SSH, got in, fixed.”</p>
<p><b>Good:</b> “Between 10:12 and 10:13 UTC an external address made repeated login attempts to the server wazuh-server and guessed the password of the account labuser. The attacker logged in and ran three commands. No data was changed. The account was locked and its password reset at 10:31. We recommend moving to key-based logins and enabling multi-factor authentication.”</p>
<p>The second summary can be forwarded to a manager without any explanation.</p>
<h3>Honesty and humility</h3>
<p>Reports should state what you do not know. “We could not determine how the attacker obtained the password” is far more useful than a confident guess. Future investigators will thank you, and readers will trust the rest of the report more.</p>
<div class="note"><b>Field note: write as you go</b>Do not leave the report until the end. Keep notes during the investigation, with times, commands and findings. A report built from good notes takes thirty minutes; one rebuilt from memory takes hours and has gaps.</div>
<h2>Putting it into practice</h2>
<p>In the SSH case file you will write a correlation rule, document it using the table above, and then write an incident report following the structure in this chapter. Treat them as portfolio pieces. A recruiter reading one clear rule and one clear report learns more about you than a list of tool names.</p>`,
takeaways:["A detection has a lifecycle: idea, data check, logic, test, deploy, tune, review.","Document each rule: purpose, data, logic, ATT&CK mapping, false positives and first response steps.","Write alert descriptions that tell the reader what happened and why it matters.","Keep rules in version control, test before deploying, and measure coverage honestly.","Good reports start with a plain-language summary, use evidence, avoid blame and state what is unknown."],
quiz:[{q:"Why think about false positives before deploying a rule?",o:["To choose the right level and wording, and avoid noise","To make the rule slower","To skip testing","To hide the rule"],a:0},{q:"What should the top of an incident report contain?",o:["A plain-language summary","Raw logs","A password","A joke"],a:0},{q:"Why keep rules in version control?",o:["Every change has an author, date and reason, and can be undone","It makes alerts louder","It is required by SSH","It replaces testing"],a:0}]},

{id:"r13",mod:"m1",title:"Virtualisation Explained: A Computer Inside a Computer",labs:["1-1","1-2","1-3"],
body:String.raw`<p class="lead">You are about to build three computers that do not physically exist. Before you do, it helps to know how that trick works, because virtualisation is also how most of the modern internet is run. Understanding it will save you hours of confusion when something in your lab misbehaves.</p>
<h2>The problem virtualisation solves</h2>
<p>In the early days of business computing, every service had its own physical machine. One server ran email, another ran the database, another ran the website. Most of those machines spent most of their time idle, yet each needed space, power, cooling and care. Companies were paying for hardware that was barely used.</p>
<p>Virtualisation solved this by letting one powerful physical computer pretend to be several smaller ones at the same time. Each pretend computer, called a <b>virtual machine</b> or <b>VM</b>, believes it has its own processor, memory, disk and network card. In reality, a special program shares the real hardware among them.</p>
<h2>The cast of characters</h2>
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Host</b></td><td>The real computer that runs the virtual ones.</td></tr>
<tr><td><b>Guest</b></td><td>A virtual machine running on the host.</td></tr>
<tr><td><b>Hypervisor</b></td><td>The software that creates guests and shares the hardware between them.</td></tr>
<tr><td><b>Virtual disk</b></td><td>A large file on the host that the guest treats as its hard drive.</td></tr>
<tr><td><b>Snapshot</b></td><td>A saved moment in a guest’s life, to which you can return.</td></tr>
<tr><td><b>Guest additions or tools</b></td><td>Small programs installed inside the guest that improve the screen, mouse and clipboard sharing.</td></tr></table>
<h2>Two kinds of hypervisor</h2>
<p>A <b>type 1</b> hypervisor runs directly on the hardware, with no ordinary operating system underneath it. Companies use these in data centres. Examples include VMware ESXi, Microsoft Hyper-V on servers, and KVM on Linux. A <b>type 2</b> hypervisor runs as a normal program on top of an operating system that you already use. VirtualBox and VMware Workstation are type 2. They are slightly less efficient but far easier for a student, because you install them like any other application.</p>
<h2>How the trick works</h2>
<p>Modern processors include features built for virtualisation. On Intel they are called VT-x and on AMD they are called AMD-V or SVM. These features let the guest’s instructions run directly on the real processor at nearly full speed, while the hypervisor keeps control of anything that could interfere with other guests. This is why we asked you to check that virtualisation was enabled in the BIOS before you began. Without it, 64-bit guests will not start at all, or will crawl.</p>
<p>Memory works by <b>allocation</b>. When you give a guest 6 GB of RAM, that memory is reserved from the host’s total. If your host has 16 GB and the host operating system needs about 3 or 4 GB for itself, you can see why you have to plan your lab carefully. Allocate too much, and the host starts using the disk as slow, emergency memory. Everything then feels broken, even though nothing is.</p>
<p>Storage works through a <b>virtual disk file</b>. When you create a 50 GB disk in VirtualBox, you usually create a file that starts small and grows as the guest writes data. Inside, the guest sees an ordinary disk and formats it as it likes. This design is why you can copy a whole computer by copying a file, and why deleting a VM’s folder deletes the computer completely.</p>
<h2>How snapshots really work</h2>
<p>When you take a snapshot, the hypervisor stops writing changes to the original disk file. From that moment, every new change goes into a second file that records only the differences. To go back, the hypervisor simply throws the second file away. To keep going, it merges the changes into the original.</p>
<p>This makes snapshots fast and cheap, which is wonderful for a lab. It also gives you three rules to remember.</p>
<ul>
<li><b>A snapshot is not a backup.</b> If the host’s disk fails, the snapshot is lost together with the VM.</li>
<li><b>Long chains of snapshots slow a VM down</b> and use more disk. Delete old ones you no longer need.</li>
<li><b>Take a snapshot before every risky step</b>, such as installing Wazuh or editing a configuration, and name it clearly so that future you understands why it exists.</li>
</ul>
<h2>Virtual networking: the part that confuses everyone</h2>
<p>Each VM has one or more virtual network cards. The hypervisor connects each card to a virtual network of a particular type. VirtualBox offers several, and four matter for you.</p>
<table><tr><th>Mode</th><th>What it does</th><th>Used for</th></tr>
<tr><td><b>NAT</b></td><td>The guest reaches the internet through the host, which hides it behind the host’s address. Outsiders and other guests cannot reach it.</td><td>Downloading updates and installers</td></tr>
<tr><td><b>Bridged</b></td><td>The guest appears on your real home or office network, as if it were another physical computer.</td><td>Rarely in security labs, because attacks could reach real devices</td></tr>
<tr><td><b>Host-only</b></td><td>A private network containing only the host and the guests. No internet.</td><td>Our lab network, where attacks happen safely</td></tr>
<tr><td><b>Internal</b></td><td>A private network containing only the guests, not even the host.</td><td>Fully isolated experiments</td></tr></table>
<p>Your lab gives each VM two cards: the first is NAT, for the internet, and the second is host-only, for the lab. This is a deliberate design. The attacker can only reach the targets over the private network, and the private network cannot reach the outside world.</p>
<div class="note"><b>Field note: why isolation is not optional</b>Security teams that test malware run it in networks with no route to the real company. There are many true stories of researchers who accidentally let a test sample escape to the production network. When you choose host-only networking, you are following a rule that professionals treat as sacred.</div>
<h2>The same ideas in real companies</h2>
<p>Almost every server you will monitor in your career is a virtual machine, in a company data centre or in the cloud. When you read that a cloud “instance” has been compromised, it means a virtual machine. Cloud providers make virtualisation a product: you ask for a machine of a given size and a few minutes later it exists. The skills you practise in your lab, such as creating machines, giving them networks, snapshotting them and rebuilding them, are the same skills that cloud engineers use.</p>
<p>Containers, such as Docker, are a lighter relative. Instead of pretending to be a whole computer, a container shares the host’s operating system and isolates only the application. You will meet them later in the academy.</p>
<h2>A short troubleshooting guide for beginners</h2>
<ul>
<li><b>“VT-x is not available.”</b> Turn on virtualisation in the BIOS. On Windows, also check whether other hypervisor features are interfering.</li>
<li><b>Everything is extremely slow.</b> You have given the guests too much memory. Reduce it, close other programs, and run fewer machines at once.</li>
<li><b>A guest has no internet.</b> Check that the first network card is NAT and that the cable is ticked as connected.</li>
<li><b>Two guests cannot see each other.</b> Check that both are on the same host-only network and that their addresses are in the same subnet.</li>
<li><b>The host disk fills up.</b> Snapshots and growing virtual disks consume space. Delete unneeded snapshots and keep at least 20 GB free.</li>
</ul>
<h2>What to remember</h2>
<p>A virtual machine is a computer made of software and a few large files, borrowing the host’s real hardware. A hypervisor makes it possible. Snapshots let you move back in time, but they are not backups. And network modes decide who can talk to whom, which is the most important thing to get right in a security lab.</p>`,
takeaways:["A hypervisor lets one physical host run several virtual machines by sharing its processor, memory, disk and network.","Hardware virtualisation (VT-x or AMD-V) must be enabled for 64-bit guests to run well.","A virtual disk is just a file, and a snapshot records only the changes since a moment in time.","A snapshot is not a backup, and long snapshot chains slow a VM.","NAT gives internet access, host-only gives a private lab network; using both keeps attacks contained."],
quiz:[{q:"What is a hypervisor?",o:["Software that creates and runs virtual machines","A kind of firewall","A password manager","A web browser"],a:0},{q:"Why is a snapshot not a backup?",o:["It is stored with the VM and is lost if the host disk fails","It is encrypted","It is too small","It is only for Linux"],a:0},{q:"Which network mode keeps attacks inside your computer?",o:["Host-only","Bridged","NAT only","None"],a:0}]},

{id:"r14",mod:"m1",title:"Running a Lab Like a Professional: Notes, Naming and Change Discipline",labs:["1-6"],
body:String.raw`<p class="lead">Two students can build the same lab and end up in very different places. One has a tidy notebook, clear names and a way to go back. The other has a pile of half-remembered commands and a machine nobody dares to touch. This chapter is about becoming the first student, because it is also how professionals work.</p>
<h2>Why discipline matters even in a lab</h2>
<p>A lab is a rehearsal. The habits you form while rehearsing become the habits you perform with. If you edit a configuration file without keeping a copy, you will do the same on a production server one day, and that day will be unpleasant. If you cannot explain what you changed yesterday, you will struggle to explain an incident to a manager.</p>
<p>Professional security teams use the phrase <b>change discipline</b> for a simple idea: <b>every change should be intentional, recorded and reversible</b>.</p>
<h2>The lab notebook</h2>
<p>Keep a single text file or note for the whole academy. Call it something obvious, such as <code>soc-lab-notes.md</code>. Each time you finish a session, add a short entry with four parts.</p>
<ol>
<li><b>Date and goal.</b> What were you trying to do?</li>
<li><b>What you did.</b> The exact commands and settings, copied from the screen, not retyped from memory.</li>
<li><b>What happened.</b> The result, including errors, with the exact error text.</li>
<li><b>What you learned or still do not understand.</b> This line is the most valuable one.</li>
</ol>
<p>Here is a sample entry.</p>
<pre>2026-10-28 — Goal: connect the Windows agent to Wazuh.
Did: ran the install command from Deploy new agent; started WazuhSvc.
Result: agent showed "Never connected".
Cause: Test-NetConnection to port 1515 failed; Ubuntu firewall was on.
Fix: sudo ufw allow 1515/tcp. Agent now Active.
Learned: always test the ports before blaming the agent.</pre>
<p>This habit is slow for the first week and then pays for itself. When a lab breaks three weeks from now, the notebook tells you what changed. When you apply for jobs, the notebook becomes the raw material for your portfolio.</p>
<h2>Naming things well</h2>
<p>Names are documentation that you cannot forget to update. Use the same names in every place: the VM name in VirtualBox, the computer name in the operating system, and the agent name in Wazuh. In this academy they are <code>wazuh-server</code>, <code>win-victim</code> and <code>kali-attacker</code>. When an alert mentions <code>win-victim</code>, you instantly know which machine and what role it plays.</p>
<p>For files, snapshots and notes, put the date or a number first so that they sort naturally: <code>01-network-ready</code>, <code>02-before-wazuh</code>. For rules and detections, include a short description of what they do rather than a number alone. Compare <code>rule 100100</code> with <code>ssh-success-after-bruteforce</code>. The second tells you something even if the rule number is forgotten.</p>
<h2>Backups and snapshots, used properly</h2>
<p>Snapshots are your short-term undo. Backups are your protection against losing everything. Do both.</p>
<ul>
<li><b>Before any risky change,</b> take a snapshot. Risky means installing software, editing configuration, running an attack, or changing the network.</li>
<li><b>After a milestone,</b> such as Wazuh working, take another snapshot and name it for what is true at that moment.</li>
<li><b>Once a week,</b> copy the VM folders to a second disk or cloud storage. If your laptop is lost or its disk fails, you will be glad you did.</li>
<li><b>Export your configuration.</b> Copy the key files, such as <code>ossec.conf</code>, your custom rules and your notes, to a folder outside the VMs. Configuration is small, and losing it is expensive.</li>
</ul>
<h2>Version control: the professional’s time machine</h2>
<p>Developers and engineers keep files in a system called <b>Git</b>. Git records each change with an author, a date and a message, so you can see how a file looked last month and undo a mistake precisely. Detection engineers keep their rules in Git, because a bad rule can silence real alerts. You do not need Git in the first modules, but creating a folder for your rules and notes now will make adopting it painless later.</p>
<p>A simple start is: create a free account on a code hosting site, make a private repository called <code>soc-lab</code>, and upload your notes, custom rules and reports. Never upload real passwords, keys or any information about a real employer.</p>
<h2>Runbooks: instructions for future you</h2>
<p>A <b>runbook</b> is a step-by-step guide to a task that has been done before. Real operations teams have them for everything: “how to add a new server to monitoring”, “what to do when the disk is nearly full”. After you first complete a task in your lab, write its runbook in your own words. For example: “How to reset the lab: revert the three snapshots in this order, start wazuh-server first, wait two minutes, start win-victim.” You will use it more than you expect, and you will have created exactly the kind of document that employers value.</p>
<h2>How production environments differ</h2>
<p>Your lab is a <b>sandbox</b>: you can break it and rebuild it. Real companies separate their systems into environments.</p>
<table><tr><th>Environment</th><th>Purpose</th><th>Rules</th></tr>
<tr><td>Development</td><td>Engineers build and experiment</td><td>Loose; things break often</td></tr>
<tr><td>Test or staging</td><td>A copy of production, to rehearse changes</td><td>Changes are tested here first</td></tr>
<tr><td>Production</td><td>Real customers and real data</td><td>Strict; changes need approval and a plan</td></tr></table>
<p>Many incidents begin with someone treating production like a sandbox. A key professional instinct is therefore to ask, before any command: <b>“Which system am I on?”</b> Look at the prompt, the computer name and the address every time. In your lab this takes two seconds and builds a lifelong habit.</p>
<div class="note"><b>Field note: the change window</b>In many companies, risky changes are scheduled for quiet hours, announced in advance and approved by a manager or a change board. That calendar is exactly what an analyst checks when a file integrity alert fires. “Was this change approved?” is a question you can only answer if the company writes changes down. Notice how much of security depends on ordinary, boring record-keeping.</div>
<h2>A weekly routine to adopt now</h2>
<ol>
<li>Spend ten minutes at the end of every session on your notebook.</li>
<li>Once a week, delete snapshots you no longer need and check disk space.</li>
<li>Once a week, back up your VM folders and configuration.</li>
<li>Every Friday, write two lines: what you built this week and what you will do next week.</li>
</ol>
<p>These habits are small, but they separate people who dabble from people who build careers.</p>`,
takeaways:["Change discipline means every change is intentional, recorded and reversible.","Keep a lab notebook with the goal, exact commands, results, and what you learned.","Use clear, consistent names for machines, snapshots and rules.","Snapshots are short-term undo; backups protect against losing everything, so do both.","Always ask which environment you are on before you type a command."],
quiz:[{q:"What does change discipline mean?",o:["Every change is intentional, recorded and reversible","Never change anything","Change only at night","Change only in production"],a:0},{q:"What is a runbook?",o:["Step-by-step instructions for a repeated task","A running program","A type of malware","A firewall rule"],a:0},{q:"Why use consistent names for machines?",o:["Alerts and notes immediately make sense","It speeds up the CPU","It hides the machine","It is a licence rule"],a:0}]},

{id:"r15",mod:"m2",title:"Linux for Security People: Files, Permissions, Processes and Services",labs:["2-1","2-4"],
body:String.raw`<p class="lead">The command line lessons teach you what to type. This chapter explains what you are looking at. It covers how Linux organises its files, who may do what, how programs run, and where evidence of an attack is found.</p>
<h2>Everything is a file, and the files have a map</h2>
<p>Linux arranges everything in one tree that starts at a single point called the <b>root</b>, written <code>/</code>. There are no drive letters. Programs, settings, users’ documents and even hardware appear as files and folders somewhere in this tree. Once you know the main branches, you can find almost anything.</p>
<table><tr><th>Folder</th><th>What lives there</th><th>Why a defender cares</th></tr>
<tr><td><code>/etc</code></td><td>System settings</td><td>Attackers change settings here, so file integrity monitoring watches it</td></tr>
<tr><td><code>/var/log</code></td><td>Logs</td><td>The first place to look in an investigation</td></tr>
<tr><td><code>/home</code></td><td>Each user’s personal files</td><td>Contains keys, history and anything a stolen account could reach</td></tr>
<tr><td><code>/root</code></td><td>The administrator’s home</td><td>Highly sensitive</td></tr>
<tr><td><code>/tmp</code></td><td>Temporary files, writable by everyone</td><td>Attackers often drop tools here because anyone can write to it</td></tr>
<tr><td><code>/usr/bin</code>, <code>/bin</code>, <code>/sbin</code></td><td>Programs</td><td>A changed program here can mean a trojaned system</td></tr>
<tr><td><code>/var/www</code></td><td>Web pages, on web servers</td><td>Defacement and web shells</td></tr>
<tr><td><code>/opt</code></td><td>Optional, installed software</td><td>Wazuh itself lives in <code>/var/ossec</code></td></tr></table>
<h2>Users, groups and the all-powerful root</h2>
<p>Every Linux user has a numeric identity. Ordinary users have numbers starting at 1000 on most systems. The special user <b>root</b>, number 0, may do anything. Users can belong to <b>groups</b>, which grant shared permissions. The group <code>sudo</code> on Ubuntu lets its members run commands as root.</p>
<p>The key files are <code>/etc/passwd</code>, which lists accounts and is readable by all, and <code>/etc/shadow</code>, which holds password hashes and is readable only by root. An attacker who can read <code>shadow</code> can try to crack the hashes elsewhere, which is why reading it triggers alarms in well-monitored systems.</p>
<h3>Why root should rarely be used</h3>
<p>Working constantly as root makes every typing mistake and every successful attack catastrophic. The better practice is to log in as a normal user and use <code>sudo</code> for individual administrative commands. The system then records each use of <code>sudo</code>, which creates an audit trail. In your lab, you see this in <code>/var/log/auth.log</code>.</p>
<h2>Reading permissions</h2>
<p>When you run <code>ls -l</code>, each line begins with ten characters such as <code>-rw-r-----</code>. Read them in groups.</p>
<pre>-  rw-  r--  ---
|   |    |    |
|   |    |    +-- everyone else: no access
|   |    +------- the owning group: read only
|   +------------ the owner: read and write
+---------------- type: a file (a d would mean a directory)</pre>
<p>The letters mean <b>r</b> read, <b>w</b> write and <b>x</b> execute (run). Permissions can also be written as numbers: read is 4, write is 2, execute is 1, and they add up. So <code>rw-</code> is 6, <code>r--</code> is 4 and <code>---</code> is 0, and the file above is <code>640</code>. Common values are <code>644</code> (owner writes, everyone reads), <code>755</code> (programs and folders), and <code>600</code> (private, such as an SSH private key).</p>
<h3>Two permission problems attackers love</h3>
<ul>
<li><b>World-writable files</b> in sensitive places, with permissions such as <code>777</code>. Anyone can change them.</li>
<li><b>SUID programs.</b> A file with the “set user ID” bit runs with its owner’s powers, usually root, whoever starts it. Some are legitimate, such as the program that changes passwords. A new, unexpected one is a classic way to become root.</li>
</ul>
<p>You can list SUID programs on your lab server with <code>sudo find / -perm -4000 -type f 2&gt;/dev/null</code>. Run it once on a clean system, save the output, and you have a baseline to compare later.</p>
<h2>Processes: programs in motion</h2>
<p>A program on disk is just a file. When it runs, it becomes a <b>process</b>, with its own number (the <b>PID</b>), an owner, and a parent process that started it. This parent-child relationship matters a great deal in security. A web server starting a command shell, for example, is unusual and suggests that someone has taken over the web application.</p>
<table><tr><th>Command</th><th>Shows</th></tr>
<tr><td><code>ps aux</code></td><td>All processes with their owners</td></tr>
<tr><td><code>top</code> or <code>htop</code></td><td>Live view of what is using the processor and memory</td></tr>
<tr><td><code>ps -ef --forest</code></td><td>Processes drawn as a tree of parents and children</td></tr>
<tr><td><code>sudo ss -tulpn</code></td><td>Which process is listening on which port</td></tr>
<tr><td><code>kill PID</code></td><td>Ends a process politely; <code>kill -9</code> forces it</td></tr></table>
<h2>Services and systemd</h2>
<p>A <b>service</b> is a program that starts at boot and keeps running in the background, such as the SSH server or Wazuh. Modern Linux uses a manager called <b>systemd</b> to control them. The commands <code>systemctl status</code>, <code>start</code>, <code>stop</code>, <code>enable</code> and <code>restart</code> are among those you will type most often.</p>
<p>From a security view, the list of services is a list of doors. Each running service is a possible way in. Each unit file that starts one is also a possible way for an attacker to stay: creating a new service that launches a hidden program is a known persistence technique. That is why you list services and compare them with what you expect.</p>
<h2>Where the evidence lives</h2>
<table><tr><th>Question</th><th>Look here</th></tr>
<tr><td>Who logged in, and who failed?</td><td><code>/var/log/auth.log</code> (Debian and Ubuntu) or <code>journalctl -u ssh</code></td></tr>
<tr><td>What did an administrator run with sudo?</td><td>The same <code>auth.log</code></td></tr>
<tr><td>When was a user last logged in?</td><td><code>last</code> and <code>lastlog</code></td></tr>
<tr><td>Who is logged in now?</td><td><code>who</code> and <code>w</code></td></tr>
<tr><td>What did the user type?</td><td><code>~/.bash_history</code> (which a careful attacker deletes)</td></tr>
<tr><td>What scheduled jobs exist?</td><td><code>crontab -l</code>, <code>/etc/cron*</code></td></tr>
<tr><td>What changed recently?</td><td><code>find / -mtime -1 -type f 2&gt;/dev/null</code></td></tr></table>
<div class="note"><b>Field note: the first five minutes on a suspicious Linux server</b>Many responders run the same few commands in the same order: <code>who</code>, <code>last -n 20</code>, <code>ps aux --forest</code>, <code>ss -tulpn</code>, and a look at <code>auth.log</code>. They save the output to a file with timestamps. That small, repeatable routine is more valuable than a clever trick, because it works every time and leaves evidence.</div>
<h2>Practise reading, not just typing</h2>
<p>When you work through the Linux lessons, pause after every command and ask yourself three questions. What did that show me? What would be different on a compromised system? What would I save as evidence? That habit turns commands into investigation skills.</p>`,
takeaways:["Linux has a single file tree; /etc, /var/log, /home and /tmp are the folders defenders visit most.","Users, groups and root define who may do what; sudo creates an audit trail.","Permissions are read, write and execute for owner, group and others; SUID programs run with their owner’s power.","A process has a parent and an owner, and unusual parent-child pairs are strong clues.","Services are doors and persistence points; list them and compare with what you expect."],
quiz:[{q:"What does permission 600 mean?",o:["Only the owner can read and write","Everyone can write","Nobody can read","Only root exists"],a:0},{q:"Why is /tmp interesting to attackers?",o:["Anyone can write there","It holds passwords","It is encrypted","It is read-only"],a:0},{q:"A web server process starting a shell is…",o:["Suspicious","Always normal","A backup","A printer driver"],a:0}]},

{id:"r16",mod:"m2",title:"Windows for Security People: Accounts, Services, the Registry and Event Logs",labs:["2-2","2-4","2-5"],
body:String.raw`<p class="lead">Most employees use Windows, so most attacks aim at Windows. A SOC analyst does not need to be a Windows administrator, but needs to know how the system is organised, where it keeps its secrets, and what traces activity leaves. This chapter is that tour.</p>
<h2>Accounts and identities</h2>
<p>Windows identifies every account by a long internal number called a <b>SID</b>, the Security Identifier, and shows a friendly name for people. There are several kinds of account.</p>
<ul>
<li><b>Local accounts</b> exist on one computer only, such as <code>analyst</code> and <code>labuser</code> in your lab.</li>
<li><b>Domain accounts</b> exist in a company’s central directory, called <b>Active Directory</b>, and work on any computer that has joined the domain. They are the normal case in companies.</li>
<li><b>Service accounts</b> are used by programs, not people. They often have long-lived passwords and broad rights, which makes them attractive to attackers.</li>
<li><b>SYSTEM</b> is not a person or a normal account. It is the operating system itself, and the most powerful identity on a machine. Many legitimate Windows services and many successful attacks run as SYSTEM.</li>
</ul>
<h3>Groups and administrators</h3>
<p>Rights are mostly granted through groups. The local group <b>Administrators</b> may do almost everything on the machine. In a domain, the group <b>Domain Admins</b> may do almost everything in the company. Attackers therefore look for ways to join these groups, and defenders log every change to their membership (events 4732 and 4728 are two you met earlier).</p>
<h2>Processes and services</h2>
<p>As on Linux, programs become <b>processes</b> when they run. Task Manager lists them, and PowerShell’s <code>Get-Process</code> does too. Windows also has a strong parent-child structure that defenders use. For example, a Word document that starts a command shell is highly suspicious, because documents do not normally need to run commands.</p>
<p><b>Services</b> are background programs that start at boot. You can list them with <code>Get-Service</code> or the Services console (<code>services.msc</code>). Two services matter greatly for defenders: <b>Windows Event Log</b>, which records events, and <b>Windows Defender</b> (Microsoft’s built-in antivirus). If an attacker stops either, the computer goes quiet or loses protection, so teams alert when they stop unexpectedly.</p>
<h2>The registry</h2>
<p>The <b>registry</b> is a large hierarchical database where Windows and many programs keep settings. It is organised into top-level groups called <b>hives</b>.</p>
<table><tr><th>Hive</th><th>Short name</th><th>Holds</th></tr>
<tr><td>HKEY_LOCAL_MACHINE</td><td>HKLM</td><td>Settings for the whole computer</td></tr>
<tr><td>HKEY_CURRENT_USER</td><td>HKCU</td><td>Settings for the user who is logged in</td></tr>
<tr><td>HKEY_USERS</td><td>HKU</td><td>Settings for every loaded user profile</td></tr>
<tr><td>HKEY_CLASSES_ROOT</td><td>HKCR</td><td>File associations and program registrations</td></tr></table>
<p>Inside the hives are <b>keys</b> (like folders) and <b>values</b> (like files with a name and some data). For defenders, a handful of keys are famous because they control what runs automatically. The best known are the <code>Run</code> and <code>RunOnce</code> keys, under both HKLM and HKCU. A program listed there starts at every logon. Attackers add themselves to those keys, which is why file integrity monitoring watches them.</p>
<h2>Files and folders defenders visit</h2>
<table><tr><th>Location</th><th>Why it matters</th></tr>
<tr><td><code>C:\Windows\System32</code></td><td>Core system programs. A changed file here is serious.</td></tr>
<tr><td><code>C:\Windows\System32\drivers\etc\hosts</code></td><td>Maps names to addresses; edited to redirect websites.</td></tr>
<tr><td><code>C:\Windows\System32\Tasks</code></td><td>Definitions of scheduled tasks.</td></tr>
<tr><td><code>C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</code></td><td>Programs here start for every user.</td></tr>
<tr><td><code>C:\Users\NAME\AppData</code></td><td>Per-user program data. Attackers hide here because ordinary users can write to it.</td></tr>
<tr><td><code>C:\Users\Public</code></td><td>A shared folder that anyone can write to; a common staging area.</td></tr>
<tr><td><code>C:\Windows\Temp</code> and user Temp folders</td><td>Temporary files and dropped tools.</td></tr></table>
<h2>Scheduled tasks</h2>
<p>Windows can run programs at set times or events using <b>scheduled tasks</b>. Administrators use them for maintenance. Attackers use them for persistence, because a task can start a program every day or at every logon. You can list tasks with <code>schtasks /query</code> or <code>Get-ScheduledTask</code>. A task with an odd name that runs a program from a user’s temporary folder deserves attention.</p>
<h2>The event logs</h2>
<p>Windows records events in <b>channels</b>, which you can open in Event Viewer. The ones you will use most are:</p>
<table><tr><th>Channel</th><th>Contents</th></tr>
<tr><td><b>Security</b></td><td>Logons, account changes, privilege use, and (if enabled) process creation and object access</td></tr>
<tr><td><b>System</b></td><td>Services starting and stopping, drivers, restarts</td></tr>
<tr><td><b>Application</b></td><td>Events from installed programs</td></tr>
<tr><td><b>Microsoft-Windows-PowerShell/Operational</b></td><td>PowerShell activity, including script blocks</td></tr>
<tr><td><b>Microsoft-Windows-Sysmon/Operational</b></td><td>Detailed process, network and file events, if Sysmon is installed</td></tr>
<tr><td><b>Windows Defender/Operational</b></td><td>Malware detections and Defender configuration changes</td></tr></table>
<p>Which events are written depends on the <b>audit policy</b>. Windows does not record everything by default, because the volume would be huge. For this reason, security teams deliberately turn on extra auditing, such as process creation with command lines, and then carefully choose which of those events to send to the SIEM.</p>
<h2>Windows Defender and why you keep it on</h2>
<p>Windows includes antivirus protection called Microsoft Defender. In your lab you will leave it on, because real computers have it, and because Defender’s own events appear in your logs. You will sometimes see Defender delete a file you created for a test. That is not a failure of the lab. It is a lesson: your detection tools and your preventive tools see the same events, and good analysts learn to read both.</p>
<h2>PowerShell: the tool both sides love</h2>
<p><b>PowerShell</b> is a powerful command shell built into Windows. Administrators use it to automate work, and attackers use it because it is already there and can do almost anything. Attackers often hide their commands by encoding them, so that the text looks like random characters. A PowerShell command line containing the options <code>-enc</code> or <code>-EncodedCommand</code> is therefore a classic suspicious sign, and you will write a rule for it in a later module.</p>
<div class="note"><b>Field note: “living off the land”</b>Attackers like to use tools that are already installed, such as PowerShell, <code>certutil</code>, <code>schtasks</code> and <code>wmic</code>, because they leave no new files for antivirus to find. Defenders call these <b>living-off-the-land binaries</b>, or LOLBins. A defender cannot simply block them, as administrators need them too. Instead, you learn what normal use looks like, and watch the context: who ran it, from what parent program, with what arguments.</div>
<h2>Connecting this to your lab</h2>
<p>On <code>win-victim</code> you will create accounts, list services, read the Security log, and add tripwires on the hosts file, the Startup folder and the Run key. Each of those has a place in this chapter. When you complete a lab, say aloud how it fits: “this is the registry hive, this is what the attacker would change, this is the event I would read.” That is how knowledge becomes judgement.</p>`,
takeaways:["Windows identifies accounts by SIDs; local, domain, service and SYSTEM identities have different risks.","Administrators and Domain Admins are the groups attackers want to join, and membership changes are logged.","The registry Run keys and the Startup folder control what starts automatically, so they are persistence hotspots.","Event channels such as Security, System and PowerShell record what happened, but only if audit policy enables it.","Living-off-the-land tools like PowerShell are used by both administrators and attackers, so context decides."],
quiz:[{q:"What is SYSTEM on Windows?",o:["The operating system’s own, most powerful identity","A normal user","A password","A folder"],a:0},{q:"Which registry keys start programs at logon?",o:["Run and RunOnce","Hosts","Tasks","Defender"],a:0},{q:"Why might a PowerShell command containing -enc be suspicious?",o:["Attackers encode commands to hide them","It speeds up PowerShell","It is the default","It is a Linux option"],a:0}]},

{id:"r17",mod:"m3",title:"Vulnerabilities and Threat Intelligence: Knowing What to Worry About",labs:["3-1"],
body:String.raw`<p class="lead">A company can have thousands of weaknesses and cannot fix them all at once. Security teams therefore spend as much time deciding what to worry about as they do fixing anything. This chapter explains the vocabulary and the habits behind that decision.</p>
<h2>What a vulnerability is</h2>
<p>A <b>vulnerability</b> is a weakness that an attacker could use. It may be a flaw in a program’s code, a dangerous setting, a missing update, or a weak password. Not every weakness is a software bug. A server that exposes its administration page to the whole internet has a configuration vulnerability, even though no code is broken.</p>
<p>Three words are often mixed up, so keep them apart.</p>
<ul>
<li>A <b>vulnerability</b> is the weakness.</li>
<li>A <b>threat</b> is someone or something that could take advantage of it.</li>
<li>A <b>risk</b> is the chance and the cost of that happening.</li>
</ul>
<p>An unlocked door is a vulnerability. A burglar in the street is a threat. The risk is how likely the burglar is to try the door, multiplied by what they could steal.</p>
<h2>CVE: giving weaknesses names</h2>
<p>When researchers find a flaw in widely used software, it receives an identifier of the form <b>CVE-YEAR-NUMBER</b>, for example CVE-2021-44228. CVE stands for Common Vulnerabilities and Exposures. The identifier lets everybody, from vendors to scanners to news stories, refer to the same flaw without confusion. When Wazuh’s vulnerability detection reports a finding on a computer, it lists the CVE number so you can look it up.</p>
<h2>CVSS: a score, and what it does not tell you</h2>
<p>Most CVEs carry a <b>CVSS</b> score, the Common Vulnerability Scoring System. It rates severity from 0 to 10, usually grouped as low, medium, high and critical. It is a helpful starting point, because it combines how easy the flaw is to exploit and how much damage it can do.</p>
<p>But experienced teams warn against treating the score as the whole story. Consider two flaws. One is rated 9.8 but affects a program that exists only on a test machine with no network access. Another is rated 7.0 but affects the public website, and attackers are actively using it. The second is clearly more urgent. The score measures the flaw in general; it does not know <b>your</b> environment.</p>
<h2>How teams really prioritise</h2>
<p>A practical approach asks four questions about each vulnerability.</p>
<ol>
<li><b>Is it being exploited in the wild?</b> Public catalogues of vulnerabilities known to be exploited, such as one maintained by the United States cybersecurity agency, help here. A flaw being used right now jumps the queue.</li>
<li><b>Is the affected system reachable by an attacker?</b> Internet-facing systems matter more than internal ones.</li>
<li><b>How important is the system?</b> A flaw on the payment server matters more than on a printer.</li>
<li><b>Is there a fix, and what does it cost?</b> Sometimes the fix is a quick update. Sometimes it needs downtime that the business resists.</li>
</ol>
<p>When a fix cannot be applied quickly, teams use <b>compensating controls</b>: restricting access to the system, adding monitoring on it, or switching off the vulnerable feature. A SOC often supports this by adding detections for exploitation of that particular flaw.</p>
<h2>Patching: simple in theory, hard in practice</h2>
<p>“Just install the updates” is advice that ignores how companies work. Updates can break software that the business relies on. Servers cannot always be restarted at will. Some devices, such as factory machines or medical equipment, cannot be updated at all. Mature teams therefore run a <b>patch management</b> process: they test updates on a small group first, schedule changes in approved windows, and keep a record of what has and has not been updated.</p>
<div class="note"><b>Field note: the Friday disclosure</b>A new critical vulnerability is often announced late in the week. By Monday, attackers are already scanning the internet for it. The SOC’s first questions are: “do we run this software?” and “is it exposed?”. A good asset inventory can answer in minutes; a poor one takes days. This is why seemingly dull record-keeping decides how a team performs in a crisis.</div>
<h2>Vulnerability scanning</h2>
<p>A <b>vulnerability scanner</b> checks computers for known flaws, either by connecting to them from outside or by reading their software lists from inside. Wazuh does the second kind: the agent reports installed software, and the server compares it with a database of known vulnerabilities. The result is a list per computer.</p>
<p>Scanners produce long lists, and much of the list is of low practical importance. A skilled analyst filters it by the four questions above, and by whether the vulnerable software is actually running and reachable. Delivering a short, ranked list of “fix these first” is far more useful than a report with ten thousand rows.</p>
<h2>Threat intelligence: knowing the opponent</h2>
<p><b>Threat intelligence</b> is information about attackers: who they are, what they want, and how they work. It comes in several levels.</p>
<table><tr><th>Level</th><th>Example</th><th>Used by</th></tr>
<tr><td><b>Strategic</b></td><td>“Criminal groups are targeting companies in our industry with ransomware.”</td><td>Executives deciding where to invest</td></tr>
<tr><td><b>Tactical</b></td><td>“These groups often start with phishing and use these tools.”</td><td>Defenders designing detections</td></tr>
<tr><td><b>Operational</b></td><td>“A campaign is under way this week against banks.”</td><td>The SOC during an active period</td></tr>
<tr><td><b>Technical</b></td><td>“These addresses and file hashes were used.”</td><td>Tools that block or alert automatically</td></tr></table>
<h3>Indicators of compromise</h3>
<p>The technical level consists of <b>indicators of compromise</b>, or <b>IOCs</b>: specific pieces of evidence that an attack has occurred, such as an IP address, a domain name or the hash of a malicious file. They are easy to share and to search for, which is their strength. They are also fragile. An attacker can change an IP address or recompile a program in minutes, so the same indicator quickly becomes useless.</p>
<h3>Behaviours are harder to change</h3>
<p>The more durable kind of intelligence describes <b>behaviour</b>, called <b>tactics, techniques and procedures</b> (TTPs). For example, “the attacker creates a scheduled task that runs a PowerShell command” remains true whatever the file names or addresses are. This is why detection engineers prefer to write rules for behaviours and why the MITRE ATT&CK catalogue is organised around techniques.</p>
<h2>Using intelligence responsibly</h2>
<ul>
<li><b>Check where it came from.</b> Not all sources are reliable, and indicators shared without context cause many false alarms.</li>
<li><b>Check how old it is.</b> An IP address that was malicious two years ago may belong to a harmless company today.</li>
<li><b>Add context before alerting.</b> “This address is on a list” is a hint, not a verdict.</li>
<li><b>Share back when permitted.</b> Many industries have groups that exchange intelligence to protect each other.</li>
</ul>
<h2>How this fits your lab</h2>
<p>In your labs you will meet intelligence in small ways. When a file alert includes a SHA256 hash, you will paste it into a public reputation service to see whether it is known. When you map an alert to an ATT&CK technique, you are connecting your observation to the world’s shared knowledge of attacker behaviour. And in the later vulnerability lesson, you will read a list of findings and practise the art of choosing three to fix first.</p>`,
takeaways:["A vulnerability is a weakness, a threat is who might use it, and risk combines likelihood and impact.","CVE gives each public flaw a shared name; CVSS gives a general severity score, not your real priority.","Prioritise by whether it is exploited, reachable, important and fixable, and use compensating controls when you cannot patch quickly.","Indicators of compromise are easy to share but quickly outdated; behaviours (TTPs) last longer.","Use threat intelligence with checks on source, age and context."],
quiz:[{q:"Why might a 7.0 vulnerability outrank a 9.8 one?",o:["It is on an exposed, important system and is being exploited","Seven is bigger than nine","Scores are random","It is older"],a:0},{q:"What is an IOC?",o:["A piece of evidence such as an IP or file hash","A firewall type","A password rule","A cloud product"],a:0},{q:"Which is more durable for detection?",o:["Attacker behaviour (TTPs)","One IP address","One file name","A date"],a:0}]},

{id:"r18",mod:"m3",title:"Phishing and Social Engineering: The Human Layer",labs:["3-2"],
body:String.raw`<p class="lead">The most effective attack technique in the world does not exploit a computer. It exploits a person. This chapter explains how social engineering works, why smart people fall for it, how defenders spot it, and how to handle a reported message without becoming the next victim yourself.</p>
<h2>What social engineering is</h2>
<p><b>Social engineering</b> means manipulating people into doing something that helps an attacker: revealing a password, opening a file, approving a payment or letting someone through a door. It works because it targets habits we all share: trust, politeness, urgency and the wish to be helpful.</p>
<p>The most common form is <b>phishing</b>, a dishonest message that pretends to be from a trusted sender. The name comes from fishing: the attacker casts bait and waits.</p>
<h2>Kinds of phishing</h2>
<table><tr><th>Type</th><th>Description</th></tr>
<tr><td><b>Bulk phishing</b></td><td>The same message sent to thousands. Often poorly written, but a tiny percentage of replies is enough to profit.</td></tr>
<tr><td><b>Spear phishing</b></td><td>A message aimed at one person or a small group, using details that make it believable, such as a colleague’s name or a real project.</td></tr>
<tr><td><b>Business email compromise</b></td><td>The attacker pretends to be an executive or supplier and asks for a payment or a change of bank details. There is often no malicious link at all.</td></tr>
<tr><td><b>Smishing and vishing</b></td><td>Phishing by text message and by voice call.</td></tr>
<tr><td><b>Credential harvesting</b></td><td>A fake sign-in page that records what the victim types.</td></tr>
<tr><td><b>Malicious attachments</b></td><td>Documents or archives that install malware when opened or when “content” is enabled.</td></tr>
<tr><td><b>Adversary in the middle</b></td><td>A fake site that relays the real sign-in, including the second factor code, and steals the session.</td></tr></table>
<h2>Why intelligent people fall for it</h2>
<p>People who fall for phishing are not stupid. They are busy. A well-made message arrives at the moment when someone is rushing, and it asks for something ordinary. It creates one of a few emotions: fear (“your account will be closed”), urgency (“within one hour”), curiosity (“you have been tagged in a photo”), authority (“from the director”) or reward (“a refund is waiting”). Defenders who blame victims discourage reporting, which is the opposite of what they need.</p>
<h2>How defenders look at a suspicious message</h2>
<p>When an employee forwards a message to the security mailbox, the analyst works through a short routine, never clicking links in the ordinary way.</p>
<ol>
<li><b>Sender.</b> Compare the display name with the real address. Look for domains that nearly match, such as <code>paypa1.com</code> or a company name with one letter changed.</li>
<li><b>Authentication results.</b> Email headers show whether the message passed three checks. <b>SPF</b> says whether the sending server was allowed to send for that domain. <b>DKIM</b> says whether the message carries a valid signature. <b>DMARC</b> says what to do if those checks fail. Messages that fail all three are not proof of fraud, but they are a strong hint.</li>
<li><b>Links.</b> Hover to see the real destination. Check it using a safe analysis service rather than visiting it from a work computer.</li>
<li><b>Attachments.</b> Open nothing on a normal machine. Analysts use isolated analysis environments (sandboxes) where a file can run safely.</li>
<li><b>Content.</b> Is there pressure, a request for secrecy, an unusual payment, or a change in tone?</li>
<li><b>Scope.</b> Who else received it? Did anyone click? Search the mail logs for the sender and the link.</li>
</ol>
<h3>The question that matters most</h3>
<p>After deciding whether the message is malicious, ask: <b>did anyone act on it?</b> If a user entered a password, the password must be reset and the account checked for suspicious sign-ins. If a user opened an attachment, the computer must be examined. If several users received it, they should be told together. The message is a small event; the response to a click is the real work.</p>
<h2>Where phishing shows up in your SIEM</h2>
<p>The attack itself usually reaches you from the email security tool, but its consequences appear in other logs.</p>
<ul>
<li>A <b>proxy or DNS log</b> showing a user visiting a newly registered domain just after receiving an email.</li>
<li>A <b>successful sign-in from an unusual country</b> soon after, with no failed attempts before it. This is the signature of a stolen password rather than a guessed one.</li>
<li>A <b>new inbox rule</b> that forwards or hides mail, a favourite trick of attackers who have taken over a mailbox.</li>
<li>A <b>process started by an office program</b>, such as Word starting PowerShell, which suggests that a malicious document ran.</li>
</ul>
<div class="note"><b>Field note: the reporting culture</b>The best defence against phishing is not a perfect filter. It is employees who report suspicious messages quickly and without fear. Companies with “report phishing” buttons often detect campaigns hours earlier because the first recipient raises the alarm. Analysts who answer reports kindly, with a short thank-you and an explanation, build that culture.</div>
<h2>Reducing the damage</h2>
<table><tr><th>Control</th><th>How it helps</th></tr>
<tr><td>Multi-factor authentication</td><td>A stolen password alone no longer works. Security keys resist even relay attacks.</td></tr>
<tr><td>Email filtering and link rewriting</td><td>Blocks known bad senders and checks links at click time.</td></tr>
<tr><td>Disabling macros from the internet</td><td>Stops a major source of malicious documents.</td></tr>
<tr><td>Least privilege</td><td>A compromised normal account cannot do as much harm.</td></tr>
<tr><td>Simulations and training</td><td>Practice builds habits, if done without shaming people.</td></tr>
<tr><td>Payment verification rules</td><td>For example, “always confirm bank changes by phone using a known number”. This defeats business email compromise.</td></tr></table>
<h2>Social engineering beyond email</h2>
<p>Attackers also phone helpdesks pretending to be employees who have lost access, ask receptionists to let them in as “maintenance staff”, or leave infected USB drives in car parks. The common defence is a <b>verification procedure</b> that does not depend on someone’s good manners: call back on a known number, ask for a manager’s approval, or require identity checks for resets.</p>
<h2>Connecting this to your academy journey</h2>
<p>Your lab has no email system, but you will practise the same skills on a smaller scale. In the case files you will see how a stolen password appears in logs and how to decide whether a login was the owner or an intruder. You will also practise writing a plain, kind explanation for a user whose account was affected, which is a surprisingly important professional skill.</p>`,
takeaways:["Social engineering exploits trust, urgency and helpfulness; phishing is its most common form.","Spear phishing and business email compromise are targeted and may contain no malware at all.","Analysts examine sender, SPF/DKIM/DMARC results, links, attachments, content and scope, then ask whether anyone acted on the message.","A stolen password often shows as a successful sign-in from an unusual place with no preceding failures.","A kind reporting culture, MFA and verification procedures reduce damage most."],
quiz:[{q:"Business email compromise often involves…",o:["A request for payment with no malicious link","A virus attachment only","A broken router","A USB fault"],a:0},{q:"What is the most important question after finding a phishing message?",o:["Did anyone act on it?","What font is it?","Who wrote it first?","Is it long?"],a:0},{q:"Which control best limits stolen passwords?",o:["Multi-factor authentication","A longer email","Bigger screens","Dark mode"],a:0}]},

{id:"r19",mod:"m3",title:"Malware and Ransomware: What They Do and How Defenders See Them",labs:["3-2"],
body:String.raw`<p class="lead">Malware is the word for software written to harm. It is a broad family with many members, and ransomware, the most feared of them, is a good case study in how an ordinary-looking intrusion turns into a crisis. This chapter explains the types, the life cycle of a ransomware attack, and the many places a defender can notice it.</p>
<h2>The malware family</h2>
<table><tr><th>Kind</th><th>What it does</th></tr>
<tr><td><b>Virus and worm</b></td><td>Spread by copying themselves. A worm spreads across networks without help.</td></tr>
<tr><td><b>Trojan</b></td><td>Pretends to be useful, but carries a hidden payload.</td></tr>
<tr><td><b>Backdoor and remote access trojan</b></td><td>Give the attacker control of the machine.</td></tr>
<tr><td><b>Keylogger and infostealer</b></td><td>Record keystrokes or steal saved passwords, cookies and documents.</td></tr>
<tr><td><b>Loader or dropper</b></td><td>A small first program whose only job is to download and start the real one.</td></tr>
<tr><td><b>Cryptominer</b></td><td>Uses the victim’s processor to produce cryptocurrency.</td></tr>
<tr><td><b>Ransomware</b></td><td>Encrypts files, or locks the system, and demands payment.</td></tr>
<tr><td><b>Rootkit</b></td><td>Hides itself and other malware from the operating system.</td></tr></table>
<p>Real attacks usually combine them. A phishing document might start a loader, which downloads an infostealer, which finds a password that lets a human attacker deploy ransomware a week later.</p>
<h2>How ransomware attacks actually unfold</h2>
<p>Popular images show ransomware as a virus that strikes in an instant. In many serious incidents, the opposite is true: human attackers spend days or weeks inside the company before pressing the button. Incident responders often describe the same sequence.</p>
<ol>
<li><b>Entry.</b> A phishing email, a stolen or guessed password on a remote access service, or an unpatched internet-facing system.</li>
<li><b>Foothold.</b> A tool is installed so that the attacker can return, often disguised with a harmless-looking name.</li>
<li><b>Exploration.</b> The attacker maps the network and looks for valuable systems and for accounts with high privileges.</li>
<li><b>Credential theft.</b> They collect passwords, often from memory or from stored files.</li>
<li><b>Spreading.</b> They use those credentials to log in to other computers, including servers that hold backups.</li>
<li><b>Preparation.</b> They stop security software, delete backups or shadow copies, and copy valuable data out for later use as extra leverage.</li>
<li><b>Encryption.</b> They run the ransomware across as many machines as possible at once, often in the early hours of a weekend.</li>
<li><b>Demand.</b> A note appears, with payment instructions and often a threat to publish the stolen data.</li>
</ol>
<p>The long gap between steps one and seven is good news for defenders. Each stage is a chance to notice, and we call the whole span the attacker’s <b>dwell time</b>.</p>
<h2>Where defenders can see it</h2>
<table><tr><th>Stage</th><th>What may be visible</th><th>Typical data source</th></tr>
<tr><td>Entry</td><td>Phishing message, odd login, exploit attempt</td><td>Email security, identity logs, web logs</td></tr>
<tr><td>Foothold</td><td>New program, new scheduled task, new service, new Run key</td><td>FIM, Sysmon, Windows events</td></tr>
<tr><td>Exploration</td><td>Many connections to many computers; commands such as <code>whoami</code>, <code>net group</code></td><td>Process logs, firewall</td></tr>
<tr><td>Credential theft</td><td>A program touching the memory of the login process</td><td>EDR, Sysmon</td></tr>
<tr><td>Spreading</td><td>Remote logins at odd hours between machines that never normally talk</td><td>Windows logon events (type 3 and 10)</td></tr>
<tr><td>Preparation</td><td>Antivirus switched off, backup service stopped, shadow copies deleted</td><td>Defender and System logs, process logs</td></tr>
<tr><td>Encryption</td><td>Thousands of files changed or renamed in minutes</td><td>FIM, file server logs</td></tr></table>
<p>The last row is where your BrightMart bulk-rename rule sits. It is a valuable last alarm, but by then the damage has started. The earlier rows give the chance to act with far less harm.</p>
<h2>Why backups decide the outcome</h2>
<p>If a company has recent, tested backups that the attacker cannot reach, ransomware becomes an expensive nuisance rather than a catastrophe. Attackers know this and try to destroy backups first. The practical lesson, often repeated by responders, is the <b>3-2-1 rule</b>: keep <b>three</b> copies of important data, on <b>two</b> different kinds of storage, with <b>one</b> copy offline or immutable, meaning it cannot be changed or deleted. Test restores regularly. A backup that has never been restored is a hope, not a plan.</p>
<h2>Reading signs on a single computer</h2>
<p>When an analyst suspects a computer is infected, a few clues help.</p>
<ul>
<li><b>Unexpected processes</b>, especially with names that imitate system programs, run from the wrong folder, or have the wrong parent.</li>
<li><b>Programs set to start automatically</b> that you do not recognise.</li>
<li><b>Network connections</b> to unfamiliar addresses, especially regular beacons at fixed intervals.</li>
<li><b>Security tools that are stopped</b> or altered.</li>
<li><b>Files that changed all at once</b>, or have new extensions.</li>
</ul>
<h2>What to do when you suspect ransomware</h2>
<p>These steps are widely recommended, and teams rehearse them before they are needed.</p>
<ol>
<li><b>Isolate</b> the affected computers from the network quickly, by disconnecting the cable or using the endpoint tool’s isolation feature. Do not shut them down if memory evidence is needed.</li>
<li><b>Escalate immediately.</b> This is a major incident, and the incident response lead, management and often legal staff must be told.</li>
<li><b>Preserve evidence</b> and record every action with its time.</li>
<li><b>Find the entry point and the spread</b> before restoring, so that you do not rebuild into the same hole.</li>
<li><b>Restore from clean backups</b> and reset credentials that may have been stolen.</li>
<li><b>Do not rush decisions about payment.</b> That is a business and legal matter, with law enforcement involvement in many countries.</li>
</ol>
<div class="note"><b>Field note: calm is a skill</b>Ransomware incidents are stressful. People work long hours and make decisions with incomplete facts. Experienced responders keep a written log, assign one person to communicate, and take short breaks so that mistakes do not multiply. If you join a SOC, you will practise through exercises where everything goes wrong on purpose.</div>
<h2>Detection ideas you will build</h2>
<p>In the academy you will meet several small versions of these ideas: tripwires on startup folders and Run keys for the foothold stage, a rule for a burst of renamed files for the encryption stage, and an incident report template for the aftermath. Together they show how layers of simple detections can cover a long attack.</p>`,
takeaways:["Malware is a family: trojans, backdoors, infostealers, loaders, miners, ransomware and more, often chained together.","Serious ransomware attacks are human-driven and spread over days, so every stage is a detection chance.","Each stage of the attack has a typical data source, from email logs to FIM alerts.","3-2-1 backups with one immutable or offline copy decide how bad an incident becomes.","On suspicion: isolate, escalate, preserve evidence, find the entry point, restore cleanly and reset credentials."],
quiz:[{q:"Why is long attacker dwell time good news for defenders?",o:["Each stage is a chance to detect","It slows the internet","It encrypts less","It means no attack"],a:0},{q:"What is the 3-2-1 backup rule?",o:["Three copies, two storage types, one offline or immutable","Three disks only","One daily copy","Two passwords"],a:0},{q:"What should you usually do first on a ransomware suspicion?",o:["Isolate the machine and escalate","Delete all files","Pay immediately","Ignore it"],a:0}]},

{id:"r20",mod:"m4",title:"Windows Event Logging in Depth: Audit Policy, PowerShell and Sysmon",labs:["4-4"],
body:String.raw`<p class="lead">A SIEM is only as good as the logs it receives, and on Windows the most useful logs are not all switched on by default. This chapter explains how Windows decides what to record, which settings turn the valuable ones on, and how a free Microsoft tool called Sysmon fills the biggest gaps.</p>
<h2>Why Windows logs are not enough out of the box</h2>
<p>A fresh Windows computer records logons and many system events, but it does not record every program that starts, and it does not keep the command lines that were used. That is understandable: recording everything would fill disks and slow machines. For a defender, though, a record that says “a program started” with no name or arguments tells almost nothing.</p>
<p>The solution is to decide, on purpose, what to record, collect those events centrally, and discard the noise. Companies call this <b>logging strategy</b> or <b>audit policy design</b>.</p>
<h2>Audit policy: categories and subcategories</h2>
<p>The security log is controlled by the <b>advanced audit policy</b>. It has categories, each with subcategories, and for each one you choose whether to record success, failure or both. The ones that matter most for a SOC are these.</p>
<table><tr><th>Subcategory</th><th>Produces</th><th>Value</th></tr>
<tr><td>Logon and Logoff: Logon</td><td>4624, 4625</td><td>Who logs in, and failed attempts</td></tr>
<tr><td>Detailed Tracking: Process Creation</td><td>4688</td><td>Every program that starts (add command lines to make it useful)</td></tr>
<tr><td>Account Management: User Account Management</td><td>4720, 4722, 4724, 4738 and others</td><td>New, changed and disabled accounts</td></tr>
<tr><td>Account Management: Security Group Management</td><td>4728, 4732, 4756</td><td>Changes to powerful groups</td></tr>
<tr><td>Object Access: File System and Registry</td><td>4663, 4657</td><td>Who touched a monitored file or key (needs auditing rules on the object; Wazuh’s whodata uses this)</td></tr>
<tr><td>Policy Change: Audit Policy Change</td><td>4719</td><td>An attacker or an error changing what is recorded</td></tr>
<tr><td>System: Security State and others</td><td>1102 (log cleared)</td><td>Tampering with evidence</td></tr></table>
<p>You can inspect the current policy with <code>auditpol /get /category:*</code> and change a setting with a command such as <code>auditpol /set /subcategory:"Process Creation" /success:enable</code>. In companies, these settings are applied to all computers at once through Group Policy, so everyone logs consistently.</p>
<h3>Process creation with command lines</h3>
<p>Event 4688 records that a process started. By default it does not include the command line. A registry setting adds it. With it, a defender can see not only that <code>powershell.exe</code> ran, but also the exact text typed, including any encoded commands. This single setting is among the highest-value changes a team can make.</p>
<h2>PowerShell logging</h2>
<p>Because attackers love PowerShell, Windows can record what it does. Two features matter.</p>
<ul>
<li><b>Script block logging</b> (event 4104) records the contents of the scripts that run, including code that was encoded or built on the fly, once Windows decodes it for execution. It is one of the most useful defensive features available.</li>
<li><b>Module logging</b> (event 4103) records pipeline activity in a more verbose style.</li>
</ul>
<p>These events live in the channel <code>Microsoft-Windows-PowerShell/Operational</code>. Script block logs may contain sensitive text, such as passwords typed in a script, so access to them must be controlled.</p>
<h2>Sysmon: a flight recorder for Windows</h2>
