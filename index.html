<p><b>Sysmon</b>, short for System Monitor, is a free tool from Microsoft’s Sysinternals collection. Once installed as a service, it records detailed activity into its own channel, <code>Microsoft-Windows-Sysmon/Operational</code>. You control what it records through a configuration file, and community-maintained configurations give a sensible start. Its most useful event types are these.</p>
<table><tr><th>Event ID</th><th>Records</th><th>Why defenders love it</th></tr>
<tr><td>1</td><td>Process creation, with command line, hashes and parent process</td><td>Shows exactly what ran and what started it</td></tr>
<tr><td>3</td><td>Network connection, with process and destination</td><td>Shows which program called out, and to where</td></tr>
<tr><td>7</td><td>Image (DLL) loaded</td><td>Helps find injected or hijacked code</td></tr>
<tr><td>10</td><td>One process accessing another’s memory</td><td>Credential theft from the login process</td></tr>
<tr><td>11</td><td>File created</td><td>Which program dropped which file</td></tr>
<tr><td>12, 13, 14</td><td>Registry keys and values created, set, renamed</td><td>Which program changed a Run key (including per-user hives)</td></tr>
<tr><td>15</td><td>File stream created (alternate data streams)</td><td>Hidden data attached to files</td></tr>
<tr><td>19, 20, 21</td><td>WMI event filters and consumers</td><td>A stealthy persistence method</td></tr>
<tr><td>22</td><td>DNS query, with process</td><td>Which program looked up which name</td></tr>
<tr><td>23</td><td>File deleted (archived)</td><td>Evidence of cleanup</td></tr></table>
<h3>Why Sysmon and FIM work well together</h3>
<p>File integrity monitoring tells you <b>what changed</b> and with whodata, <b>which account</b>. Sysmon tells you <b>which process</b> made the change, who started that process and what its command line was. When a file appears in a startup folder, FIM raises the alert, and Sysmon event 11 then shows that <code>powershell.exe</code>, started by <code>winword.exe</code>, created it. The pair turns an observation into a story.</p>
<h2>Getting events into Wazuh</h2>
<p>The Wazuh agent reads Windows event channels when you list them in its configuration. You choose each channel in a <code>localfile</code> block, with the format <code>eventchannel</code>. You can add a <code>query</code> to leave out noisy event IDs before they leave the computer. Wazuh’s default rules already understand a wide range of Windows and Sysmon events, so alerts appear as soon as the data arrives.</p>
<h2>Volume, noise and retention</h2>
<p>More logging is not always better. A single busy server can produce millions of events a day. Teams therefore choose carefully.</p>
<ul>
<li><b>Collect high-value events everywhere</b>: logons, account changes, process creation, PowerShell, Defender and service installation.</li>
<li><b>Collect expensive events on critical machines only</b>: detailed file and registry auditing, network connections.</li>
<li><b>Filter at the source</b> using queries, and by tuning the Sysmon configuration.</li>
<li><b>Size the log files.</b> The Security log has a maximum size and overwrites old events when full. On a busy server it may hold only hours of history unless it is enlarged and forwarded centrally.</li>
</ul>
<div class="note"><b>Field note: the log that is not there</b>Many incident reports contain the sentence “the relevant logging was not enabled”. It is one of the most common and most avoidable reasons that investigations end without answers. Enabling process creation with command lines and PowerShell script block logging, before an incident, is some of the best value work a security team can do.</div>
<h2>A first logging checklist</h2>
<ol>
<li>Enable the audit subcategories in the table above.</li>
<li>Turn on command lines in process creation events.</li>
<li>Turn on PowerShell script block logging.</li>
<li>Install Sysmon with a reviewed configuration.</li>
<li>Forward the Security, System, PowerShell, Sysmon and Defender channels to the SIEM.</li>
<li>Enlarge log files, and alert on 1102 and 4719.</li>
<li>Test by performing a harmless action and finding the event.</li>
</ol>
<p>The Wazuh agent lesson in Module 4 and the later Windows modules put this list into practice, one step at a time.</p>`,
takeaways:["Windows does not record everything by default; audit policy decides what is logged.","Process creation with command lines and PowerShell script block logging are among the highest-value settings.","Sysmon adds detailed process, network, file, registry and DNS events in its own channel.","FIM tells what changed; Sysmon shows which process made the change and how it was started.","Choose logs deliberately: collect high-value events everywhere and expensive ones only where needed."],
quiz:[{q:"What does event 4688 record?",o:["A process was created","A user logged off","A service was installed","A file was deleted"],a:0},{q:"Which Sysmon event shows a process creating a file?",o:["11","1","3","22"],a:0},{q:"Why is script block logging valuable?",o:["It records the real PowerShell code that ran, even if it was encoded","It speeds up PowerShell","It blocks scripts","It deletes logs"],a:0}]},

{id:"r21",mod:"m4",title:"Choosing Your First Log Sources: A Practical Plan",labs:["4-4","4-5"],
body:String.raw`<p class="lead">One of the most common mistakes in a new SIEM project is connecting every log source at once. The result is a flood of data, a huge bill and an analyst team that cannot see anything useful. This chapter gives you a simple way to decide what to collect first, and why.</p>
<h2>Start from questions, not from data</h2>
<p>Experienced teams do not begin by asking “what logs can we collect?” They begin by asking “what do we most fear, and what evidence would show it?” That reverses the usual order and keeps the project honest.</p>
<p>Take a small online shop. Its owner might say that the three worst outcomes are: a customer database being stolen, the website being defaced, and the payment page being altered to steal card numbers. For each of those, ask which attacker actions are likely and which logs would reveal them.</p>
<table><tr><th>Fear</th><th>Likely attacker action</th><th>Evidence that would show it</th></tr>
<tr><td>Customer data stolen</td><td>Logs in to the database server with a stolen account and copies data</td><td>Login logs on the server, database audit logs, large outbound transfers</td></tr>
<tr><td>Website defaced</td><td>Uploads or edits files in the web folder</td><td>File integrity monitoring on the web folder, web server access logs</td></tr>
<tr><td>Payment page altered</td><td>Changes a script file on the checkout page</td><td>File integrity monitoring, change records, web logs</td></tr></table>
<p>This table already tells you what to collect first: server login logs, file integrity events and web server logs. It also shows what not to collect yet.</p>
<h2>A sensible first wave of log sources</h2>
<p>Most organisations arrive, by different roads, at a similar first wave. Think of it as a ladder, with the highest-value rungs first.</p>
<ol>
<li><b>Identity and authentication.</b> Who signed in, from where, and who failed. For a small company this is the logon events on servers and laptops. For a larger one it includes the central directory and any cloud sign-in service. Stolen accounts are so common that these logs usually give the best return.</li>
<li><b>Administrative actions.</b> New accounts, changes to groups, use of administrator rights, changes to audit settings. These are rare in normal life and meaningful when they happen.</li>
<li><b>Endpoint process activity.</b> Which programs ran, with which command lines. Process creation events and Sysmon give this.</li>
<li><b>File integrity events on critical paths.</b> Startup locations, web roots, configuration folders and registry autorun keys.</li>
<li><b>Security tool alerts.</b> Antivirus detections, endpoint tool alerts and email security alerts. These are already someone else’s detections, and you want them in one place.</li>
<li><b>Network perimeter.</b> Firewall and VPN logs, which show who connects in and which devices call out.</li>
<li><b>DNS and web proxy.</b> Names looked up and sites visited, which expose malware calling home.</li>
<li><b>Cloud audit logs.</b> If the company uses cloud services, their control-plane logs are a priority, because one mis-set permission can expose a great deal.</li>
</ol>
<h2>What to leave for later</h2>
<p>Some logs are voluminous and low in value at the start. Verbose application debug logs, full packet captures, and every successful file read on every server are examples. They can be valuable for specific investigations, but sending them all to the SIEM on day one drowns the signal. A good rule is to add a source only when you can say which detection or investigation it supports.</p>
<h2>Check that each source is truly usable</h2>
<p>Before you call a source “connected”, check five things.</p>
<ul>
<li><b>It arrives.</b> New events appear within seconds or minutes.</li>
<li><b>It is complete.</b> No whole computers or time periods are missing.</li>
<li><b>It is parsed.</b> The fields you need, such as user and source address, are extracted correctly.</li>
<li><b>The time is right.</b> The clocks on the source agree with the rest of the company.</li>
<li><b>Someone owns it.</b> A person is responsible if it stops.</li>
</ul>
<p>Teams that skip this checklist discover months later that a firewall stopped sending logs in spring and nobody noticed. This is why monitoring the health of log sources, not just their content, is itself a standard detection.</p>
<h2>Estimating volume and cost</h2>
<p>Logs are measured in events per second and gigabytes per day. The numbers surprise newcomers. A single domain controller can generate many thousands of events an hour. Firewalls can generate millions. A practical approach is to connect one example of each source type, measure for a week, then multiply by the number of devices and the retention period.</p>
<p>Cost often depends on volume. Commercial SIEMs may charge by data ingested per day. Even with a free product like Wazuh, you pay for storage and for the memory that searching requires. Knowing the volume lets you decide honestly what you can afford to keep, and for how long.</p>
<h2>Retention in layers</h2>
<p>Teams rarely keep everything in the same place for the same time. A common pattern is:</p>
<ul>
<li><b>Hot storage</b>, fast and expensive, holding the last weeks or months for daily searches and investigations.</li>
<li><b>Warm or cold storage</b>, cheaper and slower, holding older data for compliance or to look back at a long-running attack.</li>
<li><b>Short retention for noisy sources</b>, and longer retention for authentication and administrative logs, which investigators ask for most.</li>
</ul>
<p>Regulations sometimes set minimums, and legal teams sometimes set maximums. The security team’s job is to explain trade-offs, not to decide alone.</p>
<h2>The time problem</h2>
<p>Every log line carries a time stamp, and if clocks disagree, timelines become fiction. Companies keep computers in step with a time service, using a protocol called <b>NTP</b>, and standardise on one time zone, usually UTC, in the SIEM. When an investigation seems to show an event after its own consequence, suspect the clocks before you suspect magic.</p>
<div class="note"><b>Field note: the “first month” source list</b>A small team’s first month often looks like this: week one, authentication logs and endpoint alerts; week two, process creation on servers; week three, file integrity on web and configuration paths; week four, firewall and DNS, and a review of what was noisy. Slow and steady beats fast and drowning.</div>
<h2>What your lab teaches you here</h2>
<p>Your lab has just three machines, so choosing sources is easy: the Linux authentication log, the Windows Security log and file integrity events. But the habit is the real lesson. For each new thing you add, write one sentence: “I am adding this log so that I can detect ___.” If you cannot finish the sentence, wait.</p>`,
takeaways:["Start from the outcomes you fear and work backwards to the evidence that would show them.","The first wave is usually identity, administrative actions, endpoint processes, critical file changes, security tool alerts, then perimeter, DNS and cloud.","Add a source only when you can name the detection or investigation it supports.","A source is usable only if it arrives, is complete, is parsed, has correct time and has an owner.","Measure volume before scaling, keep retention in layers, and keep clocks synchronised."],
quiz:[{q:"What should decide which logs you collect first?",o:["The outcomes you most fear and the evidence for them","Whatever is easiest","The biggest logs","Alphabetical order"],a:0},{q:"Which check confirms a log source is usable?",o:["It arrives, is complete, parsed, time-correct and owned","It is large","It is old","It is encrypted"],a:0},{q:"Why standardise on UTC?",o:["Timelines from different systems line up","It is faster","It is secret","It reduces disk use"],a:0}]},

{id:"r22",mod:"m5",title:"Windows Persistence: Where Attackers Hide and How FIM Sees It",labs:["fim-5","fim-7"],
body:String.raw`<p class="lead">An attacker who gets onto a computer wants to stay there. Computers restart, users log off, and any program that is not set up to run again simply vanishes. The ways attackers arrange to come back are called <b>persistence</b>, and they are among the best things a defender can look for, because they leave durable traces.</p>
<h2>Why persistence is a defender’s opportunity</h2>
<p>An attacker can disguise many things, but to survive a restart, something on disk or in settings must change. That change cannot be avoided. It might be a file in a folder, a value in the registry, a scheduled task, or a new service. Because those locations are limited and well known, a defender can watch a small list and catch a large share of intrusions. This is the logic behind the tripwires you place in the BrightMart case file.</p>
<h2>The main Windows persistence methods</h2>
<table><tr><th>Method</th><th>How it works</th><th>Where to look</th></tr>
<tr><td><b>Registry Run keys</b></td><td>Programs listed here start at every logon.</td><td><code>HKLM\Software\Microsoft\Windows\CurrentVersion\Run</code>, <code>RunOnce</code>, and the same under <code>HKCU</code></td></tr>
<tr><td><b>Startup folders</b></td><td>Anything placed here starts when a user logs on.</td><td>All users: <code>C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</code>; per user: the same under <code>AppData\Roaming</code></td></tr>
<tr><td><b>Scheduled tasks</b></td><td>A task starts a program on a timer or at logon.</td><td><code>C:\Windows\System32\Tasks</code>, the Task Scheduler event log, event 4698</td></tr>
<tr><td><b>Services</b></td><td>A new service runs a program at boot, often with high privileges.</td><td>Registry under <code>HKLM\System\CurrentControlSet\Services</code>; events 7045 and 4697</td></tr>
<tr><td><b>Winlogon settings</b></td><td>Values such as Shell and Userinit control what runs at logon.</td><td><code>HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</code></td></tr>
<tr><td><b>Image File Execution Options</b></td><td>A “debugger” value makes Windows launch another program whenever the named one starts.</td><td>Under <code>HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options</code></td></tr>
<tr><td><b>WMI event subscriptions</b></td><td>A hidden rule in the management system runs a command when a condition occurs.</td><td>The WMI repository; Sysmon events 19, 20 and 21</td></tr>
<tr><td><b>DLL hijacking</b></td><td>A malicious library is placed where a legitimate program will load it.</td><td>Program folders; Sysmon image-load events</td></tr>
<tr><td><b>New or modified accounts</b></td><td>A hidden account with a password the attacker knows.</td><td>Events 4720, 4722, 4732</td></tr>
<tr><td><b>PowerShell profiles</b></td><td>A profile script runs whenever PowerShell starts.</td><td><code>C:\Windows\System32\WindowsPowerShell\v1.0\profile.ps1</code> and users’ profile files</td></tr></table>
<h2>What FIM sees well, and what it misses</h2>
<p>File integrity monitoring covers the first rows of that table with ease, because they are files and registry keys. A new file in a startup folder, a changed Run key, a fresh task definition, a changed Winlogon value: these are precisely FIM’s strengths.</p>
<p>It is weaker where the persistence does not live in watched files or keys. A WMI subscription is stored in a database that FIM does not inspect, so Sysmon’s WMI events are the better tool. A malicious DLL in a program’s own folder is only noticed if that folder is monitored. And a per-user Run key under <code>HKCU</code> sits in a different registry file for each user, so you need to check that your monitoring covers it, or add Sysmon registry events as a backup.</p>
<h2>Reading a persistence alert</h2>
<p>When an alert tells you a file was added to a startup folder or a registry autorun value was changed, work through these questions.</p>
<ol>
<li><b>What does the new entry point to?</b> A real application in <code>Program Files</code>, or a program in <code>Temp</code>, <code>Public</code> or <code>AppData</code>?</li>
<li><b>What is its name?</b> Attackers often choose names that imitate Windows components, such as <code>svchost32.exe</code> or <code>WindowsUpdater.exe</code>. The real <code>svchost.exe</code> lives only in <code>System32</code>.</li>
<li><b>Who or what created it?</b> With whodata or Sysmon, you can see the account and the parent process. A creator such as <code>winword.exe</code> or <code>powershell.exe</code> is more suspicious than an installer.</li>
<li><b>Is the file known?</b> Check its hash against a reputation service, and check whether it is digitally signed by a real publisher.</li>
<li><b>Was it expected?</b> Is there an approved change, or did a person just install a legitimate program?</li>
<li><b>What else happened nearby?</b> Logons, other new files, outbound connections.</li>
</ol>
<h2>Common legitimate causes, and how to tell</h2>
<p>Not every new startup entry is an attack. Browsers, chat applications, cloud storage clients and printer software all add themselves. The difference is usually in the details: a legitimate program is signed, is installed in <code>Program Files</code>, appears across many machines at once after an update, and has a reputable name. A malicious one is often unsigned, sits in a user-writable folder, and appears on one machine alone.</p>
<div class="note"><b>Field note: the “only one machine” test</b>If an unfamiliar startup entry appears on exactly one computer in a company of hundreds, and the same name appears nowhere else, that is a strong signal. Real software tends to appear on many. Searching your SIEM for the same file name or hash across all agents takes seconds and is one of the most effective quick checks.</div>
<h2>The response, once you are sure</h2>
<ol>
<li>Capture the evidence: the file itself, its hash, the registry value, and screenshots with timestamps.</li>
<li>Isolate the computer if there is any sign of active control.</li>
<li>Remove the persistence entry, but only after you have copied what you need. Remember that attackers often install <b>more than one</b>, so removing one and declaring victory is a mistake.</li>
<li>Search every other computer for the same indicators.</li>
<li>Find and fix the entry point: the phishing email, the weak password, the missing update.</li>
<li>Write the report, with the persistence method named and mapped to its ATT&CK technique.</li>
</ol>
<h2>A mental model: “doors back in”</h2>
<p>Imagine the attacker has broken into a house and wants to return tomorrow. They will copy a key, leave a window unlatched, and hide a spare key in the garden. Defenders must check all three. In Windows terms, that is: a startup entry, a scheduled task, a service. Good teams hunt for each, and they remember that a single clean location proves nothing.</p>
<h2>How the case file uses this</h2>
<p>In Case File #1 you add tripwires for the Startup folder and for registry Run keys, and then you play the attacker who uses both. Treat the exercise as a rehearsal of the investigation list above. After every alert, ask: what does it point to, who made it, is it known, and what else is there?</p>`,
takeaways:["Persistence methods are limited and well known, so a short watch list catches many intrusions.","FIM covers startup folders, Run keys, task definitions and service keys well; WMI subscriptions and DLL hijacks need Sysmon or wider coverage.","Check what an entry points to, its name, its creator, its hash and signature, and whether it was approved.","A startup entry that appears on only one computer is a strong signal.","Attackers often install several persistence methods, so remove all of them and fix the entry point."],
quiz:[{q:"Why is persistence a good thing to monitor?",o:["Surviving a restart requires a change that can be seen","Attackers never use it","It is rare on Windows","It only affects Linux"],a:0},{q:"Which method is poorly covered by file monitoring alone?",o:["WMI event subscriptions","Startup folder files","Run keys","Task definition files"],a:0},{q:"An unfamiliar startup entry appears on exactly one machine. This is…",o:["A strong signal worth investigating","Always harmless","A printer feature","Normal after updates"],a:0}]},

{id:"r23",mod:"m5",title:"A Month of Tuning: The Story of a Noisy Alert",labs:["fim-8","fim-9"],
body:String.raw`<p class="lead">Textbooks describe tuning in a sentence: “reduce false positives.” In practice it is a patient, slightly detective-like activity that takes weeks. This chapter follows one composite team through a month, so you can see the decisions, the mistakes and the small victories.</p>
<div class="note"><b>A note on this story</b>The company, Kestrel Logistics, and its people are invented to illustrate patterns that security teams commonly describe. The numbers are plausible, not statistics from any real organisation.</div>
<h2>Week one: the flood</h2>
<p>Kestrel Logistics runs two hundred Windows laptops and thirty servers. In January it installed Wazuh agents everywhere and turned on file integrity monitoring on <code>C:\Windows\System32</code>, <code>C:\Program Files</code> and the users’ document folders, because someone thought “more coverage is better”.</p>
<p>By Friday, the dashboard held more than ninety thousand file integrity alerts. The analyst, Chidi, opened the list on Monday and felt his shoulders drop. He could not read ninety thousand alerts. Worse, he suspected that if an attacker added a file to the Startup folder, it would be buried among the rest.</p>
<p>Chidi’s manager, Funmi, gave him one instruction: “Do not try to read them. Count them.”</p>
<h2>Week two: counting and sorting</h2>
<p>Chidi grouped the alerts by three questions: which path, which computer, and which rule. A pattern emerged within an hour.</p>
<table><tr><th>Source of noise</th><th>Share of alerts</th><th>What it was</th></tr>
<tr><td>Windows Update folders under <code>System32</code> and <code>WinSxS</code></td><td>About 40 per cent</td><td>Monthly updates installed on Tuesday night</td></tr>
<tr><td>A finance application’s cache folder in <code>Program Files</code></td><td>About 25 per cent</td><td>The application rewrote its own cache every few minutes</td></tr>
<tr><td>Users’ document folders</td><td>About 20 per cent</td><td>People saving and editing files, as people do</td></tr>
<tr><td>Browser and temporary folders</td><td>About 10 per cent</td><td>Normal churn</td></tr>
<tr><td>Everything else</td><td>About 5 per cent</td><td>Mixed; the only part worth reading</td></tr></table>
<p>The result was striking. Ninety-five per cent of the alerts came from sources that could never indicate an attack by themselves. The real signal lived in the last five per cent.</p>
<h2>The first cuts, and the first argument</h2>
<p>Chidi proposed removing the documents folders, the update folders and the cache folder from monitoring. A colleague, Ife, objected. “What if an attacker hides a tool in the finance application’s folder?” It was a fair point. The team agreed on a compromise that became their guiding rule: <b>never ignore a whole folder when you can ignore a narrow pattern inside it</b>.</p>
<p>So instead of dropping the entire <code>Program Files</code> area, they:</p>
<ul>
<li>stopped monitoring users’ document folders entirely, because change there is the purpose of the folders and ransomware can be caught by a burst rule instead;</li>
<li>ignored the specific cache subfolder of the finance application, but kept the application’s program files watched;</li>
<li>watched the Windows Update areas only by scheduled scan, not in real time, and added a note to compare against the patch calendar;</li>
<li>kept real-time watching with who-changed-it information on a handful of critical places: the hosts file, startup folders, scheduled task definitions, the web server folder, and a few registry autorun keys.</li>
</ul>
<p>They wrote each change into a shared document, with the date and the reason. Funmi insisted: “In six months nobody will remember why this cache is ignored.”</p>
<h2>Week three: the mistake</h2>
<p>Pleased with progress, Chidi loosened another rule. One server produced a few alerts every night at two o’clock. He assumed it was a backup, and added an exception for the whole server’s Temp folder.</p>
<p>A week later a different analyst noticed, during a routine hunt, that the nightly alerts had stopped, yet the backup software was still running. Digging in, she found that the original alerts had been caused by a scheduled job unrelated to backups, which a contractor had left behind. The exception hid it. Nothing malicious had happened, but the lesson was clear.</p>
<p>The team added two new habits.</p>
<ol>
<li><b>Verify before you ignore.</b> Never add an exception because an alert “looks like” something. Identify the actual process or job responsible, and write its name in the note.</li>
<li><b>Review exceptions monthly.</b> An exception is a place where the team has decided to stop looking, so it deserves a regular second glance.</li>
</ol>
<h2>Raising the important alerts</h2>
<p>Tuning is not only about silencing. In week three Funmi pointed out that the team had spent days reducing noise and no time making the important alerts louder. By default, a change in the hosts file is just another file modification. The team wrote custom rules that raised the severity for four things: a change to the hosts file, a new file in any Startup folder, a new script in the web folder, and a change to the agent’s own configuration file. They also wrote a burst rule for large numbers of renamed files in short periods, as an early warning for ransomware.</p>
<p>They tested each rule on a lab machine first, performing the action and watching for the alert, as you do in the case file.</p>
<h2>Week four: the results</h2>
<p>By the end of the month, the numbers had changed.</p>
<table><tr><th>Measure</th><th>Week one</th><th>Week four</th></tr>
<tr><td>File integrity alerts per day</td><td>About 13,000</td><td>About 40</td></tr>
<tr><td>Alerts needing a human decision</td><td>Impossible to say</td><td>About 6 a day</td></tr>
<tr><td>Time for Chidi to review the morning queue</td><td>Never finished</td><td>About 15 minutes</td></tr>
<tr><td>Custom high-severity rules</td><td>0</td><td>5</td></tr></table>
<p>One of the six alerts that Monday was a new file in a Startup folder on a sales laptop. The file turned out to belong to a new video conferencing tool that an employee had installed. Chidi checked the signature, found the publisher legitimate, noted the approval, and closed it in four minutes. Without the tuning, he would never have seen it.</p>
<h2>What the story teaches</h2>
<ul>
<li><b>Count before you cut.</b> A simple count by path, host and rule usually shows the main noise sources.</li>
<li><b>Ignore narrowly.</b> Remove the smallest pattern that solves the problem, not a whole directory.</li>
<li><b>Record every decision and its reason.</b> Future you, and your auditor, will ask.</li>
<li><b>Verify before ignoring.</b> Guessing is how blind spots are made.</li>
<li><b>Make the important louder, not only the unimportant quieter.</b></li>
<li><b>Review.</b> Environments change, and so should the tuning.</li>
<li><b>Measure.</b> Alerts per day and review time are simple, honest numbers.</li>
</ul>
<div class="note"><b>Field note: the human side</b>Tuning is easier when the people who own the applications are involved. The finance application’s team knew exactly why its cache was rewritten. A ten-minute conversation saved Chidi a day of guessing. Security teams that treat other teams as partners get better exceptions, and better cooperation when a real incident arrives.</div>
<h2>Practising it in your lab</h2>
<p>In the case file you will create deliberate noise and then silence it with a narrow ignore, proving that a real change still alerts. After that, you will write rules that raise the importance of dangerous places. Try to narrate each choice the way this team did: what is the source, is it harmless, what is the smallest change that fixes it, and how will I check that I did not hide something important?</p>`,
takeaways:["Count alerts by path, host and rule before changing anything; a few sources usually cause most noise.","Ignore the narrowest pattern possible; never drop a whole folder if a smaller exception works.","Verify what is actually causing an alert before adding an exception, and review exceptions regularly.","Tuning also means raising the severity of truly important alerts with custom rules.","Record every change and its reason, and measure alerts per day and review time."],
quiz:[{q:"What was the first thing Chidi did with the flood of alerts?",o:["Counted and grouped them by path, host and rule","Deleted the agents","Read every alert","Turned off FIM"],a:0},{q:"Why verify before adding an exception?",o:["Guessing can hide a real problem","It makes alerts louder","It is a licence rule","Exceptions are forbidden"],a:0},{q:"Besides reducing noise, what else is part of tuning?",o:["Raising severity for important events","Deleting all rules","Buying more disks","Changing passwords weekly"],a:0}]},

{id:"r24",mod:"m6",title:"Linux Persistence and What Attackers Do After They Log In",labs:["6-3"],
body:String.raw`<p class="lead">In the SSH case file, the attacker guesses a password and logs in. That is where many tutorials stop, but for a defender it is where the interesting part begins. This chapter explains what attackers typically do in the first minutes and hours on a Linux server, and how each action leaves a trace that you can learn to read.</p>
<h2>The first five minutes</h2>
<p>An attacker who has just logged in as an ordinary user usually does not know where they are. Most spend the first moments gathering basic information, an activity called <b>discovery</b>. The commands are short and familiar, which is exactly why they are easy to miss.</p>
<table><tr><th>Command</th><th>What the attacker learns</th></tr>
<tr><td><code>whoami</code>, <code>id</code></td><td>Which account this is, and which groups it belongs to</td></tr>
<tr><td><code>hostname</code>, <code>uname -a</code></td><td>What the machine is, and which kernel version it runs</td></tr>
<tr><td><code>cat /etc/os-release</code></td><td>Which distribution and version</td></tr>
<tr><td><code>ip a</code>, <code>ss -tulpn</code></td><td>Addresses, other networks, and which services listen</td></tr>
<tr><td><code>ps aux</code></td><td>What software runs, including security tools</td></tr>
<tr><td><code>ls /home</code>, <code>cat /etc/passwd</code></td><td>Other users on the machine</td></tr>
<tr><td><code>sudo -l</code></td><td>Whether this account can run administrator commands</td></tr>
<tr><td><code>crontab -l</code></td><td>Existing scheduled jobs</td></tr></table>
<p>None of these commands is harmful by itself, and administrators run them all the time. Defenders therefore do not alarm on a single one. They watch for a <b>cluster</b> of them in the first minute after a login from an unfamiliar address.</p>
<h2>Looking for a way up</h2>
<p>An ordinary account has limited rights. The attacker’s next goal is usually <b>privilege escalation</b>, becoming root. Common routes include:</p>
<ul>
<li><b>Misconfigured sudo</b> rights that let the account run powerful commands without a password.</li>
<li><b>SUID programs</b> that can be abused to run commands as root.</li>
<li><b>Writable scripts or services</b> that run as root and that the user can modify.</li>
<li><b>Old, unpatched software</b>, including the kernel itself.</li>
<li><b>Credentials lying around</b>: passwords in scripts, backup files, shell history or configuration files.</li>
</ul>
<p>Watching for escalation means watching for unexpected use of <code>sudo</code>, the creation of SUID files, and changes in files that root executes. These are tasks that file integrity monitoring and the authentication log handle well.</p>
<h2>Persistence on Linux</h2>
<p>As on Windows, an attacker who wants to return arranges for it. The usual methods are limited and well known.</p>
<table><tr><th>Method</th><th>How it works</th><th>Where to look</th></tr>
<tr><td><b>SSH keys</b></td><td>The attacker adds their own public key, so they can log in without the password, even after it is changed.</td><td><code>~/.ssh/authorized_keys</code> for each user, including root</td></tr>
<tr><td><b>Cron jobs</b></td><td>A scheduled command re-establishes access.</td><td>User crontabs, <code>/etc/crontab</code>, <code>/etc/cron.d</code>, <code>/etc/cron.hourly</code> and similar</td></tr>
<tr><td><b>New services or timers</b></td><td>A systemd unit starts a hidden program at boot or on a schedule.</td><td><code>/etc/systemd/system</code> and <code>~/.config/systemd/user</code></td></tr>
<tr><td><b>Shell startup files</b></td><td>Commands added to files that run at each login.</td><td><code>~/.bashrc</code>, <code>~/.profile</code>, <code>/etc/profile.d</code></td></tr>
<tr><td><b>New accounts</b></td><td>An account added with a known password, sometimes named to resemble a service.</td><td><code>/etc/passwd</code>, <code>/etc/shadow</code>, auth log entries for <code>useradd</code></td></tr>
<tr><td><b>Library preloading</b></td><td>A malicious library loaded into every program.</td><td><code>/etc/ld.so.preload</code></td></tr>
<tr><td><b>Replaced programs</b></td><td>A trojaned copy of a common program.</td><td><code>/bin</code>, <code>/usr/bin</code>; compare hashes with package records</td></tr></table>
<p>Compare this list with your Linux file integrity paths. A tripwire on <code>/etc/passwd</code>, <code>/etc/ssh</code>, cron folders, systemd folders and each user’s <code>authorized_keys</code> covers most rows.</p>
<h2>Covering tracks</h2>
<p>A careful attacker tries to reduce evidence. Typical steps include clearing the shell history (for example by unsetting the history file or deleting <code>~/.bash_history</code>), editing or truncating log files, or stopping the logging service. Each leaves its own signature.</p>
<ul>
<li>A log file that suddenly becomes much smaller, or has a gap in time, is suspicious.</li>
<li>A stopped logging or monitoring service should itself raise an alert.</li>
<li>Logs that have already been shipped to a central server cannot be edited by someone who has only taken over one machine. This is the strongest protection, and the reason central logging is a core principle.</li>
</ul>
<h2>Moving on</h2>
<p>From the first machine, an attacker looks for others. They check the SSH known-hosts file to see which servers this one connects to, look for private keys that might work elsewhere, and scan the internal network. The defender’s signs are new connections between machines that rarely talk, logins using keys from unusual sources, and the scanning pattern seen in earlier chapters.</p>
<h2>What you can see in the SSH case file</h2>
<p>In the case file, the “attacker” runs a few discovery commands after logging in. They are quick and quiet. The lesson is in what you check afterward. You read the authentication log for the success. You look at <code>last</code> for the session. You check the home folder for new keys and the crontab for new jobs. Those are the same checks real responders make in their first ten minutes.</p>
<h2>A short checklist for a possibly compromised Linux server</h2>
<ol>
<li>Who is logged in now, and who logged in recently (<code>who</code>, <code>last</code>)?</li>
<li>What is running, and which processes have strange parents (<code>ps aux --forest</code>)?</li>
<li>What is listening, and what is connecting out (<code>ss -tulpn</code>, <code>ss -tnp</code>)?</li>
<li>What is scheduled (crontabs, timers)?</li>
<li>What keys are authorised (<code>authorized_keys</code> for every user)?</li>
<li>Which accounts exist, and which are new?</li>
<li>Which files changed recently in sensitive folders?</li>
<li>Do the logs look complete?</li>
</ol>
<div class="note"><b>Field note: the quiet attacker</b>Many real intruders do very little. They log in, check the machine, leave a key, and come back weeks later. A team that only looks for noise misses them. Reviewing new SSH keys and new cron jobs weekly is a cheap habit that regularly uncovers long-running access.</div>`,
takeaways:["After logging in, attackers run short discovery commands; a cluster of them soon after an unfamiliar login is the signal.","Privilege escalation often uses sudo rights, SUID files, writable root scripts, old software or stored credentials.","Linux persistence methods include SSH keys, cron, systemd units, shell startup files, new accounts and preloaded libraries.","Attackers may clear history or edit logs; central logging protects the evidence.","Check logins, processes, connections, schedules, keys, accounts, recent file changes and log completeness."],
quiz:[{q:"Which is a common Linux persistence method?",o:["Adding a key to authorized_keys","Changing the wallpaper","Restarting the router","Installing a printer"],a:0},{q:"Why does central logging help against log tampering?",o:["Shipped copies cannot be edited from the compromised machine","It makes logs smaller","It removes the need for logs","It encrypts the attacker"],a:0},{q:"What matters more than a single discovery command?",o:["A cluster of them soon after an unfamiliar login","The font used","The server colour","The log file name"],a:0}]},

{id:"r25",mod:"m6",title:"Active Response and Automation: Power and Peril",labs:["6-5"],
body:String.raw`<p class="lead">It is tempting to believe that the best security system is one that fixes everything by itself. Security teams have learned, sometimes painfully, that automation is a sharp tool. Used well, it saves hours and stops attacks while people sleep. Used carelessly, it breaks the business faster than any attacker could. This chapter helps you use it wisely.</p>
<h2>Why automate at all</h2>
<p>Three pressures push teams towards automation.</p>
<ul>
<li><b>Speed.</b> Attacks can move in seconds. A person who must read an alert, decide and click may take minutes or hours.</li>
<li><b>Volume.</b> A team cannot manually handle thousands of repetitive alerts. Many of them need the same simple steps.</li>
<li><b>Consistency.</b> A script does exactly what it is told, at three in the morning, without tiredness or distraction.</li>
</ul>
<h2>The automation ladder</h2>
<p>Automation is not all or nothing. Mature teams climb a ladder, one rung at a time, and stop where the risk is acceptable.</p>
<table><tr><th>Level</th><th>What the system does</th><th>Example</th></tr>
<tr><td>0. Manual</td><td>Nothing. A human does everything.</td><td>Analyst reads the alert and looks up the address</td></tr>
<tr><td>1. Enrichment</td><td>Adds information to the alert automatically.</td><td>Looks up the source address and adds its country and reputation</td></tr>
<tr><td>2. Notification and ticketing</td><td>Tells the right person and opens a case.</td><td>Sends a chat message and creates a ticket</td></tr>
<tr><td>3. Suggested action</td><td>Proposes a response and waits for approval.</td><td>“Block this address? Yes or no”</td></tr>
<tr><td>4. Automatic action, limited</td><td>Acts alone, for high-confidence cases, with safeguards.</td><td>Blocks a scanning address for ten minutes</td></tr>
<tr><td>5. Automatic action, broad</td><td>Acts alone on many situations, including disruptive ones.</td><td>Isolates laptops, disables accounts</td></tr></table>
<p>Most teams are comfortable at levels one to three for most alerts, and level four for a short list of carefully chosen cases. Level five is rare, and usually only where speed is critical and the cost of a wrong action is low.</p>
<h2>Wazuh Active Response</h2>
<p>Wazuh’s built-in automation is called <b>Active Response</b>. The idea is simple. You define a <b>command</b>, a script that does something such as blocking an address. You then define an <b>active response</b> that says when to run it: for which rules, on which machines, and for how long. Wazuh ships with several ready-made scripts, for example one that blocks an address with the host firewall, one that adds an address to a deny list, and one that disables an account. Windows has its own equivalents. You can also write your own.</p>
<p>The key settings are:</p>
<ul>
<li><b>Command.</b> Which script to run.</li>
<li><b>Location.</b> Where it runs: on the agent that generated the alert, on the server, on a specific agent, or everywhere.</li>
<li><b>Rules or levels.</b> Which alerts trigger it. Tie it to specific rule IDs or groups, not to broad severity levels, so you know exactly what causes an action.</li>
<li><b>Timeout.</b> How long the action stays in place before the system reverses it. A time limit is one of the most valuable safeguards.</li>
</ul>
<h2>Five ways automation goes wrong</h2>
<h3>1. Blocking the wrong thing</h3>
<p>Remember that many people can share one public address. A bot at the same address as your head office may lead to the whole office being locked out. Attackers also know that automated blocks exist, and some forge the source addresses of harmless services, such as your own DNS server, to make your system block them. This is why every blocking action needs an <b>allowlist</b> of addresses that must never be blocked: administrators, monitoring systems, critical partners, and your own infrastructure.</p>
<h3>2. Acting on a false alarm</h3>
<p>If a rule has a high false positive rate, automatic action turns each false alarm into an outage. Only automate responses for rules you have measured and trust. A good test: could a human reviewing this rule’s last fifty alerts say “yes, blocking would have been right every time”?</p>
<h3>3. Making things worse</h3>
<p>Some actions destroy evidence. Wiping a machine or killing a process may remove the information needed to learn what happened. Isolating a server that runs a critical business process may stop the attacker and stop the business. The cost of an action is part of the decision.</p>
<h3>4. Loops and storms</h3>
<p>A response can trigger another alert, which triggers another response. For example, a script that writes to a log file that your own file monitoring watches will create a loop of alerts. Test automation in a lab, and set limits on how often an action can run.</p>
<h3>5. Silent failure</h3>
<p>A response that does not run, but that nobody checks, gives false comfort. Log every action, and alert when an expected action fails.</p>
<h2>Safeguards that professionals use</h2>
<ul>
<li><b>Allowlists</b> for addresses, accounts and machines that must never be touched.</li>
<li><b>Time limits</b> on every block, so mistakes fix themselves.</li>
<li><b>Confidence thresholds</b>: act automatically only when two independent signals agree.</li>
<li><b>Approval steps</b> for disruptive actions: a person confirms with one click.</li>
<li><b>Rate limits</b>: no more than a set number of blocks per hour.</li>
<li><b>Dry-run mode</b>: log what would have been done for a week before you let it happen.</li>
<li><b>Audit trail</b>: every action records who or what decided, when and why.</li>
<li><b>An undo path</b>: documented steps to reverse each action quickly.</li>
</ul>
<h2>Beyond Wazuh: orchestration platforms</h2>
<p>Larger teams use platforms known as <b>SOAR</b>, security orchestration, automation and response. They connect many tools, such as the SIEM, ticketing, email security, the firewall and threat intelligence services, and run <b>playbooks</b> across them. A playbook for a phishing report might: extract the links, check them against reputation services, search the mail system for the same message, delete it from all inboxes if malicious, and write a summary to the ticket. Open source options and workflow tools such as n8n can do similar work at a smaller scale, and you will build one in a later module.</p>
<h2>A worked example: should you auto-block SSH brute force?</h2>
<p>Consider the rule from your case file, which fires when there are many failed SSH logins from one address. Ask the safeguard questions.</p>
<ol>
<li><b>Is the rule reliable?</b> Yes: many failures within two minutes from one address is rarely innocent.</li>
<li><b>What is the cost of a wrong block?</b> Low if the block lasts minutes and the allowlist protects your administrators. Higher if a shared address is blocked from a service customers use.</li>
<li><b>What does the block achieve?</b> It stops the guessing from that address, though a determined attacker simply switches address. So its value is mainly against simple bots.</li>
<li><b>What safeguards apply?</b> Allowlist, ten-minute timeout, a log of each block, and a weekly review.</li>
</ol>
<p>The decision, “yes, with these safeguards”, is a typical professional answer. Notice that it also acknowledges the limits: blocking is not a substitute for fixing the weak password.</p>
<div class="note"><b>Field note: the five-minute rule</b>Many teams like to start any new automatic action in “notify only” mode, and then spend a week looking at what it would have done. When the log of proposed actions looks right every day for a week, they switch it on. That one habit prevents most automation disasters.</div>
<h2>What to do in your lab</h2>
<p>In the SSH case file you set up an automatic block with an allowlist and a three-minute timeout. After the lesson, try these experiments to feel the risks. Remove your PC from the allowlist and see what happens when you make a typing mistake repeatedly. Change the timeout and see how that changes the experience. And write down, in your notebook, a short statement of when you would and would not enable such a response in a real company.</p>`,
takeaways:["Automation gives speed, scale and consistency, but a wrong action can cause outages or destroy evidence.","Climb the ladder: enrich, notify, suggest, then automate carefully for a short list of high-confidence cases.","Active Response ties a command to specific rules, locations and time limits.","Safeguards include allowlists, timeouts, approvals, rate limits, dry runs, audit trails and undo paths.","Start new automation in notify-only mode and review what it would have done before enabling it."],
quiz:[{q:"Why give every automatic block a timeout?",o:["Mistakes fix themselves","It speeds up the attack","It is required by SSH","It hides logs"],a:0},{q:"What does an allowlist do?",o:["Lists addresses that must never be blocked","Lists addresses to block first","Lists passwords","Lists rule IDs"],a:0},{q:"What is a good first step for new automation?",o:["Run it in notify-only mode and review","Enable it on everything","Disable logging","Delete the rule"],a:0}]},

{id:"r26",mod:"m9",title:"Your First 90 Days in a SOC",labs:[],
body:String.raw`<p class="lead">The day you start as a junior analyst, you will feel both excited and slightly lost. That is normal. This chapter describes what the first three months commonly look like, what teams expect of a newcomer, and how to become useful faster than you think.</p>
<h2>What nobody tells you about starting</h2>
<p>You will not be expected to know everything. Teams hire junior analysts for their potential: curiosity, a steady temperament, willingness to learn and the ability to communicate. Tools differ from company to company, so employers cannot expect you to know their exact setup. What they hope you bring is a foundation, which this academy aims to give you, and good habits.</p>
<p>Expect your first weeks to feel like drinking from a firehose. New names, new systems, new acronyms and a dozen tools, each with its own screen. Almost every analyst remembers this. It improves quickly.</p>
<h2>Days 1 to 30: learn the environment</h2>
<p>The first month is about orientation. A typical list of tasks looks like this.</p>
<ul>
<li><b>Get access.</b> Accounts for the SIEM, the ticketing system, the chat tools and the documentation. Delays are common, so ask early.</li>
<li><b>Read the documentation.</b> Playbooks, escalation lists, the shift handover template and the architecture overview.</li>
<li><b>Shadow experienced analysts.</b> Watch how they triage, and ask why they made each decision.</li>
<li><b>Learn the environment.</b> What are the crown jewels? What does normal traffic look like? Which servers are important? Who owns which systems?</li>
<li><b>Handle low-risk alerts under supervision.</b> A senior colleague reviews your tickets, and gives feedback.</li>
</ul>
<p>Your goal in the first month is not speed. It is accuracy and learning. Write down every acronym you do not know in a personal glossary, and every question you ask along with the answer. By the end of the month, that notebook will be one of your most valuable tools.</p>
<h2>Days 31 to 60: work independently on the routine</h2>
<p>By the second month, you start to take the queue yourself. You triage the common alert types alone, and escalate the unusual ones. This is the stage where confidence builds, and where mistakes happen. They are expected. The way you handle a mistake matters more than the mistake: say so early, explain what you learned, and what you will do differently.</p>
<p>During this period, you can usually begin to contribute improvements.</p>
<ul>
<li>Point out an alert type that is nearly always a false positive, with the numbers to support your claim.</li>
<li>Improve a playbook step that confused you, because you are now the person who remembers how confusing it was.</li>
<li>Write a short how-to for something you had to learn the hard way.</li>
</ul>
<p>These contributions are valued because they show initiative and teamwork. They also teach you the environment faster than anything else.</p>
<h2>Days 61 to 90: take ownership of something small</h2>
<p>In the third month, aim to own one small thing. It might be a weekly report, the tuning of one noisy rule, or a recurring check, such as reviewing new administrator accounts every Monday. Ownership shows reliability. It also gives you a project to talk about in later interviews and in your next performance review.</p>
<p>At the end of ninety days, you should be able to:</p>
<ol>
<li>Triage the common alert types alone, with sound reasoning written in the ticket.</li>
<li>Know when to escalate, and to whom.</li>
<li>Explain what is normal in the company’s environment.</li>
<li>Write clear incident notes and a short incident summary.</li>
<li>Describe one improvement you made.</li>
</ol>
<h2>Habits that make you better quickly</h2>
<ul>
<li><b>Keep a work journal.</b> Each day, three lines: what you handled, what you learned, what you still do not understand. Review it every Friday.</li>
<li><b>Ask good questions.</b> Before asking, spend ten minutes trying. When you ask, say what you tried and what you think the answer might be. Seniors appreciate this, because it shows effort and lets them correct your thinking quickly.</li>
<li><b>Write for the next person.</b> In every ticket, leave notes that someone else could follow without you.</li>
<li><b>Learn the business.</b> Know what the company sells and who its customers are. An alert makes more sense when you know why the system matters.</li>
<li><b>Practise outside work.</b> Keep your home lab alive, and replay new attack techniques that the team discusses.</li>
</ul>
<h2>Working with other teams</h2>
<p>A SOC does not work in isolation. You will contact system owners, network engineers, helpdesk staff, managers and sometimes legal and human resources staff. Each of them cares about something different. System owners care about uptime. Managers care about risk and cost. The helpdesk cares about users who are locked out.</p>
<p>The best analysts are patient communicators. They explain what happened without drama or jargon, they say what they need and by when, and they thank people who help. When a real incident arrives, the relationships built in quiet weeks decide how quickly others respond.</p>
<h2>Shifts, stress and staying healthy</h2>
<p>Many SOCs run around the clock. Night shifts disrupt sleep, and incident days can be intense. Look after yourself in ordinary ways.</p>
<ul>
<li>Protect your sleep, especially during rotating shifts. Ask how rotation is managed.</li>
<li>Take real breaks during long incidents. Tired people make careless mistakes.</li>
<li>Talk about hard days with colleagues. Everyone has had them.</li>
<li>Do not carry blame. Good teams review incidents to improve systems, not to find culprits.</li>
</ul>
<h2>Questions worth asking in your first weeks</h2>
<ol>
<li>What are the most important systems and data here?</li>
<li>What are the three most common alert types, and how do we handle them?</li>
<li>Who do I call, and how, at night?</li>
<li>Which of our detections do we trust most, and which least?</li>
<li>What does a good ticket look like? Can I see an example?</li>
<li>What would you like a new analyst to learn first?</li>
</ol>
<div class="note"><b>Field note: the unglamorous value</b>New analysts sometimes worry that they are not doing exciting work. Yet a junior analyst who reliably clears the queue, writes clear notes and flags issues early is enormously valuable. Many promotions go to the people who were dependable and curious, not to the ones who were flashy.</div>
<h2>How the academy prepares you</h2>
<p>Everything you do in the case files, a timeline, an evidence list, a containment plan and a written report, mirrors a task from your first ninety days. When you finish a case file, imagine that a manager has asked you for a summary before lunch. Practise writing that summary clearly. That small habit will be noticed on day one.</p>`,
takeaways:["Teams hire juniors for curiosity, temperament and communication; you are not expected to know every tool.","The first month is for learning the environment; the second is for independent routine work; the third is for owning one small thing.","Keep a work journal and a personal glossary, ask well-prepared questions, and write notes for the next person.","Good analysts communicate calmly with system owners, managers and other teams.","Protect your sleep and your health, and treat incident reviews as learning, not blame."],
quiz:[{q:"What is the main goal of your first month?",o:["Accuracy and learning the environment","Closing the most tickets","Rewriting all rules","Avoiding questions"],a:0},{q:"What makes a good question to a senior colleague?",o:["Saying what you tried and what you think","Asking before reading anything","Asking in a hurry with no detail","Never asking"],a:0},{q:"What is a good third-month goal?",o:["Own one small recurring task or improvement","Leave the team","Disable all alerts","Change the SIEM product"],a:0}]},

{id:"r27",mod:"m9",title:"Building a Portfolio and Preparing for Interviews",labs:[],
body:String.raw`<p class="lead">When employers cannot see years of experience, they look for evidence. A good portfolio is evidence that you can do the work, think clearly and communicate. This chapter shows you how to build one from the labs in this academy, and how to talk about it in an interview.</p>
<h2>What a hiring manager is really asking</h2>
<p>Behind every interview question, a manager is trying to answer a few simple things.</p>
<ol>
<li>Can this person learn quickly?</li>
<li>Do they understand the fundamentals, not only the buttons?</li>
<li>Can they explain things clearly?</li>
<li>Will they be reliable and calm?</li>
<li>Do they care about doing this work?</li>
</ol>
<p>A portfolio answers many of these before you say a word. Reading a clear incident report tells a manager more than a list of tool names ever could.</p>
<h2>What to put in your portfolio</h2>
<p>Choose quality over quantity. Three well-presented projects beat ten thin ones. Using this academy, you can produce a strong first set.</p>
<table><tr><th>Project</th><th>What it proves</th></tr>
<tr><td><b>Your lab design and build notes</b></td><td>You can build and document an environment, and troubleshoot it.</td></tr>
<tr><td><b>Case File #1 report: BrightMart file tampering</b></td><td>Detection with file integrity monitoring; investigation; reporting.</td></tr>
<tr><td><b>Case File #2 report: SSH intruder</b></td><td>Password attack detection; correlation rule; containment.</td></tr>
<tr><td><b>Custom rules with documentation</b></td><td>Detection engineering: you can write and explain a rule.</td></tr>
<tr><td><b>A coverage table</b></td><td>You think in terms of attacker techniques and gaps.</td></tr>
<tr><td><b>A short lessons-learned page</b></td><td>Honesty, reflection and growth.</td></tr></table>
<h2>How to present each project</h2>
<p>Every project should be easy to read in three minutes. Use this simple structure.</p>
<ul>
<li><b>Goal.</b> One sentence: what problem did you set out to solve?</li>
<li><b>Environment.</b> A small diagram and a list of machines and tools.</li>
<li><b>What I did.</b> Steps, in plain language, with a few key screenshots.</li>
<li><b>What I found.</b> Alerts, timelines and results.</li>
<li><b>What went wrong, and how I fixed it.</b> This is the part employers enjoy most, because it shows how you think.</li>
<li><b>What I would do next.</b> Show that you know the limits of your project.</li>
</ul>
<h3>Where to host it</h3>
<p>A free code-hosting account is the usual place. Create a repository for each project, with a clear title and a README file at the top. A simple structure is a folder for rules, a folder for screenshots, a folder for reports, and a short README that tells the story. Link the repositories from your CV and your professional profile.</p>
<h3>Protect yourself</h3>
<ul>
<li>Never upload real passwords, keys, internal documents, or anything about a real employer.</li>
<li>Blur or remove personal information in screenshots, including real addresses.</li>
<li>Do not claim experience you do not have. Say “home lab project”, not “production deployment”.</li>
</ul>
<h2>Your CV</h2>
<p>A junior CV should be one page and honest. A few suggestions follow.</p>
<ul>
<li>Open with a two-line summary of what you offer and what you want.</li>
<li>List <b>projects</b> early, with one or two bullet points each, starting with a verb and ending with a result: “Wrote a correlation rule that detects a successful SSH login after a brute-force attempt; validated it with a simulated attack.”</li>
<li>List tools, but only ones you can talk about. If a tool is on your CV, assume you will be asked about it.</li>
<li>Include relevant education and certifications, and any volunteer or practical experience.</li>
<li>Check spelling and consistency. Small errors stand out in security roles, where attention to detail matters.</li>
</ul>
<h2>Interviews: what to expect</h2>
<p>Junior SOC interviews often mix three kinds of questions.</p>
<h3>Concept questions</h3>
<p>Examples: What is the difference between a vulnerability, a threat and a risk? What happens when you type a website address into a browser? What is the difference between a true positive and a false positive? What is the CIA triad? Prepare short, clear answers, and give an example from your lab.</p>
<h3>Scenario questions</h3>
<p>Examples: “You see fifty failed logins followed by a success. What do you do?” “An employee reports a suspicious email. Walk me through your steps.” For these, use the method you learned: confirm what happened, assess scope, consider impact, contain, document, escalate if needed. Speak your thinking aloud, even if you are unsure of the answer. Interviewers want to see how you reason.</p>
<h3>Behavioural questions</h3>
<p>Examples: “Tell me about a time something did not work, and what you did.” “Describe a time you learned something quickly.” A good structure is <b>STAR</b>: describe the <b>situation</b>, the <b>task</b>, the <b>action</b> you took and the <b>result</b>. Your lab troubleshooting stories are perfect material. For example: “My Windows agent showed ‘never connected’. I tested the network ports, found the firewall on the server was blocking one of them, opened it, and the agent connected.”</p>
<h2>Practise out loud</h2>
<p>Many people know the answer but stumble when saying it. Practise explaining your projects to a friend who does not work in technology. If they understand, so will most interviewers. Record yourself once; it is uncomfortable and extremely useful.</p>
<h2>Questions to ask the interviewer</h2>
<ul>
<li>What does a typical day look like for an analyst on this team?</li>
<li>How do you support junior staff in their first months?</li>
<li>What tools and log sources do you use?</li>
<li>How do you handle shifts and on-call?</li>
<li>How do analysts grow here: which skills lead to promotion?</li>
</ul>
<p>Good questions show interest and help you judge whether the team is right for you.</p>
<h2>Handling a question you cannot answer</h2>
<p>Everyone meets one. Do not bluff. A calm, honest response works well: “I have not worked with that tool, but here is how I would approach it.” Then walk through how you would find out. Interviewers often respect this more than a confident wrong answer.</p>
<h2>Where to look and how to network</h2>
<p>Entry-level security roles can be competitive, so use several routes. Apply to job boards and company career pages. Join local and online security communities. Attend meetups and webinars. Contribute to open source projects, or write short blog posts about what you learn. Build professional relationships before you need them. A short, polite message to someone whose work you admire, asking one specific question, is often welcomed.</p>
<h2>Staying patient</h2>
<p>Job searches take time, and rejections are normal. Treat each interview as practice. After each one, write down what you were asked and how you could improve. Keep building projects while you wait, because each new project is another strong talking point.</p>
<div class="note"><b>Field note: the portfolio walk-through</b>Many hiring managers will ask you to walk them through a project. Prepare a two-minute version: the problem, what you built, one thing that went wrong, and what you learned. If you can tell that story calmly and clearly, you have already shown several of the skills the job needs.</div>`,
takeaways:["Employers want evidence that you can learn, understand fundamentals, communicate clearly and stay calm.","Build three to five well-presented projects from your labs: build notes, two case-file reports, documented rules and a coverage table.","Present each project with goal, environment, steps, findings, what went wrong and what you would do next.","Prepare for concept, scenario and behavioural questions, using the triage method and the STAR structure.","Be honest, practise out loud, protect private data, and keep building while you search."],
quiz:[{q:"What do employers enjoy seeing in a project write-up?",o:["What went wrong and how you fixed it","Only success screenshots","No explanation","A list of tool names"],a:0},{q:"What does STAR stand for in interviews?",o:["Situation, Task, Action, Result","Scan, Test, Alert, Respond","Security, Tools, Alerts, Reports","Start, Think, Answer, Review"],a:0},{q:"If you do not know an answer, you should…",o:["Say so honestly and explain how you would find out","Make something up","End the interview","Change the subject"],a:0}]},

{id:"r28",mod:"m9",title:"Certifications, Learning Paths and Staying Current",labs:[],
body:String.raw`<p class="lead">Security is a field that changes constantly. New attack techniques, new tools and new regulations arrive every month. The people who thrive are not those who know the most today, but those who keep learning in a sustainable way. This chapter gives you a map of the options and a plan for staying current without burning out.</p>
<h2>The role of certifications</h2>
<p>Certifications are exams or practical assessments that prove you have a body of knowledge. They are neither required nor sufficient. Some employers screen applicants by certification, especially for entry-level roles and in regulated industries. Others care mainly about practical skill. A good rule is: <b>use certifications to open doors, and projects to prove you can walk through them</b>.</p>
<h3>Choosing wisely</h3>
<p>Before paying for any exam, ask:</p>
<ol>
<li>Do job advertisements for the role I want mention it? Read twenty and count.</li>
<li>Does it cover skills I will actually use?</li>
<li>What does it cost in money and time, including renewal?</li>
<li>Is the exam knowledge-based or hands-on? Hands-on assessments tend to give stronger evidence, but are harder.</li>
</ol>
<h2>A map of common options</h2>
<p>Certification names and details change, so check each provider’s current information before you decide. The following groups are widely recognised for defensive roles.</p>
<table><tr><th>Stage</th><th>Typical options</th><th>What they cover</th></tr>
<tr><td><b>Foundations</b></td><td>Entry-level general security certificates; networking fundamentals certificates; operating-system fundamentals</td><td>Core concepts, vocabulary, basic controls</td></tr>
<tr><td><b>Defensive and SOC practice</b></td><td>Practical or exam-based analyst certificates from industry bodies and training companies</td><td>Triage, investigation, incident handling</td></tr>
<tr><td><b>Tool-specific</b></td><td>Vendor certificates for the SIEM or cloud platform your team uses (for example Splunk, Microsoft security, or cloud-provider security tracks)</td><td>Using a particular product well</td></tr>
<tr><td><b>Intermediate and advanced</b></td><td>Incident response, threat hunting, forensics, detection engineering</td><td>Depth in a specialty</td></tr>
<tr><td><b>Governance and management</b></td><td>Risk, audit and management certificates</td><td>Policy, compliance, leadership</td></tr></table>
<p>For a SOC career, a reasonable path is: a foundations certificate to show you know the basics, a practical defensive certificate to show analyst skills, and then a certificate for the SIEM or cloud your target employers use.</p>
<h2>Learning without certificates</h2>
<p>You can also learn through free and low-cost sources, and many employers value the evidence. Useful routes include:</p>
<ul>
<li><b>Hands-on training platforms</b> that provide browser-based labs for defence and investigation. Many offer free tiers.</li>
<li><b>Capture-the-flag competitions</b>, in which you solve security puzzles. Defensive versions exist too, often called blue team challenges.</li>
<li><b>Vendor documentation and training.</b> Wazuh, Microsoft, Splunk and cloud providers publish good documentation and free introductory courses.</li>
<li><b>Public attack catalogues.</b> MITRE ATT&CK pages, with their examples and mitigations, are a free education.</li>
<li><b>Public incident reports.</b> Security companies and agencies publish detailed write-ups of real intrusions. Reading one a week teaches you more than most courses.</li>
<li><b>Community.</b> Local meetups, online groups and mentoring programmes.</li>
</ul>
<h2>A sustainable learning routine</h2>
<p>It is easy to start with enthusiasm and stop after two weeks. A small routine you can keep is better than a heroic one you cannot.</p>
<table><tr><th>Frequency</th><th>Habit</th></tr>
<tr><td>Daily, 20 to 30 minutes</td><td>Read one article or report, or do one small lab step. Write two lines in your notebook.</td></tr>
<tr><td>Weekly, 2 to 3 hours</td><td>Do one longer lab or challenge. Update your portfolio with one improvement.</td></tr>
<tr><td>Monthly</td><td>Review what you learned. Rebuild a part of your lab from scratch to test your notes.</td></tr>
<tr><td>Every quarter</td><td>Choose a new focus: a new tool, technique or certificate. Retire something that no longer serves you.</td></tr></table>
<h2>Specialisations to consider</h2>
<p>After you have a foundation, security branches into many fields. You do not need to choose now, but knowing the options helps you notice what you enjoy.</p>
<ul>
<li><b>Detection engineering:</b> writing and tuning rules, testing against attacker techniques.</li>
<li><b>Threat hunting:</b> searching proactively for hidden attackers using hypotheses.</li>
<li><b>Incident response and digital forensics:</b> leading the response to serious attacks and examining evidence.</li>
<li><b>Threat intelligence:</b> studying attackers and turning knowledge into defence.</li>
<li><b>Cloud security:</b> securing and monitoring cloud accounts and services.</li>
<li><b>Security engineering and automation:</b> building the pipelines and tools that the SOC uses.</li>
<li><b>Governance, risk and compliance:</b> policies, audits and standards. A good path for people who enjoy structure and communication.</li>
<li><b>Application security:</b> finding and fixing weaknesses in software.</li>
</ul>
<p>A beneficial way to explore is to spend a month on each, with one small project. Pay attention to which tasks make you forget the time.</p>
<h2>Staying current without drowning</h2>
<p>The volume of security news is overwhelming. Nobody can follow everything. Pick a few quality sources: one or two newsletters, a couple of blogs from trusted researchers, and the advisories published by national cybersecurity agencies. Check them at set times, not all day. When something major appears, such as a widely exploited vulnerability, read a clear explanation, then ask the questions from the vulnerability chapter: do we run it, is it exposed, is it being exploited?</p>
<p>Most “breaking” stories are variations on old themes: stolen passwords, phishing, misconfiguration, unpatched systems. If you understand the fundamentals, new events fit into frameworks you already know.</p>
<h2>Teaching what you learn</h2>
<p>One of the best ways to learn is to teach. Write a short article about a lab you completed. Explain an alert type to a friend. Present a case file to a study group. Teaching exposes gaps in understanding faster than anything else, and it builds your reputation.</p>
<h2>Ethics and professional conduct</h2>
<p>As you grow, you will gain powerful skills, and the field relies on trust. Keep to a few principles throughout your career.</p>
<ul>
<li>Test only with permission, and stay within the agreed scope.</li>
<li>Protect confidential information you encounter, even when it is tempting to share.</li>
<li>Report weaknesses responsibly.</li>
<li>Be honest about your skills and about mistakes.</li>
<li>Support colleagues, and treat users as partners, not as problems.</li>
</ul>
<div class="note"><b>Field note: nobody knows everything</b>Experienced analysts regularly say “I do not know, let me find out”. The skill that matters is not memorised facts, but knowing how to learn, how to search for answers, and how to check them. If you build those habits now, every new tool and technique becomes easier to master.</div>
<h2>Your next steps after this academy</h2>
<ol>
<li>Finish the remaining modules and complete both case files with reports.</li>
<li>Publish your portfolio with clear write-ups.</li>
<li>Choose a foundations certificate if your target employers expect it.</li>
<li>Practise on a hands-on platform for at least an hour a week.</li>
<li>Join a community and introduce yourself.</li>
<li>Apply, even before you feel ready, and learn from each response.</li>
</ol>
<p>The path is long but well lit. You have the structure, the lab and the habits. Keep going steadily, and the skills will compound.</p>`,
takeaways:["Certifications can open doors, but projects prove you can do the work; choose them by checking real job adverts.","A reasonable path is foundations, then a practical defensive certificate, then a tool-specific one.","Free routes include hands-on platforms, challenges, documentation, ATT&CK, public incident reports and community.","Keep a small, sustainable weekly learning routine and review monthly.","Explore specialisations one at a time and stay ethical and honest throughout your career."],
quiz:[{q:"A good use of certifications is to…",o:["Open doors, with projects proving your skill","Replace all practice","Avoid learning","Skip interviews"],a:0},{q:"How should you choose a certification?",o:["Check job adverts, content, cost and renewal","Pick the most expensive","Pick a random one","Pick the oldest"],a:0},{q:"What helps you learn fast?",o:["Teaching what you learn","Avoiding practice","Reading nothing","Memorising only"],a:0}]},

{id:"r29",mod:"m2",title:"Active Directory in Plain Language",labs:["2-4"],
body:String.raw`<p class="lead">Almost every medium and large company that runs Windows also runs Active Directory. If you work in a SOC, a large share of your investigations will pass through it, because it decides who can log in to what. You do not need to administer it, but you need to understand its shape well enough to read the alerts it produces.</p>
<h2>The problem Active Directory solves</h2>
<p>Imagine a company with five hundred employees and five hundred laptops. Without a central system, every laptop would keep its own list of users and passwords. A new employee would need an account created on each machine they use, and a leaver’s accounts would have to be deleted five hundred times. Nobody could change a security setting for everyone at once.</p>
<p>Active Directory, usually shortened to <b>AD</b>, is Microsoft’s answer. It is a central database of the company’s identities and computers, together with services that check passwords, grant access and push settings to every machine. Employees log in once with one account, and every computer that has joined the company’s <b>domain</b> trusts the answer.</p>
<h2>The cast of characters</h2>
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Domain</b></td><td>A group of users and computers managed together, with a name such as <code>brightmart.local</code>.</td></tr>
<tr><td><b>Domain controller (DC)</b></td><td>A server that holds the directory and answers login requests. Companies run at least two for safety.</td></tr>
<tr><td><b>Object</b></td><td>Any entry in the directory: a user, a group, a computer, a printer.</td></tr>
<tr><td><b>Organisational unit (OU)</b></td><td>A folder in the directory, used to organise objects and to apply settings to a chosen set of them.</td></tr>
<tr><td><b>Group</b></td><td>A list of members, used to grant access. Giving a group access is easier than giving it to each person.</td></tr>
<tr><td><b>Group Policy Object (GPO)</b></td><td>A bundle of settings that Windows computers download and apply, for example password rules, audit settings and software restrictions.</td></tr>
<tr><td><b>Forest and trust</b></td><td>A forest is one or more domains that belong together. Trusts let users in one domain use resources in another.</td></tr></table>
<h2>What happens when someone logs in</h2>
<p>When an employee types a password on a company laptop, the laptop does not check it by itself. It asks a domain controller. The most common protocol is <b>Kerberos</b>, which works a little like a theatre ticket system.</p>
<ol>
<li>The laptop proves the user’s identity to the domain controller and receives a <b>ticket-granting ticket</b>, a sort of day pass. The event on the domain controller is <b>4768</b>.</li>
<li>When the user wants to use a particular service, such as a file share, the laptop shows the day pass and asks for a <b>service ticket</b> for that service. The event is <b>4769</b>.</li>
<li>The laptop shows the service ticket to the file server, which lets the user in. The file server records a logon, event 4624.</li>
</ol>
<p>A failed first step shows up as event <b>4771</b> (Kerberos pre-authentication failed) or, for the older protocol <b>NTLM</b>, as <b>4776</b>. When the user has typed a wrong password too many times, the account is locked, and the domain controller records <b>4740</b>.</p>
<h2>Why attackers love Active Directory</h2>
<p>Because AD controls access to everything, an attacker who takes over a powerful account can reach nearly everything. For this reason, attackers follow a familiar route: steal an ordinary account, look for ways to become more powerful, and eventually aim for membership of the <b>Domain Admins</b> group or control of a domain controller.</p>
<table><tr><th>Technique</th><th>In plain words</th><th>What defenders watch</th></tr>
<tr><td><b>Password spraying</b></td><td>Try one common password on every account.</td><td>Many 4771 or 4625 events across many accounts from one source</td></tr>
<tr><td><b>Kerberoasting</b></td><td>Request service tickets for service accounts, then crack their passwords offline.</td><td>Unusual volumes of 4769 events from one user, especially for older ticket encryption types</td></tr>
<tr><td><b>Pass-the-hash</b></td><td>Use a stolen password fingerprint to log in without knowing the password.</td><td>Network logons (type 3) with unusual accounts or sources</td></tr>
<tr><td><b>DCSync</b></td><td>Pretend to be a domain controller to ask for all password data.</td><td>Directory replication requests from machines that are not domain controllers</td></tr>
<tr><td><b>Golden ticket</b></td><td>Forge login tickets after stealing a special account’s secret.</td><td>Ticket use that does not match normal login events</td></tr>
<tr><td><b>Adding to powerful groups</b></td><td>Make an ordinary account a Domain Admin.</td><td>Events 4728, 4732 and 4756</td></tr></table>
<p>You will meet these names again in later modules. For now, notice that most of them become visible as unusual patterns of ordinary events on the domain controllers. This is why domain controllers are the most important servers to monitor in a company, and why their logs are sent to the SIEM first.</p>
<h2>Events every analyst learns for AD</h2>
<table><tr><th>Event ID</th><th>Meaning</th></tr>
<tr><td>4768</td><td>A Kerberos ticket-granting ticket was requested</td></tr>
<tr><td>4769</td><td>A Kerberos service ticket was requested</td></tr>
<tr><td>4771</td><td>Kerberos pre-authentication failed (often a wrong password)</td></tr>
<tr><td>4776</td><td>The domain controller tried to validate an NTLM login</td></tr>
<tr><td>4740</td><td>An account was locked out</td></tr>
<tr><td>4720, 4722, 4724</td><td>An account was created, enabled, or had its password reset</td></tr>
<tr><td>4728, 4732, 4756</td><td>A member was added to a global, local or universal group</td></tr>
