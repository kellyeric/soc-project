<tr><td>4662</td><td>An operation was performed on a directory object (needs auditing enabled)</td></tr>
<tr><td>5136</td><td>A directory object was modified (needs auditing enabled)</td></tr></table>
<h2>Defences that matter</h2>
<ul>
<li><b>Least privilege.</b> Few people should be Domain Admins, and they should use those accounts only for administration, never for reading email.</li>
<li><b>Tiering.</b> Separate accounts for administering domain controllers, servers and workstations, so that a stolen workstation login cannot lead directly to the keys of the kingdom.</li>
<li><b>Unique local administrator passwords.</b> Tools such as Microsoft’s LAPS give each computer a different local administrator password, which stops one stolen password from opening every machine.</li>
<li><b>Strong passwords for service accounts</b>, or better, managed service accounts that rotate automatically.</li>
<li><b>Multi-factor authentication</b> for administrators and remote access.</li>
<li><b>Auditing and monitoring</b> of the events above, forwarded to the SIEM.</li>
<li><b>Patching domain controllers</b> promptly, and keeping them off the internet.</li>
</ul>
<h2>Group Policy and logging</h2>
<p>Group Policy is how companies apply the audit settings from the logging chapter to every computer at once. A security team will often work with the Windows administrators to create a policy that enables process creation logging, PowerShell logging and the audit subcategories, and applies it to all servers and workstations. A mistake in a policy can silently disable auditing everywhere, which is why changes are reviewed and why audit policy changes (event 4719) are themselves monitored.</p>
<div class="note"><b>Field note: the Friday-night change</b>A new analyst once noticed a sudden drop in logon events from one office. The cause was not an attack: a well-meaning administrator had edited a policy and accidentally removed the audit settings for that location. The silence was found only because the analyst checked whether log volume per site looked normal. Watching the health of your data is as important as watching its content.</div>
<h2>How your lab relates to this</h2>
<p>Your lab does not include a domain controller, so the Windows VM uses local accounts. The ideas still map across. The local Administrators group of <code>win-victim</code> is a miniature of Domain Admins. A failed logon on the VM is a smaller version of events 4771 and 4776. And when you read about Kerberoasting or pass-the-hash in the future, you will be able to picture where the logs come from. A later module adds a small domain controller to the lab so that you can attack and monitor these events yourself.</p>`,
takeaways:["Active Directory is the central database of identities, computers and settings that most companies use for Windows.","Kerberos login events on domain controllers (4768, 4769, 4771) and NTLM events (4776) show how people authenticate.","Attackers aim to take over powerful accounts, and most AD attacks appear as unusual patterns of ordinary events.","Key defences are least privilege, tiering, unique local admin passwords, MFA, patching and monitoring.","Domain controllers are the most important servers to monitor, and audit policy is applied with Group Policy."],
quiz:[{q:"What does a domain controller do?",o:["Holds the directory and answers login requests","Prints documents","Blocks email","Stores backups only"],a:0},{q:"Event 4740 means…",o:["An account was locked out","A user logged off","A file was deleted","A service started"],a:0},{q:"Why is spraying hard to spot per account?",o:["Each account sees only one or two failures","It uses no passwords","It is encrypted","It only happens at night"],a:0}]},

{id:"r30",mod:"m4",title:"Cloud Logging for Beginners",labs:["4-4"],
body:String.raw`<p class="lead">More and more of what companies run lives in the cloud. When you apply for a SOC job, you will almost certainly be asked how you would monitor it. This chapter explains the ideas in plain words, names the logs that matter in each of the big platforms, and lists the first detections most teams build.</p>
<h2>What “the cloud” really is</h2>
<p>A cloud provider, such as Amazon Web Services, Microsoft Azure or Google Cloud, owns huge data centres and rents out pieces of them. You can create a virtual machine, a database or a storage space in minutes, using a website or a command. Everything is controlled through <b>programming interfaces</b> (APIs), and every action on those interfaces can be recorded.</p>
<p>This is both the danger and the opportunity. The danger is that one set of stolen credentials can create or delete a great deal, quickly. The opportunity is that every action, from creating a server to changing a permission, leaves a log entry with the account that did it.</p>
<h2>The shared responsibility model</h2>
<p>A principle you will hear in every cloud discussion is <b>shared responsibility</b>. The provider is responsible for the security <i>of</i> the cloud: the buildings, the hardware and the core services. The customer is responsible for security <i>in</i> the cloud: who has access, how services are configured, which data is public, and whether logging is turned on. Most cloud breaches are not caused by the provider’s failure but by a customer’s misconfiguration or stolen credentials.</p>
<h2>Identity is the new perimeter</h2>
<p>In a traditional office, a firewall guarded the building’s edge. In the cloud, there is no single edge. Anyone with valid credentials and an internet connection can reach the control interfaces. So the main question is always: <b>who is this account, and should it be doing this?</b> That is why identity logs are the first thing most cloud monitoring programmes collect.</p>
<h2>The main log types</h2>
<table><tr><th>Provider</th><th>Control-plane (who did what)</th><th>Sign-ins</th><th>Network</th><th>Alerts from the provider</th></tr>
<tr><td><b>AWS</b></td><td>CloudTrail records API calls</td><td>CloudTrail records console sign-ins</td><td>VPC Flow Logs</td><td>GuardDuty findings</td></tr>
<tr><td><b>Azure and Microsoft 365</b></td><td>Azure Activity Log; Entra ID audit logs</td><td>Entra ID sign-in logs</td><td>Network security group flow logs</td><td>Microsoft Defender for Cloud and Entra ID Protection</td></tr>
<tr><td><b>Google Cloud</b></td><td>Cloud Audit Logs</td><td>Workspace or Cloud Identity logs</td><td>VPC Flow Logs</td><td>Security Command Center</td></tr></table>
<p>The names differ, but the structure is the same: a log of administrative actions, a log of sign-ins, network logs, and findings produced by the provider’s own detection services. Wazuh and other SIEMs can collect from several of these sources through built-in modules and integrations.</p>
<h2>What a cloud log entry looks like</h2>
<p>Cloud logs are usually structured text in a format called JSON. A simplified example of a record that says someone created an access key might read:</p>
<pre>{
  "eventTime": "2026-11-02T03:12:44Z",
  "eventName": "CreateAccessKey",
  "userIdentity": { "type": "IAMUser", "userName": "bola" },
  "sourceIPAddress": "203.0.113.50",
  "awsRegion": "eu-west-1",
  "requestParameters": { "userName": "bola" }
}</pre>
<p>Notice that it answers the familiar investigation questions: when, who, what, from where. A defender reading it would ask: is this user supposed to create keys? Is that address one of ours? Is that region one we normally use? Is the time normal?</p>
<h2>The first detections most teams build</h2>
<ol>
<li><b>Use of the root or global administrator account.</b> These should almost never be used day to day. Any use deserves a look.</li>
<li><b>Sign-in without multi-factor authentication</b>, or the removal of MFA from an account.</li>
<li><b>Sign-ins from unusual places</b>, or two sign-ins from far-apart locations in a short time, sometimes called impossible travel.</li>
<li><b>New access keys or credentials</b> created for an account, particularly for powerful ones.</li>
<li><b>Changes to permissions</b>: new administrator policies, new roles assumed, accounts added to powerful groups.</li>
<li><b>Logging being switched off or changed</b>: stopping the audit trail is a classic defence-evasion move.</li>
<li><b>Public exposure</b>: a storage bucket or database made open to the internet.</li>
<li><b>Unusual resource creation</b>: a sudden burst of virtual machines in a region the company never uses, which often means cryptocurrency mining.</li>
<li><b>Large data transfers out</b> from storage or databases.</li>
</ol>
<h2>A short story</h2>
<p>A software start-up stored its application’s keys in a code repository by mistake. Within hours, an automated scanner found them. At three in the morning the attacker used the keys to launch dozens of powerful virtual machines in a distant region and began mining cryptocurrency. The company’s alerts for “new virtual machines in an unused region” and “unusual spending” fired at 03:40. A SOC analyst disabled the key, shut the machines down and, in the morning, helped the developers rotate every secret in the repository. The bill was large but limited.</p>
<p>Three small controls limited the harm: detection of an odd region, a spending alert, and a team that knew how to disable a key quickly. None needed advanced technology.</p>
<h2>Common cloud mistakes defenders look for</h2>
<ul>
<li>Long-lived access keys that never expire and live in code or on laptops.</li>
<li>Roles and policies that grant “everything” because it was faster to set up.</li>
<li>Storage that is public by accident.</li>
<li>Management consoles open to the whole internet.</li>
<li>No MFA on powerful accounts.</li>
<li>Audit logging disabled in some regions or accounts, leaving blind spots.</li>
</ul>
<h2>Costs and volume</h2>
<p>Cloud logs can be huge, and storing them costs money. Teams usually keep control-plane and sign-in logs for a long time, because they are relatively small and extremely useful. They are more selective with high-volume network logs, perhaps keeping them for a shorter period or sampling them. As in all logging, the aim is to decide on purpose.</p>
<div class="note"><b>Field note: ask “what can this key do?”</b>When an investigation involves a stolen cloud credential, the first question is not “how did it leak?” but “what can it do?”. The answer, which depends on the permissions attached, tells you the maximum damage and decides how urgently to respond. Know how to look up those permissions quickly, before the incident.</div>
<h2>How to practise without a cloud bill</h2>
<p>Major providers offer free tiers and free trial credits, and many hands-on training platforms offer cloud security labs in a browser. A safe starter exercise is to create a new account with a spending alert, turn on audit logging, create and delete a test user, and then find those events in the log. Doing this once teaches you more than reading a dozen articles. Remember the rule from the ethics lesson: only test in accounts you own.</p>
<h2>Where this fits in the academy</h2>
<p>Your lab uses virtual machines on your own computer, but every skill transfers. A user is a user. A log is a log. A rule that looks for a successful login after many failures works on a cloud sign-in feed in the same way as it works on SSH. In a later module you will connect a cloud log source to the SIEM and write the first detections from the list above.</p>`,
takeaways:["Cloud providers record every action on their interfaces, so identity and control-plane logs are the starting point.","Shared responsibility: the provider secures the cloud, the customer secures what they put in it.","Each platform offers audit logs, sign-in logs, network logs and its own findings.","First detections include root use, missing MFA, unusual locations, new keys, permission changes, disabled logging, public exposure and unusual resource creation.","When a credential is stolen, ask what it can do, so you know the maximum damage and how fast to act."],
quiz:[{q:"What does shared responsibility mean?",o:["The provider secures the cloud; you secure what you configure in it","The provider does everything","You do everything","Nobody is responsible"],a:0},{q:"Which is a first cloud detection?",o:["Use of the root or global administrator account","A user opens a document","The sun rising","A printer jam"],a:0},{q:"Why is switching off audit logging suspicious?",o:["Attackers do it to hide their actions","It saves money for everyone","It is required","It speeds up the cloud"],a:0}]},

{id:"r31",mod:"m2",title:"Reading Network Traffic: Packets, Flows and What a Capture Shows",labs:["2-3"],
body:String.raw`<p class="lead">Logs tell you what a computer says about itself. Network traffic tells you what actually passed between computers, whatever they claim. Defenders use both, and a beginner who can read a simple packet capture gains a useful superpower. This chapter shows you how, using only the lab you already have.</p>
<h2>What is a packet?</h2>
<p>Data does not travel across a network as one big stream. It is cut into small pieces called <b>packets</b>. Each packet carries a few lines of addressing information, called a <b>header</b>, followed by a piece of the actual data. Think of letters: an envelope with an address, and a page inside.</p>
<p>A packet header typically includes the source address and port, the destination address and port, the protocol such as TCP or UDP, and, for TCP, flags and numbers that keep the conversation in order. When encryption is used, the data inside is unreadable to an observer, but the envelope is still visible. This is why so much detection depends on the envelope alone.</p>
<h2>Packet capture and flow records</h2>
<p>Defenders look at network activity in two main ways.</p>
<table><tr><th>Approach</th><th>What it records</th><th>Strengths</th><th>Weaknesses</th></tr>
<tr><td><b>Full packet capture</b></td><td>Every packet, headers and data</td><td>Complete detail; you can reconstruct a conversation</td><td>Huge storage; encrypted data stays unreadable</td></tr>
<tr><td><b>Flow records</b></td><td>A summary per conversation: who, to whom, ports, bytes, time</td><td>Small, cheap, kept for months</td><td>No content; less detail</td></tr></table>
<p>Many companies keep flow records widely and capture full packets only on request or at special locations. Tools that turn traffic into richer logs, such as Zeek and Suricata, are common additions to a SOC. You will meet them later.</p>
<h2>Tools: tcpdump and Wireshark</h2>
<p><b>tcpdump</b> is a command-line capture tool found on nearly every Linux server. <b>Wireshark</b> is a graphical program that reads captures and shows them in colour with powerful filters. A common workflow is to capture on a server with tcpdump, save to a file, and open the file in Wireshark on your own computer.</p>
<h2>Try it: capture an SSH login in your lab</h2>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> Start a capture on the lab network card. It will stop after 25 packets:
<pre>sudo tcpdump -i enp0s8 -nn -c 25 port 22</pre>
(<code>-i</code> chooses the card, <code>-nn</code> shows numbers instead of names, <code>-c 25</code> stops after 25 packets, <code>port 22</code> shows only SSH.)</li>
<li><span class="vm k">KALI</span> Connect to the server, then leave:
<pre>ssh labuser@192.168.56.10</pre>
Type the password and then <code>exit</code>.</li>
<li>Read the output on Ubuntu. Each line shows a time, the sender, the receiver and some flags.</li></ol>
<p>You will see a pattern like this, simplified:</p>
<pre>192.168.56.50.51234 &gt; 192.168.56.10.22: Flags [S]    (Kali says: let us connect)
192.168.56.10.22 &gt; 192.168.56.50.51234: Flags [S.]   (Server says: agreed)
192.168.56.50.51234 &gt; 192.168.56.10.22: Flags [.]    (Kali says: confirmed)
... then many packets with [P.] carrying encrypted login data ...</pre>
<p>These first three lines are the <b>TCP handshake</b>: SYN, SYN-ACK, ACK. Every TCP connection begins with them. Learning to spot a handshake is the first step to reading any capture.</p>
<h3>Saving and opening a capture</h3>
<pre>sudo tcpdump -i enp0s8 -nn -w ssh-test.pcap port 22</pre>
<p>This writes a file called <code>ssh-test.pcap</code>. Stop it with <code>Ctrl+C</code> after your test. Copy the file to your own computer with <code>scp socadmin@192.168.56.10:ssh-test.pcap .</code> and open it in Wireshark.</p>
<h2>Useful Wireshark filters</h2>
<table><tr><th>Filter</th><th>Shows</th></tr>
<tr><td><code>ip.addr == 192.168.56.50</code></td><td>Everything to or from the attacker</td></tr>
<tr><td><code>tcp.port == 22</code></td><td>SSH traffic</td></tr>
<tr><td><code>dns</code></td><td>Name lookups and answers</td></tr>
<tr><td><code>http</code></td><td>Unencrypted web traffic</td></tr>
<tr><td><code>tcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0</code></td><td>Connection attempts (the first step of a handshake)</td></tr>
<tr><td><code>tls.handshake</code></td><td>The start of encrypted web sessions</td></tr></table>
<h2>What a scan looks like on the wire</h2>
<p>Run a scan from Kali while capturing on Ubuntu.</p>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> <pre>sudo tcpdump -i enp0s8 -nn -c 60 'tcp[tcpflags] &amp; tcp-syn != 0 and src host 192.168.56.50'</pre></li>
<li><span class="vm k">KALI</span> <pre>nmap -p 1-30 192.168.56.10</pre></li></ol>
<p>You will see one source address sending connection attempts to many different ports in a fraction of a second. Closed ports answer with a reset, and open ones with a handshake reply. This is how security tools recognise a scan: <b>one source, many destination ports, very quickly</b>. It also reminds you why Wazuh, which reads logs on computers, did not alert on the scan: closed ports write no logs. A network sensor would see it.</p>
<h2>Patterns defenders look for in traffic</h2>
<table><tr><th>Pattern</th><th>Possible meaning</th></tr>
<tr><td>One source, many ports</td><td>Port scan</td></tr>
<tr><td>One source, one port, many hosts</td><td>Sweep for a specific service, often before an exploit</td></tr>
<tr><td>Regular outbound connections at fixed intervals</td><td>Beaconing: malware checking in with its controller</td></tr>
<tr><td>Very large outbound transfer</td><td>Data theft or backups; check which</td></tr>
<tr><td>Many short DNS lookups of random-looking names</td><td>Malware looking for its controller, or data hidden in DNS</td></tr>
<tr><td>Connections on unusual ports from servers</td><td>A new service, a tunnel or a backdoor</td></tr>
<tr><td>Internal machines talking to each other that never normally do</td><td>Lateral movement</td></tr></table>
<h2>Beaconing in more detail</h2>
<p>Much malware “phones home” at regular intervals, for example every sixty seconds, to ask for instructions. In flow data, this looks like many small connections from one computer to one destination at near-identical gaps. Attackers sometimes add random delay, called jitter, to blur the pattern, but the connections still repeat for hours. A simple chart of connection times per destination often shows a beacon plainly.</p>
<h2>Encryption, and what you can still know</h2>
<p>With encrypted traffic you cannot read the content, but you can still see the destination address, the destination name in many cases (it is sent in the opening of the connection), the amount of data, and the timing. A laptop that sends two gigabytes to an unfamiliar cloud storage address at midnight is worth a conversation, whatever was inside.</p>
<div class="note"><b>Field note: do not capture what you are not allowed to</b>Packet captures can contain passwords, personal messages and private data. In a company you capture only with authorisation, store the files securely, and delete them when the investigation ends. In your lab you may capture freely, because the traffic is yours.</div>
<h2>A habit to build</h2>
<p>Whenever you do something in the lab, from a ping to an SSH login to an Nmap scan, run a short capture and look at it. Within a few weeks, the handshake, the reset and the retransmission will look familiar, and you will have a feel for how a network behaves that no diagram can give.</p>`,
takeaways:["Data travels in packets with headers that show addresses, ports and protocol, even when the data is encrypted.","Full packet capture gives detail; flow records are cheaper summaries kept for longer.","tcpdump captures on servers and Wireshark reads captures; a TCP connection begins with SYN, SYN-ACK, ACK.","A scan appears as one source touching many ports quickly; beaconing appears as regular connections to one destination.","Encrypted traffic still reveals destination, size and timing, so metadata supports detection."],
quiz:[{q:"What is the TCP handshake?",o:["SYN, SYN-ACK, ACK","A password check","A DNS lookup","A firewall rule"],a:0},{q:"How does a port scan look on the wire?",o:["One source sends attempts to many ports quickly","One source, one port, once","Only DNS traffic","Nothing at all"],a:0},{q:"What is beaconing?",o:["Malware connecting at regular intervals to its controller","A type of firewall","A Wi-Fi signal","A DNS server"],a:0}]},

{id:"r32",mod:"m6",title:"A Worked Investigation, Step by Step",labs:["6-3","6-6"],
body:String.raw`<p class="lead">Methods are easier to learn when you can watch one in action. This chapter follows a composite analyst through a complete investigation, from the first alert to the final report. Read it with your notebook open and try to predict each step before you read it.</p>
<div class="note"><b>A note on this story</b>The incident is invented, built from the lab scenarios in this academy and patterns that responders commonly describe. The names and times are fictional.</div>
<h2>03:12: the alert</h2>
<p>Ngozi is on the night shift at BrightMart’s outsourced SOC. At 03:12 UTC a level 13 alert appears in the queue:</p>
<pre>Rule 100100 (level 13): SSH login success shortly after brute force from the same IP: likely compromised account
Agent: wazuh-server   Source IP: 192.168.56.50   User: labuser</pre>
<p>Her first move is not to run to the server. It is to open the ticket, write the time she started, and ask the seven questions.</p>
<h2>Question 1: what exactly happened?</h2>
<p>Ngozi opens the alert’s underlying events. The correlation rule fired because two earlier rules had matched: a brute-force alert, then a successful login, both from the same address. She reads the full log lines to be sure the rule is describing reality:</p>
<pre>Nov  2 03:10:41 wazuh-server sshd[2210]: Failed password for labuser from 192.168.56.50 port 40122 ssh2
...(nine more failures, one every second or so)...
Nov  2 03:10:52 wazuh-server sshd[2231]: Accepted password for labuser from 192.168.56.50 port 40142 ssh2</pre>
<p>Ten failures in about eleven seconds, then a success. Nothing about the rule description contradicts the raw data.</p>
<h2>Question 2: who or what is involved?</h2>
<p>She notes: account <code>labuser</code>, server <code>wazuh-server</code>, source <code>192.168.56.50</code>. She checks the asset list. The server is classed as important because it runs the monitoring system. The account <code>labuser</code> is a standard account with no administrator rights. The address is not on the list of known administrator addresses.</p>
<h2>Question 3: when, and what happened around it?</h2>
<p>She searches for everything from that address in the last 24 hours. The earliest event is an Nmap-style burst of connection attempts at 03:09, then the failures at 03:10, then the success. Before 03:09, nothing. She also searches all events for <code>labuser</code> in the last week. Normal logins for that account come from a different address and occur in business hours.</p>
<table><tr><th>Time (UTC)</th><th>Event</th><th>Source</th></tr>
<tr><td>03:09</td><td>Burst of connections to many ports</td><td>Firewall logs (via search)</td></tr>
<tr><td>03:10:41 to 03:10:51</td><td>10 failed SSH logins for labuser</td><td>auth.log, rule 5760, 5763</td></tr>
<tr><td>03:10:52</td><td>Successful SSH login for labuser</td><td>auth.log, rule 5715</td></tr>
<tr><td>03:12</td><td>Correlation alert 100100 fires</td><td>Wazuh</td></tr></table>
<h2>Question 4: is it normal?</h2>
<p>Ngozi considers the harmless explanations. Could the real labuser have mistyped the password ten times in eleven seconds from a new address at 3 a.m.? Almost certainly not: the speed suggests a tool. Could this be an authorised penetration test? She checks the testing calendar, and there is nothing scheduled. She writes, “No benign explanation found; speed and timing consistent with automated guessing.”</p>
<h2>Question 5: what else is connected?</h2>
<p>She searches for the same source address in the logs of the other machines, and for any other login by labuser. The Windows agent shows no events from that address. No other accounts were targeted. This suggests a single, focused attempt, not a broad campaign.</p>
<p>She then asks what the attacker did after the login. She checks the session on the server:</p>
<pre>$ last -n 3
labuser  pts/1  192.168.56.50  Tue Nov  2 03:10   still logged in
$ ps -u labuser -o pid,etime,cmd
 2240   01:52  -bash
 2255   00:41  cat /etc/passwd</pre>
<p>The session is still open, and the attacker has run a file-reading command.</p>
<h2>Question 6: how bad could it be?</h2>
<p>The account is standard, but the server holds the monitoring system, and the attacker is inside. A standard account may still read many files and might find ways to climb to root. The attacker’s actions so far are consistent with discovery. The potential impact is high and the attacker is active right now. Ngozi decides this is a <b>true positive that needs immediate containment and escalation</b>.</p>
<h2>Question 7: what should be done, and by whom?</h2>
<p>The playbook for a compromised account says: contain, scope, then eradicate. Because the session is live, Ngozi acts first and calls second, but writes down every action as she takes it.</p>
<ol>
<li><b>03:19</b>: Calls the on-call Tier 2 analyst, Tunde, and tells him: “Probable compromise of labuser on wazuh-server, session active, source 192.168.56.50, no evidence of privilege escalation yet.”</li>
<li><b>03:21</b>: With Tunde’s agreement, locks the account and ends the session:
<pre>sudo passwd -l labuser
sudo pkill -KILL -u labuser</pre></li>
<li><b>03:22</b>: Confirms the session has ended with <code>who</code> and checks that a new login with the old password now fails.</li>
<li><b>03:24</b>: Asks the network team to block the source address at the firewall. She does not do this herself because it is a change on a shared device and needs their approval.</li></ol>
<h2>Scoping: what did they touch?</h2>
<p>Tunde takes over the investigation while Ngozi continues to write notes. He checks the usual hiding places:</p>
<pre>sudo ls -la /home/labuser/.ssh        # any new keys?
sudo crontab -l -u labuser            # any scheduled jobs?
sudo find / -user labuser -newermt "2026-11-02 03:00" 2&gt;/dev/null   # files created or changed
sudo grep labuser /var/log/auth.log | grep -i sudo                   # any sudo attempts?</pre>
<p>The results: no keys, no cron jobs, no new files, no sudo attempts. The only commands recorded in the process list were <code>whoami</code>, <code>id</code>, <code>ls</code> and <code>cat /etc/passwd</code>. The attacker was caught early in the discovery stage.</p>
<h2>Eradication and recovery</h2>
<ul>
<li>Reset the labuser password to a long random one, and require it to be changed at next login.</li>
<li>Review whether the account needs to exist at all. In this case it is a test account, so it is removed after the investigation closes.</li>
<li>Check the server’s remaining accounts for weak passwords.</li>
<li>Switch SSH to key-based login only and restrict it to known addresses.</li>
</ul>
<h2>Root cause</h2>
<p>The investigation concluded that a short, guessable password on an internet-reachable service allowed the attacker to log in after fewer than a dozen attempts. Password authentication was enabled, and no lockout or rate limit existed.</p>
<h2>The report (excerpt)</h2>
<p><b>Summary.</b> At 03:10 UTC on 2 November, an external address guessed the password of the account labuser on the server wazuh-server and logged in. The session lasted about eleven minutes. The attacker ran four read-only commands. No data was changed and no persistence was found. The account was locked and the session ended at 03:21. The address was blocked at 03:40.</p>
<p><b>Detection.</b> The correlation rule 100100 detected a successful login after a brute-force pattern from the same address and raised a level 13 alert within two minutes of the login.</p>
<p><b>Recommendations.</b> Disable password logins for SSH and use keys; restrict SSH to known addresses; remove unused accounts; keep the correlation rule and extend it to the Windows servers.</p>
<h2>What went well, and what to improve</h2>
<table><tr><th>Went well</th><th>To improve</th></tr>
<tr><td>The correlation rule fired within two minutes and was clear.</td><td>The attacker reached a shell before the block; a faster automatic block might have prevented the login.</td></tr>
<tr><td>Ngozi asked the seven questions and wrote her reasoning.</td><td>She waited seven minutes before calling; the playbook should say “call at once for a live session”.</td></tr>
<tr><td>Containment kept the evidence: the session and files were examined before any cleanup.</td><td>The firewall block needed approval; a pre-approved process would save time at night.</td></tr></table>
<div class="note"><b>Field note: the review meeting</b>After any serious incident, good teams hold a short review, often called a post-incident review or lessons-learned meeting. They ask what happened, what worked, what did not and what will change. The tone is curious, never blaming. These meetings produce most of a team’s improvements, and the notes become future training material.</div>
<h2>Your turn</h2>
<p>Take the SSH case file in your lab and treat it as if it were this one. Write the timeline, the seven answers and the report in your notebook before you read anyone’s solution. Then compare your decisions with Ngozi’s. If you made different ones, think about why. There is rarely one perfect answer, but there are always good reasons for each choice, and learning to state them is the skill employers hire for.</p>`,
takeaways:["An investigation is the seven questions applied in order, with notes written as you go.","Confirm the alert from the raw log lines before acting on a summary.","Search for the same source and account elsewhere to decide whether the activity is focused or broad.","For a live session, contain first, record every action, and escalate quickly; keep evidence by examining before cleaning.","A good report has a plain summary, detection, actions, root cause and recommendations, followed by a blameless review."],
quiz:[{q:"What should you do before acting on an alert’s summary?",o:["Read the raw log lines to confirm","Close it","Reboot the server","Delete the account"],a:0},{q:"Why check the same source address in other logs?",o:["To see whether the activity is focused or broad","To speed up the SIEM","To delete logs","No reason"],a:0},{q:"What is the tone of a good post-incident review?",o:["Curious, not blaming","Angry","Silent","Competitive"],a:0}]},

{id:"r33",mod:"m7",title:"Reading Windows Security Events Like an Analyst",labs:["7-1","7-2"],
body:String.raw`<p class="lead">Windows writes thousands of events a day on a single laptop, and most are routine. An analyst’s skill is not memorising numbers. It is knowing which few fields to read, which patterns to trust and which noise to ignore. This chapter is a field guide to the events you will meet most often.</p>
<h2>How an event is built</h2>
<p>Every Windows event has two parts. The <b>System</b> part describes the event itself: its provider, its <b>Event ID</b>, the time it was created and the computer that wrote it. The <b>EventData</b> part holds the details, as a list of named fields such as <code>TargetUserName</code> or <code>IpAddress</code>. When you read an event in Event Viewer’s <b>Details</b> tab, you can switch to the XML view to see exactly which names a field has. Wazuh uses these same names, which is why they matter: a custom rule often tests a field such as <code>win.eventdata.targetUserName</code>.</p>
<p>Events also carry a keyword that says whether they record a success or a failure. Most security events exist in both forms, but only if the audit policy asks for both.</p>
<h2>Logons: the most important events you will read</h2>
<h3>Event 4624: an account logged on</h3>
<p>This event proves that someone is in. Seven fields do most of the work.</p>
<table><tr><th>Field</th><th>What it tells you</th></tr>
<tr><td><b>TargetUserName</b></td><td>The account that logged on. This is “who”.</td></tr>
<tr><td><b>SubjectUserName</b></td><td>The account that requested the logon. Often the computer itself, shown with a dollar sign at the end.</td></tr>
<tr><td><b>LogonType</b></td><td>How the person logged on. See the table below.</td></tr>
<tr><td><b>IpAddress</b> and <b>WorkstationName</b></td><td>Where the logon came from. Local logons show a dash or 127.0.0.1.</td></tr>
<tr><td><b>AuthenticationPackageName</b></td><td>The method: Kerberos, NTLM or Negotiate. NTLM in a company that normally uses Kerberos deserves a second look.</td></tr>
<tr><td><b>LogonProcessName</b></td><td>The component that handled it, such as User32 for a person at a keyboard or NtLmSsp for a network logon.</td></tr>
<tr><td><b>TargetLogonId</b></td><td>A number that identifies this session. Later events refer to the same number, which lets you follow one session from start to finish.</td></tr></table>
<h3>Logon types</h3>
<table><tr><th>Type</th><th>Name</th><th>Typical meaning</th></tr>
<tr><td>2</td><td>Interactive</td><td>Someone at the keyboard, or a console session</td></tr>
<tr><td>3</td><td>Network</td><td>A connection to a share, printer or service. Very common and usually harmless in bulk</td></tr>
<tr><td>4</td><td>Batch</td><td>A scheduled task running under an account</td></tr>
<tr><td>5</td><td>Service</td><td>A service starting under an account</td></tr>
<tr><td>7</td><td>Unlock</td><td>Someone unlocked a locked screen</td></tr>
<tr><td>9</td><td>NewCredentials</td><td>A program running with different network credentials (the <code>runas /netonly</code> case)</td></tr>
<tr><td>10</td><td>RemoteInteractive</td><td>Remote Desktop</td></tr>
<tr><td>11</td><td>CachedInteractive</td><td>A domain account logging on without reaching the domain controller</td></tr></table>
<div class="note"><b>Field note: Remote Desktop and logon type 3</b>When a computer requires Network Level Authentication, which most do, a failed Remote Desktop attempt is logged as <b>type 3</b>, not type 10, because the check happens before the desktop session is built. A successful session then shows type 10. Analysts who search only for type 10 miss the brute force.</div>
<h3>Event 4625: a logon failed</h3>
<p>The fields are similar, and two more matter: <b>Status</b> and <b>SubStatus</b>. The status is a general class, and the sub status is the real reason.</p>
<table><tr><th>SubStatus</th><th>Meaning</th><th>What it suggests</th></tr>
<tr><td><code>0xC0000064</code></td><td>The user name does not exist</td><td>Guessing names, often from a list</td></tr>
<tr><td><code>0xC000006A</code></td><td>The name exists but the password is wrong</td><td>Targeted guessing, or a real user’s mistake</td></tr>
<tr><td><code>0xC0000234</code></td><td>The account is locked out</td><td>A lockout policy has triggered</td></tr>
<tr><td><code>0xC0000072</code></td><td>The account is disabled</td><td>An old or unused account is still being tried</td></tr>
<tr><td><code>0xC0000070</code></td><td>Logon not allowed at this time or on this computer</td><td>Restrictions are working</td></tr></table>
<p>A burst of <code>0xC0000064</code> across many names, followed by a few <code>0xC000006A</code> against a particular name, is the classic shape of an attacker who has found a valid user name and is now guessing the password.</p>
<h3>Related logon events</h3>
<ul>
<li><b>4634 and 4647</b> record logoff. They end a session that you can find by its logon ID.</li>
<li><b>4648</b> records a logon with <b>explicit credentials</b>: a program used another account’s name and password. Administrators use this legitimately, and attackers use it when moving between machines.</li>
<li><b>4672</b> says that special privileges were assigned to a new logon. It means an administrator-level account just logged in. Routine for administrators and for SYSTEM, suspicious for a normal user.</li>
<li><b>4776</b> records an NTLM credential check by a domain controller.</li>
</ul>
<h2>What programs ran: event 4688</h2>
<p>When process creation auditing is enabled, event 4688 records each program that starts. Four fields matter most: <b>NewProcessName</b>, <b>ParentProcessName</b> (often labelled “Creator Process Name”), <b>CommandLine</b> (only if you enabled it) and <b>SubjectUserName</b>. Together they answer: what ran, who started it, what started it and with which arguments.</p>
<h2>Accounts and groups</h2>
<table><tr><th>Event</th><th>Meaning</th></tr>
<tr><td>4720</td><td>A user account was created</td></tr><tr><td>4722, 4725</td><td>An account was enabled, disabled</td></tr>
<tr><td>4723, 4724</td><td>A user changed a password, or an administrator reset one</td></tr>
<tr><td>4726</td><td>An account was deleted</td></tr><tr><td>4738</td><td>An account was changed</td></tr>
<tr><td>4728, 4732, 4756</td><td>A member was added to a global, local or universal group</td></tr>
<tr><td>4740</td><td>An account was locked out</td></tr></table>
<p>A sequence of 4720 (account created), 4724 (password set) and 4732 (added to Administrators) within a few minutes is a textbook description of an attacker creating a hidden administrator. You will reproduce and detect it in the labs.</p>
<h2>Services, tasks and cleaning up</h2>
<ul>
<li><b>7045</b> in the <b>System</b> log, and <b>4697</b> in Security, record a new service installation.</li>
<li><b>4698, 4699 and 4702</b> record a scheduled task being created, deleted or updated. They require the “Other Object Access Events” audit subcategory.</li>
<li><b>1102</b> in the Security log records that the audit log was cleared, and <b>104</b> in the System log records that another log was cleared. These are rare in healthy systems, and always worth checking.</li>
<li><b>4719</b> records that the audit policy itself was changed. An attacker who wants to stop being recorded has to do this first.</li>
</ul>
<h2>Separating noise from signal</h2>
<p>A new analyst opens the Security log and sees chaos. Four habits cut through it.</p>
<ol>
<li><b>Ignore the machine accounts.</b> Names ending in <code>$</code> are computers talking to each other. Filter them out of human investigations.</li>
<li><b>Ignore the built-in identities</b> such as SYSTEM, LOCAL SERVICE, NETWORK SERVICE and the window manager accounts, unless the story involves them.</li>
<li><b>Count before you read.</b> Group events by account, source address or logon type, and look at the numbers first. A single account with 400 failures is easy to spot in a count and impossible to spot in a scroll.</li>
<li><b>Compare with a baseline.</b> Learn what a normal day looks like, then look at what is different today.</li>
</ol>
<h2>A worked reading</h2>
<p>Here is a shortened sequence from a server, with the explanation of a careful reader.</p>
<pre>03:10:41  4625  labuser  type 3  from 203.0.113.50  SubStatus 0xC000006A
03:10:42  4625  labuser  type 3  from 203.0.113.50  SubStatus 0xC000006A
... (36 more, one per second) ...
03:11:20  4624  labuser  type 3  from 203.0.113.50  NTLM
03:11:22  4672  labuser  special privileges assigned
03:11:40  4688  cmd.exe  parent: wmiprvse.exe  CommandLine: whoami /all</pre>
<p>The reader’s notes: the failures are a brute force of one real account (sub status 6A), from one address, one per second, which is a tool. The success from the same address is a probable compromise. The 4672 says the account has high privileges, so the damage could be large. The last event, a command shell launched by the WMI service host running <code>whoami /all</code>, is the attacker checking their rights, using a method (remote WMI) that does not show a normal interactive session. The reader would escalate immediately.</p>
<h2>Connect to the labs</h2>
<p>In the labs for this module you will switch on the audit settings, create each of these events yourself, and learn to read them in Event Viewer, in PowerShell and in Wazuh. Take the field names with you: the same names appear in every tool.</p>`,
takeaways:["Every event has System details and named EventData fields; Wazuh uses the same field names in rules.","In 4624 read TargetUserName, LogonType, IpAddress, authentication package and the logon ID; in 4625 read the SubStatus.","With Network Level Authentication, failed Remote Desktop logons appear as type 3, successes as type 10.","Account creation, password set and group add in quick succession describes a hidden administrator.","Cut noise by ignoring machine accounts and built-in identities, counting before reading and comparing with a baseline."],
quiz:[{q:"What does SubStatus 0xC000006A mean?",o:["The user exists but the password is wrong","The user does not exist","The account is disabled","The PC is off"],a:0},{q:"What does logon type 10 mean?",o:["Remote Desktop","A service","A scheduled task","Screen unlock"],a:0},{q:"Why filter out names ending in a dollar sign?",o:["They are computer accounts talking to each other","They are administrators","They are attackers","They are disabled"],a:0}]},

{id:"r34",mod:"m7",title:"Sysmon in Practice: Install, Configure and Tune",labs:["7-3","7-4"],
body:String.raw`<p class="lead">Windows’ own logs tell you what happened. Sysmon tells you what actually ran, who started it and what it did next. It is free, small and widely used in real security teams. This chapter explains how it works, how to configure it sensibly and how to read its output.</p>
<h2>What Sysmon is</h2>
<p><b>System Monitor</b>, always called Sysmon, is a tool from Microsoft’s Sysinternals collection. You install it once. It places a small driver and a service on the computer, and from then on it writes detailed events to its own log channel, <code>Microsoft-Windows-Sysmon/Operational</code>. Unlike ordinary Windows auditing, it records things such as a program’s <b>hash</b>, its <b>full command line</b>, its <b>parent process</b>, and every network connection it makes.</p>
<h2>The events you will use most</h2>
<table><tr><th>ID</th><th>Event</th><th>Why it matters</th></tr>
<tr><td>1</td><td>Process created</td><td>Command line, hashes, parent, user. The single most valuable event.</td></tr>
<tr><td>3</td><td>Network connection</td><td>Which program connected to which address and port</td></tr>
<tr><td>7</td><td>Image (DLL) loaded</td><td>Injected or hijacked code. Very noisy, so usually filtered heavily</td></tr>
<tr><td>8</td><td>CreateRemoteThread</td><td>One process starting code inside another</td></tr>
<tr><td>10</td><td>Process access</td><td>A program reading another program’s memory, as in credential theft from the login process</td></tr>
<tr><td>11</td><td>File created</td><td>Which program dropped which file</td></tr>
<tr><td>12, 13, 14</td><td>Registry key or value created, set, renamed</td><td>Persistence, including per-user keys</td></tr>
<tr><td>15</td><td>File stream created</td><td>Hidden data in alternate data streams</td></tr>
<tr><td>19, 20, 21</td><td>WMI filter, consumer and binding</td><td>Stealthy WMI persistence</td></tr>
<tr><td>22</td><td>DNS query</td><td>Which program asked for which name</td></tr>
<tr><td>23</td><td>File deleted</td><td>Cleaning up evidence</td></tr>
<tr><td>4, 16</td><td>Sysmon state change, configuration change</td><td>Tampering with Sysmon itself</td></tr></table>
<h2>The configuration is everything</h2>
<p>Sysmon with no configuration records very little useful, and Sysmon recording everything is unreadable. The <b>configuration file</b> is an XML document that says what to include and what to exclude for each event type. Its shape is simple.</p>
<pre>&lt;Sysmon schemaversion="4.90"&gt;
  &lt;EventFiltering&gt;
    &lt;RuleGroup name="" groupRelation="or"&gt;
      &lt;ProcessCreate onmatch="exclude"&gt;
        &lt;Image condition="is"&gt;C:\Windows\System32\conhost.exe&lt;/Image&gt;
      &lt;/ProcessCreate&gt;
    &lt;/RuleGroup&gt;
  &lt;/EventFiltering&gt;
&lt;/Sysmon&gt;</pre>
<p>Two ideas explain every configuration.</p>
<ul>
<li><b>onmatch="include"</b> means “record only events that match these rules”. <b>onmatch="exclude"</b> means “record everything except events that match these rules”.</li>
<li>Each rule tests a field with a <b>condition</b> such as <code>is</code>, <code>contains</code>, <code>begin with</code>, <code>end with</code> or <code>image</code>.</li>
</ul>
<p>Beginners should use a respected community configuration as a starting point, rather than writing from nothing. The widely used one from the author known as SwiftOnSecurity is a sensible, documented baseline. Read it before you deploy it. Many teams then add their own exclusions for software that is noisy in their environment.</p>
<h2>Include or exclude?</h2>
<p>Teams argue about this, and both have a place. An <b>include</b> approach records only what you have decided is interesting. It is quiet and cheap but can miss things you did not think of. An <b>exclude</b> approach records most things and removes the known noise. It is richer but heavier. Process creation (event 1) is usually recorded broadly, because it is so valuable. High-volume events such as image loads (7) are usually limited to specific suspicious cases.</p>
<h2>Installing, updating and checking</h2>
<table><tr><th>Task</th><th>Command (admin PowerShell)</th></tr>
<tr><td>Install with a configuration</td><td><code>.\Sysmon64.exe -accepteula -i sysmonconfig.xml</code></td></tr>
<tr><td>Update the configuration</td><td><code>.\Sysmon64.exe -c sysmonconfig.xml</code></td></tr>
<tr><td>Show the current configuration</td><td><code>.\Sysmon64.exe -c</code></td></tr>
<tr><td>Uninstall</td><td><code>.\Sysmon64.exe -u</code></td></tr></table>
<p>Updating the configuration does not need a restart. Many teams keep the configuration in version control and push changes to all computers through their deployment tools.</p>
<h2>Reading a process-creation event</h2>
<p>Look at the fields in order.</p>
<ol>
<li><b>Image</b>: which program started. Is it in a normal location?</li>
<li><b>CommandLine</b>: what it was asked to do.</li>
<li><b>ParentImage</b> and <b>ParentCommandLine</b>: what started it. A document program starting a shell, or a web server starting <code>cmd.exe</code>, is a strong signal.</li>
<li><b>User</b>: under which account.</li>
<li><b>Hashes</b>: a fingerprint you can look up.</li>
<li><b>ProcessGuid</b> and <b>ParentProcessGuid</b>: identifiers that let you link events together. Every later event for the same process, such as a network connection, carries the same <b>ProcessGuid</b>, so you can follow one program through its whole life.</li>
</ol>
<h2>The process tree</h2>
<p>If you follow the parent links upward and the child links downward, you build a <b>process tree</b>. This is how analysts reconstruct an attack.</p>
<pre>explorer.exe
  └─ winword.exe  (invoice.docm)
       └─ powershell.exe  -enc JABz...
            └─ rundll32.exe  C:\Users\Public\x.dll,Start
                 └─ (network connection to 203.0.113.50:443)</pre>
<p>Each box on its own is ordinary. Together they tell the story of a malicious document that ran PowerShell, which loaded a library, which called out to the internet.</p>
<h2>Common mistakes</h2>
<ul>
<li><b>Installing and forgetting.</b> A Sysmon that is not collected centrally is only useful after the fact, on one machine.</li>
<li><b>Recording too much.</b> Verbose settings cost disk, processor time and attention. Check event counts per day after changes.</li>
<li><b>Trusting a configuration blindly.</b> Read what it excludes. An exclusion for a folder that attackers can write to is a gap.</li>
<li><b>Not protecting it.</b> Attackers with administrator rights can unload Sysmon’s driver. Alert on Sysmon’s own state-change events (4 and 16) and on the service stopping.</li>
<li><b>Ignoring version updates.</b> New versions add events and fix issues.</li>
</ul>
<div class="note"><b>Field note: the first week</b>Teams that deploy Sysmon usually spend the first week watching which programs create the most events, and excluding the harmless ones: backup agents, monitoring tools, browsers updating. By the end of that week, the log is small enough to read and rich enough to trust.</div>
<h2>Sysmon and Wazuh together</h2>
<p>The Wazuh agent can collect Sysmon events, and Wazuh already contains rules that understand them. A Sysmon event arrives with fields such as <code>win.eventdata.image</code> and <code>win.eventdata.commandLine</code>, and the standard process-creation rule carries the group <code>sysmon_event1</code>, so your own rules can build on it. File integrity monitoring tells you <b>what changed</b>. Sysmon adds <b>which program changed it</b> and <b>what started that program</b>. Used together, they turn a lone alert into a story.</p>`,
takeaways:["Sysmon records process creation, network connections, file and registry changes and more, in its own log channel.","The configuration decides what is recorded; start from a respected community configuration and tune it.","Event 1 is the most valuable: read Image, CommandLine, ParentImage, User, Hashes and the process GUIDs.","Following parent and child links builds a process tree that reveals an attack as a story.","Collect Sysmon centrally, keep the configuration in version control, and alert on tampering."],
quiz:[{q:"What does ProcessGuid let you do?",o:["Link events that belong to the same process","Hide a process","Block a process","Speed up Sysmon"],a:0},{q:"onmatch=\"exclude\" means…",o:["Record everything except events that match","Record only matching events","Disable Sysmon","Delete logs"],a:0},{q:"Why alert on Sysmon event 4?",o:["Someone may have stopped or changed Sysmon","It records every file","It is a DNS query","It shows memory use"],a:0}]},

{id:"r35",mod:"m7",title:"PowerShell and Living-off-the-Land Tools: What Attackers Run and How to See It",labs:["7-5","7-6"],
body:String.raw`<p class="lead">The most common tools attackers use on Windows are not exotic. They are built into the operating system and used every day by administrators. Defenders call this <b>living off the land</b>. This chapter explains why attackers choose these tools, the most common ones, and the clues that separate abuse from ordinary administration.</p>
<h2>Why attackers use what is already there</h2>
<p>A custom hacking program can be caught by antivirus, blocked by allow-lists and traced back to its author. A built-in tool is signed by Microsoft, present on every machine and trusted by security software. It also blends into administrators’ activity. An attacker who uses <code>powershell.exe</code>, <code>certutil.exe</code> or <code>rundll32.exe</code> leaves no strange file for a scanner to find.</p>
<p>The consequence for defenders is an important change of mindset. You cannot block these tools: the company needs them. Instead you watch <b>how, when, by whom and from what</b> they are used.</p>
<h2>PowerShell: powerful, scriptable, everywhere</h2>
<p>PowerShell can run commands, read and write files, call web services, manage the registry and reach into the operating system’s deepest parts. An administrator uses it for automation; an attacker uses it for execution, discovery, download and persistence.</p>
<h3>Patterns that deserve attention</h3>
<table><tr><th>Pattern</th><th>Example</th><th>Why it is suspicious</th></tr>
<tr><td>Encoded command</td><td><code>powershell -enc JABz...</code></td><td>Hides the content from casual reading. Some legitimate tools do it too, so check the parent.</td></tr>
<tr><td>Hidden window and no profile</td><td><code>-WindowStyle Hidden -NoProfile</code></td><td>Runs invisibly and skips normal setup</td></tr>
<tr><td>Execution policy bypass</td><td><code>-ExecutionPolicy Bypass</code></td><td>Execution policy is a safety guard, not a security control, but attackers often set it</td></tr>
<tr><td>Download cradle</td><td><code>IEX (New-Object Net.WebClient).DownloadString('http://...')</code></td><td>Fetches code from the internet and runs it without saving a file</td></tr>
<tr><td>Unusual parent</td><td>Word or a web server starting PowerShell</td><td>Documents and web servers do not normally start shells</td></tr>
<tr><td>Obfuscation</td><td>String splitting, odd casing, heavy use of <code>-join</code> and backticks</td><td>Evades simple text searches</td></tr></table>
<h3>The logging that makes it visible</h3>
<ol>
<li><b>Process creation with command line</b> (event 4688 or Sysmon 1): shows how PowerShell was started, including the encoded text.</li>
<li><b>Script block logging</b> (event 4104): records the actual code that ran, after Windows decodes it. This beats encoding and many obfuscation tricks.</li>
<li><b>Module logging and transcription</b>: more verbose records of commands and their output, useful on sensitive systems.</li>
<li><b>AMSI</b>, the Antimalware Scan Interface, lets antivirus inspect script content as it runs. Attackers sometimes try to disable it, and strings associated with such attempts appear in script block logs.</li>
</ol>
<h2>Living-off-the-land binaries</h2>
<p>The community catalogues, called <b>LOLBins</b> (or LOLBAS), list hundreds of built-in programs that can be misused. The ones below appear again and again in real incidents.</p>
<table><tr><th>Tool</th><th>Normal use</th><th>Abuse</th><th>Clue</th></tr>
<tr><td><code>certutil.exe</code></td><td>Manage certificates</td><td>Download files (<code>-urlcache -split -f</code>) or decode hidden data (<code>-decode</code>)</td><td>Certutil connecting to the internet</td></tr>
<tr><td><code>mshta.exe</code></td><td>Run HTML applications</td><td>Execute script from a web address</td><td>mshta with a URL argument</td></tr>
<tr><td><code>regsvr32.exe</code></td><td>Register components</td><td>Load a remote script (<code>/s /u /i:http://... scrobj.dll</code>)</td><td>Regsvr32 with a URL, or making a network connection</td></tr>
<tr><td><code>rundll32.exe</code></td><td>Run library functions</td><td>Run a malicious library from an odd path</td><td>A DLL in <code>Users\Public</code> or <code>Temp</code></td></tr>
<tr><td><code>wmic.exe</code></td><td>Query and manage the system</td><td>Create processes locally or remotely</td><td><code>process call create</code> in the command line</td></tr>
<tr><td><code>bitsadmin.exe</code></td><td>Manage background transfers</td><td>Download payloads quietly</td><td>A <code>/transfer</code> job to an external address</td></tr>
<tr><td><code>schtasks.exe</code></td><td>Schedule tasks</td><td>Persistence</td><td><code>/create</code> with a program from a writable folder</td></tr>
<tr><td><code>msiexec.exe</code></td><td>Install packages</td><td>Install a package from a web address</td><td>msiexec with a URL</td></tr></table>
<h2>How defenders decide</h2>
<p>A single command line is rarely enough. Experienced analysts weigh four things.</p>
<ol>
<li><b>Lineage.</b> What started this process? A scheduled administration script or a user document?</li>
<li><b>Arguments.</b> Does the command line contain a URL, an encoded blob, a hidden window or a path in a user-writable folder?</li>
<li><b>Context.</b> Which user, which computer, which time? An administrator’s workstation at noon differs from a finance laptop at night.</li>
<li><b>Rarity.</b> How many other computers run this exact command? An unusual command that appears on one machine only is far more interesting than one that appears on five hundred.</li>
</ol>
<p>The last test, often called <b>stack counting</b>, is powerful and cheap. Count how many hosts ran each command line this week, and read the ones at the bottom of the list.</p>
<h2>Writing a sensible detection</h2>
<p>Good detections for these tools do not say “alert on PowerShell”. They say, for example:</p>
<ul>
<li>Alert when PowerShell runs with an encoded command <b>and</b> its parent is an office program or a web server.</li>
<li>Alert when <code>certutil</code>, <code>mshta</code>, <code>regsvr32</code> or <code>bitsadmin</code> are started with a web address in their command line.</li>
<li>Alert when <code>rundll32</code> loads a library from a user-writable folder.</li>
<li>Alert when a scheduled task is created whose program lives in a temporary or public folder.</li>
</ul>
<p>In the labs you will write the simplest versions, a rule for encoded PowerShell and one for scheduled-task creation, and then discuss how you would make them quieter.</p>
<h2>Prevention helps too</h2>
<ul>
<li><b>Constrained Language Mode</b> and application control (such as AppLocker or Windows Defender Application Control) restrict what scripts and programs may run.</li>
<li><b>Attack surface reduction rules</b> in Microsoft Defender can block office programs from creating child processes.</li>
<li><b>Least privilege</b> means a stolen normal account cannot do as much.</li>
<li><b>Disabling unneeded tools</b> where practical, such as legacy components that nobody uses.</li>
</ul>
<div class="note"><b>Field note: the friendly administrator</b>The hardest false positives in this area are administrators who run scripts that look exactly like an attack. Good teams reduce them by asking administrators to sign their scripts, run them from known paths and from known accounts, so that “unsigned, from a user’s temp folder, at night” stands out. This is another place where good security depends on ordinary discipline.</div>
<h2>Connect to the labs</h2>
<p>You will run harmless encoded commands and scheduled tasks on <code>win-victim</code>, find them in the Security, PowerShell and Sysmon logs, send them to Wazuh and write rules that catch them. Notice at every step which log would tell the story if the others were not available.</p>`,
takeaways:["Attackers use built-in tools such as PowerShell and certutil because they are trusted, present everywhere and leave no new file.","You cannot block these tools; you watch lineage, arguments, context and rarity.","Script block logging (4104) shows the real code even when the command was encoded.","Good detections combine two signals, such as an encoded command with an office-program parent.","Prevention, including application control and attack surface reduction, reduces what attackers can run."],
quiz:[{q:"What does script block logging record?",o:["The code that actually ran, after decoding","Only the file name","Network traffic","User passwords"],a:0},{q:"Why combine signals in a PowerShell detection?",o:["Alerting on PowerShell alone creates too much noise","PowerShell is never used by admins","It makes rules shorter","Windows requires it"],a:0},{q:"What is stack counting?",o:["Counting how many hosts ran each command to find rare ones","Counting passwords","Counting files","Counting alerts per hour"],a:0}]},

{id:"r36",mod:"m8",title:"Case File #3: Meet the Domain and Its Attackers",labs:["8-1","8-2"],
body:String.raw`<p class="lead">Your lab has run on local accounts since Module 1: one Windows laptop, one Linux server, each with its own small set of users. Real companies rarely work that way. This chapter introduces the domain you are about to add to your lab, the attacks that target it, and the story you will follow through Case File #3.</p>
<h2>Why add a domain now</h2>
<p>You already know that Active Directory is the central directory most companies use for identity (the chapter “Active Directory in Plain Language” covers the ideas). Reading about Kerberos tickets and domain controllers is useful, but nothing replaces watching real 4768 and 4769 events appear on your own screen after you cause them yourself. Case File #3 gives you a small, safe domain of your own, so that the next stage of your career, interviews that ask about Active Directory, is answered from experience rather than memory.</p>
<h2>Meet BrightMart’s new office</h2>
<div class="box story"><b>📖 The story</b>BrightMart has grown. Ada now has three computers networked together, managed from one place, and a new hire, <b>Tunde</b>, who administers them. One morning, Tunde notices something odd: an account he does not remember locked out at 2 a.m., and a login from a laptop that should have been switched off. Ada asks you, now BrightMart’s contracted security analyst, to look into it.</div>
<p>To investigate Tunde’s problem, you first need the same kind of network he has: a small domain, with a domain controller, a few accounts and some everyday traffic to compare against.</p>
<h2>The new lab machine</h2>
<p>You will add a fourth virtual machine, <b>dc01</b>, running Windows Server, configured as a domain controller for a new domain called <code>brightmart.local</code>. Your existing <code>win-victim</code> joins this domain. The lab sheet below is what every later chapter and lab assumes.</p>
<table><tr><th>Machine</th><th>Role</th><th>Address</th><th>Notes</th></tr>
<tr><td>dc01</td><td>Domain controller for <code>brightmart.local</code></td><td>192.168.56.20</td><td>Windows Server (evaluation edition); also runs DNS for the domain</td></tr>
<tr><td>win-victim</td><td>Domain-joined workstation</td><td>192.168.56.30</td><td>Joins <code>brightmart.local</code>; keeps its local <code>analyst</code> account too</td></tr>
<tr><td>wazuh-server</td><td>SIEM, unchanged</td><td>192.168.56.10</td><td>Will also collect dc01’s events</td></tr>
<tr><td>kali-attacker</td><td>Attacker, unchanged</td><td>192.168.56.50</td><td>Gains a new target: dc01</td></tr></table>
<p>Two domain accounts you will create: <b>jane.okoro</b>, an ordinary domain user, and <b>svc-backup</b>, a service account with a weak, never-changing password, created deliberately so that you can study its risks.</p>
<div class="box edge"><b>Sizing note</b>A domain controller needs its own memory, on top of your other three VMs. If your computer has 16 GB, plan to run at most two or three VMs at a time during this module (for example dc01 and win-victim together, then add Kali only when attacking). Give dc01 at least 3 GB of memory and 40 GB of disk.</div>
<h2>Why attackers love domains</h2>
<p>A domain is a single system that, once broken into, can reveal the keys to everything else: every account, every password hash, every computer’s secrets. Attackers therefore follow a fairly predictable sequence once they land on one domain-joined computer.</p>
<table><tr><th>Stage</th><th>Goal</th><th>What you will study</th></tr>
<tr><td>Initial access to a workstation</td><td>Get a foothold</td><td>RDP brute force, in chapter 2 and labs 1 to 3</td></tr>
<tr><td>Discovery</td><td>Map the domain: users, groups, computers</td><td>Built-in and PowerShell commands, in lab 4</td></tr>
<tr><td>Credential access</td><td>Steal or crack passwords</td><td>Kerberoasting, in chapter 3 and labs 5 to 6</td></tr>
<tr><td>Lateral movement</td><td>Reach other computers with stolen credentials</td><td>Pass-the-hash signs, in labs 7 to 8</td></tr>
<tr><td>Privilege escalation</td><td>Become a Domain Admin</td><td>Watching group membership changes, throughout</td></tr></table>
<h2>What makes this case file different</h2>
<p>In Case Files 1 and 2 you watched files and a single Linux login. Here you will watch a <b>whole small network</b>: a workstation, a server and the directory that ties them together. The investigation skills are the same (the seven questions from “Triage and Investigation”), but the evidence now spans several machines, and you will practise <b>pivoting</b> between them: starting with one account on one computer, and following it to wherever it has been.</p>
<div class="box why"><b>💡 What you are building towards</b>By the end of Case File #3 you will have detected a Remote Desktop brute force, investigated a lateral movement attempt using stolen credentials, written a detection for Kerberoasting, and produced an incident report that spans two machines. This is squarely the kind of work a Tier 1 and Tier 2 analyst does in a company that runs Windows.</div>
<h2>A note on scope</h2>
<p>A full domain has far more depth than this case file covers: group policy design, trusts between domains, certificate services and more. Case File #3 teaches the patterns a junior analyst meets constantly, using the smallest domain that can teach them honestly. Treat the techniques you do not meet here, such as golden tickets and DCSync, as named destinations for your continued study, referenced in the chapter “Active Directory in Plain Language”.</p>`,
takeaways:["Case File #3 adds a domain controller (dc01) and a domain-joined workstation to your lab, at 192.168.56.20 and .30.","A domain is attractive to attackers because breaking into it can expose every account and computer in the company.","The attack sequence you will study is: initial access, discovery, credential access, lateral movement, privilege escalation.","This case file spans several machines, so you will practise pivoting between them during an investigation.","Some advanced Active Directory attacks are out of scope here and named as topics for later study."],
quiz:[{q:"Why do attackers specifically target domain controllers?",o:["Breaking in can expose every account and computer in the company","They are always offline","They have no logs","They are easy to find only by accident"],a:0},{q:"What is pivoting, in an investigation?",o:["Following one account or detail from one machine to the next","Rebooting a server","Changing a password","Writing a report"],a:0},{q:"Which new machine does this module add?",o:["dc01, a domain controller","A second Kali","A router","A printer"],a:0}]},

{id:"r37",mod:"m8",title:"RDP Attacks and Lateral Movement in Plain Language",labs:["8-3","8-7"],
body:String.raw`<p class="lead">Remote Desktop is how administrators and, in many smaller companies, ordinary staff connect to a Windows computer from elsewhere. It is also one of the most attacked services in the world, because it is often exposed without enough protection. This chapter explains how RDP attacks unfold, and how attackers move from one compromised computer to the next.</p>
<h2>RDP in one paragraph</h2>
<p><b>Remote Desktop Protocol</b>, RDP, lets a user see and control a Windows computer’s desktop from another machine, over port 3389. It needs a username and password (or a certificate-based alternative), and once connected, the session behaves almost exactly like sitting at the keyboard. This convenience is exactly what makes it dangerous when exposed carelessly: a successful login grants a full, interactive session.</p>
<h2>Why RDP is attacked so often</h2>
<p>Search engines for internet-connected devices make it trivial for an attacker to find computers with port 3389 open to the world. Automated tools then try common passwords around the clock. Ransomware investigations consistently name exposed RDP as one of the most common ways attackers first get in, alongside phishing and stolen credentials bought from other breaches.</p>
<h2>What an RDP attack looks like in logs</h2>
<p>Because RDP checks Network Level Authentication before building a desktop session, a failed attempt at the password stage is recorded as a <b>network logon, type 3</b>, with event <b>4625</b>. Only once credentials are accepted does Windows build the full desktop session, logged as a <b>type 10, RemoteInteractive, event 4624</b>. A separate, more specific channel, <code>Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational</code>, also records connection attempts (event 1149) even before Windows decides whether the credentials are valid.</p>
<table><tr><th>What you see</th><th>Meaning</th></tr>
<tr><td>Many 4625 events, type 3, same source, many user names</td><td>Spraying: guessing a few passwords across many accounts</td></tr>
<tr><td>Many 4625 events, type 3, same source, same user name</td><td>Brute force against one account</td></tr>
<tr><td>A 4624, type 10, after a run of failures from the same address</td><td>A likely successful break-in</td></tr>
<tr><td>Event 1149 with no matching 4624</td><td>A connection attempt that never completed, perhaps because the account was locked or the attempt was cancelled</td></tr></table>
<h2>Reducing the risk</h2>
<p>The strongest fix is simple: do not expose RDP directly to the internet. Instead, require a VPN or a gateway service first, so only an already-authenticated connection ever reaches port 3389. Where RDP must be reachable, layer defences: multi-factor authentication, account lockout policies tuned to avoid denial of service, Network Level Authentication (already default in modern Windows), and restricting which addresses may connect at the firewall.</p>
<h2>Lateral movement: what attackers do once they are in</h2>
<p>A single compromised workstation is rarely the attacker’s final goal. They want the data or the systems that matter, and those usually live elsewhere on the network. <b>Lateral movement</b> is the general term for moving from one compromised computer to another.</p>
<h3>Common lateral movement methods</h3>
<table><tr><th>Method</th><th>How it works</th><th>What it leaves behind</th></tr>
<tr><td>Valid accounts</td><td>Using a stolen username and password to log in elsewhere</td><td>4624 (often type 3 or 10) on the new machine, from a source that is itself another internal host</td></tr>
<tr><td>Remote Desktop</td><td>Using RDP to the next machine</td><td>4624 type 10 and the terminal services channel on the new machine</td></tr>
<tr><td>Pass-the-hash</td><td>Reusing a captured password hash without knowing the actual password</td><td>NTLM authentication events (4624 with NTLM, 4776) where Kerberos would be expected</td></tr>
<tr><td>Remote service creation</td><td>Creating and starting a service on another machine (often via tools like PsExec)</td><td>Event 7045 (new service) and 4624 type 3 on the target, matched by timing to activity on the source</td></tr>
<tr><td>WMI or scheduled tasks remotely</td><td>Starting processes on another machine through management interfaces</td><td>4688 on the target with an unusual parent, and a remote logon just before it</td></tr></table>
<h2>The shape of lateral movement in logs</h2>
<p>No single event proves lateral movement. The pattern is relational: the <b>same account</b> logging on to <b>several different computers</b>, often in a short time, sometimes from machines that are not that account’s usual workstation. This is why centralising logs matters so much: lateral movement is invisible if you only ever look at one machine at a time.</p>
<div class="note"><b>Field note: build the habit of asking “where else?”</b>The single most useful question in a lateral-movement investigation is: has this account, or this source address, appeared anywhere else? Searching your SIEM for an account across every agent, not just the one that raised the alert, is often how an isolated incident turns out to be a company-wide one, or reassuringly does not.</div>
<h2>A short worked example</h2>
<p>An alert fires: ten failed RDP logons against <code>win-victim</code> from an external address, followed by a success. Fifteen minutes later, <code>dc01</code> logs a 4624 for the same account, type 3, sourced from <code>win-victim</code>’s own address rather than the external one. Read together, this tells a story: the attacker broke into the workstation, then used the stolen account from inside the network to reach the domain controller. Neither event alone proves this; the two together, connected by the same account and a short time gap, do.</p>
<h2>What you will do in this module</h2>
<p>You will generate exactly this kind of two-step pattern yourself: an RDP brute force against <code>win-victim</code>, followed by a lateral step toward <code>dc01</code> using the credentials you captured. You will then search across both agents for the same account, and write the timeline that connects them.</p>`,
takeaways:["RDP failures show as type 3 logons (event 4625); a successful session shows as type 10 (event 4624).","Exposed RDP is one of the most common ways attackers first break into a company; prefer a VPN or gateway in front of it.","Lateral movement means using a foothold on one machine to reach another, often with stolen valid credentials.","No single event proves lateral movement; the pattern is the same account appearing on several machines in a short time.","Searching an account across every agent, not just the one that alerted, is the key habit for catching lateral movement."],
quiz:[{q:"A failed RDP logon attempt is usually recorded as logon type…",o:["3","10","2","5"],a:0},{q:"What is the strongest general fix for RDP exposure?",o:["Put it behind a VPN or gateway rather than exposing it directly","Change the port number only","Disable logging","Use a longer wallpaper"],a:0},{q:"What is the key signal of lateral movement?",o:["The same account appearing on several machines in a short time","A single failed login","A slow network","A full disk"],a:0}]},

{id:"r38",mod:"m8",title:"Kerberoasting and Defending the Domain",labs:["8-5","8-6","8-8"],
body:String.raw`<p class="lead">Some domain attacks do not need a single failed login to succeed. Kerberoasting is one of the best examples: it uses a completely normal, permitted request, and turns it into an offline password-cracking opportunity. This chapter explains how it works and what a defender can realistically do about it.</p>
<h2>A short reminder of Kerberos tickets</h2>
<p>The chapter “Active Directory in Plain Language” introduced the two steps of a Kerberos logon: a ticket-granting ticket (event 4768), then a service ticket for each service the user wants to reach (event 4769). Service tickets are encrypted using a key derived from the <b>password of the service account</b> that the service runs under. This detail is exactly what Kerberoasting exploits.</p>
<h2>How Kerberoasting works</h2>
<p>Any ordinary, authenticated domain user may legitimately request a service ticket for any service registered in the directory; this is normal Kerberos behaviour and raises no error. An attacker, now authenticated as any domain user, requests service tickets for every service account they can find, especially ones tied to <b>Service Principal Names</b> (SPNs) such as database or application services. They then take the returned tickets away from the network and attempt to crack them offline, at their own pace, trying to recover the service account’s actual password from its encrypted ticket.</p>
<p>The attack is attractive because the request itself is completely ordinary. The danger lies entirely in what happens afterward, outside the network, where no log can see it.</p>
<h2>Why service accounts are especially exposed</h2>
<p>Service accounts, such as the <code>svc-backup</code> account in your lab, are created once and often never revisited. Their passwords are frequently long-lived, sometimes never rotated, and occasionally weaker than a person’s password because “nobody logs in with it”. Worse, service accounts are frequently granted broad rights, because it is easier to grant too much than to work out exactly what a service needs. These properties make a cracked service account password unusually valuable to an attacker.</p>
<h2>What to watch for</h2>
<table><tr><th>Signal</th><th>Why it matters</th><th>Caveat</th></tr>
<tr><td>Many 4769 events for different services, requested by one account in a short time</td><td>A normal user rarely needs tickets for a dozen services within seconds; automated tools do</td><td>Some legitimate discovery tools and administrators also do this; context matters</td></tr>
<tr><td>4769 events using an older, weaker ticket encryption type (RC4)</td><td>Older encryption is easier to crack offline; modern environments mostly use stronger encryption by default</td><td>Some legacy applications still require RC4, so this alone is not proof</td></tr>
<tr><td>A service account later logs on interactively, or from an unusual source</td><td>Service accounts rarely log on like a person; this can indicate the cracked password being used</td><td>Confirm this is actually unusual for that account first</td></tr></table>
<h2>Defending against it</h2>
<ol>
<li><b>Use long, randomly generated passwords</b> for service accounts, ideally 25 characters or more, which makes offline cracking impractical in realistic time.</li>
<li><b>Use managed service accounts</b> where the platform supports them, so passwords rotate automatically and are never known to a person.</li>
<li><b>Avoid unnecessary SPNs</b> and review which accounts have them.</li>
<li><b>Limit service account privileges</b> to exactly what the service needs, so that even a cracked account causes limited damage.</li>
<li><b>Monitor and alert</b> on unusual volumes of service ticket requests per account, tuned to your own environment’s baseline.</li>
</ol>
<h2>The broader lesson: defending a domain is mostly hygiene</h2>
<p>Kerberoasting, like most domain attacks, is rarely stopped by a single clever detection. It is reduced by unglamorous, continuous hygiene: strong and rotated passwords, least privilege, removing unused accounts and SPNs, and keeping an accurate inventory of what exists. Detections add a safety net for when hygiene slips, which it always eventually does somewhere in a large company.</p>
<h2>Containing a domain account compromise</h2>
<p>When you confirm that a domain account, especially a privileged or service account, is compromised, the response differs slightly from a single local account, because its reach is wider.</p>
<ol>
<li><b>Disable the account</b> at the domain level, which takes effect everywhere at once, rather than on one machine.</li>
<li><b>Force a password reset</b>, and for a service account, rotate it on every system configured to use it, or the service will simply fail.</li>
<li><b>Revoke active Kerberos tickets</b> for the account where your tools support it, since a valid ticket can still be used for a time even after a password change.</li>
<li><b>Search every agent</b> for that account’s activity, not just the machine where it was first noticed.</li>
<li><b>Review group membership</b> the account can reach, and anything it was granted access to that it should not keep.</li>
</ol>
<div class="note"><b>Field note: service accounts are nobody’s favourite problem</b>Analysts often describe service account hygiene as the least glamorous and most neglected part of identity security. Nobody is excited to audit forty service accounts and their SPNs. Teams that do it anyway consistently report fewer domain-wide incidents, because so many real intrusions pass through exactly this kind of account.</div>
<h2>What you will do in this module</h2>
<p>You will request service tickets for <code>svc-backup</code> from Kali in a way that mirrors Kerberoasting, confirm the 4769 events it produces on <code>dc01</code>, write a detection rule for the pattern, and then practise the containment steps above on your own lab account.</p>`,
