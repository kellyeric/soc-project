{id:"r1",mod:"m0",title:"A Day in the Life of a SOC Analyst",labs:["1-1"],
body:`<p class="lead">Before you learn a single tool, it helps to know what the job actually looks like. Job advertisements talk about “monitoring, detection and response”. This chapter shows you what those words mean at nine o’clock on an ordinary Tuesday.</p>
<div class="note"><b>A note on the stories in this academy</b>The people and companies in these chapters are composites. They are built from the kinds of situations that security teams describe again and again, so that you can learn the patterns without us inventing facts about any real organisation.</div>
<h2>Meet Amina, Tier 1 analyst</h2>
<p>Amina works in the security operations centre, usually called the SOC, of a mid-sized online retailer. Her team watches the company’s computers around the clock. There are three shifts: morning, evening and night. Amina is on the morning shift, which starts at seven.</p>
<p>She does not start by looking at alerts. She starts by reading the <b>handover notes</b> from the night shift. A handover note is a short written message that says what happened while she was away. This morning it reads: “One phishing report still open, waiting for the user to reply. A scanning IP address blocked at the firewall at 03:10. The vulnerability scanner will run at 10:00, so expect noise from server range B.” In three lines Amina learns what is unfinished, what is already handled, and what to ignore for a while.</p>
<p>This is the first lesson of the job. <b>Good security work is mostly communication.</b> A brilliant analyst who does not write clear notes makes the whole team slower.</p>
<h2>The queue</h2>
<p>Next, Amina opens the <b>alert queue</b>. Every security tool in the company, from the SIEM to the email filter to the endpoint protection, sends its alerts into one list. Each alert becomes a <b>ticket</b>. A ticket is a record that says what happened, who is looking at it, and what the decision was.</p>
<p>A typical ticket contains:</p>
<ul>
<li>a title, for example “Multiple failed logons followed by a success”;</li>
<li>a severity, such as low, medium, high or critical;</li>
<li>the affected computer and user;</li>
<li>the time the alert fired;</li>
<li>a status, such as new, in progress, escalated or closed;</li>
<li>and a section for the analyst’s notes.</li>
</ul>
<p>On a normal morning Amina sees between thirty and eighty alerts. Her job is not to investigate every one of them in depth. Her job is to <b>triage</b>: to decide quickly which ones are real, which are harmless, and which need someone with more experience.</p>
<h2>Three alerts, three outcomes</h2>
<p>Here are three alerts from Amina’s morning. They show the three outcomes you will meet most often.</p>
<h3>Alert one: a false positive</h3>
<p>The SIEM reports that a server in the finance department modified two hundred files in ten minutes. That looks like ransomware. Amina checks the change calendar, a shared list of planned work, and finds that the finance team’s backup software runs at that hour every day. She adds a note, “expected backup activity, see change record 4417”, and closes the ticket. Later she will suggest that the detection rule ignores that backup program, so nobody wastes time on it tomorrow. This is a <b>false positive</b>: the alert was correct about what happened, but wrong about it being dangerous.</p>
<h3>Alert two: a true positive that is not an emergency</h3>
<p>The email security tool reports that a user clicked a link in a phishing message. Amina checks whether the user entered a password on the fake page. The proxy logs show the page was blocked before it loaded. Nothing was lost, but the user needs a reminder and the sender’s domain should be blocked. This is a <b>true positive with no impact</b>. The attack was real, the defences worked, and the analyst’s job is to record it and tighten the defences a little more.</p>
<h3>Alert three: a real problem</h3>
<p>At 10:42 the SIEM reports that an employee account logged in successfully from a country where the company has no staff, only minutes after ten failed attempts. Amina checks the user’s calendar: he is in the office today. She checks the login source: it is a hosting provider, not a home internet connection. She does not try to fix it alone. She raises the ticket to <b>high</b>, calls the Tier 2 analyst, and starts writing down exactly what she saw and when. Within the hour the account is disabled, its sessions are ended, and the password is reset. This is a <b>true positive with potential impact</b>, and it is the reason the SOC exists.</p>
<div class="note"><b>Field note: the 90-second rule</b>Many teams expect an analyst to form a first opinion on an alert within a couple of minutes. You will not always be right, but you must be able to say “this looks normal because…” or “this looks wrong because…”. Practising that sentence is more useful than memorising any single tool.</div>
<h2>What Amina does between alerts</h2>
<p>An analyst’s day is not only alerts. Amina also spends time on:</p>
<ul>
<li><b>Reported emails.</b> Employees forward suspicious messages to a mailbox. Amina opens them safely, looks at the sender and links, and tells the employee whether to delete it.</li>
<li><b>Tuning requests.</b> When a rule is too noisy, someone has to fix it. She writes down which alerts were useless and why.</li>
<li><b>Vulnerability follow-ups.</b> The vulnerability scanner lists weaknesses in company computers. She helps decide which ones attackers could reach first.</li>
<li><b>Documentation.</b> Playbooks, which are step-by-step instructions for common alert types, must be kept up to date.</li>
<li><b>Learning.</b> Every week there are new attack techniques. The team spends an hour reading and discussing one.</li>
</ul>
<h2>How the team measures itself</h2>
<p>Security managers like numbers, and you will hear a few abbreviations quickly.</p>
<ul>
<li><b>MTTD</b>, mean time to detect: how long an attack lasted before the team noticed it.</li>
<li><b>MTTR</b>, mean time to respond: how long it took from noticing to containing it.</li>
<li><b>False positive rate</b>: what share of alerts turn out to be harmless.</li>
<li><b>SLA</b>, service level agreement: a promise such as “high-severity alerts are looked at within fifteen minutes”.</li>
</ul>
<p>These numbers matter because the aim is not to have zero alerts. The aim is to <b>shorten the time an attacker has inside the company</b>. This time is often called <b>dwell time</b>. The longer an attacker stays unnoticed, the more damage they can do.</p>
<h2>The hard parts nobody advertises</h2>
<p>Honesty is part of this academy, so here are the parts of the job that are difficult.</p>
<p><b>Alert fatigue.</b> If an analyst sees hundreds of harmless alerts, their attention drops and they may miss the one that matters. A big part of mature security work is deleting noise.</p>
<p><b>Shift work.</b> The attackers do not keep office hours. Many SOCs run nights and weekends. Good teams rotate fairly and protect their people’s sleep.</p>
<p><b>Uncertainty.</b> You will often decide without certainty. You will sometimes be wrong. The skill is to write down your reasoning so that someone can check it and so that you can learn from it.</p>
<p><b>Repetition.</b> Much of the work is repetitive. People who thrive in the job find ways to automate the repetition and spend their curiosity on the unusual cases.</p>
<h2>What good analysts have in common</h2>
<p>They are curious: they ask “why did this happen?” rather than closing the ticket. They are calm: they stay steady when everyone else is anxious. They write clearly: their notes can be read by someone who was not there. They know their environment: they can say what is normal for their company. And they ask for help early: they would rather escalate and be told “this is fine” than stay silent and be wrong.</p>
<h2>How careers usually grow</h2>
<p>Most people begin as a Tier 1 analyst. After a year or two they move to Tier 2, where they investigate incidents in depth. From there, paths branch: <b>threat hunting</b> (searching for hidden attackers), <b>detection engineering</b> (writing and tuning the rules that create alerts), <b>incident response</b> (leading the response to serious attacks), <b>threat intelligence</b> (studying attackers), or <b>security engineering</b> (building and running the tools). This academy deliberately steers you towards detection engineering skills, because they are valuable in every one of these paths.</p>
<h2>How this academy connects to the job</h2>
<p>Everything you will practise has a counterpart in Amina’s day. The lab you build in Module 1 is a miniature company. Wazuh, the SIEM you will install, is her alert queue. The case files, where you catch file tampering and password attacks and then write a report, are the same three steps Amina performed on her high-severity ticket: <b>detect, investigate, report</b>.</p>`,
takeaways:["A SOC analyst triages alerts: real or harmless, serious or minor, fix it or escalate.","False positives, true positives with no impact, and true positives with impact are the three outcomes you will see most.","Clear written notes and handovers matter as much as technical skill.","The aim of the team is to shorten dwell time, the time an attacker stays unnoticed.","Alert fatigue is the biggest enemy of a SOC, so removing noise is real security work."],
quiz:[{q:"What is a handover note?",o:["A short message saying what happened and what is unfinished","A password list","A type of malware","An invoice"],a:0},{q:"What does dwell time mean?",o:["How long an attacker stays unnoticed in the company","The length of a shift","How long a rule takes to load","The age of a ticket"],a:0},{q:"An alert is correct about the activity but the activity is harmless. This is a…",o:["False positive","True positive with impact","Zero-day","Playbook"],a:0}]},

{id:"r2",mod:"m0",title:"What You Will Be Protecting: The Anatomy of a Modern Company",labs:["1-1"],
body:`<p class="lead">You cannot defend something you cannot describe. This chapter walks through the parts of a typical company’s technology, explains which of them produce logs, and shows how your three-machine lab is a small copy of the whole.</p>
<h2>Start with the business, not the computers</h2>
<p>A company does not exist to run computers. It exists to sell something, deliver a service, or serve customers. Security exists to protect that purpose. When a security analyst asks “what matters most here?”, the answer is rarely a particular server. It is something like “taking orders”, “paying staff on time” or “keeping patient records private”.</p>
<p>The things that matter most are called <b>crown jewels</b>. They may be a customer database, the payment system, or the source code of a product. A good analyst knows what the crown jewels are in their company, because an alert near a crown jewel deserves more attention than the same alert somewhere else.</p>
<h2>The six layers of a modern company</h2>
<h3>1. Endpoints</h3>
<p>An <b>endpoint</b> is a computer that people use: laptops, desktops, phones. Most employees work on Windows laptops, some on Macs, and a few on Linux. Endpoints are the most common place where attacks start, because people click links and open attachments. They produce logs about logins, programs that start, files that change, and security software decisions.</p>
<h3>2. Servers</h3>
<p>A <b>server</b> is a computer that provides a service to others: a website, a database, a file share, an email system. Servers mostly run Linux or Windows Server. They are usually always on, always connected, and often hold the valuable data. They produce logs about connections, administrator actions, application errors and file access.</p>
<h3>3. Identity</h3>
<p>Almost every system asks, “who are you?” The answer usually comes from a central <b>identity system</b>. In many companies this is Microsoft Active Directory on premises, or Microsoft Entra ID (formerly Azure Active Directory) in the cloud. Others use Okta, Google Workspace or similar products.</p>
<p>Identity is the new perimeter. If an attacker steals a valid username and password, they do not have to break anything; they simply log in. For this reason identity logs, such as successful and failed sign-ins, password changes and new administrators, are among the most valuable logs a SOC reads.</p>
<h3>4. Network</h3>
<p>The <b>network</b> connects everything. It includes switches, routers, wireless access points, <b>firewalls</b> that allow or block traffic, <b>VPNs</b> that let people connect from home, and <b>proxies</b> that control web browsing. Network devices log which computer talked to which other computer, on which port, and whether it was allowed.</p>
<h3>5. Email and collaboration</h3>
<p>Email remains the favourite way in for attackers, because it reaches people directly. Email security tools log suspicious messages, blocked attachments and reported phishing. Chat and file-sharing tools, such as Teams, Slack and Google Drive, log who shared what with whom.</p>
<h3>6. Cloud and software-as-a-service</h3>
<p>Many companies now run servers and storage in the cloud, in services such as Amazon Web Services, Microsoft Azure or Google Cloud, and use online products such as customer-management systems. These produce their own audit logs, for example “someone created a new access key” or “a storage bucket was made public”. Much cloud security work is reading these logs.</p>
<h2>Where logs come from</h2>
<p>The following table shows the typical log sources and why a SOC cares about each.</p>
<table><tr><th>Source</th><th>Example logs</th><th>Why it matters</th></tr>
<tr><td>Windows endpoints and servers</td><td>Logons, new processes, services, scheduled tasks, PowerShell</td><td>Shows how attackers execute and persist</td></tr>
<tr><td>Linux servers</td><td>SSH logins, sudo use, cron, application logs</td><td>Shows access and administrator activity</td></tr>
<tr><td>Identity system</td><td>Sign-ins, password resets, group changes</td><td>Shows stolen or abused accounts</td></tr>
<tr><td>Firewall and VPN</td><td>Allowed and denied connections, VPN sign-ins</td><td>Shows scanning and unusual remote access</td></tr>
<tr><td>Web proxy and DNS</td><td>Websites visited, names looked up</td><td>Shows malware calling home</td></tr>
<tr><td>Email security</td><td>Phishing detections, clicked links</td><td>Shows the most common entry point</td></tr>
<tr><td>Cloud audit logs</td><td>Resource creation, permission changes</td><td>Shows cloud misuse</td></tr>
<tr><td>Endpoint protection</td><td>Malware found, blocked, quarantined</td><td>Shows attacks the antivirus noticed</td></tr></table>
<h2>Two ideas every analyst learns early</h2>
<p><b>The attack surface.</b> The attack surface is the sum of all the places an attacker could try to get in: every open port, every user account, every email inbox, every cloud setting. Defenders try to make it smaller. Attackers look for the part nobody remembered.</p>
<p><b>Assets you did not know you had.</b> One of the most common findings in real security reviews is a forgotten server, an old test website or a former employee’s account that was never disabled. This is why companies keep an <b>asset inventory</b>, a list of what they own, and why scanning your own network is a defensive activity.</p>
<h2>Small company and large company</h2>
<p>A small business may have one office, twenty laptops and a few cloud services. Its security team might be one person who also does other work. A large enterprise may have hundreds of thousands of endpoints, thousands of servers, several clouds and a SOC with dozens of people.</p>
<p>The ideas are the same at both sizes. The differences are volume, the amount of automation needed, and how formal the processes are. If you can reason clearly about a small company, you can learn a large one quickly.</p>
<h2>Your lab as a miniature company</h2>
<p>When you build the lab in Module 1, each virtual machine stands for a piece of the picture above.</p>
<ul>
<li><b>win-victim</b> is an <b>employee laptop</b>. It is the endpoint where users work and where many attacks begin.</li>
<li><b>wazuh-server</b> is a <b>server</b>. It runs the SIEM, and also offers a remote login service so that you can attack it, like a real internet-facing server.</li>
<li><b>kali-attacker</b> plays the <b>threat</b>: an outside party trying to guess passwords and probe your systems.</li>
<li>The <b>host-only network</b> is the company <b>network</b>, kept private so that you can practise safely.</li>
</ul>
<p>The lab has no cloud and no identity system. We cover those ideas in later modules, but nothing you learn in the lab is wasted: logs, accounts, services, files and networks are the foundations underneath every larger system.</p>`,
takeaways:["Security exists to protect what the business needs most, its crown jewels.","A company has six broad layers: endpoints, servers, identity, network, email and collaboration, and cloud.","Identity logs are some of the most valuable, because stolen valid accounts are a common way in.","The attack surface is every place an attacker could try; forgotten assets are a frequent weakness.","Your lab is a miniature version of this picture, so skills transfer directly."],
quiz:[{q:"What are “crown jewels”?",o:["The most important assets to the business","Expensive laptops","Old passwords","Firewall rules"],a:0},{q:"Why are identity logs so valuable?",o:["Attackers often use stolen valid accounts","They are tiny","They never change","They replace firewalls"],a:0},{q:"In your lab, win-victim represents…",o:["An employee laptop","The firewall","The cloud","The attacker"],a:0}]},

{id:"r3",mod:"m2",title:"What Really Happens When You Log In",labs:["2-4","2-5"],
body:`<p class="lead">Logging in feels instant, but a surprising amount happens behind the screen. Understanding those steps is what lets you read a log line and say exactly what it means. This chapter follows one login on Linux and one on Windows.</p>
<h2>Authentication and authorisation</h2>
<p>Two words are often confused. <b>Authentication</b> answers “who are you?”, and is proved by something you know (a password), something you have (a phone or key) or something you are (a fingerprint). <b>Authorisation</b> answers “what are you allowed to do?” After you are authenticated, the system decides which files, programs and settings you may use.</p>
<p>Most attacks target authentication, because getting past it is cheaper than breaking the system itself. Most damage after a break-in depends on authorisation: an attacker with an administrator account can do far more than one with a normal account.</p>
<h2>A login on Linux: SSH</h2>
<p>When you type <code>ssh labuser@192.168.56.10</code>, the following steps occur.</p>
<ol>
<li>Your computer opens a TCP connection to port 22 on the server.</li>
<li>The server program, <b>sshd</b>, and your client agree on encryption, so that nobody watching the network can read the session.</li>
<li>sshd asks for a way to prove your identity: a password or a key.</li>
<li>sshd hands the decision to <b>PAM</b>, the Pluggable Authentication Modules. PAM checks the password against the system’s records and applies rules, for example “lock the account after too many failures”.</li>
<li>If PAM approves, sshd starts a shell for you, and a line is written to the log.</li>
</ol>
<p>On Ubuntu the log is <code>/var/log/auth.log</code>. A failure and a success look like this.</p>
<pre>Oct 27 10:12:01 wazuh-server sshd[1234]: Failed password for labuser from 192.168.56.50 port 4242 ssh2
Oct 27 10:12:09 wazuh-server sshd[1236]: Accepted password for labuser from 192.168.56.50 port 4244 ssh2</pre>
<p>Read each part: the time, the computer name, the program and its process number in brackets, and then the message, the account, the source address and the source port. The source port changes with every connection and is rarely useful. The <b>source address</b> and the <b>account</b> are the details you will use most.</p>
<h3>Other Linux events worth knowing</h3>
<ul>
<li><b>sudo</b> records which user ran which command as administrator. If an unexpected account runs <code>sudo</code>, that is worth a look.</li>
<li><b>su</b> switches to another user. Repeated failed <code>su</code> attempts often mean someone is trying to become root.</li>
<li><b>Account changes</b>, such as <code>useradd</code> or edits to <code>/etc/passwd</code>, are logged and are also tracked by file integrity monitoring.</li>
<li><b>cron</b> records scheduled jobs. Attackers use cron to return after a reboot.</li>
</ul>
<h2>A login on Windows</h2>
<p>Windows does the same work with different parts. When you press the keys at the sign-in screen, the <b>Winlogon</b> process collects your credentials and passes them to the <b>Local Security Authority</b>, whose process is called <b>LSASS</b>. LSASS checks the password locally, or for company accounts it asks a <b>domain controller</b> using a protocol called <b>Kerberos</b> or an older one called <b>NTLM</b>. If it succeeds, Windows creates a <b>logon session</b> and starts your desktop.</p>
<p>LSASS is important to defenders because it holds secrets in memory while people are logged in. That is why attackers often try to read its memory to steal credentials, and why security tools watch for programs that touch it.</p>
<h3>The events to learn first</h3>
<table><tr><th>Event ID</th><th>Meaning</th><th>Why it matters</th></tr>
<tr><td>4624</td><td>An account logged on successfully</td><td>Who is in, from where, and how</td></tr>
<tr><td>4625</td><td>An account failed to log on</td><td>Password guessing leaves many of these</td></tr>
<tr><td>4634 / 4647</td><td>Logoff</td><td>Helps measure how long a session lasted</td></tr>
<tr><td>4648</td><td>Logon with explicit credentials</td><td>Seen when someone uses another account’s password</td></tr>
<tr><td>4672</td><td>Special privileges assigned to a new logon</td><td>An administrator-level logon</td></tr>
<tr><td>4688</td><td>A new process was created</td><td>Shows which programs ran, and with command lines if enabled</td></tr>
<tr><td>4720</td><td>A user account was created</td><td>Attackers create accounts to stay in</td></tr>
<tr><td>4732</td><td>A member was added to a local group</td><td>Used to become an administrator</td></tr></table>
<h3>Logon types: the detail that separates normal from suspicious</h3>
<p>Inside event 4624 there is a field called <b>Logon Type</b>, a number that says how the person logged in. Learn these four, because they appear in almost every Windows investigation.</p>
<ul>
<li><b>Type 2, interactive:</b> someone sat at the keyboard.</li>
<li><b>Type 3, network:</b> a connection to a shared folder or similar service. It is very common and usually harmless.</li>
<li><b>Type 5, service:</b> a Windows service started under an account.</li>
<li><b>Type 10, remote interactive:</b> someone connected with Remote Desktop. A type 10 logon at 3 a.m. on a laptop whose owner is asleep is the kind of detail that triggers an investigation.</li>
</ul>
<h3>Why a logon failed</h3>
<p>Event 4625 also explains the failure in a <b>Status</b> and <b>Sub Status</b> code. Two are worth remembering: <code>0xC0000064</code> means the user name does not exist, and <code>0xC000006A</code> means the user name is right but the password is wrong. An attacker guessing common names against a system will generate many of the first kind; an attacker who already knows valid names will generate the second.</p>
<div class="note"><b>Field note: noise is normal</b>On a real internet-facing system you will see failed logins every hour, all day, from all over the world. Bots do this constantly. The failures alone are not the alarm. The alarm is a <b>change in pattern</b>: a failure burst against a real account, followed by a success from the same address.</div>
<h2>What a log line is not</h2>
<p>A log line is evidence, not truth. It was written by a program that may have been tricked, misconfigured or stopped. A log can be missing because logging was off, because disk space ran out, or because an attacker deleted it. This is why security teams send logs to a central server as they are created: a copy that the attacker cannot reach is much more trustworthy.</p>
<p>It is also why you should never assume “no logs” means “nothing happened”. Ask first whether the log source was working at that time.</p>
<h2>Putting it together</h2>
<p>When you reach the logging lesson in Module 2, you will create a failed login on each system and find it. Notice how each step above leaves a trace. The more of those traces you can connect, the less any single alert has to prove on its own.</p>`,
takeaways:["Authentication proves who you are; authorisation decides what you may do.","On Linux, sshd and PAM handle SSH logins and write to auth.log.","On Windows, events 4624 and 4625 show successful and failed logons, and the Logon Type tells you how the person connected.","Failed logins from the internet are normal noise; a change of pattern is the real signal.","Logs are evidence, not proof: always ask whether the log source was working."],
quiz:[{q:"Windows Logon Type 10 means…",o:["Remote Desktop (remote interactive) logon","A service started","Someone at the keyboard","A network share"],a:0},{q:"Which statement is true about authentication?",o:["It answers who you are","It decides what you may do","It is the same as authorisation","It only exists on Linux"],a:0},{q:"Why send logs to a central server?",o:["A copy the attacker cannot easily alter is more trustworthy","To use more disk","To slow attackers by 1 second","It is required by SSH"],a:0}]},

{id:"r4",mod:"m2",title:"Networking for Defenders",labs:["2-3"],
body:`<p class="lead">You do not need to become a network engineer to work in security, but you do need to read network activity fluently. This chapter explains the handful of ideas behind almost every network-related alert.</p>
<h2>Why networks matter to a defender</h2>
<p>Attackers almost never touch a computer physically. They reach it across a network, from a scan, a login attempt or a malicious download. When they have stolen something, it leaves by the network as well. So network knowledge lets you answer two questions in every investigation: <b>where did this come from?</b> and <b>where did it go?</b></p>
<h2>Addresses and groups of addresses</h2>
<p>Every device on a network has an <b>IP address</b>. In the version you meet most often, IPv4, it is four numbers from 0 to 255 separated by dots, such as <code>192.168.56.10</code>. Think of it as a street address.</p>
<p>Addresses are grouped into <b>subnets</b>. The notation <code>192.168.56.0/24</code> means “every address that begins with 192.168.56”, which is 256 addresses. Devices on the same subnet can talk to each other directly. To reach a different subnet, traffic goes through a <b>gateway</b>, usually a router.</p>
<p>Some address ranges are <b>private</b>. They are used inside homes and companies and are not reachable from the open internet. These are <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code> and <code>192.168.0.0/16</code>. When you see a private address in a log, the traffic came from inside a network. When you see any other address, it is a <b>public</b> address and could be anyone in the world.</p>
<h3>NAT: sharing one public address</h3>
<p>A home or office usually has just one public address, shared by every device behind the router. The router translates between them. This is <b>NAT</b>, network address translation. In your lab, the NAT adapter does the same job for the virtual machines. For defenders, NAT has a practical effect: thousands of different people may appear in logs as a single address. This is the reason blocking an address can punish innocent users.</p>
<h2>Ports and protocols</h2>
<p>An address finds the computer. A <b>port</b> finds the service running on it. A single server may offer a website on port 443, remote login on port 22 and a database on port 3306, all at the same address.</p>
<p>Traffic travels using a <b>protocol</b>, an agreed set of rules. Two carry most of the load.</p>
<ul>
<li><b>TCP</b> is careful. It sets up a connection with a three-step <b>handshake</b> (the client says SYN, the server replies SYN-ACK, the client confirms with ACK), then delivers data in order and checks that it arrived. Web pages, logins and email use TCP.</li>
<li><b>UDP</b> is fast and casual. It sends data without setting up a connection or checking delivery. Name lookups, video calls and some streaming use UDP.</li>
</ul>
<p>The following ports are worth learning by heart, because you will see them constantly.</p>
<table><tr><th>Port</th><th>Service</th><th>What defenders think about</th></tr>
<tr><td>22</td><td>SSH</td><td>Password guessing; stolen keys</td></tr>
<tr><td>53</td><td>DNS</td><td>Data hidden in name lookups; malware finding its controller</td></tr>
<tr><td>80 and 443</td><td>Web</td><td>Web attacks; downloads; unusual destinations</td></tr>
<tr><td>445</td><td>Windows file sharing (SMB)</td><td>Spreading between Windows computers</td></tr>
<tr><td>3389</td><td>Remote Desktop</td><td>One of the most attacked services when exposed</td></tr>
<tr><td>1514 and 1515</td><td>Wazuh agents</td><td>Your own monitoring traffic</td></tr></table>
<h2>DNS: the internet’s phone book</h2>
<p>People remember names; computers need numbers. The <b>Domain Name System</b>, DNS, translates a name such as <code>example.com</code> into an address. Almost every action on a computer starts with a DNS lookup, and the logs of those lookups tell a story. Malware needs to find its controller, and it usually does so by name. If a laptop in your company suddenly looks up a name that is random-looking, such as <code>x7f9q2k.example</code>, hundreds of times, that is worth an investigation.</p>
<h2>HTTP, HTTPS and TLS</h2>
<p>Web traffic uses <b>HTTP</b>. Modern sites use <b>HTTPS</b>, which is HTTP wrapped in encryption called <b>TLS</b>. Encryption protects users, but it also means a defender watching the wire cannot read the content. What remains visible is the <b>metadata</b>: who talked to whom, when, for how long and how much data moved. A great deal of detection runs on metadata alone.</p>
<h2>Firewalls and what they log</h2>
<p>A <b>firewall</b> allows or blocks connections by rules, for example “allow outside users to reach port 443 on the web server, block everything else”. Firewalls log allowed and denied connections. Reading these logs, you can spot <b>scanning</b>, which looks like one address trying many ports in a short time, and <b>unusual outbound traffic</b>, such as a database server suddenly contacting an unknown address.</p>
<div class="note"><b>Field note: outbound traffic is where attackers slip up</b>Many companies carefully block what comes in and barely watch what goes out. Yet once an attacker is inside, they have to talk to their own systems to receive commands and send data out. Looking at outbound connections is one of the best habits you can build.</div>
<h2>What a scan looks like</h2>
<p>When you run <code>nmap</code> against your lab in Module 2, you will do what real attackers do first: you will knock on many doors to see which are open. On the wire this is a burst of connection attempts to different ports from one address. A firewall or network sensor can see it; a host-based tool such as Wazuh usually cannot, because it reads logs on the computer, and a closed port writes no log. This is not a weakness of Wazuh; it is a reminder that different tools see different things. Mature teams combine several.</p>
<h2>Network tools you will use in the lab</h2>
<table><tr><th>Question</th><th>Linux command</th><th>Windows command</th></tr>
<tr><td>What is my address?</td><td><code>ip a</code></td><td><code>ipconfig</code></td></tr>
<tr><td>Can I reach that machine?</td><td><code>ping</code></td><td><code>ping</code></td></tr>
<tr><td>Which ports am I listening on?</td><td><code>sudo ss -tulpn</code></td><td><code>netstat -ano</code></td></tr>
<tr><td>Is a specific port open?</td><td><code>nc -zv IP PORT</code></td><td><code>Test-NetConnection IP -Port PORT</code></td></tr>
<tr><td>What is open on a target?</td><td><code>nmap IP</code></td><td>(use Kali for this)</td></tr></table>
<h2>Putting it together</h2>
<p>If you remember only four things, remember these. An address finds a computer and a port finds a service. TCP sets up a connection and UDP does not. Encryption hides content but not metadata. And a single public address can hide many people. With these, most network alerts become readable.</p>`,
takeaways:["An IP address finds a computer; a port finds the service on it.","A /24 subnet holds 256 addresses; private ranges are used inside networks.","NAT lets many users share one public address, so blocking an address can hurt innocent people.","Encryption hides content, but metadata still reveals who talked to whom.","Watching outbound traffic is one of the best ways to catch an attacker who is already inside."],
quiz:[{q:"Which port is Remote Desktop?",o:["3389","22","53","443"],a:0},{q:"What can a defender still see in HTTPS traffic?",o:["Metadata such as who talked to whom","Passwords in clear text","Page content","Nothing at all"],a:0},{q:"Why is it risky to block a single public IP address?",o:["Many people may share it through NAT","Blocking is illegal","It speeds up the attacker","It deletes logs"],a:0}]},

{id:"r5",mod:"m3",title:"How Attackers Think: Anatomy of Real-World Attacks",labs:["3-2"],
body:`<p class="lead">If you want to catch attackers, learn how they work. This chapter looks at three composite stories, each based on patterns that incident responders describe over and over, and shows where a defender could have noticed.</p>
<h2>A few truths about attackers</h2>
<p>Popular films show lone geniuses breaking through impossible defences. Reality is plainer.</p>
<ul>
<li><b>Most attackers want money.</b> They choose the easiest route to it. If a weak password works, they will not waste an advanced technique.</li>
<li><b>Most attacks are automated.</b> Bots scan the internet for known weaknesses all day. You are not being singled out; you are being found.</li>
<li><b>Attackers reuse what works.</b> Techniques repeat, which is why catalogues such as MITRE ATT&CK exist, and why detections written for one attack catch many others.</li>
<li><b>Attackers make mistakes.</b> They leave logs, files and odd connections. Defence is partly the art of noticing those traces.</li>
</ul>
<h2>Story one: from a single email to a locked company</h2>
<p>A small manufacturing firm receives an email that looks like an invoice. A staff member, Tola, opens the attachment. It asks her to “enable content”. She does, and a program quietly installs itself.</p>
<p>The program contacts a server on the internet and waits. Over the next three days, the attacker, working from a distance, looks around Tola’s computer. They find saved passwords in her browser, one of which belongs to an administrator of the file server. They log in to the file server with it, copy a folder of customer data, and then, on a Friday night when nobody is watching, run a program that encrypts every file and leaves a note demanding payment.</p>
<p>Count the opportunities to detect this.</p>
<ol>
<li>The email gateway could have blocked or flagged the attachment.</li>
<li>When the program started, endpoint protection or process logs could have shown an office program launching an unusual one.</li>
<li>The callout to the internet created DNS and proxy logs.</li>
<li>The administrator login from Tola’s computer, which never normally logs in to the file server, was an anomaly.</li>
<li>Copying a large folder out of the network was unusual.</li>
<li>Thousands of files changing within minutes is exactly what file integrity monitoring and ransomware rules look for.</li>
</ol>
<p>Each stage was a chance. Defenders do not need to catch every step; they need to catch <b>any</b> step early enough.</p>
<h2>Story two: the server nobody remembered</h2>
<p>A company once ran a small web application for a marketing campaign. The campaign ended, but the server stayed on, with its remote login open to the internet and a simple password. Within days of being switched on, bots had found it. After a few thousand guesses, one succeeded.</p>
<p>The attacker did not steal data. They installed a program that used the server’s processor to mine cryptocurrency, which slowed the machine and raised the cloud bill. The company noticed only when the invoice tripled.</p>
<p>What would have helped? An <b>asset inventory</b> that showed the server still existed. A rule that alerted on a login success after many failures. File monitoring on the folders where programs are installed. And simply switching off what is no longer needed. Many real incidents are neither clever nor rare; they are neglected systems meeting automated attacks.</p>
<h2>Story three: the insider</h2>
<p>A finance employee, about to leave the company after a dispute, copies a large set of files to a personal cloud storage account over several evenings. No malware is involved. Every action uses permissions the employee legitimately has.</p>
<p>This is a reminder that <b>not every incident comes from outside</b>, and that detection often depends on context rather than on malicious code. Useful signals include unusual volumes of data leaving, access at odd hours, and activity just before a resignation. Handling such a case also involves human resources and legal teams, and it shows why SOC analysts must treat investigations with discretion.</p>
<h2>The attack chain as a map for defenders</h2>
<p>In Module 3 you will study the attack chain in detail. For now, notice how the stories follow a similar order.</p>
<table><tr><th>Stage</th><th>Story one</th><th>Story two</th></tr>
<tr><td>Initial access</td><td>Phishing attachment</td><td>Guessed password on an exposed login</td></tr>
<tr><td>Execution</td><td>Installer runs on Tola’s PC</td><td>Attacker runs commands on the server</td></tr>
<tr><td>Persistence</td><td>Program survives restarts</td><td>Miner is set to start again after reboot</td></tr>
<tr><td>Credential access</td><td>Saved browser passwords</td><td>(already had a valid login)</td></tr>
<tr><td>Lateral movement</td><td>Admin login to the file server</td><td>(single server)</td></tr>
<tr><td>Impact</td><td>Ransomware</td><td>Resource theft</td></tr></table>
<h2>Why “assume breach” is a useful mindset</h2>
<p>Experienced defenders plan as though an attacker may already be inside. This is not pessimism. It changes the questions. Instead of only asking “how do we keep them out?” the team also asks “if one laptop were compromised, how quickly would we know, and what could that laptop reach?” Those questions lead to monitoring, segmentation and quick response, which are the subjects of this academy.</p>
<div class="note"><b>Field note: noise helps attackers</b>Attackers hide among normal activity. They use built-in tools such as PowerShell, so that their actions look like those of an administrator. A team that is already buried in false alerts will not spot the one odd command. This is why tuning, the careful removal of useless alerts, is a security activity and not just housekeeping.</div>
<h2>What to take into the lab</h2>
<p>In the case files, you will replay small versions of these stories: tampering with files and starting programs automatically in the first, and password guessing followed by a successful login in the second. When you see an alert, try to place it on the map. Ask yourself which stage it belongs to, and what the attacker would probably do next.</p>`,
takeaways:["Most attackers want money and choose the easiest route; many attacks are automated.","Real incidents often involve neglected systems, weak passwords and phishing rather than advanced tricks.","Each stage of an attack leaves traces, so you only need to catch one stage early.","Insider incidents need context and discretion, because the activity uses legitimate permissions.","“Assume breach” changes the question from keeping everyone out to noticing and limiting damage."],
quiz:[{q:"Why do defenders not need to catch every attack stage?",o:["Catching any stage early can stop the rest","Attackers only have one stage","Stages are invisible","Only the last stage matters"],a:0},{q:"What does an asset inventory help with?",o:["Finding forgotten systems","Guessing passwords","Blocking email","Encrypting files"],a:0},{q:"“Assume breach” means…",o:["Plan as though an attacker may already be inside","Give up on prevention","Turn off monitoring","Trust all users"],a:0}]},

{id:"r6",mod:"m3",title:"From Logs to Detections: How a SIEM Thinks",labs:["4-5"],
body:`<p class="lead">A SIEM can look like magic: logs go in, alerts come out. In fact it follows a small number of clear steps. Understanding them will make you better at using any SIEM, from the free one in this lab to the expensive ones you will meet in jobs.</p>
<h2>The pipeline</h2>
<p>Whatever the product, a SIEM does the same five things in order.</p>
<ol>
<li><b>Collect.</b> Logs are gathered from computers, devices and services, usually by an agent or by sending them to the SIEM directly.</li>
<li><b>Parse.</b> Each raw line is split into named fields: time, user, source address, action and so on.</li>
<li><b>Normalise.</b> Fields from different products are given common names, so that a failed login on Windows and a failed login on Linux can be searched in the same way.</li>
<li><b>Detect.</b> Rules and analytics look for patterns that suggest a problem.</li>
<li><b>Store and present.</b> Data is kept so that analysts can search it, and shown in dashboards and ticket queues.</li>
</ol>
<h2>Why parsing matters</h2>
<p>A raw log line is just text. To a computer, <code>Failed password for labuser from 192.168.56.50 port 4242 ssh2</code> is merely letters. Until it is parsed, you cannot ask a useful question such as “show me every failed login for this user from this address”. In Wazuh the <b>decoder</b> does the parsing. In Splunk it is done by field extractions, and in other products by parsers or connectors. The idea is the same.</p>
<p>Many SIEM projects fail here. A log source is connected but not parsed properly, so the data sits in the system and nobody can use it. Analysts say “we have the logs” when they mean “we have the text”. The two are very different.</p>
<h2>Kinds of detection</h2>
<h3>Signature or match rules</h3>
<p>The simplest rules look for a specific thing: a known bad address, a particular text in a log, a specific Event ID. They are easy to write and to understand. They are also easy for attackers to avoid if they know the exact pattern.</p>
<h3>Threshold rules</h3>
<p>These count. “Alert if there are eight failed logins from one address within two minutes.” Thresholds catch brute force, scanning and floods. The hard part is choosing the number: too low and you drown in noise, too high and slow attacks pass.</p>
<h3>Correlation rules</h3>
<p>These link different events. “Alert if a login succeeds within five minutes after a brute-force alert from the same address.” Correlation is where a SIEM becomes more than a search box, because it turns weak signals into a strong one. You will write such a rule in the SSH case file.</p>
<h3>Behavioural and statistical detection</h3>
<p>Some systems learn what is normal for each user and flag deviations: a login at an odd hour, a huge download, a new country. These can find attacks that no signature describes, but they need good data and careful tuning, and they produce explanations that analysts must judge.</p>
<h2>What makes a good detection</h2>
<p>A detection is a small product. Good ones share some qualities.</p>
<ul>
<li><b>Clear purpose.</b> You can say in one sentence what behaviour it looks for and why it matters.</li>
<li><b>Reliable data.</b> The logs it depends on are present and parsed.</li>
<li><b>Low noise.</b> Most alerts it creates should be worth reading.</li>
<li><b>Actionable.</b> The alert says what to check first.</li>
<li><b>Tested.</b> Someone has actually performed the behaviour and seen the alert fire.</li>
</ul>
<p>The last point is the one most often skipped. A rule that has never been tested may be silently broken. Throughout this academy you will trigger an attack and then look for the alert, so you build the habit of proving that a detection works.</p>
<h2>Severity, priority and context</h2>
<p>Every alert has a severity, a number or a label that says how serious the rule’s author thought the behaviour was. Wazuh uses levels from 0 to 15. But <b>severity is not priority</b>. Priority depends on context: which computer, which account, what time. A level 5 alert on the payroll server may deserve more attention than a level 12 alert on a test machine. Good teams add context, such as asset importance, to their alerts.</p>
<h2>Retention, cost and compliance</h2>
<p>Storing logs costs money, and some logs are very large. Teams decide how long to keep each source. Often there is a short period of fast, searchable storage, perhaps ninety days, and a longer period of cheaper archive. Some regulations require specific retention, for example one year for logs that cover payment systems. These are decisions about risk and money as much as technology, and security staff are often asked to justify them.</p>
<h2>Why SIEM projects disappoint</h2>
<p>People who work with SIEMs repeat the same warnings.</p>
<ul>
<li><b>Too many sources, too fast.</b> Connecting everything at once creates noise nobody can handle. Start with the most valuable logs.</li>
<li><b>No owner for tuning.</b> Rules decay as the company changes. Someone must be responsible for improving them every week.</li>
<li><b>No use cases.</b> A SIEM without a list of “what we want to catch” is an expensive log archive.</li>
<li><b>No response plan.</b> An alert is useless unless someone knows what to do when it fires.</li>
</ul>
<div class="note"><b>Field note: begin with use cases</b>Experienced teams start with a short list of attacker behaviours they most fear, for example password guessing on exposed systems, new administrators, and changes to critical files. They then ask which logs are needed to see each one and build only those first. That is the approach this academy follows.</div>
<h2>Common SIEM products</h2>
<p>Wazuh is free and open source, which makes it ideal for learning. Splunk, IBM QRadar, Microsoft Sentinel and Elastic Security are widely used in industry. Their screens and query languages differ, but each follows the pipeline above. When you move to another product, ask the same questions: where do logs come in, how are they parsed, how are detections written, and how are they tested?</p>`,
takeaways:["A SIEM collects, parses, normalises, detects, and stores logs.","Parsing turns text into fields; without it the data cannot be used.","Detections range from simple matches to thresholds, correlations and behavioural analytics.","A good detection has a clear purpose, reliable data, low noise, an action and a test.","Severity is not priority: context such as the asset and the account matters."],
quiz:[{q:"What does parsing do?",o:["Splits a log line into named fields","Deletes old logs","Encrypts logs","Sends email"],a:0},{q:"A rule that links a brute-force alert to a later successful login is a…",o:["Correlation rule","Match rule only","Backup","Firewall"],a:0},{q:"Why must a detection be tested?",o:["It may be silently broken","Tests slow attackers","It is a legal rule","Rules are always perfect"],a:0}]},

{id:"r7",mod:"m3",title:"Triage and Investigation: The Analyst’s Method",labs:["6-3"],
body:`<p class="lead">Tools find the alert. People decide what it means. This chapter teaches a method you can apply to any alert on any platform, so that your decisions are quick, consistent and easy to explain afterwards.</p>
<h2>Why a method matters</h2>
<p>Without a method, every alert feels like a fresh puzzle, and your conclusions depend on mood, tiredness and who happens to be watching. With a method, you ask the same questions every time. You become faster, you miss less, and your colleagues can follow your reasoning. A method also protects you: when someone asks later why you closed a ticket, you can show the steps.</p>
<h2>The seven questions</h2>
<p>Experienced analysts rarely write them down, but they always ask them.</p>
<ol>
<li><b>What exactly happened?</b> Read the alert, then read the underlying log. Do not trust the title alone.</li>
<li><b>Who or what is involved?</b> Which account, which computer, which source address.</li>
<li><b>When did it happen, and what happened around it?</b> Look at ten minutes before and after.</li>
<li><b>Is it normal here?</b> Is this typical for this user, this computer or this time of day?</li>
<li><b>What else is connected?</b> Other alerts, other computers, the same address or account elsewhere.</li>
<li><b>How bad could it be?</b> What does this account or computer have access to?</li>
<li><b>What should be done, and by whom?</b> Close, monitor, contain or escalate.</li>
</ol>
<h2>Pivoting: following the thread</h2>
<p>Investigation is a chain of small searches, each one based on a detail from the last. This is called <b>pivoting</b>. You start with a source address from an alert. You search for every event involving that address. You discover it also touched another computer, so you search that computer. You find an account, so you search the account. At each step the picture grows.</p>
<p>Good pivot points are <b>addresses</b>, <b>account names</b>, <b>computer names</b>, <b>file hashes</b> and <b>process names</b>. Write each new discovery down as you find it, because the list of what you know becomes your timeline.</p>
<h2>Building a timeline</h2>
<p>A timeline puts events in order. It is the single most useful investigation tool, because it turns a pile of alerts into a story. A simple table is enough.</p>
<table><tr><th>Time (UTC)</th><th>Source</th><th>Event</th><th>Meaning</th></tr>
<tr><td>10:12:01</td><td>Wazuh, rule 5760</td><td>Failed password for labuser from 192.168.56.50</td><td>First guess</td></tr>
<tr><td>10:12:45</td><td>Wazuh, rule 5763</td><td>Brute-force alert from the same address</td><td>Pattern confirmed</td></tr>
<tr><td>10:13:02</td><td>Wazuh, rule 5715</td><td>Successful login by labuser from the same address</td><td>Probable compromise</td></tr></table>
<p>Always use one time zone, usually UTC, and always note which computer’s clock produced each time. If two clocks disagree, your timeline will lie to you.</p>
<h2>Hypotheses and the danger of favourites</h2>
<p>As evidence arrives, you form a guess about what is happening: “this looks like password guessing.” Treat it as a <b>hypothesis</b>, not a conclusion. Ask what evidence would prove it wrong. If you can find a harmless explanation that fits all the facts, take it seriously.</p>
<p>Two mental traps catch many analysts. <b>Confirmation bias</b> is noticing only what supports your first idea. <b>Anchoring</b> is sticking to the first severity you assigned. The fix is simple: say aloud, “what else could explain this?”, and look for the one fact that does not fit.</p>
<h2>Preserving evidence</h2>
<p>Some incidents end in discipline, a legal case or an insurance claim. Even when they do not, good habits protect you.</p>
<ul>
<li>Record exact times and commands. Do not rely on memory.</li>
<li>Take screenshots of important screens, with the clock visible.</li>
<li>Copy relevant log lines into your notes instead of paraphrasing them.</li>
<li>Note the <b>hash</b> of any suspicious file before you move or change it.</li>
<li>Avoid changing a system more than needed before you have collected what you need, because actions such as rebooting can erase evidence in memory.</li>
</ul>
<h2>When to escalate</h2>
<p>Escalation is not a failure. A Tier 1 analyst who escalates a real incident quickly has done the job well. Escalate when any of the following is true.</p>
<ul>
<li>An <b>administrator or privileged account</b> is involved.</li>
<li>There is evidence of a <b>successful</b> compromise, not just an attempt.</li>
<li>The activity <b>spreads</b> to more than one computer.</li>
<li><b>Sensitive data</b> may be affected.</li>
<li>You are <b>unsure</b> and the potential impact is high.</li>
</ul>
<p>When you escalate, hand over a short, complete summary: what you saw, when, what you checked, what you have done, and what you recommend. The next person should not have to start again.</p>
<h2>Containment: stop the damage, keep the evidence</h2>
<p>Containment means limiting what the attacker can do right now. Typical steps are disabling an account, ending its sessions, isolating a computer from the network, or blocking an address. Choose the smallest action that stops the harm, and record what you did and when. Deleting accounts or wiping machines is usually a later step, because it destroys evidence and can hide how the attacker got in.</p>
<div class="note"><b>Field note: ask before you break production</b>Isolating a server that runs the company’s payment system may stop an attacker but also stop the business. In real teams, some containment actions need approval from a manager or the system owner. Learn who to call and how to reach them quickly, including at night.</div>
<h2>Closing a ticket well</h2>
<p>A closing note should let a stranger understand the decision. Compare these two.</p>
<p><b>Poor:</b> “False positive.”</p>
<p><b>Good:</b> “Closed as false positive. The source address belongs to the finance backup server (asset record 112). The activity matches the nightly backup job in the change calendar. No other related alerts in the previous 24 hours. Suggested tuning: exclude this program in rule 100210.”</p>
<p>The second note takes thirty seconds longer and saves hours later.</p>
<h2>Applying the method in the lab</h2>
<p>In the SSH case file you will walk through exactly this method. You will collect evidence on the server, build a timeline, decide whether the account was compromised, practise containment and then undo it, and write a report. Try to name each of the seven questions as you answer it.</p>`,
takeaways:["A method makes decisions faster, consistent and explainable.","Ask seven questions: what, who, when, normal, connected, how bad, and what to do.","Pivot from one detail to the next, and keep a timeline in a single time zone.","Treat first impressions as hypotheses and look for evidence that would disprove them.","Contain with the smallest effective action, record everything, and escalate early when privileged accounts or spread are involved."],
quiz:[{q:"What is pivoting?",o:["Using one detail to search for the next","Rebooting a server","Writing a rule","Closing a ticket"],a:0},{q:"Why use one time zone in a timeline?",o:["Different clocks can mislead you","It is faster to type","Windows requires it","It deletes logs"],a:0},{q:"Which is a good reason to escalate?",o:["A privileged account is involved","The alert is old","The log is long","It is Monday"],a:0}]},

{id:"r8",mod:"m4",title:"Wazuh Deep Dive: Inside the Machine",labs:["4-2","4-5"],
body:`<p class="lead">In Module 4 you will install Wazuh and use it. This chapter opens the lid, so that when something behaves unexpectedly you know which part to look at. It is more detailed than most beginner material, and it is worth reading twice.</p>
<h2>The big picture again</h2>
<p>Wazuh has three central components and one agent. The <b>Wazuh server</b> receives and analyses data. The <b>Wazuh indexer</b> stores and searches alerts, and is based on OpenSearch. The <b>Wazuh dashboard</b> is the web interface. The <b>agent</b> runs on monitored computers. In your lab the three central components share one machine; in a larger company they are separated and often duplicated.</p>
<h2>What the agent does</h2>
<p>The agent is a small set of programs on the monitored computer. It does several jobs.</p>
<ul>
<li><b>Log collection.</b> It reads log files and, on Windows, event channels, and sends new lines to the server.</li>
<li><b>File integrity monitoring.</b> The module called <b>syscheck</b> records hashes and attributes of files and registry keys and reports changes.</li>
<li><b>Inventory.</b> It reports installed software, running processes, open ports and hardware, which supports vulnerability detection.</li>
<li><b>Security configuration assessment.</b> It checks settings against published benchmarks.</li>
<li><b>Active response.</b> It runs scripts, such as blocking an address, when the server asks it to.</li>
</ul>
<p>The agent connects to the server on port 1514 and sends data over an encrypted channel. Before the first connection, it <b>enrols</b> on port 1515 and receives a unique key, stored in a file called <code>client.keys</code>. That is why cloning a machine with the agent installed causes trouble: two machines share one identity.</p>
<h2>What happens inside the server</h2>
<p>Several processes cooperate on the server. You do not need all their names, but three help.</p>
<ul>
<li><b>remoted</b> accepts connections from agents and receives their data.</li>
<li><b>analysisd</b> is the brain. It decodes events, applies rules and creates alerts.</li>
<li><b>execd</b> runs active responses when an alert asks for one.</li>
</ul>
<p>When you restart <code>wazuh-manager</code>, these processes restart. When you check your configuration with <code>wazuh-analysisd -t</code>, you are asking analysisd to read your rules and confirm that they make sense.</p>
<h2>Decoders and rules in detail</h2>
<p>An incoming event first passes through <b>pre-decoding</b>, which separates the standard header, such as the timestamp and host name. The <b>decoder</b> then identifies the program and extracts fields using regular expressions. The extracted fields are given names such as <code>srcip</code>, <code>srcuser</code> and <code>dstuser</code>.</p>
<p>The <b>rules</b> are written in XML and form a hierarchy. Many rules begin with <code>if_sid</code>, which means “only consider me if this other rule already matched”. This creates families of rules that grow more specific. For example, a general rule recognises any SSH message, a more specific one recognises failed passwords, and a still more specific one recognises many failures in a short time.</p>
<p>The most useful rule options are:</p>
<table><tr><th>Option</th><th>Meaning</th></tr>
<tr><td><code>id</code></td><td>The rule number. Your own rules must use 100000 or higher.</td></tr>
<tr><td><code>level</code></td><td>0 to 15; how serious. Level 0 means “match, but do not alert”.</td></tr>
<tr><td><code>if_sid</code></td><td>Build on another rule</td></tr>
<tr><td><code>match</code> and <code>regex</code></td><td>Look for plain text or a pattern in the log</td></tr>
<tr><td><code>field</code></td><td>Test a decoded field, such as the file path or user</td></tr>
<tr><td><code>frequency</code> and <code>timeframe</code></td><td>Fire only after N matches within a number of seconds</td></tr>
<tr><td><code>if_matched_sid</code></td><td>Correlate with an earlier rule</td></tr>
<tr><td><code>same_source_ip</code></td><td>Require both events to share a source address</td></tr>
<tr><td><code>group</code></td><td>Labels such as <code>authentication_failed</code>, used for searching and for active response</td></tr>
<tr><td><code>mitre</code></td><td>Tags the alert with ATT&CK technique IDs</td></tr></table>
<h2>Where the built-in and custom rules live</h2>
<p>Built-in rules are in <code>/var/ossec/ruleset/rules/</code>. Wazuh updates replace these files, so you should <b>never edit them</b>. Your own rules go in <code>/var/ossec/etc/rules/local_rules.xml</code>, which updates leave alone. If you want to change a built-in rule’s behaviour, you write a new rule that overrides it, rather than editing the original.</p>
<h2>From alert to screen</h2>
<p>When a rule fires, the server writes the alert in JSON form to <code>/var/ossec/logs/alerts/alerts.json</code>. A shipper reads that file and sends the alerts to the indexer, which stores them. The dashboard then queries the indexer. This explains an important troubleshooting fact: if an alert appears in <code>alerts.json</code> but not on the dashboard, the problem is after the server, in the shipper or the indexer. If it is not in <code>alerts.json</code>, the problem is earlier: the agent, the network, the decoder or the rule.</p>
<h2>A troubleshooting map</h2>
<table><tr><th>Symptom</th><th>Where to look first</th></tr>
<tr><td>Agent never connects</td><td>Network and ports 1514 and 1515; the agent’s <code>ossec.log</code>; version mismatch</td></tr>
<tr><td>Event not appearing at all</td><td>Is the agent Active? Is the log source configured in the agent’s <code>ossec.conf</code>?</td></tr>
<tr><td>Event arrives but no alert</td><td>Use <code>wazuh-logtest</code>: is there a decoder, and does any rule match?</td></tr>
<tr><td>Alert in <code>alerts.json</code> but not on the dashboard</td><td>Shipper and indexer services; disk space</td></tr>
<tr><td>Manager will not start after an edit</td><td>XML error; read <code>/var/ossec/logs/ossec.log</code></td></tr></table>
<h2>Central configuration with agent groups</h2>
<p>Editing configuration files on every computer does not scale. Wazuh lets you place computers in <b>groups</b>, and push a shared configuration from the server to each member. The shared file is called <code>agent.conf</code>. You can make sections that apply only to a particular operating system. This is how a company can roll out the same file integrity settings to a thousand Windows laptops at once.</p>
<h2>The API and automation</h2>
<p>Wazuh also has a REST API on port 55000. It lets scripts list agents, restart them, read rules and more. Teams use it to automate onboarding or to build reports. You will not need it for the first modules, but it is the doorway to automation.</p>
<div class="note"><b>Field note: version discipline</b>The manager must be the same version as or newer than the agents. Teams plan upgrades in order: indexer, then server, then dashboard, then agents. Disabling the package repository after installation, as you do in the lab, prevents accidental upgrades during routine updates.</div>
<h2>Why this knowledge pays off</h2>
<p>When something breaks, a beginner restarts everything and hopes. A professional asks which part of the pipeline the problem sits in, tests that part, and fixes it. The map in this chapter is that habit in a form you can reuse.</p>`,
takeaways:["Agents collect logs, monitor files, report inventory and run responses; they enrol on 1515 and send data on 1514.","The server’s analysis engine decodes events, applies rules and creates alerts.","Rules form hierarchies with if_sid; your own rules live in local_rules.xml and use IDs of 100000 or higher.","If an alert is in alerts.json but not on the dashboard, look at the shipper and indexer.","Groups and agent.conf let you configure many agents centrally."],
quiz:[{q:"Where should your own rules be written?",o:["/var/ossec/etc/rules/local_rules.xml","/var/ossec/ruleset/rules/","On the agent","In the browser"],a:0},{q:"An alert is in alerts.json but missing in the dashboard. Where is the problem?",o:["After the server: shipper or indexer","The agent","Your keyboard","The rule"],a:0},{q:"What does if_sid do?",o:["Builds a rule on top of another rule","Blocks an address","Reboots the agent","Deletes a decoder"],a:0}]},

{id:"r9",mod:"m4",title:"Running Wazuh in a Real Company",labs:["4-4"],
body:`<p class="lead">A lab teaches you how a tool works. A real deployment teaches you what it costs to keep it working. This chapter describes how organisations actually run Wazuh, and the decisions that matter beyond the installation command.</p>
<h2>Deciding what to monitor</h2>
<p>The first decision is not technical. It is: <b>what are we trying to protect, and what do we want to catch?</b> A company that handles card payments will care about change detection on payment servers. A software company will care about the build servers and code repositories. A hospital will care about systems that hold patient records. The answers shape which computers get agents first and what rules matter.</p>
<p>A sensible rollout begins with a pilot: ten or twenty computers of different types, a handful of use cases, and a few weeks of learning. Only then does the team expand.</p>
<h2>Sizing and architecture</h2>
<p>The quickstart, with everything on one server, suits small environments of up to a hundred or so agents, with about ninety days of searchable alerts, if the machine is sized well. Beyond that, a <b>distributed</b> deployment is recommended.</p>
<table><tr><th>Size</th><th>Typical design</th></tr>
<tr><td>Lab or small office</td><td>All-in-one on one server</td></tr>
<tr><td>Medium company</td><td>Separate server, indexer and dashboard machines</td></tr>
<tr><td>Large company</td><td>Server cluster with a load balancer, multi-node indexer cluster, dashboard behind a reverse proxy</td></tr></table>
<p>Two resources limit most deployments: <b>memory and disk on the indexer</b>. The more agents and the more verbose the logging, the more alerts per day, and the more storage you need. Teams estimate the daily volume during the pilot and multiply by the retention period.</p>
<h2>Getting agents onto thousands of computers</h2>
<p>Nobody installs agents by hand across a company. Typical methods are:</p>
<ul>
<li><b>Group Policy</b> or <b>Microsoft Intune</b> or <b>SCCM</b> for Windows laptops and servers.</li>
<li><b>Ansible</b>, <b>Puppet</b> or shell scripts for Linux servers.</li>
<li><b>Golden images</b> for virtual machines, with the agent installed but <b>not enrolled</b>, so each new machine enrols with a unique identity on first boot.</li>
</ul>
<p>The installer accepts options such as the manager address, the agent name and the group, so one command can place each machine in the correct group from the start.</p>
<h2>Groups: the habit that saves months</h2>
<p>Make groups early, for example <code>windows-workstations</code>, <code>windows-servers</code>, <code>linux-web</code> and <code>linux-database</code>. Each group gets its own shared configuration. Web servers watch their web folders; domain controllers watch different things. When the security team decides to monitor a new path, they change one file and every member receives it. Without groups, every change becomes a project.</p>
<h2>Tuning is the real work</h2>
<p>The default rules are a good start, but every environment produces its own noise. A typical tuning cycle looks like this.</p>
<ol>
<li>Let the system run for a week or two without changes.</li>
<li>List the ten noisiest rules, and the ten noisiest computers.</li>
<li>For each, decide: is it useful, harmless or misconfigured?</li>
<li>Reduce the level of harmless rules, add exceptions for known software, or fix the misconfiguration.</li>
<li>Raise the level of rules that matter more in this company, for example a change to a payment configuration file.</li>
<li>Repeat monthly.</li>
</ol>
<p>Record each change and the reason. Months later, when someone asks why an alert stopped appearing, the record is your protection.</p>
<h2>People and access</h2>
<p>Wazuh includes <b>role-based access control</b>. Analysts may read alerts but not change rules. Engineers may edit rules. Only a few administrators manage users. This is not just tidiness. If an attacker steals an analyst’s account, you want the damage to be limited. Replace the default passwords, use individual accounts rather than a shared <code>admin</code>, and keep the management ports away from the public internet.</p>
<h2>Integrating with the rest of the security stack</h2>
<p>Wazuh rarely works alone. Common integrations include:</p>
<ul>
<li><b>Email and chat notifications</b> for high-severity alerts.</li>
<li><b>Ticketing and case management</b> tools, so every alert becomes a tracked item.</li>
<li><b>Threat intelligence</b> services, for checking file hashes and addresses.</li>
<li><b>Automation platforms</b> such as n8n or Shuffle, which can enrich an alert and take simple actions.</li>
</ul>
<p>The principle is to send each alert to the place where someone will actually act on it.</p>
<h2>Retention, backup and recovery</h2>
<p>Decide how long to keep alerts, and whether to keep raw logs. Take regular backups of configuration (<code>/var/ossec/etc</code>, including your rules and groups) and of the indexer through snapshots. Test a restore at least once. A backup nobody has tested is only a hope.</p>
<h2>Monitoring the monitor</h2>
<p>A security tool that fails silently is dangerous. Teams watch for:</p>
<ul>
<li>agents that stop reporting, which can mean a fault or an attacker who stopped the service;</li>
<li>indexer disk space and memory;</li>
<li>delays between an event and its alert;</li>
<li>failed log shipping.</li>
</ul>
<h2>Costs and trade-offs</h2>
<p>Wazuh is free to license, but it is not free to run. You pay in machines, in storage and, above all, in the time of people who tune and maintain it. Commercial products charge licence fees and often reduce some of the maintenance work, but they too need tuning. This is why many companies choose Wazuh for coverage and learning, and combine it with other tools where they need specific features.</p>
<div class="note"><b>Field note: the first month</b>New deployments usually produce thousands of alerts in the first week. That is expected. The team’s success in that month is judged by how much noise they remove and how many real use cases they can show working, not by how many agents they install.</div>
<h2>What this means for your lab</h2>
<p>Your lab is deliberately small, but it already practises the right habits: you snapshot before changes, you verify each step, you record the exact configuration lines you added, and you test detections by running the behaviour. These habits are what separate a hobby setup from a professional one.</p>`,
takeaways:["Start by deciding what to protect and what to catch, then pilot with a small group.","Use distributed deployments beyond small environments, and size the indexer for volume times retention.","Roll out agents with Group Policy, Intune, Ansible or golden images, and organise them into groups from day one.","Tuning is continuous work: reduce harmless noise, raise important alerts and record why.","Control access, back up configuration, and monitor the monitor."],
quiz:[{q:"Why create agent groups early?",o:["One configuration change reaches many agents","It makes Wazuh free","It hides alerts","It is required for ping"],a:0},{q:"What should a golden image contain regarding the agent?",o:["The agent installed but not enrolled","A copied client.keys file","No operating system","The dashboard password"],a:0},{q:"What judges success in the first month?",o:["Noise removed and working use cases","Number of alerts created","Size of the server","Number of dashboards"],a:0}]},

{id:"r10",mod:"m5",title:"File Integrity Monitoring in the Real World",labs:["fim-1","fim-3"],
body:`<p class="lead">Before you build tripwires in the BrightMart case file, it is worth understanding why companies buy and run file integrity monitoring, what they actually watch, and why it so often fails in practice. This chapter gives you the context that the hands-on lessons assume.</p>
<h2>The simple idea, and why it is old</h2>
<p>File integrity monitoring, usually shortened to <b>FIM</b>, is one of the oldest ideas in security. You record a fingerprint of every important file while the system is healthy, and you check again later. If a fingerprint has changed, someone or something has modified the file. In the 1990s, administrators did this with scripts and tools that ran at night. Today it is built into products such as Wazuh and into many commercial endpoint tools.</p>
<p>The idea is lasting because attackers cannot avoid changing things. To stay on a computer, they must plant a program, change a setting or alter a file. FIM does not need to know what the attacker’s program is. It only needs to know that something changed where nothing should have.</p>
<h2>Why companies are required to do it</h2>
<p>Many organisations run FIM not only because it is good security, but because a standard says they must. The best-known example is <b>PCI DSS</b>, the security standard for organisations that handle payment cards. It requires a change-detection mechanism on critical files, with alerts to personnel when files are modified without authority. Other frameworks and regulations contain similar expectations, including those used in finance, healthcare and government. Auditors ask to see FIM alerts and evidence that someone reviewed them.</p>
<p>This has a practical consequence for you. In a regulated company, FIM output may be shown to an auditor. The quality of your notes on each alert, such as “approved change, ticket 5521”, is part of the evidence.</p>
<h2>What goes wrong when FIM is switched on carelessly</h2>
<p>New teams often make the same mistake. They enable FIM for everything. On a Windows computer this produces thousands of events daily, from updates, temporary files and the user’s own work. Analysts learn to ignore the stream. A real change is then buried among the noise, and the tool has become shelfware.</p>
<p>Successful teams do the opposite. They choose a short list of locations where change is rare and meaningful, watch those closely, and send everything else to a less intrusive scheduled scan. This is the principle you apply in the case file: <b>watch few places, watch them deeply.</b></p>
<h2>What to watch on Windows</h2>
<ul>
<li><b>The hosts file</b> (<code>C:\Windows\System32\drivers\etc</code>). Attackers edit it to redirect a website name to a server they control.</li>
<li><b>Startup locations.</b> Programs placed in a startup folder run each time someone logs in. Both the all-users folder under <code>ProgramData</code> and each user’s own folder matter.</li>
<li><b>Scheduled task definitions</b> (<code>C:\Windows\System32\Tasks</code>). Scheduled tasks are a popular persistence method.</li>
<li><b>Web server folders</b>, for example <code>C:\inetpub\wwwroot</code>. New script files here can be web shells.</li>
<li><b>Registry autorun keys</b>, such as the <code>Run</code> keys and <code>Winlogon</code>. Many malware families use them.</li>
<li><b>Security software settings</b>, including policy keys that control the antivirus. Attackers often turn protection off first.</li>
<li><b>Application configuration files</b> for business systems, such as payment or database settings.</li>
</ul>
<h2>What to watch on Linux</h2>
<ul>
<li><code>/etc/passwd</code>, <code>/etc/shadow</code>, <code>/etc/sudoers</code> and <code>/etc/sudoers.d</code>: account and privilege changes.</li>
<li><code>/etc/ssh/sshd_config</code> and users’ <code>~/.ssh/authorized_keys</code>: remote access settings and added keys.</li>
<li><code>/etc/cron*</code> and users’ crontabs: scheduled jobs.</li>
<li><code>/bin</code>, <code>/sbin</code>, <code>/usr/bin</code>: replaced system programs.</li>
<li>Web roots such as <code>/var/www</code>: defacement and web shells.</li>
</ul>
<h2>Change management: the other half of FIM</h2>
<p>An alert that a file changed is only the start. The question is: <b>was this change approved?</b> In a mature company, planned changes are recorded in a change calendar or ticket system. When FIM reports a change, the analyst checks whether a matching approved change exists. If it does, they close the alert, with a reference. If it does not, they investigate.</p>
<p>This is why FIM works best where people also follow a change process. Where nobody records changes, every alert is a mystery, and the team will eventually stop caring. Good security teams therefore often become advocates for better change records.</p>
<h2>The baseline problem</h2>
<p>FIM compares the present with a recorded baseline. If the baseline is recorded after the system is already compromised, the attacker’s files become “normal”. For this reason, teams take baselines on freshly built systems, often from a trusted image. They also expect legitimate drift: software updates change files, and the baseline must be refreshed after approved changes.</p>
<h2>FIM compared with endpoint detection tools</h2>
<p>Modern endpoint detection and response products, often called EDR, watch process behaviour in great detail. People sometimes ask whether FIM is still needed. The honest answer is that they see different things.</p>
<table><tr><th>Question</th><th>FIM is strong at</th><th>EDR is strong at</th></tr>
<tr><td>What changed on disk or in settings?</td><td>Precise before-and-after records</td><td>Partial</td></tr>
<tr><td>What did the program do while running?</td><td>Not designed for it</td><td>Detailed process and network behaviour</td></tr>
<tr><td>Is it needed for compliance?</td><td>Yes, commonly</td><td>Sometimes accepted</td></tr>
<tr><td>Does it work on simple servers?</td><td>Yes, lightweight</td><td>May be heavier or not installed</td></tr></table>
<p>Many companies use both. In this academy, you will later combine FIM with Sysmon, which fills in the process information that FIM alone lacks.</p>
<h2>What FIM cannot do</h2>
<p>It is as important to know the limits. FIM cannot say <b>why</b> a file changed unless you add context. It cannot see an attack that never touches the disk or the registry, such as a program living entirely in memory. If an attacker is skilled enough to stop or tamper with the agent, FIM will go quiet, which is why teams also alert when an agent stops reporting. And without the “who” information from whodata, it cannot tell you which account did it.</p>
<div class="note"><b>Field note: the Monday morning review</b>Many teams review the FIM alerts of the weekend every Monday. They look for changes outside approved windows, new files in sensitive folders, and any change to a security setting. The review takes twenty minutes and finds the issues that nobody was paged for. Create a habit like this in your own portfolio work.</div>
<h2>How to read the BrightMart chapters</h2>
<p>The case file turns these ideas into practice. In each chapter you will add a small tripwire, make a change the way an attacker would, and find the alert. By the end you will have covered the hosts file, a startup program, a website file, a registry autorun entry and a bulk rename that looks like ransomware. You will also experience noise, and learn to tame it, exactly as the real teams in this chapter do.</p>`,
takeaways:["FIM records fingerprints of important files and alerts when they change, regardless of what the attacker’s program is.","Standards such as PCI DSS expect change detection on critical files, so alerts and notes may be shown to auditors.","Watching everything creates noise; watch few meaningful places deeply.","The key question for any FIM alert is whether the change was approved.","FIM complements EDR; it cannot show intent, memory-only attacks or who made a change without whodata."],
