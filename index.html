  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;
&lt;localfile&gt;
  &lt;location&gt;Microsoft-Windows-Windows Defender/Operational&lt;/location&gt;
  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;
&lt;localfile&gt;
  &lt;location&gt;Microsoft-Windows-TaskScheduler/Operational&lt;/location&gt;
  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;</pre></li>
<li>Save, then restart the agent and check its log:
<pre>Restart-Service WazuhSvc
Get-Content "C:\Program Files (x86)\ossec-agent\ossec.log" -Tail 15</pre></li></ol>
<h3>Phase 3: create events and find them</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Make a recognisable set of events:
<pre>powershell -NoProfile -Command "Write-Output 'wazuh-sbl-777'"
schtasks /create /tn "WazuhTest" /tr notepad.exe /sc daily /st 09:00
schtasks /delete /tn "WazuhTest" /f
net user tempadmin P@ssw0rd123456 /add
net user tempadmin /delete</pre></li>
<li><span class="vm h">YOUR PC</span> In the dashboard open <b>Threat Hunting → Events</b>, range <b>Last 15 minutes</b>, and run these searches one at a time. Note the count of each.
<pre>agent.name:win-victim
data.win.system.channel:"Microsoft-Windows-Sysmon/Operational"
data.win.system.eventID:4720
data.win.eventdata.commandLine:*schtasks*
data.win.system.eventID:4104</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>Events from several channels. Event 4720 for <code>tempadmin</code>. A Sysmon process event whose command line contains <code>schtasks</code>. A script block event with your test text. If a channel is silent, read the agent log for errors.</div>
<h3>Phase 4: judge the volume</h3>
<p>Open <b>Overview</b> and look at the number of events per channel for the last hour. Which channel is the busiest? Is that expected? Write your answer. High volumes are normal for Sysmon, and a reason to tune its configuration.</p>
<h3>Evidence to save</h3>
<ul><li>The <code>localfile</code> blocks you added.</li><li>Screenshots of three searches with their counts.</li><li>Your note on which channel is busiest and why.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Service will not restart</td><td>XML typo</td><td>Restore <code>ossec.conf.bak2</code>; redo the edit</td></tr>
<tr><td>No Sysmon events in Wazuh</td><td>Channel not listed or Sysmon not installed</td><td>Check lab 7.3; confirm the block exists once</td></tr>
<tr><td>Duplicate events</td><td>A channel is listed twice</td><td>Remove the duplicate block</td></tr>
<tr><td>Field search returns nothing</td><td>Field names differ by version</td><td>Open one event’s JSON and copy the exact field names</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You told the agent which channels to collect, avoided duplicates, created recognisable events and found them with field searches. The data is now where your rules can reach it.</div>`,
quiz:[{q:"Why avoid listing a channel twice?",o:["It creates duplicate events and extra volume","It is illegal","It breaks Windows","It deletes the log"],a:0},{q:"What format does Wazuh use for Windows channels?",o:["eventchannel","syslog","json","audit"],a:0},{q:"Which search finds Sysmon events?",o:["data.win.system.channel:\"Microsoft-Windows-Sysmon/Operational\"","rule.id:5715","agent.id:000 only","full_log:ssh"],a:0}]},

{id:"7-5",mod:"m7",mins:75,title:"Detect encoded PowerShell and scheduled-task persistence",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>write two custom rules, one for encoded PowerShell and one for scheduled-task creation, test each with <code>wazuh-logtest</code>, trigger them from <code>win-victim</code>, and decide how to reduce their false positives.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 75 minutes. <b>You need:</b> lab 7.4 complete (Sysmon events reaching Wazuh), SSH access to <code>wazuh-server</code> and the chapter “PowerShell and Living-off-the-Land Tools”. <b>Back up your rules first:</b> <code>sudo cp /var/ossec/etc/rules/local_rules.xml /var/ossec/etc/rules/local_rules.xml.bak3</code>.</div>
<h3>Phase 1: capture a real example</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> Run an encoded command and a scheduled task:
<pre>$cmd='Write-Output "twa-test"'
$enc=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($cmd))
powershell.exe -NoProfile -EncodedCommand $enc
schtasks /create /tn "TwaTest" /tr notepad.exe /sc daily /st 09:00
schtasks /delete /tn "TwaTest" /f</pre></li>
<li><span class="vm h">YOUR PC</span> In the dashboard find the Sysmon process-creation events for these two commands. Open one in the JSON view and copy the exact names of the image and command line fields. They are normally <code>win.eventdata.image</code> and <code>win.eventdata.commandLine</code>.</li></ol>
<h3>Phase 2: write the rules</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre> and add at the bottom:
<pre>&lt;group name="windows,sysmon,lab,"&gt;
  &lt;rule id="100210" level="10"&gt;
    &lt;if_group&gt;sysmon_event1&lt;/if_group&gt;
    &lt;field name="win.eventdata.image" type="pcre2"&gt;(?i)\\schtasks\.exe&lt;/field&gt;
    &lt;field name="win.eventdata.commandLine" type="pcre2"&gt;(?i)/create&lt;/field&gt;
    &lt;description&gt;Scheduled task created with schtasks.exe&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1053.005&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
  &lt;rule id="100211" level="12"&gt;
    &lt;if_group&gt;sysmon_event1&lt;/if_group&gt;
    &lt;field name="win.eventdata.image" type="pcre2"&gt;(?i)\\powershell\.exe&lt;/field&gt;
    &lt;field name="win.eventdata.commandLine" type="pcre2"&gt;(?i)\s-(enc|encodedcommand)\s&lt;/field&gt;
    &lt;description&gt;PowerShell started with an encoded command&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1059.001&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre></li>
<li>Test the configuration and restart:
<pre>sudo /var/ossec/bin/wazuh-analysisd -t
sudo systemctl restart wazuh-manager</pre></li></ol>
<h3>Phase 3: prove the rules fire</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> Repeat the two commands from phase 1.</li>
<li><span class="vm h">YOUR PC</span> Search <code>rule.id:(100210 OR 100211)</code>. Open each alert and confirm the MITRE tag and the command line in the data.</li></ol>
<div class="box tip"><b>✅ You should see</b>A level 10 alert for the scheduled task, and a level 12 alert for the encoded command, each with the command line that caused it.</div>
<h3>Phase 4: think about false positives</h3>
<p>Answer in your notebook: (a) name one harmless program that might use an encoded PowerShell command; (b) how could you tell it apart from an attack (parent process, user, path)? (c) write the change you would make to the rule, for example requiring a suspicious parent such as <code>winword.exe</code>. <i>Suggested: management tools sometimes encode commands; check ParentImage and the account.</i></p>
<h3>Evidence to save</h3>
<ul><li>Your rule text and the output of the configuration test.</li><li>Screenshots of both alerts.</li><li>Your false-positive notes.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Configuration test shows an error</td><td>XML typo</td><td>Fix the line it names, or restore <code>.bak3</code></td></tr>
<tr><td>Rule never fires</td><td>Field names differ, or the group is not <code>sysmon_event1</code> in your version</td><td>Copy names from a real alert; check the rule group under Server management → Rules</td></tr>
<tr><td>Encoded rule matches nothing</td><td>The command has no trailing space after the option</td><td>The rule expects whitespace after <code>-enc</code>; use the exact commands above</td></tr>
<tr><td>Too many alerts</td><td>Admin tools use the same pattern</td><td>Add parent or path conditions</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You wrote two behaviour-based detections, tested them with real activity, and thought about how to make them quieter. This is the core loop of detection engineering.</div>`,
quiz:[{q:"What does if_group sysmon_event1 select?",o:["Sysmon process-creation events","Any file change","Failed logins","Antivirus alerts"],a:0},{q:"Why add a parent-process condition?",o:["To cut false positives","To slow the rule","To hide the alert","To encrypt the log"],a:0},{q:"What must you do before trusting a new rule?",o:["Trigger it with real activity","Nothing","Delete the old rules","Restart Windows"],a:0}]},

{id:"7-6",mod:"m7",mins:70,title:"Windows detection coverage: build your first coverage table",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>test eight Windows behaviours, record which ones your lab detects, which only logs, and which are missed, and produce a coverage table with ATT&amp;CK techniques and next actions.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 70 minutes. <b>You need:</b> labs 7.1 to 7.5 complete and a clean snapshot of <code>win-victim</code>. Gaps are not embarrassing; unknown gaps are. A coverage table is the document real detection teams show their managers.</div>
<h3>The method</h3>
<p>For each behaviour you will (1) perform it, (2) search the logs and Wazuh, (3) mark the result as <b>Alerted</b> (a Wazuh alert fired), <b>Logged</b> (the evidence exists but no alert) or <b>Missed</b> (nothing found), and (4) decide what to do next.</p>
<h3>The eight behaviours</h3>
<ol class="steps">
<li><b>Failed logons (T1110).</b> <pre>net use \\localhost\IPC$ /user:labuser Bad1
net use \\localhost\IPC$ /user:labuser Bad2
net use \\localhost\IPC$ /user:labuser Bad3</pre></li>
<li><b>New local account and admin group (T1136.001, T1098).</b> <pre>net user covtest P@ssw0rd123456 /add
net localgroup administrators covtest /add
net user covtest /delete</pre></li>
<li><b>Scheduled task (T1053.005).</b> <pre>schtasks /create /tn "CovTask" /tr notepad.exe /sc daily /st 09:00
schtasks /delete /tn "CovTask" /f</pre></li>
<li><b>Encoded PowerShell (T1059.001).</b> Use the commands from lab 7.5.</li>
<li><b>Run key (T1547.001).</b> <pre>reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v CovRun /t REG_SZ /d "C:\Windows\System32\calc.exe" /f
reg delete HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v CovRun /f</pre></li>
<li><b>Startup folder file (T1547.001).</b> <pre>Copy-Item C:\Windows\System32\calc.exe "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\cov.exe"
Remove-Item "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\cov.exe"</pre></li>
<li><b>Security log cleared (T1070.001).</b> <pre>wevtutil cl Security</pre></li>
<li><b>Hosts file edit (T1565.001).</b> <pre>Add-Content C:\Windows\System32\drivers\etc\hosts "203.0.113.9 cov.test"
(Get-Content C:\Windows\System32\drivers\etc\hosts) | Where-Object { $_ -notmatch "cov.test" } | Set-Content C:\Windows\System32\drivers\etc\hosts</pre></li></ol>
<h3>Fill the table</h3>
<table><tr><th>#</th><th>Behaviour</th><th>ATT&amp;CK</th><th>Alerted / Logged / Missed</th><th>Rule or event</th><th>Next action</th></tr>
<tr><td>1</td><td>Failed logons</td><td>T1110</td><td>?</td><td>?</td><td>?</td></tr><tr><td>2</td><td>New admin</td><td>T1136.001</td><td>?</td><td>?</td><td>?</td></tr><tr><td>3</td><td>Scheduled task</td><td>T1053.005</td><td>?</td><td>100210</td><td>?</td></tr><tr><td>4</td><td>Encoded PowerShell</td><td>T1059.001</td><td>?</td><td>100211</td><td>?</td></tr><tr><td>5</td><td>Run key</td><td>T1547.001</td><td>?</td><td>?</td><td>?</td></tr><tr><td>6</td><td>Startup file</td><td>T1547.001</td><td>?</td><td>?</td><td>?</td></tr><tr><td>7</td><td>Log cleared</td><td>T1070.001</td><td>?</td><td>?</td><td>?</td></tr><tr><td>8</td><td>Hosts edit</td><td>T1565.001</td><td>?</td><td>?</td><td>?</td></tr></table>
<p>Behaviours 5, 6 and 8 should be covered if you kept the Case File 1 tripwires on this machine. If you restored an earlier snapshot, they may show as <b>Missed</b>: that is a real finding about your configuration.</p>
<h3>Phase 2: act on the gaps</h3>
<p>Pick the two most important <b>Missed</b> or <b>Logged</b> rows and write a plan for each: which log source is needed, what the rule would look for, how you would test it and what false positives to expect. Implement one of them if time allows.</p>
<h3>Evidence to save</h3>
<ul><li>The completed coverage table.</li><li>Screenshots for at least three rows.</li><li>The plan for your two chosen gaps.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>You cannot tell “Logged” from “Missed”</td><td>You searched the wrong log or time range</td><td>Search the Windows log first, then Wazuh, with a wide time range</td></tr>
<tr><td>Failed logons show no Wazuh alert</td><td>Few failures and no brute-force rule for Windows yet</td><td>Record as “Logged”; Module 8 adds a rule</td></tr>
<tr><td>Everything looks Missed</td><td>Agent or channels not working</td><td>Redo lab 7.4 checks</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You tested eight attacker behaviours and turned the results into a coverage table with next actions. Failed logons are only “Logged” for now: the next module, Windows logon attacks, turns that gap into a working detection.</div>`,
quiz:[{q:"What does “Logged” mean in a coverage table?",o:["Evidence exists, but no alert fired","An alert fired","Nothing was found","The test was skipped"],a:0},{q:"Why are known gaps better than unknown gaps?",o:["You can plan to fix them","They cost nothing","They never matter","They hide alerts"],a:0},{q:"What is the first step of testing a behaviour?",o:["Perform it","Write the report","Delete logs","Reboot"],a:0}]},

{id:"8-1",mod:"m8",mins:90,title:"Build dc01: a small Windows domain controller",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have a fourth VM, <code>dc01</code>, running Windows Server, promoted to a domain controller for <code>brightmart.local</code>, reachable at 192.168.56.20.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> 75 to 90 minutes. <b>You need:</b> a Windows Server evaluation ISO (search “Microsoft Evaluation Center Windows Server”, choose the Desktop Experience edition), your RAM plan from lab 1.1, and the chapter “Case File #3: Meet the Domain and Its Attackers”. If your computer has 16 GB, close other VMs while installing this one.</div>
<h3>Phase 1: create the VM</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> VirtualBox → <b>New</b>. Name <code>dc01</code>, folder <code>SOC-Lab\VMs</code>, ISO the Windows Server image, <b>tick “Skip Unattended Installation”</b>. Type: Microsoft Windows; version: Windows Server 2022 (64-bit).</li>
<li>Memory: at least <b>3072 MB</b> (4096 if you can). Processors: 2. Disk: <b>60 GB</b>.</li>
<li><b>Settings → Network:</b> Adapter 1 = NAT; Adapter 2 enabled = Host-only Adapter (the lab network).</li></ol>
<h3>Phase 2: install Windows Server</h3>
<ol class="steps">
<li>Start the VM, choose language and keyboard, <b>Install now</b>, enter no product key (evaluation), choose <b>Windows Server 2022 Standard Evaluation (Desktop Experience)</b>, accept the licence, <b>Custom: install Windows only</b>, select the empty disk.</li>
<li>After it restarts, set the built-in <b>Administrator</b> password. Record it safely.</li></ol>
<h3>Phase 3: configure networking and rename</h3>
<ol class="steps">
<li>Log in as <b>Administrator</b>. Open <b>Server Manager</b> (it opens automatically), or use PowerShell as administrator throughout:
<pre>Get-NetAdapter | Format-Table Name, MacAddress, Status</pre>
Match the host-only adapter by its MAC address, as in lab 1.6.</li>
<li><pre>New-NetIPAddress -InterfaceAlias "Ethernet 2" -IPAddress 192.168.56.20 -PrefixLength 24
Set-DnsClientServerAddress -InterfaceAlias "Ethernet 2" -ServerAddresses 192.168.56.20
Rename-Computer -NewName "DC01" -Restart</pre>
(Use your actual adapter name if different. A domain controller is its own DNS server, which is why it points to itself.)</li></ol>
<h3>Phase 4: install Active Directory and promote</h3>
<ol class="steps">
<li>After the restart, log in again and run:
<pre>Install-WindowsFeature AD-Domain-Services -IncludeManagementTools
Install-ADDSForest -DomainName "brightmart.local" -InstallDNS -SafeModeAdministratorPassword (ConvertTo-SecureString "Summer2024!DSRM" -AsPlainText -Force) -Force:$true</pre>
This takes several minutes and restarts the VM automatically.</li>
<li>Log in again as <code>BRIGHTMART\Administrator</code> and confirm:
<pre>Get-ADDomain | Select-Object Name, DomainMode
Get-Service DNS, NTDS | Format-Table Name, Status</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>brightmart.local</code> reported as the domain name, and both <b>DNS</b> and <b>NTDS</b> (the directory service) <b>Running</b>.</div>
<h3>Phase 5: create the practice accounts</h3>
<ol class="steps"><li><pre>New-ADUser -Name "Jane Okoro" -SamAccountName "jane.okoro" -AccountPassword (ConvertTo-SecureString "Welcome2024!" -AsPlainText -Force) -Enabled $true
New-ADUser -Name "svc-backup" -SamAccountName "svc-backup" -AccountPassword (ConvertTo-SecureString "Backup123" -AsPlainText -Force) -Enabled $true -PasswordNeverExpires $true
setspn -A BrightMartApp/dc01.brightmart.local svc-backup</pre>
The <code>setspn</code> line registers a Service Principal Name, which is what makes <code>svc-backup</code> a realistic Kerberoasting target in chapter 3’s labs. Its password is deliberately weak and set never to expire: this is the vulnerability the case file studies, not a mistake in the lab.</li></ol>

<h3>Phase 6: understand what you actually built (read the directory itself)</h3>
<p>Most learners promote a domain controller and never look inside the directory they just created. Spend fifteen minutes here, because everything in this case file depends on this structure.</p>
<ol class="steps">
<li><span class="vm u">dc01</span> List the built-in containers and organisational units:
<pre>Get-ADOrganizationalUnit -Filter * | Format-Table Name, DistinguishedName
Get-ADObject -SearchBase "CN=Users,DC=brightmart,DC=local" -Filter * | Format-Table Name, ObjectClass</pre>
Notice that new users land in the built-in <b>Users</b> container by default, not in an organisational unit. Real companies almost always create their own OU structure (for example, <code>Staff</code>, <code>Service Accounts</code>, <code>Computers</code>) so that Group Policy can target each kind of object separately. Create one now, and move your accounts into it, exactly as a real administrator would on day one:
<pre>New-ADOrganizationalUnit -Name "Staff" -Path "DC=brightmart,DC=local"
New-ADOrganizationalUnit -Name "ServiceAccounts" -Path "DC=brightmart,DC=local"
Move-ADObject -Identity (Get-ADUser jane.okoro).DistinguishedName -TargetPath "OU=Staff,DC=brightmart,DC=local"
Move-ADObject -Identity (Get-ADUser svc-backup).DistinguishedName -TargetPath "OU=ServiceAccounts,DC=brightmart,DC=local"</pre></li>
<li>Look at the password policy that governs every account in the domain, since it explains why <code>svc-backup</code>’s weak password is even allowed to exist:
<pre>Get-ADDefaultDomainPasswordPolicy | Format-List ComplexityEnabled, MinPasswordLength, MaxPasswordAge, LockoutThreshold, LockoutDuration</pre>
Write down each value in your notebook with one sentence on what it means. In particular, <code>LockoutThreshold</code> of 0 (the Windows Server default) means <b>no account lockout at all</b>, which is exactly why brute-force attacks against a domain can run for as long as they like unless this is changed. This single setting will matter again in lab 8.3.</li>
<li>Harden the password policy as a real administrator would, and record the before-and-after as evidence:
<pre>Set-ADDefaultDomainPasswordPolicy -Identity brightmart.local -LockoutThreshold 5 -LockoutDuration (New-TimeSpan -Minutes 15) -LockoutObservationWindow (New-TimeSpan -Minutes 15)
Get-ADDefaultDomainPasswordPolicy | Select-Object LockoutThreshold, LockoutDuration</pre></li></ol>
<h3>Phase 7: a second, higher-privilege account for later labs</h3>
<p>Every domain needs at least one account above an ordinary user and below the built-in Administrator, because real administrators do not log on day-to-day with the single most powerful account in the forest. Create one, and add it to a delegated group rather than Domain Admins directly, which is itself a security practice worth noting:</p>
<pre>New-ADUser -Name "Tunde Admin" -SamAccountName "tunde.admin" -AccountPassword (ConvertTo-SecureString "AdminPass2024!" -AsPlainText -Force) -Enabled $true -Path "OU=Staff,DC=brightmart,DC=local"
Add-ADGroupMember -Identity "Domain Admins" -Members tunde.admin
Get-ADGroupMember "Domain Admins" | Format-Table Name, SamAccountName</pre>
<p>You will use <code>tunde.admin</code> whenever a lab calls for "a Domain Admin" rather than typing the built-in Administrator credential everywhere, which mirrors how a real environment keeps the built-in account for emergencies only.</p>
<h3>Phase 8: document your domain the way a real analyst would inherit it</h3>
<p>Before you ever attack this domain, write a short "environment document" in your notebook, because every real investigation starts by asking "what is normal here?" and you cannot answer that later if you never wrote it down now.</p>
<table><tr><th>Field</th><th>Your answer</th></tr>
<tr><td>Domain name and functional level</td><td>?</td></tr>
<tr><td>Domain controllers (name, IP)</td><td>?</td></tr>
<tr><td>Organisational units and their purpose</td><td>?</td></tr>
<tr><td>Accounts created today, with their intended normal behaviour</td><td>?</td></tr>
<tr><td>Password and lockout policy, before and after hardening</td><td>?</td></tr>
<tr><td>Which accounts are Domain Admins</td><td>?</td></tr></table>
<p>Keep this document open in every later lab in this module. When an alert fires, your first question will be "does this match the environment document?", exactly as a real analyst joining a new company would ask their predecessor.</p>
<h3>Evidence to save</h3>
<ul><li>The output of <code>Get-ADDomain</code> and <code>Get-ADUser -Filter *</code>.</li><li>A note of the DSRM password location and the Administrator password, stored safely.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td><code>Install-ADDSForest</code> fails on DNS</td><td>Static IP not set correctly first</td><td>Confirm the address with <code>Get-NetIPAddress</code>; redo phase 3</td></tr>
<tr><td>VM is extremely slow</td><td>Too little memory, or other VMs running</td><td>Close other VMs; confirm at least 3 GB assigned</td></tr>
<tr><td>Cannot log in as BRIGHTMART\Administrator</td><td>Promotion did not finish</td><td>Wait for the automatic restart; check <code>Get-Service NTDS</code></td></tr>
<tr><td><code>setspn</code> says access denied</td><td>Not running as a Domain Admin</td><td>Confirm you are logged in as the domain Administrator</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You built a real, working domain controller, with DNS, and created two practice accounts, one of them deliberately weak. Next you join <code>win-victim</code> to this domain.</div>`,
quiz:[{q:"Why does a domain controller point to itself for DNS?",o:["It is its own DNS server for the domain","It has no DNS","It uses the internet only","It is a firewall rule"],a:0},{q:"What does setspn register?",o:["A Service Principal Name, linking a service to an account","A firewall rule","A DNS record only","A password policy"],a:0},{q:"Why is svc-backup’s weak, non-expiring password deliberate?",o:["It is the vulnerability this case file studies","It is a mistake to fix immediately","Windows requires it","It speeds up login"],a:0}]},

{id:"8-2",mod:"m8",mins:60,title:"Join win-victim to the domain and connect dc01 to Wazuh",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have <code>win-victim</code> joined to <code>brightmart.local</code>, able to log on as <code>jane.okoro</code>, and <code>dc01</code> running a Wazuh agent that is Active in the dashboard.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 60 minutes. <b>You need:</b> lab 8.1 complete, <code>win-victim</code> and <code>wazuh-server</code> running, and the Deploy new agent page from lab 4.4.</div>
<h3>Phase 1: point win-victim at the domain’s DNS</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> (on <code>win-victim</code>, admin PowerShell) Point its DNS at the domain controller, on the host-only adapter:
<pre>Set-DnsClientServerAddress -InterfaceAlias "Ethernet 2" -ServerAddresses 192.168.56.20
Resolve-DnsName brightmart.local</pre></li></ol>
<h3>Phase 2: join the domain</h3>
<ol class="steps"><li><pre>Add-Computer -DomainName "brightmart.local" -Credential (Get-Credential) -Restart</pre>
At the credential prompt enter <code>BRIGHTMART\Administrator</code> and its password. The machine restarts.</li>
<li>At the Windows logon screen choose <b>Other user</b> and log on as <code>BRIGHTMART\jane.okoro</code> with her password. Confirm:
<pre>whoami
hostname</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>brightmart\jane.okoro</code> and <code>WIN-VICTIM</code>. The local <code>analyst</code> account still exists and still works for local logon, as a separate account from the domain.</div>
<h3>Phase 3: connect dc01 to Wazuh</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Dashboard → <b>Agents → Deploy new agent</b>, package Windows MSI, server <code>192.168.56.10</code>, name <code>dc01</code>.</li>
<li><span class="vm u">dc01</span> (<i>this VM is Windows, run the command there</i>) Open admin PowerShell, paste the commands from the dashboard, then:
<pre>NET START WazuhSvc</pre></li>
<li><span class="vm h">YOUR PC</span> Refresh Agents; confirm <code>dc01</code> is <b>Active</b>.</li>
<li><span class="vm u">dc01</span> Add the Security log channel if it is not already present, the same way you did for <code>win-victim</code> in lab 7.4, by editing <code>C:\Program Files (x86)\ossec-agent\ossec.conf</code>. The Security channel is usually included by default; confirm by searching events:
<pre>Get-WinEvent -FilterHashtable @{LogName='Security';Id=4624} -MaxEvents 1</pre></li></ol>
<h3>Phase 4: snapshot everything</h3>
<p>Shut down <code>dc01</code> and <code>win-victim</code> cleanly and take snapshots named <code>10-domain-ready</code> on both.</p>

<h3>Phase 5: verify the trust relationship from both directions</h3>
<p>A domain join is not just "the computer has an IP that can reach the DC". It creates a real, cryptographic trust relationship with its own secret, called the <b>computer account password</b>, which Windows rotates automatically every 30 days by default. Confirm it from both sides, because a broken computer trust is one of the most common real-world helpdesk tickets you will meet in a Windows-heavy job.</p>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> (on <code>win-victim</code>, as a domain user) <pre>Test-ComputerSecureChannel -Verbose
nltest /sc_query:brightmart.local</pre></li>
<li><span class="vm u">dc01</span> Confirm the computer object exists in the directory, as a first-class object alongside user accounts:
<pre>Get-ADComputer -Filter * | Format-Table Name, DNSHostName, Enabled
Get-ADComputer win-victim -Properties LastLogonDate | Select-Object Name, LastLogonDate</pre></li></ol>
<div class="box tip"><b>✅ You should see</b><code>Test-ComputerSecureChannel</code> returning <code>True</code>, and <code>win-victim</code> listed as a computer object in the directory, enabled, with a recent <code>LastLogonDate</code>. This is proof that the trust is healthy in both directions, not just that the network cable is plugged in.</div>
<h3>Phase 6: build a realistic group structure and apply it with a real Group Policy</h3>
<p>So far every account can do the same thing. Real companies grant access through <b>groups</b>, not individual accounts, so build that habit now rather than later.</p>
<ol class="steps">
<li><span class="vm u">dc01</span> <pre>New-ADGroup -Name "Finance-Staff" -GroupScope Global -Path "OU=Staff,DC=brightmart,DC=local"
Add-ADGroupMember -Identity "Finance-Staff" -Members jane.okoro
Get-ADGroupMember "Finance-Staff"</pre></li>
<li>Create and link a simple Group Policy Object that renames the local Administrators group message and sets a screen-lock timeout, so you can see a policy actually arrive on <code>win-victim</code>:
<pre>Import-Module GroupPolicy
New-GPO -Name "Workstation-Baseline" | New-GPLink -Target "DC=brightmart,DC=local"
Set-GPRegistryValue -Name "Workstation-Baseline" -Key "HKLM\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -ValueName "ScreenSaveTimeOut" -Type DWord -Value 600</pre></li>
<li><span class="vm w">WINDOWS</span> Force the workstation to pull the new policy immediately, rather than waiting for the normal refresh cycle, and prove it arrived:
<pre>gpupdate /force
Get-ItemProperty "HKLM:\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -Name ScreenSaveTimeOut</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>The registry value <code>600</code> now present on <code>win-victim</code>, proving that a setting created centrally on <code>dc01</code> reached the workstation without anyone touching it directly. This is exactly the mechanism real attackers abuse when they compromise a domain controller: whatever a GPO can set, an attacker who controls <code>dc01</code> can set too, on every computer at once.</div>
<h3>Phase 7: a richer Wazuh picture of the domain controller</h3>
<p>A domain controller produces far more security-relevant log volume than an ordinary workstation, because every authentication in the company passes through it. Confirm your agent is capturing the channels that matter specifically to a DC, which differ slightly from a normal workstation.</p>
<ol class="steps"><li><span class="vm u">dc01</span> Open <code>C:\Program Files (x86)\ossec-agent\ossec.conf</code> as administrator and, if not already present, add:
<pre>&lt;localfile&gt;
  &lt;location&gt;Directory Service&lt;/location&gt;
  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;
&lt;localfile&gt;
  &lt;location&gt;DNS Server&lt;/location&gt;
  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;</pre>
These two channels record directory replication and DNS activity respectively, both of which matter enormously once you study more advanced domain attacks beyond this academy’s current scope. Restart the agent and confirm no errors in <code>ossec.log</code>.</li></ol>
<h3>Phase 8: a baseline to compare every later alert against</h3>
<p>Before any attack in this module, capture what a completely normal hour of domain activity looks like, so that every later alert has something real to be compared with, rather than your memory of "that feels unusual".</p>
<ol class="steps"><li><span class="vm h">YOUR PC</span> Log on and off <code>win-victim</code> normally two or three times as <code>jane.okoro</code>, browse the Staff OU in Active Directory Users and Computers if you have the tools installed, and then in the dashboard search <code>agent.name:dc01</code> for the last hour. Count the events by <code>rule.id</code> and save the top ten counts in your notebook as your <b>normal-day baseline</b> for this domain.</li></ol>
<h3>Evidence to save (additional)</h3>
<ul><li>The <code>Test-ComputerSecureChannel</code> and <code>Get-ADComputer</code> output.</li><li>The before-and-after registry value proving the GPO arrived.</li><li>Your ten-row normal-day baseline table.</li></ul>
<h3>Evidence to save</h3>
<ul><li>The <code>whoami</code> output showing the domain account.</li><li>A screenshot of the Agents page with <code>dc01</code> Active.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td><code>Resolve-DnsName</code> fails</td><td>DNS not pointed at dc01, or dc01 is off</td><td>Recheck <code>Set-DnsClientServerAddress</code>; confirm dc01 is running</td></tr>
<tr><td>Domain join fails with a credential error</td><td>Wrong domain or account name</td><td>Use exactly <code>BRIGHTMART\Administrator</code></td></tr>
<tr><td>Cannot see “Other user” at logon</td><td>Needs a restart or a screen refresh</td><td>Press Ctrl+Alt+Del, then look again</td></tr>
<tr><td>dc01 agent never connects</td><td>Firewall or wrong address</td><td>Repeat the port tests from lab 4.4 on dc01</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You now have a real two-machine domain, both feeding Wazuh. Everything from here investigates activity across both <code>win-victim</code> and <code>dc01</code>.</div>`,
quiz:[{q:"Why must win-victim’s DNS point at dc01 before joining?",o:["Domain join needs to find the domain controller by name","It speeds up Windows","It is required for RDP only","It disables the firewall"],a:0},{q:"After joining, does the local analyst account disappear?",o:["No, it still exists separately from domain accounts","Yes, it is deleted","It merges with jane.okoro","It becomes a domain admin"],a:0},{q:"Why snapshot both VMs now?",o:["To create a clean restore point before attacks begin","To save disk space","It is required by Wazuh","To speed up logon"],a:0}]},

{id:"8-3",mod:"m8",mins:70,title:"RDP brute force: attack it, detect it",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>enable Remote Desktop on <code>win-victim</code>, run an RDP brute-force attack from Kali, find the resulting events, and write a Wazuh rule that detects the pattern.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 70 minutes. <b>You need:</b> labs 8.1 and 8.2 complete, <code>kali-attacker</code> running, and the chapter “RDP Attacks and Lateral Movement in Plain Language”. Take a snapshot of <code>win-victim</code> called <code>11-before-rdp-attack</code> first.</div>
<h3>Phase 1: enable RDP and check logging</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> (on <code>win-victim</code>, admin PowerShell) <pre>Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
auditpol /get /subcategory:"Logon"</pre>
Confirm both success and failure are already audited from lab 7.1.</li></ol>
<h3>Phase 2: attack from Kali</h3>
<ol class="steps">
<li><span class="vm k">KALI</span> Install the RDP module if needed and attack <code>jane.okoro</code>’s domain account:
<pre>sudo apt update &amp;&amp; sudo apt install -y hydra
echo -e "123456\npassword\nWelcome2024!\nSummer2024\n" &gt; pw2.txt
hydra -l jane.okoro -P pw2.txt rdp://192.168.56.30 -t 1</pre></li></ol>
<h3>Phase 3: find the pattern</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Search <code>agent.name:win-victim AND data.win.system.eventID:4625</code>, range Last 15 minutes. Open one alert and note the <code>Status</code>/<code>SubStatus</code> and <code>LogonType</code>.</li>
<li>Search <code>data.win.system.eventID:4624 AND data.win.eventdata.logonType:10</code> to see whether a success occurred.</li></ol>
<div class="box tip"><b>✅ You should see</b>Several 4625 events, type 3 (not 10, as the chapter explains), with SubStatus <code>0xC000006A</code> for <code>jane.okoro</code>. If the real password was in your list, a 4624 with type 10 follows.</div>
<h3>Phase 4: write a detection</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> (back up first: <code>sudo cp /var/ossec/etc/rules/local_rules.xml /var/ossec/etc/rules/local_rules.xml.bak4</code>)
<pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre>
<pre>&lt;group name="windows,rdp,lab,"&gt;
  &lt;rule id="100220" level="10" frequency="6" timeframe="120"&gt;
    &lt;if_group&gt;win_security&lt;/if_group&gt;
    &lt;field name="win.system.eventID"&gt;^4625$&lt;/field&gt;
    &lt;same_field&gt;win.eventdata.targetUserName&lt;/same_field&gt;
    &lt;description&gt;Possible RDP brute force: repeated failed logons for one account&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1110&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre>
<code>same_field</code> requires the matching events to share the same value in that field, here the target account, so the rule groups failures by user. If your version’s field names differ, copy the exact names from a real 4625 alert’s JSON.</li>
<li>Test and restart: <pre>sudo /var/ossec/bin/wazuh-analysisd -t
sudo systemctl restart wazuh-manager</pre></li>
<li>Repeat the attack and search <code>rule.id:100220</code>.</li></ol>

<h3>Phase 5: repeat the attack as a spray rather than a brute force, and compare</h3>
<p>Chapter 2 drew a clear distinction between brute force (many passwords, one account) and password spraying (one or two passwords, many accounts), and this lab so far has only reproduced the first. Reproduce the second now, because it produces a genuinely different log shape, and a rule written only for the first will miss it entirely.</p>
<ol class="steps">
<li><span class="vm k">KALI</span> Build a small user list that includes real and fake names, mirroring how an attacker who has done some reconnaissance would build one:
<pre>printf "jane.okoro\ntunde.admin\nadministrator\nsvc-backup\nbackupuser\n" &gt; users2.txt
hydra -L users2.txt -p "Welcome2024!" rdp://192.168.56.30 -t 1</pre></li>
<li><span class="vm h">YOUR PC</span> Search <code>agent.name:win-victim AND data.win.system.eventID:4625</code> for the last 15 minutes and count how many <b>distinct</b> target accounts appear, versus how many events exist for any single account. Compare this shape against the brute-force run from phase 2, and write two sentences in your notebook describing the difference you see in the raw event counts.</li></ol>
<div class="box tip"><b>✅ You should see</b>A handful of failures spread across several account names, rather than a large count against one name. Your rule 100220 from phase 4, which groups by <code>targetUserName</code>, will likely <b>not</b> fire here, because no single account reaches the threshold alone. This is not a bug; it is the exact limitation the chapter warned about.</div>
<h3>Phase 6: write a second rule that catches the spray</h3>
<p>Design the second rule the same disciplined way as the first: state the logic in one sentence before writing any XML. "Alert when ten or more distinct target accounts fail to log on from the same source address within two minutes" is a reasonable sentence. Implement it:</p>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre>
<pre>&lt;rule id="100221" level="10" frequency="8" timeframe="120"&gt;
  &lt;if_group&gt;win_security&lt;/if_group&gt;
  &lt;field name="win.system.eventID"&gt;^4625$&lt;/field&gt;
  &lt;same_field&gt;win.eventdata.ipAddress&lt;/same_field&gt;
  &lt;description&gt;Possible password spraying: failed logons across multiple accounts from one source&lt;/description&gt;
  &lt;mitre&gt;&lt;id&gt;T1110.003&lt;/id&gt;&lt;/mitre&gt;
&lt;/rule&gt;</pre>
Notice the key design difference from rule 100220: this one groups by <code>ipAddress</code> instead of by the target account, because the whole point of spraying is that the account varies while the source stays constant. Test the configuration, restart, and repeat the spraying attack from phase 5 to confirm it now fires.</li></ol>
<h3>Phase 7: tune both rules against your lockout policy</h3>
<p>In lab 8.1 you set <code>LockoutThreshold</code> to 5. Investigate what that actually does to your own detections, because a real tuning decision always has to account for the preventive controls already in place, not just the raw attack pattern.</p>
<ol class="steps"><li><span class="vm u">dc01</span> After your spraying run, check whether any accounts actually locked out:
<pre>Search-ADAccount -LockedOut | Select-Object Name, LockedOut
Get-ADUser jane.okoro -Properties LockedOut, BadLogonCount</pre></li>
<li>In your notebook, answer honestly: did the lockout policy fire before or after your Wazuh rule? If the lockout policy already stops the attack automatically, what does your detection rule add that the lockout alone does not? <i>Suggested answer: the lockout stops further guesses, but it does not tell anyone it happened unless something alerts on it; a detection turns a silent prevention into a visible, investigable event, and also catches sprays that stay just under the lockout threshold per account.</i></li></ol>
<h3>Phase 8: a realistic distraction, because real attackers are not always isolated events</h3>
<p>While your detections are live, generate some ordinary background noise and confirm your rules do not fire on it, which is exactly the false-positive discipline real detection engineers practise before shipping any rule.</p>
<ol class="steps"><li><span class="vm w">WINDOWS</span> Log on and off normally three times as <code>jane.okoro</code> with the <b>correct</b> password, with a few seconds between each: <pre>#  simply sign out and sign back in three times using Ctrl+Alt+Del</pre></li>
<li><span class="vm h">YOUR PC</span> Confirm neither rule 100220 nor 100221 fired for this ordinary activity. Record this as a passed false-positive test in your notebook, the same way you would document a test case in a real detection engineering ticket.</li></ol>
<h3>Evidence to save (additional)</h3>
<ul><li>The spray attack’s raw event counts, compared with the brute-force run.</li><li>Rule 100221 and a screenshot of it firing.</li><li>Your lockout-versus-detection reasoning.</li><li>Confirmation that normal logons did not trigger either rule.</li></ul>
<h3>Evidence to save</h3>
<ul><li>A screenshot of a 4625 alert with its SubStatus and LogonType.</li><li>Your rule text and a screenshot of it firing.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Hydra cannot connect</td><td>RDP not enabled, or firewall</td><td>Repeat phase 1; test with <code>Test-NetConnection 192.168.56.30 -Port 3389</code> from Kali is not possible directly; test from Ubuntu or your PC instead</td></tr>
<tr><td>No 4625 events</td><td>Logon auditing not enabled</td><td>Redo lab 7.1</td></tr>
<tr><td>Rule does not fire</td><td><code>same_field</code> option name differs by version, or field names differ</td><td>Check your version’s rule syntax documentation; confirm field names from a real alert</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You reproduced one of the most common real-world intrusion paths and built a working detection for it, grouped correctly by account rather than just counting all failures together.</div>`,
quiz:[{q:"Why did the failed attempts show logon type 3, not 10?",o:["Network Level Authentication checks credentials before the desktop session is built","RDP always uses type 3","Type 10 is for Linux only","It is a Wazuh error"],a:0},{q:"What does same_field do in the rule?",o:["Requires matching events to share the same value in that field","Deletes duplicate alerts","Encrypts the field","Hides the field"],a:0},{q:"What is the strongest general fix for this exposure?",o:["Do not expose RDP directly to the internet","Rename the account","Disable Wazuh","Increase RAM"],a:0}]},

{id:"8-4",mod:"m8",mins:55,title:"Domain discovery: what an attacker sees after one foothold",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>run the discovery commands an attacker typically runs after compromising one domain-joined computer, see what they reveal, and identify which of them you could detect.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 55 minutes. <b>You need:</b> labs 8.1 to 8.3 complete, and to be logged on to <code>win-victim</code> as <code>jane.okoro</code> (an ordinary domain user, deliberately, since this is what an attacker would have after stealing her password).</div>
<h3>Why discovery matters to a defender</h3>
<p>Once inside, an attacker with no map of the network is nearly as lost as you would be. The built-in commands below need no special tools and no elevated rights, which is exactly why they are used so often and why they are hard to block outright.</p>
<h3>Phase 1: who and what is here</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> (logged on as <code>jane.okoro</code>) <pre>whoami /all
nltest /domain_trusts
net user /domain
net group "Domain Admins" /domain
Get-ADUser -Filter * -Properties Description 2&gt;$null</pre>
The last command will likely fail for an ordinary user without the RSAT tools installed, which is itself informative: not every discovery command works from every account.</li></ol>
<h3>Phase 2: find computers and shares</h3>
<ol class="steps"><li><pre>net view
nltest /dsgetdc:brightmart.local
nslookup dc01.brightmart.local</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>Your own group memberships from <code>whoami /all</code>; a list of domain users from <code>net user /domain</code>; confirmation of which computer is the domain controller; and, likely, an access error on the RSAT-dependent command, since <code>jane.okoro</code> has no special rights.</div>
<h3>Phase 3: check what reached the logs</h3>
<ol class="steps"><li><span class="vm h">YOUR PC</span> Search <code>agent.name:win-victim</code> for the last 15 minutes and look for any 4688 process-creation events matching these commands (if command-line logging from lab 7.1 is active).</li></ol>
<p>Write down, for each command you ran: did it produce a log event you could search for later? Most discovery commands using built-in tools will show up as ordinary process creation, distinguishable mainly by being run in a short burst and by an account that does not normally run them.</p>
<h3>Phase 4: think like a defender</h3>
<p>In your notebook, answer: which single detection idea would catch the most of these commands at once? <i>Suggested answer: a rule that counts distinct built-in discovery commands (net, nltest, nslookup, whoami) run by one account within a short window, since no single command is suspicious alone, but the cluster is.</i></p>

<h3>Phase 5: discovery with lightweight native AD tools, not just net commands</h3>
<p>Windows ships a quieter, scriptable alternative to the <code>net</code> commands that many real intrusions actually prefer, because it blends in with legitimate administrative PowerShell use far better than old-style command-line tools. Try it from the same <code>jane.okoro</code> session.</p>
<ol class="steps"><li><span class="vm w">WINDOWS</span> <pre>Get-ADDomainController -Discover | Format-List Name, IPv4Address, Site
([ADSI]"LDAP://RootDSE").defaultNamingContext
$searcher = New-Object System.DirectoryServices.DirectorySearcher
$searcher.Filter = "(objectClass=user)"
$searcher.SearchRoot = "LDAP://DC=brightmart,DC=local"
$searcher.FindAll() | ForEach-Object { $_.Properties["samaccountname"] }</pre>
This last block uses the raw <b>.NET directory services</b> interface rather than any of the RSAT cmdlets you saw fail in phase 1, and it works from <b>any</b> domain-joined machine with no extra tools installed at all. This is precisely why real attackers favour it: it needs nothing beyond what every domain-joined Windows computer already has.</li></ol>
<div class="box edge"><b>Why this matters more than the net commands</b>The <code>net user /domain</code> style commands you ran earlier are old, well-known, and many security products specifically watch for them. The LDAP search above does exactly the same reconnaissance, with no special tooling, and is far less likely to be flagged by a simple command-name block list. This is a genuine arms-race lesson: blocking a tool name is weaker than detecting a behaviour.</div>
<h3>Phase 6: find a weak link by enumerating group memberships and descriptions</h3>
<p>A classic, low-effort step for a real attacker is reading account <b>description</b> fields, because administrators sometimes carelessly leave notes such as temporary passwords or hints inside them. Check whether BrightMart has this problem, and fix it if it does, as a genuine piece of hygiene work.</p>
<ol class="steps">
<li><span class="vm u">dc01</span> (as <code>tunde.admin</code>, your delegated administrator from lab 8.1) <pre>Get-ADUser -Filter * -Properties Description | Select-Object Name, Description</pre></li>
<li>Set a careless description on <code>svc-backup</code> deliberately, to see what this risk looks like, then immediately remove it, exactly as a real remediation would:
<pre>Set-ADUser svc-backup -Description "temp pw Backup123 change after setup"
Get-ADUser svc-backup -Properties Description | Select-Object Description
Set-ADUser svc-backup -Description $null</pre></li></ol>
<h3>Phase 7: measure how much of this discovery Wazuh actually sees</h3>
<p>Go back through every command in phases 1, 5 and 6 and, for each one, search Wazuh for a matching event, building a small coverage table of your own, in the same style as lab 7.6 but specific to domain discovery.</p>
<table><tr><th>Command</th><th>Logged?</th><th>Which event</th><th>Would you alert on it alone?</th></tr>
<tr><td><code>whoami /all</code></td><td>?</td><td>?</td><td>?</td></tr>
<tr><td><code>net user /domain</code></td><td>?</td><td>?</td><td>?</td></tr>
<tr><td><code>nltest /domain_trusts</code></td><td>?</td><td>?</td><td>?</td></tr>
<tr><td>.NET DirectorySearcher LDAP query</td><td>?</td><td>?</td><td>?</td></tr>
<tr><td><code>Get-ADUser -Properties Description</code></td><td>?</td><td>?</td><td>?</td></tr></table>
<p>For most rows your honest answer will be "logged as a generic process creation event, but with nothing that distinguishes it from a thousand harmless uses of the same program". Write one paragraph explaining what this tells you about the limits of command-line-based detection alone, and why counting <b>how many different</b> discovery-style commands one account runs in a short window is usually a stronger idea than trying to flag any single one of them.</p>
<h3>Evidence to save (additional)</h3>
<ul><li>The LDAP search output.</li><li>Your five-row coverage table with honest answers.</li><li>Your paragraph on the limits of single-command detection.</li></ul>
<h3>Evidence to save</h3>
<ul><li>The output of each discovery command.</li><li>Your written answer on the clustering idea.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td><code>Get-ADUser</code> fails entirely</td><td>RSAT tools not installed for this user</td><td>Expected; note it as a limit on what an ordinary account can discover directly</td></tr>
<tr><td>No matching 4688 events</td><td>Command-line logging not enabled, or wrong account</td><td>Confirm lab 7.1 settings; confirm you are logged on as jane.okoro</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You saw discovery from the attacker’s chair: quick, built-in and individually unremarkable. The defence is clustering, not single-command blocking.</div>`,
quiz:[{q:"Why are built-in discovery commands hard to block?",o:["Administrators need the same tools","They are illegal to run","They require special software","They only work on Linux"],a:0},{q:"What limited jane.okoro’s discovery in this lab?",o:["She is an ordinary account without RSAT tools or elevated rights","Windows blocked all commands","The domain had no users","DNS was broken"],a:0},{q:"What is a stronger detection idea than blocking one command?",o:["Counting a cluster of discovery commands by one account in a short time","Blocking whoami entirely","Disabling the domain","Ignoring all PowerShell"],a:0}]},

{id:"8-5",mod:"m8",mins:65,title:"Simulate Kerberoasting and find the signal",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>request Kerberos service tickets for <code>svc-backup</code> the way Kerberoasting does, confirm the resulting 4769 events on <code>dc01</code>, and distinguish this pattern from normal ticket activity.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 65 minutes. <b>You need:</b> labs 8.1 and 8.2 complete, and the chapter “Kerberoasting and Defending the Domain”. You are logged on to <code>win-victim</code> as <code>jane.okoro</code>, an ordinary domain user, which is exactly the level of access this attack needs.</div>
<h3>Why simulate rather than crack</h3>
<p>The attack itself, requesting service tickets, is completely safe and legitimate in your own lab. Attempting to crack real password hashes, even your own, teaches little this academy needs and risks building habits you should not practise outside a lab. This lab stops at the request step: the part that actually produces the log evidence you need to detect.</p>
<h3>Phase 1: find SPNs and request tickets</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> (as <code>jane.okoro</code>, ordinary PowerShell) <pre>setspn -Q */* 2&gt;$null | Select-String "svc-backup"
Add-Type -AssemblyName System.IdentityModel
New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken -ArgumentList "BrightMartApp/dc01.brightmart.local"</pre>
The second command, run as any authenticated domain user, requests a service ticket for the SPN you registered in lab 8.1. No special rights are needed, which is the whole point of the technique.</li>
<li>Repeat the request two or three times in quick succession to produce a small cluster, closer to how an automated tool behaves.</li></ol>
<h3>Phase 2: find the events on dc01</h3>
<ol class="steps"><li><span class="vm h">YOUR PC</span> Search <code>agent.name:dc01 AND data.win.system.eventID:4769</code>, range Last 15 minutes. Open one event and find the <b>Service Name</b> (should show <code>svc-backup</code> or the SPN), the <b>Account Name</b> (<code>jane.okoro</code>), and the <b>Ticket Encryption Type</b> field.</li></ol>
<div class="box tip"><b>✅ You should see</b>Several 4769 events naming the <code>BrightMartApp</code> SPN, requested by <code>jane.okoro</code>, within a few seconds of each other.</div>
<h3>Phase 3: compare with normal activity</h3>
<p>Log on and off normally a couple of times, browse a shared folder if one exists, and search 4769 events again more broadly. Write down, in your notebook: how many distinct services does an ordinary short session request tickets for, roughly? How does that compare with the cluster you just produced for one account requesting one unusual SPN repeatedly?</p>

<h3>Phase 4: request tickets for every service account at once, the way a real tool would</h3>
<p>Requesting one ticket, as you did in phase 1, is a fine first demonstration, but real Kerberoasting tools enumerate <b>every</b> account with a Service Principal Name and request tickets for all of them automatically, in seconds. Reproduce that fuller picture now.</p>
<ol class="steps">
<li><span class="vm u">dc01</span> (as <code>tunde.admin</code>) Register a second, more tempting target, so that your lab has more than one account to find, mirroring a real small company that always has more than one forgotten service account:
<pre>New-ADUser -Name "svc-reporting" -SamAccountName "svc-reporting" -AccountPassword (ConvertTo-SecureString "Report2023" -AsPlainText -Force) -Enabled $true -Path "OU=ServiceAccounts,DC=brightmart,DC=local" -PasswordNeverExpires $true
setspn -A ReportingApp/dc01.brightmart.local svc-reporting
Get-ADUser -Filter {ServicePrincipalName -like "*"} -Properties ServicePrincipalName | Select-Object Name, ServicePrincipalName</pre></li>
<li><span class="vm w">WINDOWS</span> (as <code>jane.okoro</code>) Request tickets for both accounts in a tight loop, which is close to how an automated tool behaves:
<pre>$spns = @("BrightMartApp/dc01.brightmart.local","ReportingApp/dc01.brightmart.local")
foreach ($s in $spns) {
  1..2 | ForEach-Object {
    New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken -ArgumentList $s | Out-Null
  }
}</pre></li></ol>
<h3>Phase 5: extract and examine a ticket’s properties, without cracking it</h3>
<p>Seeing the actual structure of what gets requested, without attempting to break it, grounds the theory in something concrete. Use the built-in <code>klist</code> tool, which simply lists the tickets your own session is already holding, entirely legitimately.</p>
<ol class="steps"><li><span class="vm w">WINDOWS</span> <pre>klist</pre>
Find the entries for <code>BrightMartApp</code> and <code>ReportingApp</code> and note the <b>encryption type</b> shown for each (commonly <code>RC4</code> or an AES variant). Write in your notebook which encryption type you found, and recall from the chapter why RC4 specifically is the weaker, more crackable choice. If both show AES, that is itself a useful, slightly unexpected finding worth recording: modern domains at their default functional level increasingly prefer AES, which somewhat reduces, but does not eliminate, the real-world risk of this technique.</li></ol>
<h3>Phase 6: compare a well-protected account against a poorly-protected one</h3>
<p>Not every service account is equally exposed. Demonstrate the difference with your own hands, because the comparison is what makes the mitigation chapter’s advice concrete rather than abstract.</p>
<ol class="steps"><li><span class="vm u">dc01</span> Give <code>svc-reporting</code> a long, realistic, randomly generated password, exactly as the chapter recommends, and compare the two accounts side by side:
<pre>$strong = [System.Web.Security.Membership]::GeneratePassword(28,6)
Set-ADAccountPassword -Identity svc-reporting -NewPassword (ConvertTo-SecureString $strong -AsPlainText -Force) -Reset
Get-ADUser svc-backup -Properties PasswordLastSet, PasswordNeverExpires | Select-Object Name, PasswordLastSet, PasswordNeverExpires
Get-ADUser svc-reporting -Properties PasswordLastSet, PasswordNeverExpires | Select-Object Name, PasswordLastSet, PasswordNeverExpires</pre></li></ol>
<p>Write a two-row comparison table in your notebook: <code>svc-backup</code> (short, static, never expires) against <code>svc-reporting</code> (now long and random, but still never expiring, which is itself a remaining gap you should name honestly). An attacker who Kerberoasts <code>svc-reporting</code> now walks away with a ticket that is realistically impossible to crack in any useful time, while <code>svc-backup</code> remains exactly as exposed as the chapter described.</p>
<h3>Evidence to save (additional)</h3>
<ul><li>The <code>klist</code> output showing both tickets and their encryption types.</li><li>Your two-row password comparison table.</li></ul>
<h3>Evidence to save</h3>
<ul><li>Three 4769 events for the <code>BrightMartApp</code> SPN, with timestamps close together.</li><li>Your comparison notes on normal versus clustered ticket requests.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>The .NET command errors</td><td>Assembly already loaded, or a typo</td><td>Retype carefully; a harmless error about “already requested” still means a ticket was requested</td></tr>
<tr><td>No 4769 events found</td><td>dc01 agent not sending Security events, or wrong SPN name</td><td>Recheck lab 8.2; confirm the SPN with <code>setspn -Q */* 2&gt;$null</code></td></tr>
<tr><td>setspn shows nothing</td><td>Typo when registering in lab 8.1</td><td>Re-run the <code>setspn -A</code> command from lab 8.1 as a Domain Admin</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You produced the exact log evidence Kerberoasting leaves behind, using only ordinary user rights, and you compared it against normal activity. Next you turn this into a detection.</div>`,
quiz:[{q:"What rights does requesting a Kerberos service ticket require?",o:["Ordinary authenticated domain user rights","Domain Admin rights","Local administrator rights","No account at all"],a:0},{q:"Which event records a service ticket request?",o:["4769","4625","4720","1102"],a:0},{q:"Why does this lab stop at requesting tickets rather than cracking them?",o:["The request step already produces the evidence needed to detect it","Cracking is impossible","Tickets cannot be requested safely","Windows blocks it"],a:0}]},

{id:"8-6",mod:"m8",mins:55,title:"Write a Kerberoasting detection rule",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>write and test a Wazuh rule that flags an unusual burst of service ticket requests from one account, and discuss its likely false positives.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 55 minutes. <b>You need:</b> lab 8.5 complete, SSH access to <code>wazuh-server</code>, and a backup of your rules file: <code>sudo cp /var/ossec/etc/rules/local_rules.xml /var/ossec/etc/rules/local_rules.xml.bak5</code>.</div>
<h3>Phase 1: design the rule in words first</h3>
<p>Before writing XML, state the logic in a sentence, the way a detection engineer would: “Alert when the same account requests five or more Kerberos service tickets (event 4769) within sixty seconds.” This sentence is what you will defend later, so make sure it matches what you actually observed in lab 8.5.</p>
<h3>Phase 2: write and load the rule</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre>
<pre>&lt;group name="windows,kerberos,lab,"&gt;
  &lt;rule id="100230" level="11" frequency="5" timeframe="60"&gt;
    &lt;if_group&gt;win_security&lt;/if_group&gt;
    &lt;field name="win.system.eventID"&gt;^4769$&lt;/field&gt;
    &lt;same_field&gt;win.eventdata.targetUserName&lt;/same_field&gt;
    &lt;description&gt;Possible Kerberoasting: repeated service ticket requests by one account&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1558.003&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre></li>
<li>Test and restart: <pre>sudo /var/ossec/bin/wazuh-analysisd -t
sudo systemctl restart wazuh-manager</pre></li></ol>
<h3>Phase 3: trigger and confirm</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> Repeat the ticket request from lab 8.5 five or six times in quick succession.</li>
<li><span class="vm h">YOUR PC</span> Search <code>rule.id:100230</code> and confirm the alert, its level and the account named.</li></ol>
<div class="box tip"><b>✅ You should see</b>A level 11 alert naming <code>jane.okoro</code> after the repeated requests.</div>
<h3>Phase 4: false positives, honestly</h3>
<p>In your notebook, answer: (a) name one legitimate situation that might request several service tickets quickly (a user opening several different network applications at login, or a backup job touching several services); (b) how would you adjust the rule to reduce false alarms without losing the real signal? <i>Ideas: raise the threshold, exclude known service accounts that legitimately do this, or require a second signal such as an unusual source computer.</i> Write your chosen adjustment, even if you do not implement it.</p>

<h3>Phase 5: a second rule that watches for weak encryption specifically</h3>
<p>Your rule from phase 2 catches volume. A separate, equally valuable rule catches a specific <b>quality</b> signal: a service ticket requested using the weaker RC4 encryption type, which is far more useful to crack. Build it as a second, independent layer of defence, the way real detection stacks usually combine a behavioural rule with a specific indicator rule.</p>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Open one of your 4769 alerts from lab 8.5 in the JSON view and find the exact field name for ticket encryption type in your version (commonly <code>win.eventdata.ticketEncryptionType</code>, with a value such as <code>0x17</code> for RC4).</li>
<li><span class="vm u">UBUNTU</span> <pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre>
<pre>&lt;rule id="100231" level="9"&gt;
  &lt;if_group&gt;win_security&lt;/if_group&gt;
  &lt;field name="win.system.eventID"&gt;^4769$&lt;/field&gt;
  &lt;field name="win.eventdata.ticketEncryptionType"&gt;0x17&lt;/field&gt;
  &lt;description&gt;Kerberos service ticket requested with weak RC4 encryption&lt;/description&gt;
  &lt;mitre&gt;&lt;id&gt;T1558.003&lt;/id&gt;&lt;/mitre&gt;
&lt;/rule&gt;</pre>
Test, restart, then repeat a single ticket request from lab 8.5 against <code>svc-backup</code> and confirm this new, lower-threshold rule fires even for a single request, precisely because the encryption type alone is a meaningful signal that does not need a volume threshold.</li></ol>
<h3>Phase 6: measure your two Kerberoasting rules against each other</h3>
<p>You now have two different detections for the same underlying technique. Fill in this comparison table honestly, based on what you actually observed, not on what you expect:</p>
<table><tr><th>Question</th><th>Rule 100230 (volume)</th><th>Rule 100231 (RC4)</th></tr>
<tr><td>Fires on a single request?</td><td>?</td><td>?</td></tr>
<tr><td>Fires against svc-reporting after you strengthened it in lab 8.5?</td><td>?</td><td>?</td></tr>
<tr><td>Could a patient attacker, requesting one ticket every few minutes, avoid it?</td><td>?</td><td>?</td></tr>
<tr><td>What would you tell a manager is the single biggest weakness of each rule alone?</td><td>?</td><td>?</td></tr></table>
<h3>Phase 7: write the detection documentation card, the way the reading chapter described</h3>
<p>The chapter “Writing Great Detections and Great Reports” gave you a documentation template. Use it properly now, for rule 100230, as a piece of real work you could show in an interview.</p>
<pre>Name:
Rule ID:
Purpose:
Data needed:
Logic, in words:
ATT&amp;CK techniques:
Known false positives (be specific, from your own phase 4 testing in lab 8.5 if you did it, or reason it through here):
First response steps for an analyst who gets this alert at 2am:
Owner and review date:</pre>
<h3>Evidence to save (additional)</h3>
<ul><li>Rule 100231 and a screenshot of it firing on a single request.</li><li>Your completed comparison table.</li><li>Your completed documentation card for rule 100230.</li></ul>
<h3>Evidence to save</h3>
<ul><li>Your rule text and the configuration test output.</li><li>A screenshot of the alert.</li><li>Your false-positive analysis.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Configuration test fails</td><td>XML error</td><td>Restore the backup and redo the edit carefully</td></tr>
<tr><td>Rule never fires</td><td>Fewer than five requests within the window, or field names differ</td><td>Repeat the request more times, closer together; confirm field names from a real event</td></tr>
<tr><td>Alert fires on normal logons too</td><td>Threshold too low for your environment</td><td>Raise the frequency value and retest</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You wrote a behaviour-based rule for a technique that uses entirely normal permissions, proved it works, and reasoned honestly about where it would create noise.</div>`,
quiz:[{q:"What does the rule’s frequency and timeframe control?",o:["How many matching events must occur within what time before alerting","The alert’s colour","The account’s password","The ticket’s encryption"],a:0},{q:"Why might this rule produce false positives?",o:["Some legitimate activity also requests several tickets quickly","Kerberos never requests tickets normally","The rule is always wrong","It only matches on Tuesdays"],a:0},{q:"What MITRE technique is this rule tagged with?",o:["T1558.003","T1110","T1053.005","T1565.001"],a:0}]},

{id:"8-7",mod:"m8",mins:65,title:"Investigate lateral movement across two machines",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>reproduce a two-step intrusion, pivot from one agent to another in the dashboard, and build a timeline that spans <code>win-victim</code> and <code>dc01</code>.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 65 minutes. <b>You need:</b> labs 8.1 to 8.3 complete, and the chapter “RDP Attacks and Lateral Movement in Plain Language”. Take a snapshot of both <code>win-victim</code> and <code>dc01</code> called <code>12-before-lateral</code> first.</div>
<h3>Phase 1: reproduce the scenario</h3>
<ol class="steps">
<li><span class="vm k">KALI</span> Repeat the RDP brute force from lab 8.3 against <code>jane.okoro</code>, making sure the real password is found.</li>
<li><span class="vm w">WINDOWS</span> Log on to <code>win-victim</code> as <code>jane.okoro</code> (simulating the attacker having succeeded), then immediately connect onward to the domain controller, simulating lateral movement with the same stolen account:
<pre>net use \\dc01.brightmart.local\IPC$</pre></li></ol>
<h3>Phase 2: pivot in the dashboard</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Search <code>agent.name:win-victim AND data.win.eventdata.targetUserName:jane.okoro AND data.win.system.eventID:4624</code>, range Last 15 minutes. Note the time of the successful logon.</li>
<li>Now search the <b>same account</b>, but with the agent changed: <code>agent.name:dc01 AND data.win.eventdata.targetUserName:jane.okoro AND data.win.system.eventID:4624</code>. This is the pivot: you took one detail, the account, from one machine and searched for it everywhere.</li>
<li>Note the logon type and source on <code>dc01</code>. A logon from <code>win-victim</code>’s own address, rather than Kali’s external address, is exactly what the chapter described.</li></ol>
<h3>Phase 3: build the timeline</h3>
<table><tr><th>Time</th><th>Agent</th><th>Event</th><th>Source</th><th>Meaning</th></tr>
<tr><td>?</td><td>win-victim</td><td>4625 (repeated)</td><td>Kali’s address</td><td>Brute force in progress</td></tr>
<tr><td>?</td><td>win-victim</td><td>4624 type 10</td><td>Kali’s address</td><td>Attacker gains an interactive session</td></tr>
<tr><td>?</td><td>dc01</td><td>4624 type 3</td><td>win-victim’s address</td><td>Lateral movement using the stolen account</td></tr>
<table>
<p>Fill in the real times from your search results.</p>
<h3>Phase 4: write the verdict</h3>
<p>In your notebook, write two or three sentences stating your verdict (true positive, lateral movement likely), the evidence that supports it (the same account on two machines, from two different sources, within a short window), and the next containment step you would take.</p>

<h3>Phase 5: a richer, three-hop version of the scenario</h3>
<p>Two machines is the minimum that teaches pivoting. A third hop makes the investigation genuinely harder, and far closer to what a real Tier 2 analyst faces, so add one. Use <code>tunde.admin</code>’s credential as the thing the attacker steals <b>next</b>, after already being on <code>win-victim</code>, to show privilege escalation layered on top of lateral movement.</p>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> (still logged on to <code>win-victim</code> as <code>jane.okoro</code>, simulating the attacker’s foothold) Simulate the attacker finding and using a second, more powerful stolen credential to reach the domain controller directly and interactively this time, rather than just an IPC$ connection:
<pre>$cred = New-Object System.Management.Automation.PSCredential("BRIGHTMART\tunde.admin",(ConvertTo-SecureString "AdminPass2024!" -AsPlainText -Force))
Invoke-Command -ComputerName dc01.brightmart.local -Credential $cred -ScriptBlock { whoami; hostname }</pre></li></ol>
<h3>Phase 6: pivot again, this time on the privileged account</h3>
<ol class="steps"><li><span class="vm h">YOUR PC</span> Search <code>agent.name:dc01 AND data.win.eventdata.targetUserName:tunde.admin AND data.win.system.eventID:4624</code>, then also check for event <b>4672</b> (special privileges assigned) on the same logon ID, which confirms this was genuinely a privileged session, not just any account. Add this third row to your lab 8.7 timeline table.</li></ol>
<table><tr><th>Time</th><th>Agent</th><th>Event</th><th>Account</th><th>Source</th><th>Meaning</th></tr>
<tr><td>?</td><td>dc01</td><td>4624 type 3, then 4672</td><td>tunde.admin</td><td>win-victim</td><td>A privileged account used from the already-compromised workstation: escalation, not just movement</td></tr></table>
<h3>Phase 7: the question every manager actually asks first</h3>
<p>In a real incident, the very first question from above is almost never "what technique was used". It is "<b>what can the attacker reach now</b>". Answer it properly, using the directory itself rather than guessing.</p>
<ol class="steps"><li><span class="vm u">dc01</span> (as <code>tunde.admin</code>, so you see exactly what the stolen credential could see) <pre>Get-ADGroupMember "Domain Admins" | Format-Table Name
Get-ADGroup -Filter * | Where-Object { $_.Name -like "*Admin*" } | Format-Table Name
Get-ADComputer -Filter * | Format-Table Name, DNSHostName</pre></li></ol>
<p>Write a short "blast radius" paragraph in your notebook: given that <code>tunde.admin</code> is a Domain Admin, and every computer in the domain trusts the domain, what is the honest worst case here? <i>Expected answer, in your own words: full compromise of every domain-joined computer and every account, because Domain Admin rights reach everything the domain controls.</i> This paragraph, more than any single technical detail, is the sentence a real executive actually wants from you during an incident.</p>
<h3>Phase 8: undo the escalation safely before moving on</h3>
<p>Nothing destructive happened, but end the remote session cleanly and confirm no lingering sessions remain, which is itself good practice after any lab that uses <code>Invoke-Command</code>:</p>
<pre>Get-PSSession | Remove-PSSession</pre>
<h3>Evidence to save (additional)</h3>
<ul><li>The third timeline row with the 4672 event.</li><li>Your blast-radius paragraph.</li><li>Confirmation that no PowerShell sessions remain open.</li></ul>
<h3>Evidence to save</h3>
<ul><li>The completed timeline.</li><li>Screenshots of the 4624 events on both agents.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>No 4624 on dc01</td><td><code>net use</code> did not actually authenticate, or DNS failed</td><td>Confirm <code>Resolve-DnsName dc01.brightmart.local</code> works; retry the <code>net use</code> command</td></tr>
<tr><td>Cannot tell which address is which</td><td>Event fields vary by version</td><td>Open the JSON and look for <code>ipAddress</code> or <code>workstationName</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You practised the single most important lateral-movement skill: pivoting an account across every agent, not just the one that first alerted, and reading the resulting pattern as one connected story.</div>`,
quiz:[{q:"What does pivoting mean in this lab?",o:["Searching the same account across every agent, not just one","Changing a password","Restarting a service","Deleting an account"],a:0},{q:"What made the dc01 logon look like lateral movement rather than a fresh attack?",o:["It came from win-victim’s address, using the same stolen account","It came from Kali directly","It used a different account","It had no timestamp"],a:0},{q:"Why snapshot before this lab?",o:["To create a clean restore point before simulating a compromise","To save disk space","It is required by Wazuh","To speed up logon"],a:0}]},

{id:"8-8",mod:"m8",mins:65,title:"Contain the domain account and write the Case File #3 report",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>practise containing a compromised domain account across two machines, undo your containment so later labs still work, and write a one-page incident report that spans the whole case file.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 65 minutes. <b>You need:</b> labs 8.1 to 8.7 complete and your timeline from lab 8.7. The chapter “A Worked Investigation, Step by Step” shows a full report example you can follow.</div>
<h3>Phase 1: contain at the domain level</h3>
<ol class="steps"><li><span class="vm u">dc01</span> (<i>run this on the dc01 VM, as a Domain Admin</i>) <pre>Disable-ADAccount -Identity jane.okoro
Get-ADUser jane.okoro -Properties Enabled | Select-Object SamAccountName, Enabled</pre>
Disabling at the domain takes effect on every machine that trusts the domain, immediately, unlike a local account lock which only affects one computer.</li>
<li>End any active sessions using the account, if you can find one, and reset the password as a further step:
<pre>Set-ADAccountPassword -Identity jane.okoro -NewPassword (ConvertTo-SecureString "NewSecurePass2024!" -AsPlainText -Force) -Reset</pre></li></ol>
<h3>Phase 2: confirm containment</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> On <code>win-victim</code>, try: <pre>net use \\dc01.brightmart.local\IPC$ /user:jane.okoro NewSecurePass2024!</pre>
Expect this to still work, since you just reset it correctly. Now try the <b>old</b> password, which should fail, proving the account cannot be reached with the compromised credential any longer.</li></ol>
<h3>Phase 3: undo, for later labs</h3>
<ol class="steps"><li><span class="vm u">dc01</span> <pre>Enable-ADAccount -Identity jane.okoro
Set-ADAccountPassword -Identity jane.okoro -NewPassword (ConvertTo-SecureString "Welcome2024!" -AsPlainText -Force) -Reset</pre></li></ol>
<h3>Phase 4: write the incident report</h3>
<p>Using your timeline from lab 8.7 and the detections from labs 8.3 and 8.6, write a one-page report with these sections, following the structure from “A Worked Investigation, Step by Step”.</p>
<table><tr><th>Section</th><th>What to include</th></tr>
<tr><td>Summary</td><td>Three sentences: an external address guessed jane.okoro’s RDP password, gained an interactive session on win-victim, and used the same account to reach dc01.</td></tr>
<tr><td>Timeline</td><td>Your table from lab 8.7, with real times.</td></tr>
<tr><td>Affected assets</td><td>win-victim, dc01, the account jane.okoro.</td></tr>
<tr><td>Detection</td><td>Rule 100220 (RDP brute force) and, if relevant, 100230 (Kerberoasting); which fired first.</td></tr>
<tr><td>MITRE mapping</td><td>T1110 (brute force), T1021.001 (remote services, RDP), T1558.003 if Kerberoasting was part of your scenario.</td></tr>
<tr><td>Containment</td><td>Account disabled at the domain, password reset, confirmed with a failed old-password test.</td></tr>
<tr><td>Root cause</td><td>RDP exposed with a guessable password and no account lockout or MFA.</td></tr>
<tr><td>Recommendations</td><td>MFA for RDP, a VPN or gateway in front of RDP, service account password rotation for svc-backup, and tuning the two new rules.</td></tr></table>
<div class="box lab"><b>🏆 Self-check</b>Does your report correctly distinguish the brute force stage from the lateral-movement stage? Could a colleague reproduce your timeline from your evidence alone? Could a manager act on your three recommendations without asking you anything further?</div>

<h3>Phase 5: contain the escalated account too, not just the first one</h3>
