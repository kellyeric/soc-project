<pre>Oct 27 10:12:01 wazuh-server sshd[1234]: Failed password for invalid user admin from 192.168.56.50 port 4242 ssh2
 ^when           ^computer     ^program   ^what happened            ^user           ^source IP</pre>
<p>Most lines answer six questions: <b>when, which computer, which program, what happened, to whom, and from where</b>. On Linux logs are text files in <code>/var/log</code>. On Windows they are <b>events</b> in the Event Log, each with an <b>Event ID</b>. Two to remember today: <b>4625</b> is a failed logon and <b>4624</b> is a successful logon.</p>
<h3>Exercise A: a failed login on Linux</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> Watch the log live. Leave it running:
<pre>sudo tail -f /var/log/auth.log</pre></li>
<li><span class="vm k">KALI</span> Try to log in with a user that does not exist:
<pre>ssh fakeuser@192.168.56.10</pre>
Type any password when asked, and again if prompted, then press Ctrl+C.</li>
<li><span class="vm u">UBUNTU</span> Watch a new line appear. Then press <code>Ctrl+C</code>.</li>
<li>Now fail a login for a <b>real</b> account:
<pre>ssh labuser@192.168.56.10</pre>
(from Kali, with a wrong password) and read the new line. Notice that the text now says <code>Failed password for labuser</code> without the words “invalid user”.</li></ol>
<div class="box tip"><b>✅ You should see</b>One line with <code>Failed password for invalid user fakeuser from 192.168.56.50</code> and another with <code>Failed password for labuser</code>. Mark the six parts on each. The difference between “invalid user” and a real user is meaningful: attacks on real names are more serious.</div>
<h3>Exercise B: a failed logon on Windows</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> (admin PowerShell) Make sure failures are recorded, then fail one on purpose:
<pre>auditpol /set /subcategory:"Logon" /success:enable /failure:enable
net use \\localhost\IPC$ /user:labuser WrongPassword</pre>
An error is expected.</li>
<li>Open <b>Event Viewer</b> (Start → type it) → <b>Windows Logs → Security</b>. In the right panel choose <b>Filter Current Log</b>, type <code>4625</code> in the Event ID box and click OK.</li>
<li>Double-click the newest event and read <b>Account Name</b>, <b>Failure Reason</b> and <b>Source Network Address</b>.</li>
<li>Read the same event in PowerShell:
<pre>Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} -MaxEvents 3 | Format-List TimeCreated, Message</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>An event with ID 4625, account <code>labuser</code> and a reason such as “Unknown user name or bad password”.</div>
<h3>Same event, two systems</h3>
<table><tr><th>Question</th><th>Linux (auth.log)</th><th>Windows (event 4625)</th></tr>
<tr><td>When?</td><td>Start of the line</td><td>“Logged” time</td></tr><tr><td>Which computer?</td><td>Host name</td><td>“Computer” field</td></tr><tr><td>Which account?</td><td>After <code>for</code> or <code>user</code></td><td>Account Name</td></tr><tr><td>From where?</td><td>After <code>from</code></td><td>Source Network Address</td></tr><tr><td>Why?</td><td>Message text</td><td>Status and Sub Status codes</td></tr></table>
<div class="box edge"><b>Timezones</b>Logs are time-stamped. If two computers disagree about the time, you cannot build a timeline. Security teams use UTC. Check yours with <code>timedatectl</code> on Linux and <code>Get-TimeZone</code> on Windows.</div>
<h3>Evidence to save</h3>
<ul><li>Both log lines or events, copied into your notebook, with the six parts marked.</li><li>One sentence on how “invalid user” and a real failed user differ.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td><code>auth.log</code> not found or empty</td><td>Logging goes to the journal</td><td><code>sudo journalctl -u ssh -n 10</code></td></tr>
<tr><td>No 4625 event</td><td>Failure auditing is off</td><td>Run the <code>auditpol</code> line again and repeat the failure</td></tr>
<tr><td>Event Viewer filter is empty</td><td>Wrong log or old filters</td><td>Clear filters; confirm you chose Security</td></tr>
<tr><td>Kali cannot reach SSH</td><td>Network or SSH stopped</td><td>Redo the ping matrix; check <code>systemctl status ssh</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You read a log line, produced the same kind of event on both systems, and found it in the right place. In Module 4, Wazuh will do this for you automatically and at scale.</div>
<h3>🔬 Go deeper: the same event, two systems, one story</h3>
<p>In this lesson you made a failed login on Linux and another on Windows. The core skill of a SIEM is recognising that they are the same <b>kind</b> of event. Compare them side by side in your notebook using this table.</p>
<table><tr><th>Question</th><th>Linux (auth.log)</th><th>Windows (event 4625)</th></tr>
<tr><td>When?</td><td>The date and time at the start of the line</td><td>The “Logged” time, shown in local time</td></tr>
<tr><td>Which computer?</td><td>The host name after the time</td><td>The “Computer” field</td></tr>
<tr><td>Which account?</td><td>The word after <code>for</code> or <code>user</code></td><td>Account Name under “Account For Which Logon Failed”</td></tr>
<tr><td>From where?</td><td>The address after <code>from</code></td><td>Source Network Address</td></tr>
<tr><td>Why?</td><td>The text, such as “Failed password”</td><td>Status and Sub Status codes</td></tr></table>
<p>A SIEM stores each row in a common field, so one search can find failed logons on both systems. Wazuh calls these fields things like <code>srcip</code> and <code>srcuser</code>. This idea is called <b>normalisation</b>.</p>
<p>Now check the clocks. On Ubuntu run <code>timedatectl</code>; in PowerShell run <code>Get-TimeZone</code> and <code>Get-Date</code>. If the zones differ, convert one event’s time so that you can say which happened first.</p>
<div class="box lab"><b>Challenge</b>Write a three-line timeline that mixes one Linux and one Windows event, with both times converted to UTC. Say in one sentence why a SOC insists on a single time zone.</div>`,
quiz:[{q:"Windows Event ID 4625 means…",o:["Failed logon","Successful logon","User created","Service started"],a:0},{q:"Which log shows SSH logins on Ubuntu?",o:["/var/log/auth.log","/etc/passwd","C:\\Windows","/boot"],a:0},{q:"Why must computer clocks agree?",o:["So timelines can be built correctly","To save power","For the wallpaper","They do not need to"],a:0}]},

{id:"3-1",mod:"m3",mins:60,title:"Security foundations lab: assets, threats and a risk register",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>apply the CIA triad, classify real incidents, and build a risk register for your own lab, with each risk rated and a control chosen.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 60 minutes. <b>You need:</b> your notebook and the chapters “How Attackers Think” and “Vulnerabilities and Threat Intelligence” if you can. Alerts only make sense when you know what is being protected and what an attacker wants.</div>
<h3>The vocabulary</h3>
<table><tr><th>Word</th><th>Meaning</th></tr><tr><td>Asset</td><td>Anything valuable: data, servers, reputation</td></tr><tr><td>Vulnerability</td><td>A weakness, such as a weak password</td></tr><tr><td>Threat</td><td>Someone or something that could exploit it</td></tr><tr><td>Risk</td><td>Likelihood multiplied by impact</td></tr><tr><td>Control</td><td>A protection: backups, MFA, monitoring</td></tr></table>
<h3>Phase 1: classify eight incidents</h3>
<p>For each, write which CIA goal is mainly affected: <b>C</b> confidentiality, <b>I</b> integrity or <b>A</b> availability. Then check the answers.</p>
<table><tr><th>#</th><th>Incident</th></tr><tr><td>1</td><td>Ransomware encrypts every file on the file server.</td></tr><tr><td>2</td><td>Someone changes a salary spreadsheet.</td></tr><tr><td>3</td><td>A customer database appears for sale online.</td></tr><tr><td>4</td><td>A flood of traffic takes the shop’s website offline.</td></tr><tr><td>5</td><td>An attacker edits prices in a product file.</td></tr><tr><td>6</td><td>A laptop with unencrypted customer data is stolen.</td></tr><tr><td>7</td><td>A power cut stops the order system.</td></tr><tr><td>8</td><td>A hacker defaces a company website.</td></tr></table>
<details><summary>Show answers</summary><p>1 A (and C if data is copied). 2 I. 3 C. 4 A. 5 I. 6 C. 7 A. 8 I. Several incidents touch more than one goal; the skill is naming the <b>main</b> one and the secondary ones.</p></details>
<h3>Phase 2: build a risk register for your lab</h3>
<p>List your lab’s assets and think like a defender. Fill in a table like this, with at least six rows. Rate likelihood and impact from 1 (low) to 5 (high), and multiply them.</p>
<table><tr><th>Asset</th><th>Threat</th><th>Vulnerability</th><th>Likelihood</th><th>Impact</th><th>Risk</th><th>Control</th></tr>
<tr><td>wazuh-server</td><td>Password guessing</td><td>Weak labuser password</td><td>4</td><td>3</td><td>12</td><td>Keys, lockout, monitoring</td></tr>
<tr><td>win-victim</td><td>Malicious file in Startup</td><td>No monitoring yet</td><td>?</td><td>?</td><td>?</td><td>?</td></tr>
<tr><td>Notebook</td><td>Accidental sharing</td><td>Contains passwords</td><td>?</td><td>?</td><td>?</td><td>?</td></tr></table>
<h3>Phase 3: prioritise</h3>
<p>Sort your rows from highest to lowest risk. Choose the top two and write which control you would put in place first, and what it would cost in time or money. This is the same reasoning a security team uses to decide where to spend a limited budget.</p>
<div class="box tip"><b>✅ You should see</b>A risk register with six or more rows, a ranked list, and a written reason for your top two controls.</div>
<h3>Evidence to save</h3>
<ul><li>The completed incident classification and your risk register.</li><li>A paragraph: “The risk I am most worried about is ___ because ___.”</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Difficulty</th><th>Help</th></tr><tr><td>Cannot decide between threat and vulnerability</td><td>The vulnerability is the weakness; the threat is who could use it.</td></tr><tr><td>Do not know how to rate</td><td>Use your best judgement and write down why; consistency matters more than precision.</td></tr><tr><td>Everything feels high risk</td><td>Compare rows against each other; the ranking matters more than the number.</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You used the vocabulary on real examples, built a simple risk register and chose controls by priority. This is how a SOC decides what to watch first.</div>`,
quiz:[{q:"Someone secretly edits prices. Which CIA goal?",o:["Integrity","Confidentiality","Availability","None"],a:0},{q:"A weak password is a…",o:["Vulnerability","Threat","Control","Asset"],a:0},{q:"How is risk estimated?",o:["Likelihood times impact","Age of the asset","Price of the asset","Number of users"],a:0}]},

{id:"3-2",mod:"m3",mins:70,title:"Attack chain lab: MITRE ATT&CK and technique cards",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>find techniques in MITRE ATT&CK, map a story to the attack chain, write two technique cards, and draw an attack chain for the BrightMart case file.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 70 minutes. <b>You need:</b> internet access and the chapters “How Attackers Think” and “Phishing and Social Engineering” if you can. Attackers follow steps. If you catch any step, you can stop the rest, and SOC teams name techniques with ATT&CK IDs so everyone speaks the same language.</div>
<h3>The attack chain in plain words</h3>
<table><tr><th>Stage</th><th>Goal</th><th>Lab example</th></tr>
<tr><td>Reconnaissance</td><td>Find targets</td><td>Nmap scan</td></tr><tr><td>Initial access</td><td>Get in</td><td>Guess an SSH password</td></tr><tr><td>Execution</td><td>Run code</td><td>A PowerShell command</td></tr><tr><td>Persistence</td><td>Stay after a reboot</td><td>Startup folder, Run key</td></tr><tr><td>Privilege escalation</td><td>Become admin</td><td>Add self to Administrators</td></tr><tr><td>Defence evasion</td><td>Avoid detection</td><td>Clear logs, switch off antivirus</td></tr><tr><td>Credential access</td><td>Steal passwords</td><td>Brute force</td></tr><tr><td>Lateral movement</td><td>Spread</td><td>Remote Desktop to another PC</td></tr><tr><td>Collection and exfiltration</td><td>Gather and steal data</td><td>Copy files out</td></tr><tr><td>Impact</td><td>Do harm</td><td>Ransomware, defacement</td></tr></table>
<h3>Phase 1: learn to use ATT&CK</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Open <b>attack.mitre.org</b>. Click <b>Matrix → Enterprise</b>. The columns are stages (called tactics) and the cells are techniques.</li>
<li>Use the search box for <code>T1110</code>. Read: the description, the sub-techniques (such as Password Spraying), the <b>Detection</b> section and the <b>Mitigations</b> section.</li>
<li>Search <code>T1547.001</code> and read it the same way.</li></ol>
<h3>Phase 2: write two technique cards</h3>
<p>For T1110 and T1547.001, fill in this card in your notebook:</p>
<pre>Technique: ________ (ID, name)
Stage: ________
How it works (my words): ________
What it looks like in logs: ________
How I would detect it: ________
How I would reduce it: ________
Where I practise it in this academy: ________</pre>
<h3>Phase 3: map a story</h3>
<p>Match each step to a stage and look up a technique ID: <i>(a) a bot guesses passwords on SSH; (b) it logs in as labuser; (c) it drops a program in the Startup folder; (d) it deletes the Windows security log.</i></p>
<details><summary>Show answers</summary><p>(a) Credential access, T1110. (b) Initial access using valid accounts, T1078. (c) Persistence, T1547.001. (d) Defence evasion, T1070.001.</p></details>
<h3>Phase 4: draw the BrightMart chain</h3>
<p>In the BrightMart case file, Shadow makes several moves. Before you start Module 5, predict them: write the stage, the technique and the detection you would hope for in a table.</p>
<table><tr><th>Move</th><th>Stage</th><th>Technique</th><th>Your planned detection</th></tr><tr><td>Change prices</td><td>Impact</td><td>T1565</td><td>?</td></tr><tr><td>Edit hosts file</td><td>?</td><td>?</td><td>?</td></tr><tr><td>Program in Startup</td><td>?</td><td>?</td><td>?</td></tr><tr><td>Run key</td><td>?</td><td>?</td><td>?</td></tr></table>
<div class="box tip"><b>✅ You should see</b>Two completed technique cards, four mapped steps with correct IDs, and a table with your predictions for Module 5. Come back to it after the case file and mark which predictions were right.</div>
<h3>Evidence to save</h3>
<ul><li>The two cards and the prediction table.</li><li>One sentence: “The stage I would most like to catch is ___ because ___.”</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Difficulty</th><th>Help</th></tr><tr><td>The matrix looks overwhelming</td><td>Use the search box; you never read the whole matrix.</td></tr><tr><td>Several techniques seem to fit</td><td>Pick the closest one and note the alternative; real analysts disagree too.</td></tr><tr><td>Cannot find a technique ID</td><td>Search by name, then read the ID on the page.</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You used the ATT&CK catalogue, wrote reusable technique cards and mapped attacker actions to stages. You do not need to memorise IDs, but you do need to recognise the stage and look the technique up.</div>`,
quiz:[{q:"A program planted to survive reboot belongs to which stage?",o:["Persistence","Reconnaissance","Impact","Exfiltration"],a:0},{q:"What is MITRE ATT&CK?",o:["A public catalogue of attacker techniques","A firewall","A Windows update","A password list"],a:0},{q:"Scanning for open ports is…",o:["Reconnaissance","Impact","Persistence","Evasion"],a:0}]},

{id:"3-3",mod:"m3",mins:75,title:"Triage lab: the SOC workflow on real alerts",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>apply the seven-question triage method to three alerts, write a closing note and a handover note, and explain severity versus priority.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 75 minutes. <b>You need:</b> your notebook and the chapter “Triage and Investigation: The Analyst’s Method”. This is your future job, and the method here is the same one you will use in the case files.</div>
<h3>The method</h3>
<p>Answer these seven questions for every alert: <b>1 What happened? 2 Who or what is involved? 3 When, and what is around it? 4 Is it normal here? 5 What else is connected? 6 How bad could it be? 7 What should be done, and by whom?</b> Then write your verdict: true positive or false positive.</p>
<h3>Phase 1: triage three alerts</h3>
<p>For each alert, answer the seven questions in your notebook, then compare with the suggested verdict.</p>
<table><tr><th>#</th><th>Alert</th></tr>
<tr><td>1</td><td>“50 failed logins for admin from an IP in another country in 2 minutes.”</td></tr>
<tr><td>2</td><td>“Backup software modified files in D:\Backups at 02:00, as scheduled.”</td></tr>
<tr><td>3</td><td>“A new program was added to the Startup folder by a user who never uses Startup.”</td></tr></table>
<details><summary>Show suggested verdicts</summary><p>1 Likely true positive (brute force); look up whether any login succeeded; block and monitor. 2 False positive (expected); check the change calendar and add a tuning note. 3 Suspicious; investigate the file, its signature, and who created it; likely true positive.</p></details>
<h3>Phase 2: write a closing note</h3>
<p>Choose alert 2 and write a closing note a stranger could understand. Use this pattern:</p>
<pre>Closed as false positive. Source: backup server (asset record ___). Matches the nightly backup job in the change calendar (record ___). No related alerts in the previous 24 hours. Suggested tuning: exclude this program in rule ___.</pre>
<h3>Phase 3: write a handover note</h3>
<p>Imagine your shift is ending and alert 3 is still open. Write a handover note in four lines: what the alert is, what you checked, what you have not checked, and what the next analyst should do first.</p>
<h3>Phase 4: severity versus priority</h3>
<p>Wazuh gives levels from 0 to 15. Decide which alert deserves attention first and why: (a) level 5 alert on the payroll server; (b) level 12 alert on a test machine nobody uses. Write your choice and one sentence of reasoning. <i>Suggested: (a) may be more urgent, because context decides priority.</i></p>
<div class="box tip"><b>✅ You should see</b>Three triaged alerts with written answers, a closing note, a handover note, and a reasoned choice in phase 4.</div>
<h3>Evidence to save</h3>
<ul><li>Your seven answers for alert 3, your closing note and your handover note.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Difficulty</th><th>Help</th></tr><tr><td>“I do not have enough information to decide.”</td><td>Good: write what extra fact you need, and from where. That is a valid triage result.</td></tr><tr><td>Unsure between false and true positive</td><td>Assume the worse until you find a harmless explanation that fits every fact.</td></tr><tr><td>Notes feel too long</td><td>Aim for facts, not stories: what, who, when, decision.</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You applied a repeatable method to three alerts, wrote notes that someone else can use, and practised separating severity from priority.</div>
<h3>🔬 Go deeper: five more triage drills</h3>
<p>For each alert, write your verdict (true positive, false positive or needs more information), the first extra fact you would look up, and your action. Then check the suggested answer.</p>
<ol class="steps">
<li><b>“A user logged in from two countries within ten minutes.”</b> <i>Suggested:</i> likely suspicious unless a VPN explains it. Look up: the sign-in addresses, the device, and whether the user is travelling. Action: contact the user and, if unconfirmed, reset the password and end sessions.</li>
<li><b>“A new local administrator was created on a server at 14:05.”</b> <i>Suggested:</i> needs information. Look up: the change calendar and who created it. Action: if no approved change, treat as a true positive and escalate.</li>
<li><b>“An antivirus tool quarantined a file on a laptop.”</b> <i>Suggested:</i> true positive with probably no impact, since the tool acted. Look up: how the file arrived and whether it ran before it was caught.</li>
<li><b>“A web server shows 300 requests for pages that do not exist, from one address.”</b> <i>Suggested:</i> scanning, a true positive with low impact. Look up: whether any request succeeded. Action: block if policy allows; note the address.</li>
<li><b>“The Wazuh agent on a finance laptop stopped reporting at 02:00.”</b> <i>Suggested:</i> needs information. It may be a switched-off laptop, or tampering. Look up: other events from the same host just before it went quiet. Action: contact the owner; escalate if the history looks odd.</li></ol>
<div class="box lab"><b>Challenge</b>Invent two alerts of your own, one clearly harmless and one clearly serious, and swap them with a friend to triage.</div>`,
quiz:[{q:"A harmless alert is called a…",o:["False positive","True positive","Exploit","Payload"],a:0},{q:"Which role writes and tunes detection rules?",o:["Detection engineer","Help desk","Developer","Auditor"],a:0},{q:"What decides priority besides severity?",o:["Context such as the asset and the account","The colour of the alert","The alert’s length","The analyst’s mood"],a:0}]},

{id:"4-1",mod:"m4",mins:50,title:"How Wazuh works: map it, then check your server is ready",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>name the four parts of Wazuh and the ports they use, trace how one log becomes an alert, and prove that your Ubuntu VM has the memory, disk and internet access the installation needs.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 50 minutes. <b>You need:</b> <code>wazuh-server</code> running with the address from lab 1.6, and the chapters “Wazuh Deep Dive” and “Running Wazuh in a Real Company” if you can. When something fails later, you will troubleshoot by asking which part is failing. You can only do that if you know the parts, so we study the map before touching the installer.</div>
<h3>Phase 1: the four parts</h3>
<table><tr><th>Part</th><th>Job</th><th>Mall analogy</th></tr>
<tr><td><b>Agent</b></td><td>Runs on each computer; reads logs and files and sends them</td><td>A security camera</td></tr>
<tr><td><b>Wazuh server</b></td><td>Receives data, decodes it, applies rules, creates alerts</td><td>The guard who understands the feeds</td></tr>
<tr><td><b>Wazuh indexer</b></td><td>Stores alerts so they can be searched fast</td><td>The recording room</td></tr>
<tr><td><b>Wazuh dashboard</b></td><td>The web page analysts use</td><td>The monitor wall</td></tr></table>
<p>In your lab, the server, indexer and dashboard all run on <code>wazuh-server</code> (the “all-in-one” design). The agent runs on <code>win-victim</code>, and the Ubuntu machine monitors itself as <b>agent 000</b>.</p>
<h3>Phase 2: draw it from memory</h3>
<p>Close this page for two minutes and draw, on paper, the path of one failed SSH login: from the log file, through the agent, to the dashboard. Write the port numbers. Then compare with the answer below.</p>
<details><summary>Show the answer</summary><pre>log line → agent (or the server itself) → port 1514 → decoder → rule → alert → indexer → dashboard (port 443) → you
agents enrol on port 1515; the API is on 55000; the indexer listens on 9200</pre></details>
<h3>Phase 3: check that your server is ready</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Connect: <code>ssh socadmin@192.168.56.10</code></li>
<li><span class="vm u">UBUNTU</span> <pre>free -h
nproc
df -h /
hostnamectl | head -n 3
curl -sI https://packages.wazuh.com | head -n 1</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>At least 5 GB of memory in the “total” column (6 GB or more recommended), 2 or more processors (4 recommended), at least 30 GB free on <code>/</code> (50 GB total), the static hostname <code>wazuh-server</code>, and a line beginning <code>HTTP/</code> from the download site. If the last command prints nothing, the VM has no internet: fix Adapter 1 (NAT) first.</div>
<h3>Phase 4: take the before-Wazuh snapshot</h3>
<p>In VirtualBox, with the VM running or switched off, open its <b>Snapshots</b> tab and take a snapshot called <code>02-before-wazuh</code>. If the installation fails or you want to restart the lesson, you will return here in seconds.</p>
<h3>Phase 5: plan your troubleshooting map</h3>
<p>Copy this table to your notebook and fill the third column. You will use it in lab 4.2.</p>
<table><tr><th>Symptom</th><th>Part to suspect</th><th>First check</th></tr>
<tr><td>Dashboard page does not open</td><td>?</td><td>?</td></tr><tr><td>Agent never connects</td><td>?</td><td>?</td></tr><tr><td>Event happened but no alert</td><td>?</td><td>?</td></tr><tr><td>Alert exists but is not on the dashboard</td><td>?</td><td>?</td></tr></table>
<details><summary>Suggested answers</summary><p>Dashboard: the dashboard service and port 443. Agent: network and ports 1514 and 1515, and the agent log. No alert: the decoder and rule, tested with wazuh-logtest. Missing on the dashboard: the indexer, disk space and the shipper.</p></details>
<h3>Evidence to save</h3>
<ul><li>Your hand-drawn diagram (a photo is fine) and the filled table.</li><li>The output of the readiness commands and the snapshot list.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Memory shows less than 5 GB</td><td>VM was created with too little RAM</td><td>Power off; Settings → System → increase memory within your plan</td></tr>
<tr><td>Less than 30 GB free</td><td>Small virtual disk</td><td>Create a larger disk, or rebuild the VM with 50 GB</td></tr>
<tr><td><code>curl</code> prints nothing</td><td>No internet through NAT</td><td>Check Adapter 1 is NAT and cable connected; restart the VM</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You can now name the parts, the ports and the data path, and you know your server meets the requirements. You also have a snapshot to return to. Next you install Wazuh.</div>`,
quiz:[{q:"Which part stores alerts for searching?",o:["Indexer","Agent","Dashboard","Router"],a:0},{q:"Agents send events on port…",o:["1514","22","443","3389"],a:0},{q:"Why take a snapshot before installing?",o:["To restart cleanly if it fails","To speed up Ubuntu","It is legally required","To save passwords"],a:0}]},

{id:"4-2",mod:"m4",mins:75,title:"Install Wazuh on wazuh-server",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have Wazuh installed and running, be logged in to the dashboard from your own PC, and have saved the administrator password and a snapshot called <code>03-wazuh-installed</code>.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> 45 to 75 minutes, mostly waiting. <b>You need:</b> lab 4.1 complete, the snapshot <code>02-before-wazuh</code> and an internet connection in the VM. Installing and checking a SIEM is part of the job. We use the official installation assistant, which sets up all four parts with one command.</div>
<div class="box edge"><b>Version note</b>The commands use version <b>4.14</b>, which was the current release in the official quickstart when this lesson was written. Before you begin, open <b>documentation.wazuh.com/current/quickstart.html</b>. If the <code>curl</code> line shows a newer number, use that number instead.</div>
<h3>Phase 1: install</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> <code>ssh socadmin@192.168.56.10</code></li>
<li><span class="vm u">UBUNTU</span> Make sure the tools exist:
<pre>sudo apt update &amp;&amp; sudo apt install -y curl</pre></li>
<li>Download and run the installer. It takes about 15 to 30 minutes, so do not close the window. It prints progress lines such as “Installing Wazuh indexer”:
<pre>curl -sO https://packages.wazuh.com/4.14/wazuh-install.sh &amp;&amp; sudo bash ./wazuh-install.sh -a</pre></li>
<li><b>Copy the administrator password now.</b> The summary shows <code>User: admin</code> and a long <code>Password</code>. Paste it into a text file on your PC. If you lose it, see the troubleshooting table.</li></ol>
<h3>Phase 2: verify with three independent checks</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> Services: <pre>sudo systemctl is-active wazuh-manager wazuh-indexer wazuh-dashboard filebeat</pre></li>
<li>Ports: <pre>sudo ss -tulpn | grep -E ':(1514|1515|55000|443|9200)'</pre></li>
<li>Firewall (only if it is switched on): <pre>sudo ufw status
sudo ufw allow 1514,1515,55000,443/tcp</pre></li>
<li><span class="vm h">YOUR PC</span> Open <code>https://192.168.56.10</code> in a browser. It warns that the certificate is not trusted: this is expected in a lab. Choose <b>Advanced → Proceed</b>. Log in with <code>admin</code> and the password.</li></ol>
<div class="box tip"><b>✅ You should see</b><code>active</code> four times; listeners on 1514, 1515, 55000, 443 and 9200; and the Wazuh dashboard after login, showing one active agent (the server itself, agent 000).</div>
<h3>Phase 3: protect your work</h3>
<ol class="steps">
<li>Stop accidental upgrades from changing your lab:
<pre>sudo sed -i "s/^deb/#deb/" /etc/apt/sources.list.d/wazuh.list
sudo apt update</pre></li>
<li>Shut the server down cleanly (<code>sudo poweroff</code>), take the snapshot <code>03-wazuh-installed</code>, and start it again.</li></ol>
<h3>What the installer did</h3>
<table><tr><th>Port</th><th>Service</th></tr><tr><td>1514</td><td>Agents send events</td></tr><tr><td>1515</td><td>Agents enrol</td></tr><tr><td>55000</td><td>Wazuh API</td></tr><tr><td>443</td><td>Dashboard</td></tr><tr><td>9200</td><td>Indexer (internal)</td></tr></table>
<h3>Evidence to save</h3>
<ul><li>The output of the service check and the port check.</li><li>A screenshot of the dashboard home page.</li><li>The password stored safely (not in a shared file).</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Installer stops with a memory or CPU message</td><td>Too little RAM or CPU</td><td>Give the VM at least 6 GB and 2 processors, then rerun</td></tr>
<tr><td>Installation failed halfway</td><td>Network drop or a package error</td><td>Restore <code>02-before-wazuh</code> and try again; or run <code>sudo bash ./wazuh-install.sh -u</code> to uninstall</td></tr>
<tr><td>Browser cannot connect</td><td>Firewall or wrong address</td><td>Run <code>sudo ufw status</code>; ping 192.168.56.10 from your PC</td></tr>
<tr><td>“Dashboard server is not ready yet”</td><td>Still starting</td><td>Wait two minutes; then <code>sudo systemctl restart wazuh-dashboard</code></td></tr>
<tr><td>Password lost</td><td>Not saved</td><td><code>sudo tar -O -xvf wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt</code> from the folder where you ran the installer</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You installed a complete SIEM, confirmed it three ways (services, ports and the web page), protected it from accidental upgrades and saved a restore point. Everything in the case files runs on top of what you just built.</div>
<h3>🔬 Go deeper: what did that one command build?</h3>
<p>The installer did a great deal in a few minutes. Take some time to look at what now exists. Run each command and write one sentence in your notebook about what you see.</p>
<pre>sudo /var/ossec/bin/wazuh-control status
sudo ss -tulpn | grep -E ':(1514|1515|55000|443|9200)'
ls /var/ossec
sudo /var/ossec/bin/agent_control -l
df -h /
free -h</pre>
<table><tr><th>Command</th><th>What it teaches</th></tr>
<tr><td><code>wazuh-control status</code></td><td>The server’s internal programs, such as the analysis engine and the agent receiver, and whether each is running</td></tr>
<tr><td><code>ss … grep</code></td><td>Which ports Wazuh opened: 1514 and 1515 for agents, 55000 for the API, 443 for the dashboard, 9200 for the indexer</td></tr>
<tr><td><code>ls /var/ossec</code></td><td>Wazuh’s folders: <code>etc</code> for settings, <code>logs</code> for logs, <code>ruleset</code> for built-in rules, <code>queue</code> for working data</td></tr>
<tr><td><code>agent_control -l</code></td><td>The list of agents. Right now there is one, the server itself (ID 000)</td></tr>
<tr><td><code>df -h</code> and <code>free -h</code></td><td>Disk and memory use. Record them now so you can see how they grow</td></tr></table>
<div class="box lab"><b>Challenge</b>Why is port 9200 usually not opened to other machines? Find out which address it listens on. <i>Hint: look at the address column; it explains who can reach the indexer.</i></div>`,
quiz:[{q:"Why is the browser certificate warning expected?",o:["The lab uses a self-made certificate","The lab is hacked","Wazuh is broken","You typed the wrong IP"],a:0},{q:"What URL opens the dashboard?",o:["https://192.168.56.10","ssh://192.168.56.10","ftp://192.168.56.10","http://google.com"],a:0},{q:"Why disable the Wazuh repository after installing?",o:["To avoid accidental upgrades that break the lab","To free memory","It is a licence rule","To hide Wazuh"],a:0}]},

{id:"4-3",mod:"m4",mins:55,title:"Dashboard tour: a treasure hunt with evidence",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>find your way around the Wazuh dashboard, use the time filter and search bar correctly, read one alert in detail, and know which page to open for which job.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 55 minutes. <b>You need:</b> Wazuh installed (lab 4.2) and a few SSH logins from your PC so that real alerts exist. An analyst lives in this screen: knowing where things are makes investigations fast.</div>
<h3>Map of the main places</h3>
<p>Open the menu (☰, top left). Names differ slightly between versions: if you cannot find one, use the search box in the menu.</p>
<table><tr><th>Page</th><th>You use it to…</th></tr>
<tr><td><b>Overview</b></td><td>See alert counts, top agents and top MITRE techniques</td></tr>
<tr><td><b>Agents</b> (Endpoints summary)</td><td>List computers, their status and operating system</td></tr>
<tr><td><b>Threat Hunting → Events</b></td><td>Search and read every alert: your main workbench</td></tr>
<tr><td><b>File Integrity Monitoring</b></td><td>See file and registry changes (Module 5)</td></tr>
<tr><td><b>Vulnerability Detection</b>, <b>Configuration Assessment</b></td><td>Known weaknesses and benchmark scores</td></tr>
<tr><td><b>MITRE ATT&amp;CK</b></td><td>Alerts grouped by technique</td></tr>
<tr><td><b>Server management → Rules, Decoders</b></td><td>Read the built-in rules and decoders</td></tr></table>
<div class="box edge"><b>The time filter is the #1 beginner mistake</b>The top right shows a time range such as “Last 15 minutes”. If you cannot see an alert, widen the range to <b>Last 24 hours</b> before assuming Wazuh missed it.</div>
<h3>The treasure hunt</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Create some activity first: open a new terminal and run <code>ssh socadmin@192.168.56.10</code>, log in, and exit. Do it twice.</li>
<li>Open <b>Agents</b>. How many agents are there? What is the name of agent <b>000</b>? <i>Expected: one agent, named wazuh-server.</i></li>
<li>Open <b>Threat Hunting → Events</b>, set the range to <b>Last 24 hours</b>, and search <code>rule.id:5715</code>. These are your own successful SSH logins.</li>
<li>Click one alert and open the <b>JSON</b> view. Write down: <code>agent.name</code>, <code>rule.id</code>, <code>rule.level</code>, <code>rule.description</code>, <code>full_log</code> and <code>timestamp</code>. Also find the field that holds the source address (it starts with <code>data.</code>).</li>
<li>Open <b>Server management → Rules</b>. Search <code>5715</code>. Write its description, level and groups.</li>
<li>Open <b>Decoders</b> and search <code>sshd</code>. Open one and look at its <code>regex</code> pieces.</li>
<li>Back in Events, search <code>rule.level &gt;= 7</code>. Do you see anything? Why or why not?</li></ol>
<div class="box tip"><b>✅ You should see</b>One agent named wazuh-server; alerts for rule 5715 with a <code>full_log</code> that matches your SSH login; the rule described as an authentication success at a low level; and probably no alerts at level 7 or above yet (you have not attacked anything).</div>
<h3>Your dashboard cheat card</h3>
<p>Copy this into your notebook and add to it as you learn: how to set the time range, how to search a rule ID, how to open the JSON view, how to read a rule, and where to find decoders.</p>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the Events page with your 5715 alerts, and one of the JSON view with the six fields.</li><li>Your answers to steps 2, 5 and 7.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>No events at all</td><td>Time range too narrow, or no activity</td><td>Widen to 24 hours; make another SSH login</td></tr>
<tr><td>Cannot find a menu page</td><td>Version differences</td><td>Use the menu search box</td></tr>
<tr><td>Search returns an error</td><td>Typo or missing quotes</td><td>Use <code>rule.id:5715</code> exactly, no spaces</td></tr></table>
<div class="box lab"><b>📝 Recap</b>Rules decide what is suspicious, decoders split lines into fields, events are the alerts, and the time filter is the first thing to check. You made your own alerts and read them in detail.</div>`,
quiz:[{q:"You cannot find an alert you just caused. What do you check first?",o:["The time filter","Reinstall Wazuh","Delete the agent","Reboot your PC"],a:0},{q:"Where can you read built-in rules?",o:["Server management → Rules","Vulnerability Detection","Agents","Dev Tools only"],a:0},{q:"Which field holds the original log line?",o:["full_log","agent.id","rule.level","timestamp"],a:0}]},

{id:"4-4",mod:"m4",mins:70,title:"Connect the Windows agent",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have the Wazuh agent installed on <code>win-victim</code>, shown as <b>Active</b> in the dashboard, and be able to prove the connection from both ends.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 70 minutes. <b>You need:</b> Wazuh running (lab 4.2), <code>win-victim</code> running with both network cards, and its address <code>192.168.56.30</code>. A computer without an agent is invisible to the SIEM, so deploying agents is one of the most common tasks on a real SOC team.</div>
<h3>Phase 1: test the path before installing</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> <pre>ping 192.168.56.10
Test-NetConnection 192.168.56.10 -Port 1515
Test-NetConnection 192.168.56.10 -Port 1514</pre></li></ol>
<p>Both ports must say <code>TcpTestSucceeded : True</code>. If not, fix the network or the Ubuntu firewall (lab 4.2) first: installing an agent on a broken path only creates confusion.</p>
<h3>Phase 2: generate the install command</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> In the dashboard open <b>Agents → Deploy new agent</b>.</li>
<li>Choose package <b>Windows (MSI, 64-bit)</b>. For the server address enter <code>192.168.56.10</code>. For the agent name enter <code>win-victim</code>. Leave groups empty.</li>
<li>The page shows commands. <b>Copy them.</b> They match your Wazuh version exactly, which avoids version mismatch.</li></ol>
<h3>Phase 3: install on Windows</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Open <b>admin PowerShell</b>, paste and run the commands, then start the service:
<pre>NET START WazuhSvc</pre></li>
<li><span class="vm h">YOUR PC</span> Go to <b>Agents</b> and refresh after a minute.</li>
<li><span class="vm w">WINDOWS</span> Look at what the agent installed:
<pre>Get-Service WazuhSvc
Get-ChildItem "C:\Program Files (x86)\ossec-agent" | Select-Object Name
Get-Content "C:\Program Files (x86)\ossec-agent\ossec.log" -Tail 10</pre></li>
<li>Shut Windows down cleanly and take the snapshot <code>04-agent-connected</code>.</li></ol>
<div class="box tip"><b>✅ You should see</b><b>win-victim</b> with the status <b>Active</b>; a running <code>WazuhSvc</code>; a folder containing <code>ossec.conf</code> and <code>ossec.log</code>; and in the log a line saying the agent connected to the server.</div>
<h3>Where the agent’s settings live</h3>
<div class="box edge"><b>Remember this file</b><code>C:\Program Files (x86)\ossec-agent\ossec.conf</code> is the file you will edit in Module 5. Always open Notepad <b>as administrator</b> to save it, and keep a backup copy before editing.</div>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the Agents page with both agents Active.</li><li>The last ten log lines from <code>ossec.log</code>.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Check</th></tr>
<tr><td>“Never connected” or “Disconnected”</td><td>(1) Do both <code>Test-NetConnection</code> tests pass? (2) Is <code>WazuhSvc</code> running? (3) Read the last lines of <code>ossec.log</code>. (4) Is <code>&lt;address&gt;</code> in <code>ossec.conf</code> 192.168.56.10? (5) The agent must not be a newer version than the server. (6) Was an agent with the same name already created? Delete the old one or choose another name.</td></tr>
<tr><td>The download fails in PowerShell</td><td>The Windows VM needs its NAT adapter for internet: test with <code>ping google.com</code></td></tr>
<tr><td>Agent shows Active but no events</td><td>Wait a few minutes; check the time range on the dashboard</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You tested the path, generated a version-matched command, installed the agent and proved the connection. Next you will see how Wazuh turns logs into alerts.</div>
<h3>🔬 Go deeper: see the connection from both ends</h3>
<p>Once the agent is Active, prove to yourself how it talks. On the server, run:</p>
<pre>sudo ss -tn | grep 1514
sudo /var/ossec/bin/agent_control -i 001</pre>
<p>The first command shows a line with the Windows VM’s address, <code>192.168.56.30</code>, connected to port 1514. The second prints the agent’s details: name, address, status and the time it last sent a keep-alive. On Windows, open the agent log and look for the connection message:</p>
<pre>Get-Content "C:\Program Files (x86)\ossec-agent\ossec.log" -Tail 15</pre>
<p>Now run an experiment. Stop the service on Windows with <code>NET STOP WazuhSvc</code>, wait about a minute and a half, and refresh the Agents page. The status changes to <b>Disconnected</b>. Start it again with <code>NET START WazuhSvc</code>. Real SOCs alert on this, because an attacker who stops the agent makes the machine go quiet.</p>
<div class="box lab"><b>Challenge</b>Write down the exact steps and time it takes for an agent to be shown as disconnected after you stop it. Then describe a rule you would want that alerts when any important server’s agent stays disconnected for more than 15 minutes.</div>`,
quiz:[{q:"Why copy the install command from the dashboard?",o:["It matches your Wazuh version","It is shorter","Windows requires it","It disables antivirus"],a:0},{q:"Which log do you read when the agent misbehaves?",o:["ossec.log","notepad.log","setup.log","readme.txt"],a:0},{q:"Status Active means…",o:["The agent is connected and sending data","It is installing","The PC is off","The agent is deleted"],a:0}]},

{id:"4-5",mod:"m4",mins:80,title:"From log to alert: decoders, rules and levels",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>explain how Wazuh turns a log line into an alert, test log lines with the built-in tester, read a real rule, and cause a real alert and trace it through the pipeline.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 80 minutes. <b>You need:</b> Wazuh running and the Windows agent connected. Detection engineering, which means writing rules, is the highest-value SOC skill, and it rests on three ideas: decoder, rule and level.</div>
<h3>The pipeline</h3>
<p><b>Log line</b> → <b>decoder</b> (finds the program and splits out fields such as user and address) → <b>rule</b> (checks conditions and assigns a number and a level) → <b>alert</b> (saved and shown).</p>
<table><tr><th>Level</th><th>Meaning</th></tr><tr><td>0</td><td>Ignored (no alert)</td></tr><tr><td>1 to 3</td><td>System notices, low value</td></tr><tr><td>4 to 7</td><td>Worth a look: errors and failed actions</td></tr><tr><td>8 to 11</td><td>Important: possible attacks</td></tr><tr><td>12 to 15</td><td>Urgent: probable compromise</td></tr></table>
<h3>Phase 1: test lines with the rule tester</h3>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> (via SSH) Start the tester:
<pre>sudo /var/ossec/bin/wazuh-logtest</pre></li>
<li>Paste this line and press Enter:
<pre>Oct 27 10:12:01 wazuh-server sshd[1234]: Failed password for invalid user admin from 192.168.56.50 port 4242 ssh2</pre></li>
<li>Read the three phases it prints. <b>Phase 1</b> is pre-decoding (timestamp, host, program). <b>Phase 2</b> is the decoder name and the extracted fields (<code>srcip</code>, <code>srcuser</code>). <b>Phase 3</b> is the rule that matched: id, level, description, groups and MITRE information.</li>
<li>Paste a successful login and compare:
<pre>Oct 27 10:15:44 wazuh-server sshd[1300]: Accepted password for labuser from 192.168.56.50 port 5252 ssh2</pre></li>
<li>Press <code>Ctrl+C</code> to leave.</li></ol>
<div class="box tip"><b>✅ You should see</b>The first line matches an <b>sshd</b> rule for a non-existent user (rule <b>5710</b>, level 5), and the second matches a successful authentication rule (rule <b>5715</b>, low level). Exact levels depend on your version.</div>
<h3>Phase 2: read a real rule</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> <pre>ls /var/ossec/ruleset/rules | grep -i ssh
sudo grep -n 'id="5710"' -A 8 /var/ossec/ruleset/rules/0095-sshd_rules.xml</pre>
<code>if_sid</code> says which rule this builds on, <code>match</code> is the text to find, and <code>description</code> is what appears in the alert.</li></ol>
<h3>Phase 3: cause a real alert and follow it</h3>
<ol class="steps">
<li><span class="vm k">KALI</span> Fail a login: <pre>ssh fakeuser@192.168.56.10</pre> Type a wrong password, then press Ctrl+C.</li>
<li><span class="vm h">YOUR PC</span> Dashboard → Threat Hunting → Events, range <b>Last 15 minutes</b>, search <code>rule.id:5710</code>. Open the alert in the JSON view and match each part to what the tester showed you.</li></ol>
<h3>The path an alert takes on disk</h3>
<table><tr><th>Step</th><th>Where to look</th></tr><tr><td>Raw log</td><td><code>/var/log/auth.log</code></td></tr><tr><td>Alert created</td><td><code>/var/ossec/logs/alerts/alerts.json</code></td></tr><tr><td>Alert searchable</td><td>The dashboard (through the indexer)</td></tr></table>
<p>If an alert is in <code>alerts.json</code> but not on the dashboard, the problem is <b>after</b> the server. If it is not in <code>alerts.json</code>, the problem is earlier: the agent, the decoder or the rule.</p>
<h3>Evidence to save</h3>
<ul><li>The three phases of the tester output for the first line.</li><li>A screenshot of your rule 5710 alert in the dashboard.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Tester says “no decoder matched”</td><td>An incomplete line was pasted</td><td>Paste the whole line, including the date</td></tr>
<tr><td>No alert in the dashboard</td><td>Time range or agent 000 not active</td><td>Widen the range; check the Agents page</td></tr>
<tr><td>The <code>grep</code> finds nothing</td><td>The rule file name differs in your version</td><td>List the folder and search for <code>5710</code> with <code>grep -rn 'id="5710"' /var/ossec/ruleset/rules</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>The decoder reads the line, the rule judges it, the level says how urgent. Your own rules, in Modules 5 and 6, simply add more judgement in <code>local_rules.xml</code>, and you will test each with <code>wazuh-logtest</code> before trusting it.</div>
<h3>🔬 Go deeper: write and test your very first rule</h3>
<p>Now that you have seen a rule, write one. This one raises the importance of an invalid-user login attempt when it comes from your attacker VM. Open the custom rules file and add the following at the bottom:</p>
<pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre>
<pre>&lt;group name="lab,"&gt;
  &lt;rule id="100050" level="9"&gt;
    &lt;if_sid&gt;5710&lt;/if_sid&gt;
    &lt;srcip&gt;192.168.56.50&lt;/srcip&gt;
    &lt;description&gt;Login attempt with a non-existent user from the attacker VM&lt;/description&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre>
<p>Save, then restart the manager with <code>sudo systemctl restart wazuh-manager</code> and open the tester again:</p>
<pre>sudo /var/ossec/bin/wazuh-logtest</pre>
<p>Paste the same failed-login line you used earlier, which contains <code>192.168.56.50</code>. In phase 3 you should now see rule <b>100050</b>, level 9, with your description. Then change the address in the pasted line to <code>10.0.0.9</code> and confirm that the original rule 5710 matches instead. That proves your rule is specific, which is what you want.</p>
<div class="box lab"><b>Challenge</b>Rewrite the rule so that it fires at level 12 only when the user name is <code>root</code>. (Hint: add a line such as <code>&lt;srcuser&gt;root&lt;/srcuser&gt;</code>, and test it with a line in which the user is root.) Describe in one sentence why a rule for root attempts might deserve a higher level.</div>`,
quiz:[{q:"What does a decoder do?",o:["Splits a log line into fields","Blocks hackers","Draws charts","Installs agents"],a:0},{q:"Which tool lets you test a log line safely?",o:["wazuh-logtest","ping","nmap","hydra"],a:0},{q:"Where are your own rules stored?",o:["local_rules.xml","The Windows registry","Kali","The browser"],a:0}]},

{id:"fim-1",mod:"m5",mins:10,title:"Monday 9:02 AM: something is wrong",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>name the three questions FIM answers (what changed, when, by whom), prepare <code>win-victim</code> and your notebook for the case file, and write your predictions for what the attacker will do.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 25 minutes. <b>You need:</b> <code>win-victim</code> with the agent <b>Active</b> (lab 4.4), <code>wazuh-server</code> running, and the attack-prediction table from lab 3.2. This chapter sets up the story; the hands-on work starts in chapter 3.</div>
<div class="box story"><b>📖 The story</b>Meet <b>Ada</b>. She runs <b>BrightMart</b>, a small online shop. Everything runs from one Windows PC called <code>SHOP-PC</code>: the website, the price list, and the receipts.<br><br>Monday 9:02 AM. A customer messages: <i>“Why does your website say HACKED? And why is rice only 1 naira?”</i><br><br>Ada panics. She asks you, her new security analyst: <b>“What changed? When? Who did it?”</b><br>Right now nobody can answer. There is no record. That is about to change.</div>
<div class="box why"><b>💡 Why this matters</b>A hacker who gets into a computer almost always <b>changes files</b>: they edit a website, add a hidden program, or tweak a setting so they can come back later. If you can spot <b>which file changed, when, and by whom</b>, you can find the attacker and fix the damage.<br><br>The tool for this is called <b>File Integrity Monitoring</b>, or <b>FIM</b>. Think of it as a <b>smoke detector for files</b>.</div>
<h3>What you will do in this case file</h3>
<ol class="steps"><li>Learn the one big idea behind FIM (10 minutes, no tools)</li><li>Set your first <b>tripwire</b> and see a real alert</li><li>Learn to read alerts like a detective</li><li>Replay Shadow’s attack and build the timeline</li><li>Find out <b>who</b> did it, watch the <b>registry</b>, remove the <b>noise</b></li><li>Write your own alarm rules, then face the <b>boss fight</b></li></ol>
<div class="box tip"><b>✅ What you need</b>Your lab from Modules 1 and 4: <code>wazuh-server</code> running Wazuh, and <code>win-victim</code> with an <b>Active</b> agent. Snapshot your Windows VM now, so you can undo anything.</div>
<h3>Warm-up thinking</h3><p>Ada’s PC has thousands of files. Which of these would a hacker most likely change? Answer below.</p>
<h3>Prepare for the case file</h3>
<ol class="steps">
<li><span class="vm h">YOUR PC</span> Open the dashboard → <b>Agents</b> and confirm that <b>win-victim</b> is <b>Active</b>. If it is not, repeat lab 4.4 before going on.</li>
<li>Shut <code>win-victim</code> down cleanly and take a snapshot called <code>05-fim-start</code>. If you ever want to restart the case file, you return here.</li>
<li>In your notebook add the heading “Case File 1: BrightMart” and write your predictions: which three places on a Windows PC would you watch first, and why?</li></ol>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the Agents page with both agents Active.</li><li>Your written predictions for the three places to watch.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Agent is not Active</td><td>The agent or network is not working</td><td>Repeat lab 4.4; check ports 1514 and 1515</td></tr><tr><td>Snapshot option is greyed out</td><td>The VM is in a transitional state</td><td>Power the VM off fully, then take the snapshot</td></tr><tr><td>You cannot think of three places</td><td>Unfamiliar with Windows locations</td><td>Reread the chapter “Windows Persistence” and the Windows chapter</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You prepared a clean restore point and set your own expectations before seeing the answers. Comparing predictions with results is how analysts learn faster.</div>`,
quiz:[{q:"Which change is MOST dangerous for BrightMart?",o:["Someone adds a photo to the gallery folder","A new program is added to the Startup folder","Someone opens Calculator","The wallpaper changes"],a:1},{q:"What does FIM answer?",o:["Which website is fastest","Which file changed, when, and by whom","How much RAM is free","Who is online"],a:1}]},

{id:"fim-2",mod:"m5",mins:15,title:"The big idea: fingerprints and seals",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>explain a hash, a baseline and an alert in your own words, and prove with PowerShell that changing one character changes a file’s fingerprint.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 20 minutes. <b>You need:</b> <code>win-victim</code> and an <b>admin PowerShell</b> window. This repeats lab 2.2 on purpose: the whole case file rests on this one idea.</div>
<div class="box story"><b>📖 The story</b>Ada sells boxes of medicine. To catch tampering she puts a <b>numbered seal</b> on every box. If a seal is broken or the number is different, she knows someone touched it.<br><br>FIM puts a <b>seal on every file</b>. The seal is called a <b>hash</b>.</div>
<div class="box why"><b>💡 What is a hash?</b>A hash is a short code calculated from a file’s contents, like a fingerprint. Change <b>one letter</b> in the file and the whole code changes. Two rules: same file = same hash, different file = different hash.<br><br>FIM works in 3 steps: <b>1. Baseline</b> (record every seal when things are clean) → <b>2. Watch</b> (check files again) → <b>3. Alert</b> (if a seal changed, tell the analyst).</div>
<h3>Try it yourself (no Wazuh yet; this repeats lesson 2.2 on purpose)</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Open <b>PowerShell</b> (Start menu, type PowerShell, press Enter). Create the shop folder and price list:
<pre>New-Item C:\BrightMart\site -ItemType Directory -Force
Set-Content C:\BrightMart\prices.csv "item,price"
Add-Content C:\BrightMart\prices.csv "rice,12"
Add-Content C:\BrightMart\prices.csv "beans,3"
Set-Content C:\BrightMart\site\index.html "&lt;h1&gt;Welcome to BrightMart&lt;/h1&gt;"</pre></li>
<li>Take the file’s fingerprint:
<pre>Get-FileHash C:\BrightMart\prices.csv -Algorithm SHA256</pre>Write down the first 6 characters of the Hash.</li>
<li>Now change <b>one number</b> (rice from 12 to 1):
<pre>(Get-Content C:\BrightMart\prices.csv) -replace "rice,12","rice,1" | Set-Content C:\BrightMart\prices.csv
Get-FileHash C:\BrightMart\prices.csv -Algorithm SHA256</pre></li>
<li>Put it back and check again:
<pre>(Get-Content C:\BrightMart\prices.csv) -replace "rice,1$","rice,12" | Set-Content C:\BrightMart\prices.csv
Get-FileHash C:\BrightMart\prices.csv -Algorithm SHA256</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>A long code in step 2, a completely different code in step 3, and the original code again in step 4. That is the whole trick behind FIM. Wazuh just does this automatically, for thousands of files, and tells you.</div>
<details><summary>😕 Stuck? Click here</summary><p>“Access denied”: open PowerShell with <b>Run as administrator</b>. If the hash after step 4 is different, a space or line ending changed; that is itself a good lesson, because even tiny changes alter a hash. Just continue.</p></details>
<div class="box lab"><b>Remember these 3 words</b><b>Baseline</b> = the clean snapshot · <b>Hash</b> = a file’s fingerprint · <b>Alert</b> = a seal was broken.</div>
<h3>Evidence to save</h3>
<ul><li>The first eight characters of the hash before, after the change, and after the restore.</li><li>One sentence: “A hash is…”.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>“Access denied”</td><td>PowerShell is not elevated</td><td>Open PowerShell as administrator</td></tr><tr><td>Hash after restoring differs from the original</td><td>A hidden line ending or space changed</td><td>This is itself a lesson: any change alters a hash. Continue.</td></tr><tr><td>Get-FileHash not found</td><td>Very old PowerShell</td><td>Use a current Windows 10 or 11 ISO</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You saw a hash change with your own eyes. Wazuh does this automatically, for thousands of files, and alerts you.</div>`,
quiz:[{q:"What happens to a hash if you change ONE letter in the file?",o:["Nothing","It changes completely","It gets shorter","It is deleted"],a:1},{q:"What is a baseline?",o:["A bad file","A clean snapshot to compare against","A firewall","An alert"],a:1}]},

{id:"fim-3",mod:"m5",mins:30,title:"Set your first tripwire",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>add your first tripwire to the Windows agent’s configuration, wait for the baseline, and see a real “modified” alert with a diff.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 40 minutes. <b>You need:</b> the agent <b>Active</b>, the <code>C:\BrightMart</code> folder from chapter 2, and Notepad opened <b>as administrator</b>. <b>First make a backup</b> in admin PowerShell: <code>Copy-Item "C:\Program Files (x86)\ossec-agent\ossec.conf" "C:\Program Files (x86)\ossec-agent\ossec.conf.bak"</code>. If anything breaks, copy it back.</div>
<div class="box story"><b>📖 The story</b>Ada says: <b>“Start small. Protect the BrightMart folder first.”</b> You will tell the Wazuh agent on <code>SHOP-PC</code> to watch <code>C:\BrightMart</code> like a hawk.</div>
<div class="box why"><b>💡 Why this matters</b>Wazuh only watches what you tell it to. Telling it to watch <i>everything</i> creates thousands of useless alerts. So we pick <b>a few important places</b> and watch them closely. Those are your <b>tripwires</b>.</div>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Open Notepad <b>as administrator</b>: Start menu, type <b>Notepad</b>, right-click it, choose <b>Run as administrator</b>.</li>
<li>In Notepad: <b>File → Open</b>. Change the box at the bottom right from “Text Documents” to <b>All Files</b>. Paste this path in the file name box and press Enter:
<pre>C:\Program Files (x86)\ossec-agent\ossec.conf</pre></li>
<li>Press <code>Ctrl+F</code> and search for <code>&lt;syscheck&gt;</code>. (“syscheck” is Wazuh’s name for the FIM module.) If you see <code>&lt;disabled&gt;yes&lt;/disabled&gt;</code> right below it, change <b>yes</b> to <b>no</b>.</li>
<li>On a new line <b>right below</b> the <code>&lt;syscheck&gt;</code> line, paste this one line:
<pre>&lt;directories realtime="yes" check_all="yes" report_changes="yes"&gt;C:\BrightMart&lt;/directories&gt;</pre>
Read it like a sentence: <b>“Watch C:\BrightMart (directories), notify me instantly (realtime), compare everything (check_all), and show me what changed inside text files (report_changes).”</b></li>
<li>Press <code>Ctrl+S</code> to save. Then in PowerShell (as administrator):
<pre>Restart-Service WazuhSvc</pre></li>
<li><b>Wait 3 minutes.</b> The agent is building its baseline (taking all the seals). Be patient; changes made too early will not alert.</li>
<li>Now trip the wire. Add a fake price:
<pre>Add-Content C:\BrightMart\prices.csv "gold bar,1"</pre></li>
<li><span class="vm h">YOUR PC</span> Open the Wazuh dashboard. In the left menu open <b>File Integrity Monitoring</b> (it may be inside “Endpoint security”). Pick your agent <b>win-victim</b> and open the <b>Events</b> tab.</li></ol>
<div class="box tip"><b>✅ You should see</b>A new line for <code>c:\brightmart\prices.csv</code> with event <b>modified</b>. Click it to open the details; you will see the added line <code>gold bar,1</code>. 🎉 You just built your first detection.</div>
<details><summary>😕 Stuck? Click here</summary>
<p><b>Service will not restart:</b> you probably made a typo in the XML. Check that every <code>&lt;</code> has a matching <code>&gt;</code> and the closing <code>&lt;/directories&gt;</code> is there. Look at the last lines of <code>C:\Program Files (x86)\ossec-agent\ossec.log</code> for the error.</p>
<p><b>Nothing shows up:</b> (1) wait another 2 minutes, (2) set the dashboard time filter to “Last 1 hour”, (3) check the agent is <b>Active</b> in the Agents page, (4) check the folder path is spelled exactly.</p>
<p><b>I see lots of other events:</b> that is the default Windows monitoring. Filter by path <code>brightmart</code>.</p></details>
<h3>Evidence to save</h3>
<ul><li>The exact line you added to <code>ossec.conf</code>.</li><li>A screenshot of the modified alert with the diff showing the added line.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td><code>Restart-Service WazuhSvc</code> fails</td><td>XML typo in <code>ossec.conf</code></td><td>Read the last lines of <code>ossec.log</code>; restore the <code>.bak</code> copy and redo the edit</td></tr><tr><td>No alert appears</td><td>Baseline still building, or wrong path</td><td>Wait three minutes; check the folder path spelling; widen the time range</td></tr><tr><td>Alert appears but no diff</td><td>report_changes missing, or a non-text file</td><td>Check the attribute is on your line; use a plain text file</td></tr><tr><td>Many unrelated events</td><td>Default Windows monitoring</td><td>Filter by the path <code>brightmart</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You told the agent what to watch, waited for its baseline, and tripped the wire. To undo your edit at any time, copy <code>ossec.conf.bak</code> over <code>ossec.conf</code> and restart the service.</div>`,
quiz:[{q:"What does realtime=\"yes\" do?",o:["Alerts only once a day","Detects changes within seconds","Deletes the file","Hides the file"],a:1},{q:"Why not watch the whole C: drive?",o:["It is illegal","It creates huge noise and hides real attacks","Wazuh cannot","It is too fast"],a:1},{q:"After restarting the agent you should…",o:["Change files immediately","Wait a few minutes for the baseline","Reinstall Windows","Turn off the firewall"],a:1}]},

{id:"fim-4",mod:"m5",mins:25,title:"Read an alert like a detective",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>name the three FIM events (added, modified, deleted), read the key fields of an alert, and give each one a verdict.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 30 minutes. <b>You need:</b> chapter 3 complete, with <code>C:\BrightMart</code> monitored and the agent Active.</div>
<div class="box story"><b>📖 The story</b>Ada looks over your shoulder: <b>“There is a line on the screen. So what does it tell us?”</b> Every alert answers detective questions: <b>What? Where? When? How big? What exactly changed?</b></div>
<h3>The three events you will see a lot</h3>
<table><tr><th>Event</th><th>Means</th><th>Wazuh rule</th></tr><tr><td><b>added</b></td><td>A new file appeared</td><td>554</td></tr><tr><td><b>modified</b></td><td>An existing file changed</td><td>550</td></tr><tr><td><b>deleted</b></td><td>A file disappeared</td><td>553</td></tr></table>
<p style="color:var(--mu)">Rule numbers can differ by Wazuh version. You can confirm them in the dashboard under <i>Server management → Rules</i>.</p>
<h3>Practice: make all three events</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> 
<pre>Set-Content C:\BrightMart\new.txt "hello"
Start-Sleep 5
Add-Content C:\BrightMart\new.txt "world"
Start-Sleep 5
Remove-Item C:\BrightMart\new.txt</pre></li>
<li><span class="vm h">YOUR PC</span> In File Integrity Monitoring → Events, find the 3 lines for <code>new.txt</code>. Click the <b>modified</b> one and open it in the <b>JSON</b> view.</li></ol>
<h3>The 6 fields detectives look at first</h3>
<table><tr><th>Field in the alert</th><th>Detective question</th></tr>
<tr><td><code>syscheck.path</code></td><td><b>Where?</b> Which file or registry key</td></tr>
<tr><td><code>syscheck.event</code></td><td><b>What happened?</b> added, modified, deleted</td></tr>
<tr><td><code>timestamp</code></td><td><b>When?</b></td></tr>
<tr><td><code>syscheck.changed_attributes</code></td><td><b>What exactly?</b> size, content, permissions…</td></tr>
<tr><td><code>syscheck.diff</code></td><td><b>Show me!</b> The lines that were added or removed</td></tr>
<tr><td><code>syscheck.sha256_after</code></td><td><b>Is the file bad?</b> Paste it into virustotal.com</td></tr></table>
<div class="box tip"><b>✅ You should see</b>For “modified”: <code>changed_attributes</code> lists size and hashes, and the diff shows the line <code>world</code> was added. For “deleted”: no new hash, because the file is gone.</div>
<div class="box why"><b>💡 Think like an analyst</b>Every alert needs a verdict: <b>true positive</b> (a real attack) or <b>false positive</b> (harmless). Ask: <i>Is this a place attackers use? Was anyone supposed to change it now?</i> You will practise this in the next chapters.</div>
<details><summary>😕 Stuck? Click here</summary><p>Cannot find the events? Search <code>syscheck.path: *new.txt*</code> in <b>Threat Hunting → Events</b>. If the “diff” is missing, check that <code>report_changes="yes"</code> is in your line and that the file is a plain text file.</p></details>
<h3>Evidence to save</h3>
<ul><li>A table of the three <code>new.txt</code> events: event type, rule ID, path, hash change and diff.</li><li>One sentence on why “deleted” has no new hash.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Cannot find the events</td><td>Time range too narrow</td><td>Widen to the last hour; search the path <code>*new.txt*</code></td></tr><tr><td>No diff on the modified event</td><td>report_changes missing</td><td>Check your configuration line</td></tr><tr><td>Rule IDs differ from the chapter</td><td>Version differences</td><td>Confirm IDs under Server management → Rules</td></tr></table>
<div class="box lab"><b>📝 Recap</b>Every FIM alert answers where, what, when and how much. The verdict, true or false positive, comes from context and is your job.</div>`,
quiz:[{q:"A file disappears. Which event is that?",o:["added","modified","deleted","renamed"],a:2},{q:"Which field shows the exact lines that changed?",o:["syscheck.diff","timestamp","agent.name","rule.level"],a:0},{q:"Why look up sha256_after on VirusTotal?",o:["To see if the new file is known malware","To speed up Wazuh","To fix the file","To delete it"],a:0}]},

{id:"fim-5",mod:"m5",mins:40,title:"Replay Shadow’s attack and build the timeline",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>replay four attacker moves, catch each one, and build an evidence-based timeline.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 50 minutes. <b>You need:</b> chapter 4 complete. <b>Take a snapshot of win-victim called <code>06-before-attack</code></b> before you start. Windows Defender may delete the planted <code>update.exe</code>: that is a finding to note, not a failure.</div>
<div class="box story"><b>📖 The story</b>Ada found out the hacker is called <b>Shadow</b>. Shadow got in with a stolen password and made <b>4 moves</b>. You will replay them in your lab, exactly as they happened, and catch each one.</div>
<div class="box why"><b>💡 Why attackers do this</b><b>Move 1</b>: change prices = fraud. <b>Move 2</b>: deface the website = hurt the brand. <b>Move 3</b>: edit the <code>hosts</code> file = secretly send customers to a fake bank site. <b>Move 4</b>: drop a program in the <b>Startup folder</b> = it runs every time the PC starts, so Shadow can come back (this is called <b>persistence</b>).</div>
<h3>First: add 2 more tripwires</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> Open <code>ossec.conf</code> again as administrator (same as Chapter 3). Right below your BrightMart line, paste these two lines:
<pre>&lt;directories realtime="yes" check_all="yes" report_changes="yes"&gt;C:\Windows\System32\drivers\etc&lt;/directories&gt;
&lt;directories realtime="yes" check_all="yes"&gt;C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup&lt;/directories&gt;</pre>
(The first watches the <code>hosts</code> file folder. The second is the all-users Startup folder.)</li>
<li>Save, run <code>Restart-Service WazuhSvc</code>, and <b>wait 3 minutes</b> for the new baseline.</li></ol>
<h3>Now play Shadow (one move at a time, note the time)</h3>
<ol class="steps">
<li><b>Move 1, change the price:</b><pre>(Get-Content C:\BrightMart\prices.csv) -replace "rice,12","rice,1" | Set-Content C:\BrightMart\prices.csv</pre></li>
<li><b>Move 2, deface the website:</b><pre>Set-Content C:\BrightMart\site\index.html "&lt;h1&gt;Hacked by Shadow&lt;/h1&gt;"</pre></li>
<li><b>Move 3, hijack a website name</b> (203.0.113.x is a safe fake address reserved for examples):<pre>Add-Content C:\Windows\System32\drivers\etc\hosts "203.0.113.50 www.mybank.com"</pre></li>
<li><b>Move 4, plant a program that survives reboot:</b><pre>Copy-Item C:\Windows\System32\calc.exe "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\update.exe"</pre></li></ol>
<h3>Your job: build the timeline</h3>
<p>In File Integrity Monitoring → Events, fill in this table for all 4 moves. This is exactly what a real analyst gives their manager.</p>
<table><tr><th>Time</th><th>Event</th><th>File</th><th>What it means</th></tr><tr><td>?</td><td>modified</td><td>prices.csv</td><td>Price fraud</td></tr><tr><td>?</td><td>?</td><td>?</td><td>?</td></tr><tr><td>?</td><td>?</td><td>?</td><td>?</td></tr><tr><td>?</td><td>?</td><td>?</td><td>?</td></tr></table>
<div class="box tip"><b>✅ You should see</b>4 alerts. Moves 1, 2 and 3 are <b>modified</b>; move 4 is <b>added</b>, and the new file <code>update.exe</code> has its own hash. The hosts file alert shows the added line in the diff.</div>
<h3>Clean up</h3><pre>Set-Content C:\BrightMart\prices.csv "item,price"; Add-Content C:\BrightMart\prices.csv "rice,12"; Add-Content C:\BrightMart\prices.csv "beans,3"
Set-Content C:\BrightMart\site\index.html "&lt;h1&gt;Welcome to BrightMart&lt;/h1&gt;"
(Get-Content C:\Windows\System32\drivers\etc\hosts) | Where-Object { $_ -notmatch "203.0.113.50" } | Set-Content C:\Windows\System32\drivers\etc\hosts
Remove-Item "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\update.exe"</pre>
<details><summary>😕 Stuck? Click here</summary><p>No alert for the hosts file or Startup folder: you probably did not restart the agent or wait for the baseline. Windows Defender may delete <code>update.exe</code>: that is fine, it shows up as a <b>deleted</b> event, and you can note it as a finding. If PowerShell says “access denied” on the hosts file, you are not running as administrator.</p></details>
<h3>Evidence to save</h3>
<ul><li>The four-row timeline table with real times.</li><li>A screenshot of the hosts-file alert showing the added line.</li><li>Confirmation that you ran the cleanup commands.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Access denied editing the hosts file</td><td>PowerShell is not elevated</td><td>Use admin PowerShell</td></tr><tr><td>No alert for hosts or Startup changes</td><td>Agent not restarted, or baseline not finished</td><td>Restart <code>WazuhSvc</code>; wait three minutes; repeat the move</td></tr><tr><td>Defender removes <code>update.exe</code></td><td>Antivirus is working</td><td>Record the Defender event and the FIM “deleted” event as evidence</td></tr><tr><td>Timeline times look odd</td><td>Different time zones</td><td>Convert both to UTC before comparing</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You replayed a small attack and caught every move. Restore snapshot <code>06-before-attack</code> or run the cleanup so later chapters start clean.</div>`,
quiz:[{q:"Why do attackers put a program in the Startup folder?",o:["To make the PC faster","To run again after every reboot (persistence)","To free space","To block updates"],a:1},{q:"Which move sends customers to a fake website?",o:["Changing prices","Editing the hosts file","Defacing index.html","Deleting a log"],a:1},{q:"A new file appears in Startup. The FIM event is…",o:["added","modified","deleted","none"],a:0}]},

{id:"fim-6",mod:"m5",mins:30,title:"Who did it? Turn on whodata",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>turn on whodata so alerts show who changed a file and which program did it, and read those fields.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 40 minutes. <b>You need:</b> the chapter 5 configuration, admin PowerShell, and Notepad as administrator.</div>
<div class="box story"><b>📖 The story</b>Ada: <b>“Great, we know WHAT changed. But WHO did it? Which account? Which program?”</b> Right now the alerts do not say. We need a stronger tripwire.</div>
<div class="box why"><b>💡 Three levels of watching</b>
<table><tr><th>Mode</th><th>Speed</th><th>Tells you who?</th></tr><tr><td>Scheduled (default)</td><td>Every 12 hours</td><td>No</td></tr><tr><td><code>realtime="yes"</code></td><td>Seconds</td><td>No</td></tr><tr><td><code>whodata="yes"</code></td><td>Seconds</td><td><b>Yes</b>: user name and program</td></tr></table>
<b>whodata</b> asks Windows itself to record who touched the file (Windows auditing). It costs a bit more, so use it only for your most important folders: the shop folder, the hosts file and the Startup folder.</div>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Open <code>ossec.conf</code> as administrator. On <b>each of your three lines</b>, replace <code>realtime="yes"</code> with <code>whodata="yes"</code>. Example:
<pre>&lt;directories whodata="yes" check_all="yes" report_changes="yes"&gt;C:\BrightMart&lt;/directories&gt;</pre></li>
<li>Save and run <code>Restart-Service WazuhSvc</code>. Wait 3 minutes.</li>
<li>Repeat Shadow’s Move 1 and Move 2 from the last chapter.</li>
<li><span class="vm h">YOUR PC</span> Open one of the new alerts in the JSON view and look for <code>audit.user.name</code> and <code>audit.process.name</code> (also <code>audit.process.id</code>).</li></ol>
<div class="box tip"><b>✅ You should see</b>Your Windows username, and <code>powershell.exe</code> as the program that made the change. Also look at <code>syscheck.mode</code>: it should say <code>whodata</code>.</div>
<h3>Now think like an analyst</h3>
<table><tr><th>What you see</th><th>What it means</th></tr><tr><td>User = <code>labuser</code>, process = <code>powershell.exe</code></td><td>A person ran a script from their account. Is that normal for this user?</td></tr><tr><td>User = <code>SYSTEM</code></td><td>A service or malware running as the machine itself. Dig deeper with Sysmon process logs.</td></tr><tr><td>Process = <code>notepad.exe</code> editing a Startup folder</td><td>Suspicious. Normal people do not do that.</td></tr></table>
<details><summary>😕 Stuck? Click here</summary><p><b>No audit.user.name?</b> whodata could not start and Wazuh quietly fell back to realtime. Look in <code>ossec.log</code> for a “whodata” message. The most common reason in companies: a <b>Group Policy</b> resets the audit settings. The fix is to enable <i>Audit File System</i> in that policy. In your lab, run:<pre>auditpol /set /subcategory:"File System" /success:enable</pre>then restart the agent.</p></details>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the JSON showing <code>audit.user.name</code>, <code>audit.process.name</code> and <code>syscheck.mode</code>.</li><li>One sentence on what you would do if the user is <code>SYSTEM</code>.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>No <code>audit.user.name</code></td><td>whodata fell back to realtime</td><td>Look for “whodata” in <code>ossec.log</code>; run <code>auditpol /set /subcategory:"File System" /success:enable</code>; restart the agent</td></tr><tr><td>Group Policy overwrites audit settings</td><td>Common in companies</td><td>Enable File System auditing in the policy</td></tr><tr><td>Service will not restart</td><td>Typo in the edited lines</td><td>Restore the backup and redo the edit</td></tr></table>
<div class="box lab"><b>📝 Recap</b>Whodata adds the account and the program, at the cost of a little more load. Use it only on your most important folders.</div>`,
quiz:[{q:"Which option tells you WHO changed a file?",o:["realtime","whodata","scheduled","restrict"],a:1},{q:"Alert shows user SYSTEM. What is a good next step?",o:["Ignore it","Look at process logs (Sysmon) around that time","Delete the file","Restart the PC"],a:1},{q:"Why not use whodata on everything?",o:["It does not work","It costs more resources, so save it for critical places","It is illegal","It hides alerts"],a:1}]},

{id:"fim-7",mod:"m5",mins:30,title:"The registry: where attackers hide",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>watch Windows registry autorun keys and catch a persistence entry added by an attacker.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 40 minutes. <b>You need:</b> the chapter 6 configuration and admin PowerShell. Per-user keys (HKCU) are not covered here; the chapter explains why.</div>
<div class="box story"><b>📖 The story</b>You cleaned up the Startup folder, but the next morning the strange program is <b>back</b>. Shadow used a second hiding place you were not watching: the <b>Windows Registry</b>.</div>
