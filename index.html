<div class="box why"><b>💡 What is the registry?</b>The registry is Windows’ giant settings database. Some keys say <b>“run this program every time the PC starts.”</b> Attackers love them. Wazuh can watch registry keys with the same seal trick.</div>
<table><tr><th>Registry key (short name)</th><th>Why attackers use it</th></tr><tr><td><code>...\CurrentVersion\Run</code></td><td>Starts a program at every login</td></tr><tr><td><code>...\Winlogon</code></td><td>Replaces what runs at login</td></tr><tr><td><code>...\Services</code></td><td>Creates a hidden service</td></tr><tr><td><code>...\Policies\Microsoft\Windows Defender</code></td><td>Turns antivirus off</td></tr></table>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Open <code>ossec.conf</code> as administrator. Inside <code>&lt;syscheck&gt;</code>, below your <code>directories</code> lines, paste:
<pre>&lt;windows_registry arch="both"&gt;HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run&lt;/windows_registry&gt;
&lt;windows_registry arch="both"&gt;HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon&lt;/windows_registry&gt;
&lt;windows_registry&gt;HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows Defender&lt;/windows_registry&gt;</pre>
(<code>arch="both"</code> because Windows has a 32-bit and a 64-bit view of the registry, and attackers can use either.)</li>
<li>Save, restart the service (<code>Restart-Service WazuhSvc</code>), wait 3 minutes.</li>
<li><b>Shadow’s Move 5</b>, in an administrator PowerShell:
<pre>reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v Updater /t REG_SZ /d "C:\Users\Public\x.exe" /f</pre></li>
<li>In File Integrity Monitoring, look for a <b>registry</b> event (value added). Open the details.</li>
<li>Clean up:
<pre>reg delete HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v Updater /f</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>An alert for the key <code>...\Run</code> with value name <b>Updater</b> and the data <code>C:\Users\Public\x.exe</code>. Registry events use rule <b>752</b> (added), <b>750</b> (changed), <b>751</b> (deleted). Confirm numbers for your version in the Rules page.</div>
<div class="box edge"><b>⚠️ Gotcha</b>Run keys under <b>HKEY_CURRENT_USER</b> (one per user) are in a different place and are easy to miss. Real teams add Sysmon (event 13) to catch those. You will learn that in a later case file.</div>
<details><summary>😕 Stuck? Click here</summary><p>No registry alert: check the key path is spelled right (no spaces missing), that you restarted, and that you waited. Registry alerts are in the same File Integrity Monitoring page, under the <b>Registry</b> tab or filter.</p></details>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the registry alert with the key, value name and data.</li><li>The three <code>windows_registry</code> lines you added.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>No registry alert</td><td>Key path misspelled, or agent not restarted</td><td>Compare the path with the chapter; restart and wait</td></tr><tr><td>Alert exists but no old value</td><td>Version differences</td><td>Read the JSON for the fields your version provides</td></tr><tr><td>Rule IDs differ</td><td>Version differences</td><td>Check under Server management → Rules</td></tr></table>
<div class="box lab"><b>📝 Recap</b>The registry is where many attackers hide. You watched a Run key and saw exactly what was added.</div>`,
quiz:[{q:"Why do attackers use the Run registry key?",o:["To change wallpaper","To start their program at every login","To speed up Windows","To clean logs"],a:1},{q:"Why arch=\"both\"?",o:["Windows has 32-bit and 64-bit registry views","It makes alerts bigger","It is required for all keys","It hides keys"],a:0}]},

{id:"fim-8",mod:"m5",mins:25,title:"Too many alerts! Cutting the noise",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>create realistic noise, silence it with a narrow ignore, and prove a real change still alerts.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 35 minutes. <b>You need:</b> the current configuration and admin PowerShell. Keep a copy of <code>ossec.conf</code> before editing.</div>
<div class="box story"><b>📖 The story</b>Ada hired a second analyst, <b>Tunde</b>. His first week he gets <b>3,000 alerts a day</b> because someone turned FIM on for everything. By Friday he stops reading them. Then a real attack arrives… and nobody notices.</div>
<div class="box why"><b>💡 Alert fatigue</b>Too many useless alerts is as dangerous as no alerts, because humans ignore noise. A good analyst <b>watches few things deeply</b> and <b>silences harmless noise</b>. Let’s see it happen.</div>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Simulate a busy program that keeps writing temp files into the shop folder:
<pre>New-Item C:\BrightMart\cache -ItemType Directory -Force
1..40 | ForEach-Object { Set-Content "C:\BrightMart\cache\tmp$_.dat" "x" }</pre></li>
<li><span class="vm h">YOUR PC</span> In File Integrity Monitoring → Events, search <code>syscheck.path: *cache*</code> and note how many events appeared. <b>~40 alerts for nothing.</b></li>
<li><span class="vm w">WINDOWS</span> Add this line inside <code>&lt;syscheck&gt;</code> in <code>ossec.conf</code> (as administrator), then save and restart the service:
<pre>&lt;ignore&gt;C:\BrightMart\cache&lt;/ignore&gt;</pre></li>
<li>Wait 2 minutes and run the loop again with new names:
<pre>1..40 | ForEach-Object { Set-Content "C:\BrightMart\cache\b$_.dat" "x" }</pre></li>
<li>Check the dashboard again, then trip a <b>real</b> wire: <code>Add-Content C:\BrightMart\prices.csv "test,1"</code>.</li></ol>
<div class="box tip"><b>✅ You should see</b>No new events from the cache folder, but the price change still alerts. You silenced the noise <b>without</b> going blind.</div>
<h3>Common noise makers on Windows (do not watch these broadly)</h3>
<table><tr><th>Place</th><th>Why it is noisy</th><th>What to do</th></tr>
<tr><td><code>C:\Windows\System32</code> during updates</td><td>Windows Update changes hundreds of files</td><td>Watch only specific subfolders, or ignore log folders</td></tr>
<tr><td><code>C:\ProgramData</code> (whole)</td><td>Antivirus and installers write all day</td><td>Watch only small, specific folders</td></tr>
<tr><td>Temp folders, browser caches</td><td>Change every minute</td><td>Do not monitor</td></tr>
<tr><td>OneDrive or Dropbox folders</td><td>Sync constantly</td><td>Exclude</td></tr>
<tr><td>Office files like <code>~$report.docx</code></td><td>Appear and vanish</td><td>Pattern ignore (below)</td></tr></table>
<p>To ignore by pattern use <code>sregex</code>:</p>
<pre>&lt;ignore type="sregex"&gt;.log$|.tmp$|.etl$&lt;/ignore&gt;</pre>
<div class="box lab"><b>The golden rule</b><b>Watch the places an attacker must touch, ignore the places nobody cares about.</b> Review your ignore list every month: attackers sometimes hide inside an old ignore.</div>
<details><summary>😕 Stuck? Click here</summary><p>Still seeing cache events? The old ones stay in the dashboard; compare by time. Check the ignore line is inside <code>&lt;syscheck&gt;</code> and the service restarted without errors.</p></details>
<h3>Evidence to save</h3>
<ul><li>The alert counts before and after the ignore line.</li><li>The exact ignore line you used.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Cache alerts still appear</td><td>Old alerts remain in the dashboard</td><td>Compare by time, after the restart</td></tr><tr><td>Ignore has no effect</td><td>The line is outside <code>&lt;syscheck&gt;</code></td><td>Move it inside the block</td></tr><tr><td>Real changes stopped alerting</td><td>The ignore is too broad</td><td>Narrow the pattern; test with <code>prices.csv</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You cut the noise without going blind. Always test that an important change still alerts after any ignore.</div>`,
quiz:[{q:"Why is too much noise dangerous?",o:["It slows the internet","Analysts start ignoring alerts and miss real attacks","It breaks Windows","It deletes files"],a:1},{q:"What does <ignore> do?",o:["Skips a path so it creates no alerts","Deletes it","Encrypts it","Hides the agent"],a:0},{q:"The golden rule of FIM is…",o:["Watch everything","Watch the places an attacker must touch","Never use realtime","Only watch System32"],a:1}]},

{id:"fim-9",mod:"m5",mins:40,title:"Raise the alarm: write your first rules",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>write four custom rules on the Wazuh server, test them, and trigger each one with real activity.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 50 minutes. <b>You need:</b> SSH access to <code>wazuh-server</code> and chapters 5 and 6 done. Rule IDs 100000 and above are yours.</div>
<div class="box story"><b>📖 The story</b>Ada: <b>“A change to the hosts file or the Startup folder should wake us up at night. Right now it looks like any other alert.”</b> You will teach Wazuh what is <b>urgent</b>.</div>
<div class="box why"><b>💡 Rules and levels</b>Wazuh gives every alert a <b>level from 0 to 15</b>: <b>0-3</b> background noise, <b>4-7</b> worth a look, <b>8-11</b> important, <b>12-15</b> drop everything. A <b>rule</b> says: “when you see THIS, give it level X.” The built-in rule for a modified file is only a low level. Your <b>custom rules</b> raise it for dangerous places.</div>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> (the Wazuh server, <b>not</b> Windows). Open the custom rules file:
<pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre></li>
<li>Go to the bottom of the file and paste (use <code>Ctrl+Shift+V</code>):
<pre>&lt;group name="brightmart,fim,"&gt;
  &lt;rule id="100300" level="12"&gt;
    &lt;if_sid&gt;550&lt;/if_sid&gt;
    &lt;field name="file" type="pcre2"&gt;(?i)\\drivers\\etc\\hosts$&lt;/field&gt;
    &lt;description&gt;Windows hosts file was modified&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1565.001&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
  &lt;rule id="100301" level="12"&gt;
    &lt;if_sid&gt;554&lt;/if_sid&gt;
    &lt;field name="file" type="pcre2"&gt;(?i)\\Start Menu\\Programs\\Startup\\&lt;/field&gt;
    &lt;description&gt;New file in Startup folder (persistence)&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1547.001&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
  &lt;rule id="100303" level="7"&gt;
    &lt;if_sid&gt;554&lt;/if_sid&gt;
    &lt;field name="file" type="pcre2"&gt;(?i)\.locked$&lt;/field&gt;
    &lt;description&gt;File with .locked extension created&lt;/description&gt;
  &lt;/rule&gt;
  &lt;rule id="100304" level="14" frequency="20" timeframe="30"&gt;
    &lt;if_matched_sid&gt;100303&lt;/if_matched_sid&gt;
    &lt;same_agent /&gt;
    &lt;description&gt;Possible ransomware: 20+ .locked files in 30 seconds&lt;/description&gt;
    &lt;mitre&gt;&lt;id&gt;T1486&lt;/id&gt;&lt;/mitre&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre>
<b>How to read a rule:</b> <code>if_sid 550</code> = “start from the built-in modified-file rule”; <code>field file</code> = “only if the path matches this pattern”; <code>level</code> = how urgent; <code>(?i)</code> = ignore upper/lower case, because Windows paths do not care. The two backslashes <code>\\</code> mean one real backslash.</li>
<li>Save (<code>Ctrl+O</code>, Enter, <code>Ctrl+X</code>) and restart the manager:
<pre>sudo systemctl restart wazuh-manager</pre></li>
<li><span class="vm w">WINDOWS</span> Repeat Shadow’s Move 3 (hosts) and Move 4 (Startup file) from Chapter 5, then clean up.</li>
<li>Now simulate <b>ransomware</b> (files being locked in bulk):
<pre>1..25 | ForEach-Object { Set-Content "C:\BrightMart\doc$_.txt" "x" }
Get-ChildItem C:\BrightMart\doc*.txt | Rename-Item -NewName { $_.Name + ".locked" }</pre></li>
<li><span class="vm h">YOUR PC</span> In Threat Hunting → Events search <code>rule.id:(100300 OR 100301 OR 100303 OR 100304)</code>.</li></ol>
<div class="box tip"><b>✅ You should see</b>Level 12 alerts with <i>your</i> descriptions for the hosts file and Startup folder, and a level 14 alert “Possible ransomware” after the bulk rename. You just taught a SIEM what matters.</div>
<details><summary>😕 Stuck? Click here</summary>
<p><b>Manager will not restart:</b> XML typo. Run <code>sudo tail -20 /var/ossec/logs/ossec.log</code>.</p>
<p><b>Rule never fires:</b> open one real alert in the JSON view, copy the exact field name for the path (usually <code>syscheck.path</code>, which rules call <code>file</code>), and test on the server with <code>sudo /var/ossec/bin/wazuh-logtest</code>: paste a log and see which rule matches. Custom rule IDs must be 100000 or higher.</p>
<p><b>Ransomware rule silent:</b> make sure the 25 renames happen within 30 seconds, and clean up old files first.</p></details>
<h3>Evidence to save</h3>
<ul><li>Your <code>local_rules.xml</code> additions.</li><li>A screenshot of the level 12 and level 14 alerts.</li><li>The tester output that proves the rule matches.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Manager will not restart</td><td>XML typo</td><td><code>sudo tail -20 /var/ossec/logs/ossec.log</code></td></tr><tr><td>Rule never fires</td><td>Field name differs by version</td><td>Copy the exact field from a real alert’s JSON; test with <code>wazuh-logtest</code></td></tr><tr><td>Ransomware rule stays silent</td><td>Fewer than 20 events in 30 seconds</td><td>Run the rename loop again, after clearing old files</td></tr><tr><td>No <code>.locked</code> alerts</td><td>Folder not monitored</td><td>Check the BrightMart tripwire is still in the configuration</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You taught a SIEM what is urgent. Test every rule with real activity before you trust it.</div>`,
quiz:[{q:"What does a higher rule level mean?",o:["More urgent","Older alert","Fewer details","Slower"],a:0},{q:"Where do custom rules live?",o:["On the Windows PC","local_rules.xml on the Wazuh server","In Notepad","On Kali"],a:1},{q:"Why does the ransomware rule use frequency and timeframe?",o:["To catch MANY events in a short time","To slow Wazuh","To hide alerts","To delete files"],a:0}]},

{id:"fim-10",mod:"m5",mins:60,title:"Boss fight: Shadow returns",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>investigate an unguided incident, build a timeline, identify the attacker’s persistence, and write a one-page incident report.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 60 minutes. <b>You need:</b> all earlier chapters complete and a clean snapshot. Do not look back at the hints until you have tried.</div>
<div class="box story"><b>📖 The story</b>Wednesday, 02:14 AM. Ada’s phone buzzes: a <b>level 14 alert</b>. Shadow is back and moving fast. This time there are <b>no hints</b>. You have your tripwires, your rules and your detective skills. Catch everything, explain it, and tell Ada what to do.</div>
<h3>Setup check</h3>
<p>☐ BrightMart folder, hosts, Startup and registry tripwires are active ☐ whodata is on ☐ rules 100300-100304 are loaded ☐ the clean-up from earlier chapters is done. Snapshot Windows, then run the script below. It performs 6 moves with 20 seconds between them.</p>
<span class="vm w">WINDOWS</span> <pre>$d=20
(Get-Content C:\BrightMart\prices.csv) -replace "beans,3","beans,0" | Set-Content C:\BrightMart\prices.csv; Start-Sleep $d
Set-Content C:\BrightMart\site\index.html "&lt;h1&gt;Shadow was here&lt;/h1&gt;"; Start-Sleep $d
Add-Content C:\Windows\System32\drivers\etc\hosts "203.0.113.77 pay.brightmart.test"; Start-Sleep $d
Copy-Item C:\Windows\System32\notepad.exe "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\svchost32.exe"; Start-Sleep $d
reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v WinUpdate /t REG_SZ /d "C:\Users\Public\svchost32.exe" /f; Start-Sleep $d
1..25 | ForEach-Object { Set-Content "C:\BrightMart\inv$_.txt" "x" }
Get-ChildItem C:\BrightMart\inv*.txt | Rename-Item -NewName { $_.Name + ".locked" }</pre>
<h3>Your mission (answer each one)</h3>
<ol class="steps"><li><b>Find all 6 moves</b> in the dashboard. Which ones fired a custom rule, and which only the default?</li><li><b>Build the timeline</b>: time, event, file or key, who, process.</li><li><b>Who and how?</b> Which account and program made the changes? Is anything suspicious about the file name <code>svchost32.exe</code>? (Hint: the real Windows file is called <code>svchost.exe</code> and lives in System32.)</li><li><b>Is the new file bad?</b> Copy its <code>sha256_after</code>, look it up, and explain what you would do if the result was “malicious”.</li><li><b>Link the moves:</b> which two moves belong together (the file and the registry entry)? Why would an attacker create both?</li><li><b>Contain and fix:</b> write the steps you would take, in order.</li></ol>
<h3>Write the incident report (one page)</h3>
<table><tr><th>Section</th><th>Write</th></tr><tr><td>Summary</td><td>3 sentences a shop owner understands</td></tr><tr><td>Timeline</td><td>Your table</td></tr><tr><td>Impact</td><td>What was changed or at risk (prices, website, customer traffic, persistence, files locked)</td></tr><tr><td>How we detected it</td><td>Which tripwires and rules fired</td></tr><tr><td>Containment and recovery</td><td>Isolate the PC from the network · remove the Startup file, Run key and hosts line · restore prices and website from backup · reset all passwords · check other PCs for the same file hash</td></tr><tr><td>Lessons and gaps</td><td>What was missed? What new rule would you add?</td></tr></table>
<div class="box lab"><b>🏆 Self-check, score yourself</b>6 moves found (30) · timeline correct (20) · who/process identified (15) · suspicious name explained (10) · sensible containment (15) · one new rule or tuning idea (10). <b>80+ = you can do this at a junior SOC.</b></div>
<h3>Clean up</h3>
<pre>Remove-Item "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\svchost32.exe" -ErrorAction SilentlyContinue
reg delete HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v WinUpdate /f
(Get-Content C:\Windows\System32\drivers\etc\hosts) | Where-Object { $_ -notmatch "203.0.113.77" } | Set-Content C:\Windows\System32\drivers\etc\hosts
Remove-Item C:\BrightMart\inv*.locked</pre>
<p>Then restore <code>prices.csv</code> and <code>index.html</code> as in Chapter 5, or revert the snapshot.</p>
<details><summary>😕 Stuck? Click here</summary><p>Missing an alert? Check the time filter, then check the order: file alerts need the agent to have finished its baseline. For each missing move, ask: <i>Do I have a tripwire on that path?</i> That question is exactly how real gaps are found.</p></details>
<h3>Evidence to save</h3>
<ul><li>Your incident report and your self-score.</li><li>The timeline with six moves.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>You found fewer than six moves</td><td>A tripwire is missing or the time filter is too narrow</td><td>Ask “do I have a tripwire there?” for each missing move</td></tr><tr><td>Cannot tell who made a change</td><td>whodata not enabled for that path</td><td>Enable it; repeat the move</td></tr><tr><td>Report feels unclear</td><td>Too many details</td><td>Write the summary for the shop owner first, then the timeline</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You completed an unguided investigation from alert to report. This is the piece to show in your portfolio.</div>`,
quiz:[{q:"A file named svchost32.exe in Startup is suspicious because…",o:["It mimics a real Windows name in the wrong place","It is too small","It is a text file","Windows deletes it"],a:0},{q:"First containment step for a compromised PC?",o:["Isolate it from the network","Send a thank-you email","Delete the SIEM","Ignore"],a:0},{q:"Linking a Startup file and a Run key means…",o:["Two ways to get the program started again","Two backups","Antivirus work","Nothing"],a:0}]},

{id:"fim-11",mod:"m5",mins:30,title:"Cheat sheet: every setting and real-world gotchas",
body:String.raw`<div class="goal"><b>🎯 By the end of this chapter you will</b>consolidate everything into your own final configuration and rules, and turn the case file into a portfolio piece.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 30 minutes. <b>You need:</b> chapter 10 complete and your notebook.</div>
<p>You finished the story. Keep this page open as your <b>reference</b>. Click a heading to open it.</p>
<details open><summary>📋 Directory settings (what each word in your tripwire line does)</summary>
<table><tr><th>Setting</th><th>Meaning in plain words</th></tr>
<tr><td><code>realtime="yes"</code></td><td>Alert within seconds</td></tr><tr><td><code>whodata="yes"</code></td><td>Seconds, plus who and which program (needs Windows auditing)</td></tr>
<tr><td><code>report_changes="yes"</code></td><td>Show the lines that changed (text files only)</td></tr><tr><td><code>check_all="yes"</code></td><td>Compare everything that applies</td></tr>
<tr><td><code>check_sum="yes"</code></td><td>Compare all hashes (md5, sha1, sha256)</td></tr>
<tr><td><code>check_sha256sum</code>, <code>check_md5sum</code>, <code>check_sha1sum</code></td><td>Pick specific hashes</td></tr>
<tr><td><code>check_size</code>, <code>check_mtime</code>, <code>check_owner</code></td><td>Size, last-modified time, owner</td></tr>
<tr><td><code>check_perm</code></td><td>Windows permissions (ACLs)</td></tr><tr><td><code>check_attrs</code></td><td>Windows attributes such as hidden or read-only</td></tr>
<tr><td><code>check_group</code>, <code>check_inode</code></td><td>Linux only</td></tr>
<tr><td><code>recursion_level="N"</code></td><td>How many sub-folder levels to watch</td></tr>
<tr><td><code>restrict="text"</code></td><td>Only files whose names contain this text (separate several with |)</td></tr>
<tr><td><code>tags="a,b"</code></td><td>Labels that show up in alerts, useful for filtering</td></tr></table></details>
<details><summary>⚙️ Global settings (inside &lt;syscheck&gt;)</summary>
<table><tr><th>Setting</th><th>Default</th><th>Meaning</th></tr>
<tr><td>disabled</td><td>no</td><td>Turns FIM off</td></tr><tr><td>frequency</td><td>43200</td><td>Seconds between full scans (12 hours)</td></tr>
<tr><td>scan_on_start</td><td>yes</td><td>Scan when the agent starts</td></tr><tr><td>scan_time / scan_day</td><td>none</td><td>Run scans at a chosen time or day</td></tr>
<tr><td>max_eps</td><td>100</td><td>Max FIM events per second</td></tr><tr><td>process_priority</td><td>10</td><td>How gently scans run</td></tr>
<tr><td>windows_audit_interval</td><td>300</td><td>How often whodata audit settings are re-checked (seconds)</td></tr>
<tr><td>file_limit, registry_limit</td><td>100000</td><td>Maximum items tracked</td></tr>
<tr><td>diff → disk_quota, file_size</td><td>1GB, 50MB</td><td>Space for saved copies and the biggest file to diff</td></tr>
<tr><td>ignore, ignore type="sregex"</td><td>none</td><td>Skip a path, or skip by pattern</td></tr>
<tr><td>nodiff</td><td>none</td><td>Never save contents of this file (for secrets)</td></tr>
<tr><td>registry_ignore</td><td>none</td><td>Skip registry keys</td></tr>
<tr><td>synchronization</td><td>on</td><td>Keeps agent and server records aligned</td></tr></table>
<p style="color:var(--mu)">Defaults and options vary slightly between Wazuh versions. Confirm in the docs for your version.</p></details>
<details><summary>🗝️ Registry settings</summary>
<table><tr><th>Setting</th><th>Meaning</th></tr><tr><td><code>arch="32bit|64bit|both"</code></td><td>Which registry view (use both for Run and Software keys)</td></tr><tr><td><code>tags</code></td><td>Label for alerts</td></tr><tr><td><code>recursion_level</code></td><td>How deep into sub-keys</td></tr><tr><td><code>report_changes</code></td><td>Show old and new values (depends on version)</td></tr></table></details>
<details><summary>⚠️ 12 real-world gotchas</summary>
<table><tr><th>Situation</th><th>What happens</th><th>Fix</th></tr>
<tr><td>Wazuh restarted, no alert after change</td><td>Baseline still building</td><td>Wait a few minutes</td></tr>
<tr><td>Group Policy overwrites audit settings</td><td>whodata silently falls back to realtime</td><td>Enable File System auditing in the GPO</td></tr>
<tr><td><code>%APPDATA%</code> used in a path</td><td>Agent runs as SYSTEM, so it points to the wrong profile</td><td>Use full paths like C:\Users\name\...</td></tr>
<tr><td>HKEY_CURRENT_USER keys</td><td>Easy to miss</td><td>Use Sysmon registry events as backup</td></tr>
<tr><td>Rename</td><td>Appears as delete plus add</td><td>Look for pairs close in time</td></tr>
<tr><td>Config file with passwords</td><td>report_changes stores contents in alerts</td><td>Use nodiff</td></tr>
<tr><td>Network shares</td><td>Instant watching works poorly</td><td>Install the agent on the file server</td></tr>
<tr><td>Locked files (pagefile, user hives)</td><td>Cannot be hashed</td><td>Ignore them</td></tr>
<tr><td>Antivirus deletes a file</td><td>Looks like a delete</td><td>Check Defender events</td></tr>
<tr><td>Attacker stops the Wazuh service</td><td>Silence looks like safety</td><td>Alert on disconnected agents</td></tr>
<tr><td>Attacker edits the agent config to hide a folder</td><td>Blind spot</td><td>Also monitor <code>ossec.conf</code> itself</td></tr>
<tr><td>Cloned Windows images</td><td>Same agent identity</td><td>Sysprep and re-enrol with unique names</td></tr></table></details>
<details><summary>🔢 Event IDs to memorise</summary>
<table><tr><th>ID</th><th>Meaning</th><th>ID</th><th>Meaning</th></tr><tr><td>4624</td><td>Logon success</td><td>4625</td><td>Logon failed</td></tr><tr><td>4688</td><td>Process created</td><td>4698</td><td>Scheduled task created</td></tr><tr><td>4720</td><td>User created</td><td>4732</td><td>Added to a local group</td></tr><tr><td>7045</td><td>Service installed</td><td>1102</td><td>Security log cleared</td></tr><tr><td>4663</td><td>File accessed (whodata)</td><td>4104</td><td>PowerShell script block</td></tr></table></details>
<details><summary>🧰 Full tripwire config you built (copy this for your portfolio)</summary>
<pre>&lt;syscheck&gt;
  &lt;directories whodata="yes" check_all="yes" report_changes="yes"&gt;C:\BrightMart&lt;/directories&gt;
  &lt;directories whodata="yes" check_all="yes" report_changes="yes"&gt;C:\Windows\System32\drivers\etc&lt;/directories&gt;
  &lt;directories whodata="yes" check_all="yes"&gt;C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup&lt;/directories&gt;
  &lt;windows_registry arch="both"&gt;HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run&lt;/windows_registry&gt;
  &lt;windows_registry arch="both"&gt;HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon&lt;/windows_registry&gt;
  &lt;windows_registry&gt;HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows Defender&lt;/windows_registry&gt;
  &lt;ignore&gt;C:\BrightMart\cache&lt;/ignore&gt;
  &lt;ignore type="sregex"&gt;.log$|.tmp$|.etl$&lt;/ignore&gt;
&lt;/syscheck&gt;</pre></details>
<div class="box lab"><b>🏁 Portfolio idea</b>Put the incident report, your timeline, your rules file, and screenshots of each chapter on GitHub as “Case File #1: BrightMart”. Recruiters love a story that shows detection, investigation and tuning.</div>
<h3>Evidence to save</h3>
<ul><li>Your final <code>syscheck</code> block, with any private details removed.</li><li>Your rules file, your report and your screenshots, organised in a folder.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Config will not load</td><td>A tag is unclosed or mistyped</td><td>Compare with the full config in this chapter; restore your backup</td></tr><tr><td>Changes do not take effect</td><td>Agent not restarted</td><td>Run <code>Restart-Service WazuhSvc</code></td></tr><tr><td>Too many alerts again</td><td>Paths are too broad</td><td>Apply the narrow-ignore rule from chapter 8</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You now have a complete, tested FIM setup and a story to tell in an interview.</div>`,
quiz:[{q:"Which setting stops secrets being stored in an alert diff?",o:["nodiff","tags","ignore","realtime"],a:0},{q:"What default interval does a scheduled scan use?",o:["12 hours","1 minute","7 days","Never"],a:0}]},

{id:"6-1",mod:"m6",mins:45,title:"Case File #2: The SSH Intruder. Story and baseline",
body:String.raw`<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 45 minutes. <b>You need:</b> Wazuh running with agent 000 active, the <code>labuser</code> account from lab 2.4, and <code>kali-attacker</code> running. The chapter “Password Attacks and Authentication Defence” gives useful background.</div>
<div class="box story"><b>📖 The story</b>BrightMart’s owner, Ada, keeps a Linux server for the shop (your <code>wazuh-server</code>). Her admin logs in remotely with <b>SSH</b>. One Friday night, Ada gets a text from her hosting provider: <i>“Unusual login activity detected on your server.”</i> She asks you: <b>“Is someone guessing our passwords? Did they get in?”</b></div>
<div class="goal"><b>🎯 By the end of this chapter you will</b>explain SSH and password attacks, and find a <b>normal</b> login in the logs and in Wazuh so you know what “normal” looks like.</div>
<div class="box why"><b>💡 Why it matters</b>Every server on the internet is hit by automated password guessing within hours of going online. A defender’s job is to tell harmless noise from a real break-in. You cannot spot “abnormal” until you have seen “normal”.</div>
<h3>What is SSH?</h3>
<p><b>SSH</b> (Secure Shell, port 22) is how administrators log in to Linux servers over a network, with an encrypted text session. You already use it from your PC. A login needs a <b>username</b> and a <b>password</b> (or a key).</p>
<table><tr><th>Password attack</th><th>How it works</th></tr><tr><td><b>Brute force</b></td><td>Many passwords against <b>one</b> account</td></tr><tr><td><b>Password spraying</b></td><td>One or a few common passwords against <b>many</b> accounts (avoids lock-outs)</td></tr><tr><td><b>Credential stuffing</b></td><td>Using leaked username/password pairs from other breaches</td></tr></table>
<h3>Baseline: make and find a normal login</h3>
<ol class="steps">
<li><span class="vm k">KALI</span> Log in properly as the lab victim account (password <code>Summer2024</code>, created in lesson 2.4):
<pre>ssh labuser@192.168.56.10
whoami
exit</pre></li>
<li><span class="vm u">UBUNTU</span> Find it in the log:
<pre>sudo grep "Accepted" /var/log/auth.log | tail -n 3</pre></li>
<li><span class="vm h">YOUR PC</span> In Wazuh: <b>Threat Hunting → Events</b>, range <b>Last 15 minutes</b>, search <code>rule.id:5715</code>. Open the alert and the JSON view.</li>
<li>Fill in this card about the alert: <b>Which computer? Which user? Which source IP? What time? Which rule description and level?</b> In the JSON look for fields beginning <code>data.</code> (the IP is usually <code>data.srcip</code>; the user appears as <code>data.dstuser</code> or <code>data.srcuser</code> depending on the rule).</li></ol>
<div class="box tip"><b>✅ You should see</b>A line like <code>Accepted password for labuser from 192.168.56.50</code> and a Wazuh alert saying authentication succeeded, level 3, with source IP 192.168.56.50. This is a <b>normal, successful</b> login: low level, one event.</div>
<div class="box lab"><b>📝 Why this matters later</b>Keep this alert in mind. In the next chapters a login from the same IP will look very different: preceded by dozens of failures.</div>
<details><summary>😕 Stuck?</summary><p><b>Permission denied right away:</b> labuser does not exist or the password differs; redo lesson 2.4. <b>No 5715 alert:</b> widen the time range and confirm agent 000 is Active. <b>auth.log is empty:</b> use <code>sudo journalctl -u ssh -n 20</code>.</p></details>
<h3>Evidence to save</h3>
<ul><li>A completed alert card: computer, user, source address, time, rule ID, level.</li><li>The matching <code>Accepted password</code> line from <code>auth.log</code>.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Permission denied straight away</td><td>labuser missing or the password differs</td><td>Repeat lab 2.4 on Ubuntu</td></tr><tr><td>No rule 5715 alert</td><td>Time range or agent 000 not active</td><td>Widen the time range; check the Agents page</td></tr><tr><td><code>auth.log</code> is empty</td><td>Logging goes to the journal</td><td><code>sudo journalctl -u ssh -n 20</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You found a normal login in the log and in Wazuh. Keep this card: in the next chapters the same login will look very different.</div>`,
quiz:[{q:"Many passwords against ONE account is…",o:["Brute force","Password spraying","Phishing","Ransomware"],a:0},{q:"Why look at a normal login first?",o:["To learn what normal looks like","It is required by SSH","To delete logs","No reason"],a:0},{q:"Which rule showed the successful login?",o:["5715","5710","5763","550"],a:0}]},

{id:"6-2",mod:"m6",mins:50,title:"The attack: password guessing with Hydra",
body:String.raw`<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 50 minutes. <b>You need:</b> chapter 1 complete. <b>Take a snapshot of wazuh-server called <code>07-before-ssh-case</code></b> first, so you can start the case again. Keep <code>kali-attacker</code> running only for this chapter.</div>
<div class="box story"><b>📖 The story</b>Friday, 11:48 PM. A bot starts guessing passwords against BrightMart’s server. You will replay what it did, so you can see exactly what Wazuh records.</div>
<div class="goal"><b>🎯 By the end of this chapter you will</b>run a password-guessing attack in your own lab and find the alert trail: single failures, then a brute-force alert.</div>
<div class="box why"><b>💡 What is Hydra?</b>Hydra is a tool that tries many passwords automatically. Real attackers use it or similar tools. We run it <b>only</b> against our own lab.</div>
<ol class="steps">
<li><span class="vm k">KALI</span> Make a small password list. The real password is deliberately near the end:
<pre>printf "123456\npassword\nqwerty\nletmein\nadmin\nwelcome\nmonkey\ndragon\nfootball\nSummer2024\n" &gt; pw.txt
cat pw.txt</pre></li>
<li>Run the attack against the account <code>labuser</code>:
<pre>hydra -l labuser -P pw.txt ssh://192.168.56.10 -t 4</pre>
<b>Read it:</b> <code>-l</code> = one login name, <code>-P</code> = password list file, <code>ssh://IP</code> = the target service, <code>-t 4</code> = 4 attempts at once.</li>
<li>Hydra reports its result. Note the time you ran it.</li>
<li><span class="vm h">YOUR PC</span> In Wazuh Events (range <b>Last 15 minutes</b>) search:
<pre>rule.id:(5760 OR 5763 OR 5710 OR 5712 OR 5715)</pre></li>
<li>Sort by time (oldest first) and build the timeline below.</li></ol>
<table><tr><th>Rule</th><th>Meaning</th><th>Appears when</th></tr>
<tr><td>5760</td><td>sshd: authentication failed (a real user, wrong password)</td><td>Each wrong guess</td></tr>
<tr><td>5710 / 5712</td><td>Login attempt with a user that does not exist / brute force on non-existent user</td><td>Guessing usernames</td></tr>
<tr><td>5763</td><td><b>Brute force</b>: many failures from one IP in a short time</td><td>After about 8 failures</td></tr>
<tr><td>5715</td><td>Authentication success</td><td>When the right password is found</td></tr></table>
<div class="box tip"><b>✅ You should see</b>Hydra printing something like <code>[22][ssh] host: 192.168.56.10 login: labuser password: Summer2024</code>. In Wazuh: a run of level-5 failure alerts, then a <b>level-10 alert “brute force trying to get access to the system”</b>, then a <b>success</b> alert from the same IP, 192.168.56.50.</div>
<div class="box why"><b>💡 What to notice</b>The brute-force alert fires <b>before</b> or around the time the password is found. The most dangerous line in the whole timeline is the <b>success after failures</b>: that means the attacker is in. You will investigate it next.</div>
<h3>Your timeline (fill this in)</h3>
<table><tr><th>Time</th><th>Rule</th><th>Source IP</th><th>User</th><th>Meaning</th></tr><tr><td>?</td><td>5760</td><td>?</td><td>labuser</td><td>First failed guess</td></tr><tr><td>?</td><td>5763</td><td>?</td><td>?</td><td>?</td></tr><tr><td>?</td><td>5715</td><td>?</td><td>labuser</td><td>?</td></tr></table>
<details><summary>😕 Stuck?</summary><p><b>Hydra: “connection refused”:</b> SSH is not running or the IP is wrong: <code>nc -zv 192.168.56.10 22</code>. <b>Hydra finds nothing:</b> the password in the list must match the real labuser password. <b>Only a few alerts:</b> widen the time range; brute-force alerts need 8 failures in a short window, so use at least 10 guesses. <b>Hydra says “too many connections”:</b> use <code>-t 1</code>.</p></details>
<h3>🔬 Go deeper: spraying, and why the rules look different</h3>
<p>In this lesson, Hydra tried many passwords against one user. Now try the opposite, which defenders call <b>password spraying</b>: one password against many users. First create a list of user names, some real and some not.</p>
<pre>printf "admin\nroot\nubuntu\nlabuser\ntest\noracle\nguest\nsupport\n" &gt; users.txt
hydra -L users.txt -p Summer2024 ssh://192.168.56.10 -t 1</pre>
<p>Here <code>-L</code> is a list of users and <code>-p</code> is a single password. In Wazuh, search <code>rule.id:(5710 OR 5712 OR 5760 OR 5763 OR 5715)</code>. You should see more of the <b>non-existent user</b> alerts (5710, and possibly 5712), because most of those names do not exist, and then a success for <code>labuser</code>.</p>
<p>Compare the two attacks in a table in your notebook:</p>
<table><tr><th></th><th>Brute force (one user)</th><th>Spraying (one password)</th></tr>
<tr><td>Failures per account</td><td>Many</td><td>One</td></tr>
<tr><td>Main rules</td><td>5760, 5763</td><td>5710, 5712 and one success</td></tr>
<tr><td>What a lockout policy does</td><td>Stops it quickly</td><td>Rarely triggers</td></tr>
<tr><td>Best detection</td><td>Failures per account or per source</td><td>Failures per <b>source</b> across many accounts</td></tr></table>
<div class="box lab"><b>Challenge</b>Run the user-count command from lesson 2.1 on the new logs. How many distinct user names did the attacker try, and from how many addresses? Write the sentence you would put in a report.</div>
<h3>Evidence to save</h3>
<ul><li>The Hydra result line showing the password found.</li><li>Your filled timeline table with real times and rule IDs.</li><li>A screenshot of the Events page showing the failures and the brute-force alert.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>Hydra: “connection refused”</td><td>SSH is not reachable</td><td>Test with <code>nc -zv 192.168.56.10 22</code>; check the ping matrix</td></tr><tr><td>Hydra finds nothing</td><td>The real password is not in your list</td><td>Make sure <code>Summer2024</code> is in <code>pw.txt</code></td></tr><tr><td>Only a few alerts</td><td>Time range too narrow, or too few guesses</td><td>Widen the range; use at least ten guesses</td></tr><tr><td>Hydra reports too many connections</td><td>Too many parallel attempts</td><td>Use <code>-t 1</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You ran a password attack against your own lab and followed its trail: single failures, a brute-force alert, then a success from the same address.</div>`,
quiz:[{q:"Which rule is the brute-force alert?",o:["5763","5715","550","60122"],a:0},{q:"What is the most worrying pattern?",o:["One failed login","Success right after many failures from one IP","A normal login","A ping"],a:1},{q:"What does -P pw.txt mean in Hydra?",o:["Use this list of passwords","Print the password","Port number","Ping"],a:0}]},

{id:"6-3",mod:"m6",mins:55,title:"Investigate: did they get in, and what did they do?",
body:String.raw`<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 55 minutes. <b>You need:</b> chapter 2 complete with alerts in the dashboard, and <code>kali-attacker</code> running. <b>Remember to undo the account lock</b> at the end of the chapter.</div>
<div class="box story"><b>📖 The story</b>Ada: <b>“I see the alerts. But did they actually get in? What can they do now?”</b> You will investigate the way a Tier 2 analyst does: confirm, scope and contain.</div>
<div class="goal"><b>🎯 By the end of this chapter you will</b>prove a compromise with evidence, check what the attacker did, and practise containment steps.</div>
<h3>Step 1: the attacker uses the stolen password</h3>
<ol class="steps"><li><span class="vm k">KALI</span> Log in as the attacker, run a few “curious” commands, and leave:
<pre>ssh labuser@192.168.56.10
whoami; id; hostname; ls /home
cat /etc/passwd | head -n 3
exit</pre></li></ol>
<h3>Step 2: gather evidence on the server</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span>
<pre>sudo grep "Failed password for labuser" /var/log/auth.log | wc -l
sudo grep "Accepted password for labuser" /var/log/auth.log
last -n 5
sudo ls -la /home/labuser/.ssh 2&gt;/dev/null
sudo crontab -l -u labuser 2&gt;/dev/null</pre>
<b>Read it:</b> the first counts the failures; the second shows successes and the source IP; <code>last</code> lists recent logins; the last two check for the attacker’s two favourite hiding places, SSH keys and scheduled jobs.</li></ol>
<h3>Step 3: the verdict</h3>
<table><tr><th>Question</th><th>Evidence</th></tr><tr><td>Was it a brute-force attack?</td><td>Rule 5763 plus a block of 5760 failures from 192.168.56.50</td></tr><tr><td>Did it succeed?</td><td>Rule 5715 from the <b>same IP</b> shortly after the failures</td></tr><tr><td>Is that IP expected?</td><td>No: this host has never logged in as labuser before the attack</td></tr><tr><td><b>Verdict</b></td><td><b>True positive: the labuser account is compromised</b></td></tr></table>
<h3>Step 4: contain (practise, then undo)</h3>
<ol class="steps"><li><span class="vm u">UBUNTU</span> The standard containment steps:
<pre>sudo passwd -l labuser                 # lock the account
sudo pkill -KILL -u labuser            # end any live sessions
sudo grep -c labuser /etc/passwd       # confirm account still exists
</pre></li>
<li>Test: from Kali try <code>ssh labuser@192.168.56.10</code> with the right password. It should now fail.</li>
<li>Undo it so later chapters work:
<pre>sudo passwd -u labuser
echo 'labuser:Summer2024' | sudo chpasswd</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>The <code>wc -l</code> command printing about 9 failures; one “Accepted” line from 192.168.56.50; the attacker’s session in <code>last</code>; no <code>.ssh</code> folder and no cron jobs (this attacker only looked around); and the login failing while the account is locked.</div>
<div class="box why"><b>💡 What you would do in a real company</b>Lock or reset the account, end sessions, <b>reset every password the user reuses</b>, search other servers for the same source IP, preserve the logs as evidence, tell the account owner, write a report. Deleting the account is usually <b>not</b> the first step: you may need it for evidence.</div>
<details><summary>😕 Stuck?</summary><p><b>auth.log shows nothing:</b> use <code>sudo journalctl -u ssh --since "30 min ago"</code>. <b>Locked account still logs in:</b> an existing session continues; the <code>pkill</code> line ends it. <b>You forgot to unlock:</b> run the undo commands above.</p></details>
<h3>Evidence to save</h3>
<ul><li>The failure count, the “Accepted” line and the <code>last</code> output.</li><li>Your written verdict: true positive, with the evidence.</li><li>Proof that you unlocked <code>labuser</code> again (a successful login).</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td><code>auth.log</code> shows nothing</td><td>Journal logging</td><td><code>sudo journalctl -u ssh --since "30 min ago"</code></td></tr><tr><td>Locked account still logs in</td><td>An existing session continues</td><td>Run the <code>pkill</code> line to end the session</td></tr><tr><td>Later chapters fail to log in</td><td>The account stayed locked</td><td>Run <code>sudo passwd -u labuser</code> and reset the password</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You turned alerts into proof: you showed that the account was compromised, checked what the attacker did, practised containment and then undid it.</div>`,
quiz:[{q:"What makes this a true positive?",o:["Success from the same IP right after many failures","One failed login","A level 3 alert alone","A ping"],a:0},{q:"First containment step for a compromised account?",o:["Lock the account and end its sessions","Delete the server","Ignore it","Email the attacker"],a:0},{q:"Why check .ssh and cron?",o:["Attackers hide persistence there","They are slow","They hold passwords of Wi-Fi","No reason"],a:0}]},

{id:"6-4",mod:"m6",mins:50,title:"Detection engineering: write a correlation rule",
body:String.raw`<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 50 minutes. <b>You need:</b> SSH access to <code>wazuh-server</code> and chapters 1 to 3 done. <b>Make a backup first:</b> <code>sudo cp /var/ossec/etc/rules/local_rules.xml /var/ossec/etc/rules/local_rules.xml.bak</code>. Restoring it fixes any mistake.</div>
<div class="box story"><b>📖 The story</b>Ada: <b>“Why did nothing scream at me? A success right after a brute force should be an emergency.”</b> Wazuh gave a level-3 alert for the success, and the brute-force alert separately. You will write a rule that connects the two.</div>
<div class="goal"><b>🎯 By the end of this chapter you will</b>write, test and trigger a <b>correlation rule</b>: one that fires only when two events happen in sequence.</div>
<div class="box why"><b>💡 Why it matters</b>Single events are weak signals. A pattern (failures then success from the same IP) is a strong one. Writing correlation rules is detection engineering.</div>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> Open the custom rules file:
<pre>sudo nano /var/ossec/etc/rules/local_rules.xml</pre></li>
<li>Go to the bottom (below any existing rules) and paste:
<pre>&lt;group name="brightmart,ssh,"&gt;
  &lt;rule id="100100" level="13" timeframe="300"&gt;
    &lt;if_sid&gt;5715&lt;/if_sid&gt;
    &lt;if_matched_sid&gt;5763&lt;/if_matched_sid&gt;
    &lt;same_source_ip /&gt;
    &lt;description&gt;SSH login success shortly after brute force from the same IP: likely compromised account&lt;/description&gt;
    &lt;mitre&gt;
      &lt;id&gt;T1110&lt;/id&gt;
      &lt;id&gt;T1078&lt;/id&gt;
    &lt;/mitre&gt;
  &lt;/rule&gt;
&lt;/group&gt;</pre>
<b>Read it like a sentence:</b> “Start from the <b>login success</b> rule (<code>if_sid 5715</code>). If, within <b>300 seconds</b>, the <b>brute-force</b> rule (<code>5763</code>) already fired for the <b>same source IP</b>, raise a <b>level 13</b> alert with this description.” IDs 100000 and above are reserved for your own rules.</li>
<li>Save (<code>Ctrl+O</code>, Enter, <code>Ctrl+X</code>) and check the file is valid and restart:
<pre>sudo /var/ossec/bin/wazuh-analysisd -t
sudo systemctl restart wazuh-manager</pre>The first line tests your configuration: it must print nothing alarming.</li>
<li><span class="vm k">KALI</span> Replay the attack (same as chapter 2). Hydra will fail on many guesses and then find the password:
<pre>hydra -l labuser -P pw.txt ssh://192.168.56.10 -t 1</pre></li>
<li><span class="vm h">YOUR PC</span> Search in Events: <code>rule.id:100100</code>.</li></ol>
<div class="box tip"><b>✅ You should see</b>A <b>level 13</b> alert called “SSH login success shortly after brute force…”, with source IP 192.168.56.50 and the MITRE techniques T1110 and T1078. Also check <code>rule.level >= 12</code>: your rule is now one of the loudest alerts, as it should be.</div>
<details><summary>😕 Stuck?</summary>
<p><b>Config test shows an error:</b> read the line number it gives; almost always a missing <code>&lt;</code> or <code>&gt;</code> or a missing <code>&lt;/rule&gt;</code>.</p>
<p><b>Manager will not restart:</b> <code>sudo tail -20 /var/ossec/logs/ossec.log</code>.</p>
<p><b>Rule does not fire:</b> 5763 needs about 8 failures before the success. In your list the right password is last, so with <code>-t 1</code> (one at a time) the order is predictable. If the 5763 alert did not appear, widen the time range and re-run. If your Wazuh version names the “same IP” option differently, try <code>&lt;same_srcip /&gt;</code>.</p>
<p><b>Level in your version differs:</b> rule IDs and levels can change between versions. Confirm 5715 and 5763 in <b>Server management → Rules</b>.</p></details>
<div class="box lab"><b>📝 Challenge</b>Change the rule so the alert also fires when the success follows the <i>non-existent user</i> brute-force rule, <b>5712</b>. (Hint: a rule can have several <code>if_matched_sid</code> lines, or you can write a second rule 100101.)</div>
<h3>Evidence to save</h3>
<ul><li>The rule text you added.</li><li>The output of <code>wazuh-analysisd -t</code>.</li><li>A screenshot of the level 13 alert for rule 100100.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>The configuration test shows an error</td><td>Missing <code>&lt;</code>, <code>&gt;</code> or closing tag</td><td>Read the line number it gives; fix or restore the backup</td></tr><tr><td>Manager will not restart</td><td>XML error</td><td><code>sudo tail -20 /var/ossec/logs/ossec.log</code></td></tr><tr><td>Rule does not fire</td><td>Fewer than eight failures before the success, or the wrong option name</td><td>Use <code>-t 1</code> and the full list; try <code>&lt;same_srcip /&gt;</code> if your version differs</td></tr><tr><td>Levels differ</td><td>Version differences</td><td>Check 5715 and 5763 under Server management → Rules</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You wrote a correlation rule that connects two weak signals into one strong one, and you proved it by causing the pattern yourself.</div>`,
quiz:[{q:"A correlation rule fires when…",o:["Two events happen in a pattern","Any single event happens","The server reboots","Windows updates"],a:0},{q:"What does same_source_ip ensure?",o:["Both events came from the same IP","The IP is blocked","The IP is private","Nothing"],a:0},{q:"Custom rule IDs must be…",o:["100000 or higher","1 to 100","Negative","Any number"],a:0}]},

{id:"6-5",mod:"m6",mins:55,title:"Fight back: automatically block the attacker (Active Response)",
body:String.raw`<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 55 minutes. <b>You need:</b> chapter 4 complete. <b>Back up the config first:</b> <code>sudo cp /var/ossec/etc/ossec.conf /var/ossec/etc/ossec.conf.bak</code>. Whitelist your PC and the Windows VM before you test.</div>
<div class="box story"><b>📖 The story</b>Ada: <b>“It is great that we catch it. But it is 3 AM. Can the system stop them while we sleep?”</b> Yes: <b>Active Response</b> lets Wazuh act automatically, here by blocking the attacker’s IP.</div>
<div class="goal"><b>🎯 By the end of this chapter you will</b>configure an automatic block, prove it works, and understand the risks of automation.</div>
<div class="box why"><b>💡 Careful: automation can hurt you</b>If you block the wrong IP, you lock out real users or yourself. That is why we <b>whitelist</b> trusted IPs first and block for a limited time.</div>
<ol class="steps">
<li><span class="vm u">UBUNTU</span> Open the main config:
<pre>sudo nano /var/ossec/etc/ossec.conf</pre></li>
<li>Press <code>Ctrl+W</code>, search <code>&lt;global&gt;</code>, and add these lines <b>inside</b> it (before <code>&lt;/global&gt;</code>) so your PC and Windows VM can never be blocked:
<pre>&lt;white_list&gt;192.168.56.1&lt;/white_list&gt;
&lt;white_list&gt;192.168.56.30&lt;/white_list&gt;</pre></li>
<li>Search for the last line <code>&lt;/ossec_config&gt;</code> and paste this block <b>just above</b> it:
<pre>&lt;active-response&gt;
  &lt;command&gt;firewall-drop&lt;/command&gt;
  &lt;location&gt;local&lt;/location&gt;
  &lt;rules_id&gt;5763&lt;/rules_id&gt;
  &lt;timeout&gt;180&lt;/timeout&gt;
&lt;/active-response&gt;</pre>
<b>Read it:</b> “When rule 5763 (brute force) fires, run the <code>firewall-drop</code> command on this machine (<code>local</code>) and keep the block for 180 seconds.”</li>
<li>Save and restart the manager:
<pre>sudo systemctl restart wazuh-manager</pre></li>
<li><span class="vm k">KALI</span> Attack again:
<pre>hydra -l labuser -P pw.txt ssh://192.168.56.10 -t 1</pre></li>
<li>Right afterwards, test the connection:
<pre>ssh labuser@192.168.56.10
nc -zv -w 3 192.168.56.10 22</pre></li>
<li><span class="vm u">UBUNTU</span> Prove the block exists:
<pre>sudo iptables -L -n | grep 192.168.56.50
sudo tail -n 5 /var/ossec/logs/active-responses.log</pre></li>
<li>Wait 3 minutes and test SSH from Kali again.</li></ol>
<div class="box tip"><b>✅ You should see</b>Hydra stops finding the password because it is cut off (it reports errors or timeouts); the SSH test from Kali hangs or times out; the iptables line shows a <b>DROP</b> rule for 192.168.56.50; the response log records “add”; after 180 seconds the rule disappears and SSH works again.</div>
<div class="box edge"><b>Because of the block, the attacker never reaches the success step.</b> That is the point: detection is good, <b>prevention</b> is better. You can still see your correlation rule from chapter 4 in the history.</div>
<details><summary>😕 Stuck?</summary><p><b>No block appears:</b> confirm the 5763 alert fired (search <code>rule.id:5763</code>), check you pasted the block inside <code>&lt;ossec_config&gt;</code>, and read <code>/var/ossec/logs/active-responses.log</code> and <code>ossec.log</code> for errors. <b>You blocked yourself:</b> wait 3 minutes, or run <code>sudo iptables -F</code>. <b>Command says iptables not found:</b> <code>sudo apt install -y iptables</code>.</p></details>
<div class="box lab"><b>📝 Think</b>Your whole office shares one public IP. A bot at the same IP fails 8 logins. What happens if you auto-block it? Write two ways to reduce that risk. (Ideas: whitelist known IPs, use a short timeout, block only on high-confidence rules, require a second signal.)</div>
<h3>Evidence to save</h3>
<ul><li>The <code>white_list</code> and <code>active-response</code> lines you added.</li><li>The <code>iptables</code> output showing the DROP rule, and the line in <code>active-responses.log</code>.</li><li>A note of when the block ended.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>No block appears</td><td>The 5763 alert did not fire, or the block is outside <code>&lt;ossec_config&gt;</code></td><td>Search <code>rule.id:5763</code>; check where you pasted the block; read <code>active-responses.log</code></td></tr><tr><td>You blocked yourself</td><td>Your address was not whitelisted</td><td>Wait three minutes, or run <code>sudo iptables -F</code></td></tr><tr><td><code>iptables</code> not found</td><td>Package missing</td><td><code>sudo apt install -y iptables</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You automated a response, proved it with evidence, and saw why allowlists and time limits matter.</div>`,
quiz:[{q:"Why whitelist trusted IPs before enabling blocking?",o:["To avoid blocking yourself or real users","To speed Wazuh","It is optional","To hide logs"],a:0},{q:"firewall-drop with timeout 180 means…",o:["Block for 3 minutes","Block forever","Reboot in 180 days","Delete the logs"],a:0},{q:"Which is better, in general?",o:["Prevent the attack when possible","Only detect","Only reboot","Do nothing"],a:0}]},

{id:"6-6",mod:"m6",mins:60,title:"Edge cases, and your first incident report",
body:String.raw`<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 60 minutes. <b>You need:</b> chapters 1 to 5 complete and your notebook with your timeline. The chapter “A Worked Investigation, Step by Step” shows a full example.</div>
<div class="goal"><b>🎯 By the end of this chapter you will</b>recognise the situations that fool simple SSH detection, and produce a professional one-page incident report.</div>
<div class="box why"><b>💡 Why it matters</b>Real attackers do not behave like our tutorial. A good analyst knows where the simple rules fail.</div>
<h3>Real-world edge cases</h3>
<table><tr><th>Situation</th><th>Problem</th><th>What to do</th></tr>
<tr><td><b>Many users share one public IP</b> (office, school, mobile network)</td><td>Blocking the IP blocks innocent people</td><td>Whitelist known IPs, short timeouts, block only after multiple signals</td></tr>
<tr><td><b>Password spraying</b></td><td>1 attempt per account never reaches “8 failures on one account”</td><td>Count failures by <b>source IP across many users</b>; Wazuh’s non-existent-user brute-force rule helps</td></tr>
<tr><td><b>Low and slow</b></td><td>One attempt per hour stays under every threshold</td><td>Hunt over days, not minutes; look at total failures per IP per week</td></tr>
<tr><td><b>Valid user vs non-existent user</b></td><td>Guessing names that do not exist is noisy; hitting a real name is more serious</td><td>Prioritise alerts on real accounts, especially admin names</td></tr>
<tr><td><b>Success from a new country or at 3 AM</b></td><td>Password correct, but the person is not</td><td>Add context (GeoIP, working hours); require MFA/keys</td></tr>
<tr><td><b>Key-based logins</b></td><td>No password failures at all</td><td>Monitor <code>authorized_keys</code> for new keys with FIM (Module 5 skills)</td></tr>
<tr><td><b>SSH on another port</b></td><td>Scanners find it anyway</td><td>Obscurity is not security; use keys, rate limits and monitoring</td></tr>
<tr><td><b>Root login</b></td><td>Attackers always try root</td><td>Disable root SSH: <code>PermitRootLogin no</code></td></tr>
<tr><td><b>Logs only in the journal</b></td><td>Some systems do not write auth.log</td><td>Collect <code>journald</code> or check <code>journalctl -u ssh</code></td></tr>
<tr><td><b>Your own tests</b></td><td>Your lab attack looks like a real one</td><td>Record test windows so nobody escalates your drills</td></tr></table>
<h3>Hardening: fix the root cause</h3>
<p>Detection is half the job. After an incident ask <b>“how do we stop this next time?”</b> Options: strong unique passwords, SSH keys instead of passwords, lock out after failures, MFA, restricting SSH to known IPs, and keeping systems updated.</p>
<div class="box lab"><b>📝 Exercise</b>On Ubuntu, harden SSH in the lab: <code>sudo nano /etc/ssh/sshd_config</code>, set <code>PermitRootLogin no</code> and <code>MaxAuthTries 3</code>, then <code>sudo systemctl restart ssh</code> and test that your own login still works <b>before</b> you close your current session.</div>
<h3>Write the incident report (copy this template)</h3>
<table><tr><th>Section</th><th>What to write</th></tr>
<tr><td><b>1 Summary</b></td><td>3 sentences a shop owner can understand: what happened, how serious, current status</td></tr>
<tr><td><b>2 Timeline</b></td><td>Table of time, event, source IP, rule ID (use your chapter-2 table)</td></tr>
<tr><td><b>3 Affected assets</b></td><td>Server wazuh-server, account labuser</td></tr>
<tr><td><b>4 Indicators</b></td><td>Attacker IP, targeted usernames, tool signature (many sequential failed logins)</td></tr>
<tr><td><b>5 MITRE mapping</b></td><td>T1110 Brute Force, T1078 Valid Accounts</td></tr>
<tr><td><b>6 Detection</b></td><td>Which rules fired (5760, 5763, 5715, your 100100) and which alerted first</td></tr>
<tr><td><b>7 Containment and recovery</b></td><td>Account locked, sessions ended, password reset, active response block</td></tr>
<tr><td><b>8 Root cause</b></td><td>A weak, guessable password and password login enabled on the internet-facing service</td></tr>
<tr><td><b>9 Recommendations</b></td><td>Keys or MFA, lock-out policy, restrict by IP, longer passwords, regular review</td></tr></table>
<div class="box tip"><b>🏆 Self-check</b>Does your report name evidence for every claim? Could Ada act on it without asking you questions? Could another analyst reproduce your findings from it? If yes, it is good. Save it as <code>incident-report-ssh.md</code> in your portfolio folder.</div>
<h3>Evidence to save</h3>
<ul><li>Your finished one-page incident report.</li><li>The hardening change you made to <code>sshd_config</code> and proof that your own login still works.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr><tr><td>You locked yourself out after hardening</td><td>A wrong setting while the only session closed</td><td>Keep one session open while testing; restore <code>sshd_config.bak</code></td></tr><tr><td>Report feels too long</td><td>Too many details in the summary</td><td>Write three sentences for the owner first</td></tr><tr><td>Unsure what to recommend</td><td>Root cause unclear</td><td>Ask: what one change would have stopped this?</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You moved from detection to prevention, and you wrote the report that a manager could act on. Together with Case File 1, you now have two portfolio pieces.</div>`,
quiz:[{q:"Why is password spraying hard to catch with a per-account threshold?",o:["Each account sees very few failures","It is encrypted","It uses no passwords","It is legal"],a:0},{q:"The best long-term fix for SSH password attacks is…",o:["Keys or MFA and strong passwords","Hiding the server","Turning off logging","More RAM"],a:0},{q:"An incident report should include…",o:["Timeline, evidence, containment and recommendations","Only a title","Only screenshots","Jokes"],a:0}]},

{id:"7-1",mod:"m7",mins:60,title:"Turn on the logs: audit policy, command lines and PowerShell logging",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have switched on the Windows audit settings, command-line logging and PowerShell script block logging on <code>win-victim</code>, and proved with test events that each one works.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 60 minutes. <b>You need:</b> <code>win-victim</code> running, an <b>admin PowerShell</b> window, and the chapter “Windows Event Logging in Depth” if you can. Take a snapshot of <code>win-victim</code> called <code>08-before-logging</code> first. Many investigations end with the sentence “the relevant logging was not enabled”, and this lab prevents that.</div>
<h3>Why these settings?</h3>
<p>Windows does not record every program that starts, nor the command line used, nor the script text PowerShell runs. For a defender, “a program started” with no name or arguments says almost nothing. In a company, these settings are applied to every computer by Group Policy. Here you apply them by hand to one, so you can see exactly what each does.</p>
<h3>Phase 1: look at the current policy</h3>
<ol class="steps"><li><span class="vm w">WINDOWS</span> <pre>auditpol /get /category:*</pre>Scroll through the output. Note which subcategories say “No Auditing” and write three of them in your notebook.</li></ol>
<h3>Phase 2: enable the audit subcategories</h3>
<ol class="steps"><li><pre>auditpol /set /subcategory:"Logon" /success:enable /failure:enable
auditpol /set /subcategory:"Process Creation" /success:enable
auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable
auditpol /set /subcategory:"Security Group Management" /success:enable /failure:enable
auditpol /set /subcategory:"Audit Policy Change" /success:enable /failure:enable
auditpol /set /subcategory:"Other Object Access Events" /success:enable</pre></li>
<li>Check one: <pre>auditpol /get /subcategory:"Process Creation"</pre></li></ol>
<h3>Phase 3: add command lines and PowerShell script block logging</h3>
<ol class="steps"><li><pre>reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f
reg add HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging /v EnableScriptBlockLogging /t REG_DWORD /d 1 /f</pre></li></ol>
<h3>Phase 4: prove each setting works</h3>
<ol class="steps">
<li>Process creation with command line:
<pre>ping -n 1 192.168.56.10
Get-WinEvent -FilterHashtable @{LogName='Security';Id=4688} -MaxEvents 5 | Format-List TimeCreated,Message</pre>
Look for the “Process Command Line” line that includes <code>ping -n 1 192.168.56.10</code>.</li>
<li>PowerShell script block logging:
<pre>powershell -NoProfile -Command "Write-Output 'sbl-test-12345'"
Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PowerShell/Operational';Id=4104} -MaxEvents 10 | Where-Object { $_.Message -like '*sbl-test*' } | Format-List TimeCreated,Message</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>Event 4688 with a command line that contains your ping command, and event 4104 whose message contains the text <code>sbl-test-12345</code>. If 4688 shows no command line, the registry value was not set or the VM needs a minute.</div>
<h3>What each setting gives you</h3>
<table><tr><th>Setting</th><th>Event</th><th>Why a defender wants it</th></tr>
<tr><td>Process Creation audit</td><td>4688</td><td>Every program that starts</td></tr>
<tr><td>Command-line inclusion</td><td>(in 4688)</td><td>What the program was asked to do</td></tr>
<tr><td>Script block logging</td><td>4104</td><td>The real PowerShell code, even if encoded</td></tr>
<tr><td>Logon, accounts, groups</td><td>4624, 4625, 4720, 4732…</td><td>Who is in, and who changed access</td></tr>
<tr><td>Audit Policy Change</td><td>4719</td><td>Someone tampering with what is recorded</td></tr></table>
<h3>Evidence to save</h3>
<ul><li>The output of <code>auditpol /get /subcategory:"Process Creation"</code>.</li><li>A screenshot of event 4688 with the command line, and of event 4104 with your test text.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>No command line in 4688</td><td>Registry value missing</td><td>Rerun the first <code>reg add</code> command; run a new test command</td></tr>
<tr><td>No 4104 events</td><td>Setting not applied, or wrong log</td><td>Confirm the registry key exists; use the PowerShell Operational channel</td></tr>
<tr><td><code>auditpol</code> says “parameter incorrect”</td><td>Subcategory name mistyped</td><td>List names with <code>auditpol /list /subcategory:*</code></td></tr>
<tr><td>A Group Policy resets your settings later</td><td>Domain policy overrides local</td><td>Not an issue in the lab; in a company, set the policy in the GPO</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You switched on the six audit subcategories, command-line logging and script block logging, and proved each with a test event. From now on, every program you run on <code>win-victim</code> leaves a rich record.</div>`,
quiz:[{q:"Which event records a new process?",o:["4688","4624","1102","4720"],a:0},{q:"Why enable command lines in process creation?",o:["To see what the program was asked to do","To speed up the PC","To block programs","To hide logs"],a:0},{q:"What does event 4104 contain?",o:["The PowerShell script text that ran","A password","A file hash only","Network speed"],a:0}]},

{id:"7-2",mod:"m7",mins:75,title:"Read Windows security events: logons, failures and hidden accounts",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>generate and read 4624 logons of different types, 4625 failures with their sub status codes, a hidden-administrator sequence (4720, 4724, 4732) and a log-clearing event, and you will have a personal “event lookup card”.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 75 minutes. <b>You need:</b> lab 7.1 complete, an admin PowerShell window, and the chapter “Reading Windows Security Events Like an Analyst”. You will create a temporary account called <code>tempadmin</code> and delete it at the end.</div>
<h3>Phase 1: build a helper to read events as fields</h3>
<p>Reading raw messages is slow. This small function turns events into tidy rows. Paste it into admin PowerShell:</p>
<pre>function Get-SecEv($id,$n=10){ Get-WinEvent -FilterHashtable @{LogName='Security';Id=$id} -MaxEvents $n | ForEach-Object { $x=[xml]$_.ToXml(); $d=@{}; $x.Event.EventData.Data | ForEach-Object { $d[$_.Name]=$_.'#text' }; [pscustomobject]@{Time=$_.TimeCreated; User=$d['TargetUserName']; Type=$d['LogonType']; Ip=$d['IpAddress']; Sub=$d['SubStatus']} } }</pre>
<h3>Phase 2: logons</h3>
<ol class="steps">
<li>Create a network logon, then remove it:
<pre>net use \\localhost\IPC$ /user:labuser Summer2024
net use \\localhost\IPC$ /delete</pre></li>
<li>Read the successes:
<pre>Get-SecEv 4624 15 | Format-Table -AutoSize</pre>
Find your <code>labuser</code> entry with <b>Type 3</b>. Notice the other rows: type 5 and type 2 entries for services and for you.</li></ol>
<h3>Phase 3: failures and their reasons</h3>
<ol class="steps">
<li>Fail once for a real user and once for a user that does not exist:
<pre>net use \\localhost\IPC$ /user:labuser WrongPassword
net use \\localhost\IPC$ /user:nosuchuser WrongPassword</pre></li>
<li>Read them:
<pre>Get-SecEv 4625 5 | Format-Table -AutoSize</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>Two failures. The <code>labuser</code> failure has SubStatus <code>0xC000006A</code> (wrong password) and the <code>nosuchuser</code> failure has <code>0xC0000064</code> (no such user). Write both codes on your lookup card.</div>
<h3>Phase 4: a hidden administrator</h3>
<ol class="steps">
<li><pre>net user tempadmin P@ssw0rd123 /add
net user tempadmin P@ssw0rd1234
net localgroup administrators tempadmin /add</pre></li>
<li>Find the three events:
<pre>Get-WinEvent -FilterHashtable @{LogName='Security';Id=4720,4724,4732} -MaxEvents 6 | Select-Object TimeCreated,Id | Format-Table -AutoSize</pre></li>
<li>Clean up:
<pre>net user tempadmin /delete</pre></li></ol>
<h3>Phase 5: the log-clearing alarm</h3>
<ol class="steps"><li>On a lab machine you may clear the Security log, to see what it leaves behind. <b>Only do this in the lab:</b>
<pre>wevtutil cl Security
Get-WinEvent -FilterHashtable @{LogName='Security';Id=1102} -MaxEvents 1 | Format-List TimeCreated,Message</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>Event IDs 4720, 4724 and 4732 close together in time, and a single 1102 event after clearing, telling you that the log was cleared and by which account. Clearing a log always leaves a record of the clearing itself.</div>
<h3>Your event lookup card</h3>
<p>Copy to your notebook and complete: <b>4624</b> (type 2, 3, 5, 10), <b>4625</b> (sub status 64 and 6A), <b>4672</b>, <b>4688</b>, <b>4720</b>, <b>4724</b>, <b>4732</b>, <b>1102</b>, <b>4719</b>. For each, write one sentence: what it means, and what would make it suspicious.</p>
<h3>Evidence to save</h3>
<ul><li>The tidy tables for 4624 and 4625, with the type and sub status values circled.</li><li>The three account events and the 1102 event.</li><li>Your completed lookup card.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>The function prints nothing</td><td>No such events yet, or a typo in the paste</td><td>Repeat the test commands; paste the function again as one line</td></tr>
<tr><td>No type 3 logon for labuser</td><td>The share connection used another path</td><td>Run <code>net use</code> again and check the newest 4624 entries</td></tr>
<tr><td>Password rejected for tempadmin</td><td>Policy rules</td><td>Use a longer password such as <code>P@ssw0rd123456</code></td></tr>
<tr><td>Event Viewer is slow after clearing</td><td>Large logs rebuilding</td><td>Wait; refresh</td></tr></table>
<div class="box lab"><b>📝 Recap</b>You produced real events, read their fields with a helper, learned the codes that explain a failure and watched an account takeover unfold in three events. Next you add Sysmon, which shows what the programs actually did.</div>`,
quiz:[{q:"SubStatus 0xC0000064 means…",o:["No such user","Wrong password","Account locked","Account disabled"],a:0},{q:"Which three events suggest a hidden administrator?",o:["4720, 4724, 4732","4624, 4634, 4647","1102, 4719, 4688","7045, 4698, 4672"],a:0},{q:"What does event 1102 tell you?",o:["The Security log was cleared","A user logged in","A service started","A file was deleted"],a:0}]},

{id:"7-3",mod:"m7",mins:75,title:"Install Sysmon and read process activity",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have Sysmon installed with a community configuration, see process, registry and (if configured) network events in its log, and trace a small process tree with ProcessGuid.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 75 minutes. <b>You need:</b> lab 7.1 complete, the Windows VM’s NAT card for downloading, and the chapter “Sysmon in Practice”. Take a snapshot called <code>09-before-sysmon</code>. Sysmon may be flagged by some antivirus products because attackers sometimes copy it: in your lab it is safe.</div>
<h3>Phase 1: download and install</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> In admin PowerShell:
<pre>cd C:\
Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile Sysmon.zip
Expand-Archive Sysmon.zip -DestinationPath C:\Sysmon -Force
Invoke-WebRequest https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml -OutFile C:\Sysmon\sysmonconfig.xml</pre></li>
<li>Read the configuration before you install it. Open it in Notepad and find three places where it uses <code>onmatch="exclude"</code> and one where it uses <code>include</code>. Write one example of each in your notebook.</li>
<li>Install:
<pre>C:\Sysmon\Sysmon64.exe -accepteula -i C:\Sysmon\sysmonconfig.xml
Get-Service Sysmon64</pre></li></ol>
<div class="box tip"><b>✅ You should see</b>“Sysmon64 installed” messages and a service named <code>Sysmon64</code> that is <b>Running</b>.</div>
<h3>Phase 2: generate and find events</h3>
<ol class="steps">
<li>Process creation (event 1):
<pre>notepad.exe
Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational';Id=1} -MaxEvents 3 | Format-List TimeCreated,Message</pre>
Look for <code>Image: ...notepad.exe</code>, its <code>ParentImage</code> (usually <code>powershell.exe</code>), its <code>CommandLine</code> and its <code>Hashes</code>.</li>
<li>Registry (event 13) using an autorun key, then undo it:
<pre>reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v SysmonTest /t REG_SZ /d "C:\Windows\System32\calc.exe" /f
Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational';Id=13} -MaxEvents 3 | Format-List TimeCreated,Message
reg delete HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v SysmonTest /f</pre></li>
<li>Names and connections (events 22 and 3), if your configuration records them:
<pre>nslookup example.com
Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational';Id=22,3} -MaxEvents 5 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message</pre></li></ol>
<h3>Phase 3: follow a process tree</h3>
<ol class="steps"><li>Run a chain: <pre>cmd /c "ping -n 1 192.168.56.10"</pre></li>
<li>In Event Viewer open <b>Applications and Services Logs → Microsoft → Windows → Sysmon → Operational</b>. Find the event for <code>ping.exe</code>. Write down its <code>ParentProcessGuid</code>, then find the event for <code>cmd.exe</code> with that same value as its <code>ProcessGuid</code>. You just walked up a process tree.</li></ol>
<h3>Phase 4: protect and understand it</h3>
<ol class="steps"><li>Show the current configuration and Sysmon’s own state events:
<pre>C:\Sysmon\Sysmon64.exe -c
Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational';Id=4,16} -MaxEvents 3 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message</pre>Events 4 and 16 record Sysmon starting and its configuration changing.</li></ol>
<h3>Evidence to save</h3>
<ul><li>A screenshot of the notepad process-creation event with Image, ParentImage, CommandLine and Hashes visible.</li><li>The registry event for the Run key.</li><li>The two GUID values that link <code>ping</code> to <code>cmd</code>.</li></ul>
<h3>Troubleshooting</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Download fails</td><td>No internet on the NAT adapter</td><td>Check Adapter 1; run <code>ping google.com</code></td></tr>
<tr><td>Antivirus blocks Sysmon</td><td>Heuristic detection</td><td>Allow it in the lab, and note the event as a finding</td></tr>
<tr><td>No event 13 or 22</td><td>Your configuration does not record it, or the run was too quick</td><td>Read the config; that is itself a result. Try again after a minute</td></tr>
<tr><td>Event Viewer path not found</td><td>Install not finished</td><td>Check the service is running; reinstall with <code>-u</code> then <code>-i</code></td></tr></table>
<div class="box lab"><b>📝 Recap</b>You installed Sysmon, read what its configuration includes and excludes, generated process and registry events, and walked up a process tree with GUIDs. Next you send everything to Wazuh.</div>`,
quiz:[{q:"What links a child process to its parent in Sysmon events?",o:["ParentProcessGuid matching ProcessGuid","The file name","The window colour","The user’s name"],a:0},{q:"Which Sysmon event records a registry value being set?",o:["13","1","3","22"],a:0},{q:"Why read a configuration before installing it?",o:["To know what it records and excludes","To make it faster","It is a rule of Windows","To rename it"],a:0}]},

{id:"7-4",mod:"m7",mins:70,title:"Send Windows events to Wazuh and search them",
body:String.raw`<div class="goal"><b>🎯 By the end of this lab you will</b>have the Security, PowerShell, Sysmon, Defender and Task Scheduler channels reaching Wazuh, and find your own test events on the dashboard using field searches.</div>
<div class="box why"><b>💡 Before you begin</b><b>Time:</b> about 70 minutes. <b>You need:</b> labs 7.1 to 7.3 complete, the agent Active, and Notepad opened as administrator. <b>Back up the agent configuration first:</b> <code>Copy-Item "C:\Program Files (x86)\ossec-agent\ossec.conf" "C:\Program Files (x86)\ossec-agent\ossec.conf.bak2"</code>. Log lines mean nothing in a SIEM until they arrive, are parsed, and can be found.</div>
<h3>Phase 1: see what is already collected</h3>
<ol class="steps">
<li><span class="vm w">WINDOWS</span> Open <code>C:\Program Files (x86)\ossec-agent\ossec.conf</code> as administrator and search for <code>eventchannel</code>. List which channels appear. The default Windows configuration often already includes Application, Security, System and sometimes Sysmon.</li></ol>
<div class="box edge"><b>Do not duplicate</b>If a channel is already listed, do not add it again. Two blocks for the same channel create duplicate events and double your volume.</div>
<h3>Phase 2: add the missing channels</h3>
<ol class="steps"><li>Inside <code>&lt;ossec_config&gt;</code>, near the other <code>localfile</code> blocks, add only the ones that are missing:
<pre>&lt;localfile&gt;
  &lt;location&gt;Microsoft-Windows-Sysmon/Operational&lt;/location&gt;
  &lt;log_format&gt;eventchannel&lt;/log_format&gt;
&lt;/localfile&gt;
&lt;localfile&gt;
  &lt;location&gt;Microsoft-Windows-PowerShell/Operational&lt;/location&gt;
